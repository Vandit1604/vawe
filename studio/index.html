<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shortwave Studio</title>
    <link rel="stylesheet" href="/studio/studio.css" />
  </head>
  <body>
    <header>
      <span class="brand"><span class="dot"></span>Shortwave <b>Studio</b></span>
      <label class="f">Format<select id="fmt"></select></label>
      <label class="f">Orientation
        <span class="seg-ctl" id="orientSeg" role="group" aria-label="Orientation">
          <button type="button" data-v="portrait" class="on">Portrait</button>
          <button type="button" data-v="landscape">Landscape</button>
        </span>
      </label>
      <!-- kept in the DOM (visually hidden) so the headless check can drive it via page.select -->
      <select id="orient" class="vh" tabindex="-1" aria-hidden="true">
        <option value="portrait">Portrait 9:16</option>
        <option value="landscape">Landscape 16:9</option>
      </select>
      <label class="f">FPS<input id="fps" type="number" value="30" min="1" max="60" style="width:64px" /></label>
      <span class="spacer"></span>
      <button id="apply" class="primary">Apply ⏎</button>
      <button id="save">Save…</button>
    </header>

    <main>
      <section class="editor" id="inspector">
        <div class="sec" data-sec="quick">
          <h3 class="sec-head">Quick edit<i class="chev"></i></h3>
          <div class="sec-body"><div class="quick" id="quick"><span class="hint">Pick a format…</span></div></div>
        </div>
        <div class="sec" data-sec="pacing" id="pacingSec" style="display:none">
          <h3 class="sec-head">Pacing <span class="hint">(seconds · or drag a segment edge)</span><i class="chev"></i></h3>
          <div class="sec-body"><div class="pacegrid" id="pacing"></div></div>
        </div>
        <div class="sec" data-sec="audio" id="audioSec" style="display:none">
          <h3 class="sec-head">Audio<i class="chev"></i></h3>
          <div class="sec-body"><div class="audiogrid" id="audioPanel"></div></div>
        </div>
        <div class="sec jsonwrap" data-sec="json">
          <h3 class="sec-head">Data JSON <span class="hint">(⌘/Ctrl+Enter to apply)</span><i class="chev"></i></h3>
          <div class="sec-body"><textarea id="json" spellcheck="false"></textarea></div>
        </div>
        <div class="status" id="status"></div>
      </section>

      <section class="preview">
        <div class="stage-wrap">
          <div class="frame-box" id="box"><iframe id="frame" title="preview"></iframe></div>
        </div>
        <div class="transport">
          <div class="tl-resize" id="tlResize" title="Drag to resize the timeline"></div>
          <div class="tl-controls">
            <button class="play" id="play" title="Play / pause (Space)">▶</button>
            <button class="icon" id="mute" title="Mute audio">🔊</button>
            <span class="zoomctl">
              <button id="zoomOut" title="Zoom out">−</button>
              <button id="zoomFit" title="Fit to width">⤢</button>
              <button id="zoomIn" title="Zoom in">+</button>
            </span>
          </div>
          <div class="timeline">
            <div class="tl-scroll" id="tlScroll">
              <div class="tl-inner" id="tlInner">
                <div class="tl-ruler" id="ruler"></div>
                <div class="tl-track" id="track" title="Drag to scrub · click a segment to jump · drag a segment edge to retime"></div>
                <div class="tl-audio" id="audio"></div>
                <div class="tl-head" id="tlHead"></div>
              </div>
            </div>
          </div>
          <span class="time" id="time">0.0s · f0</span>
        </div>
      </section>
    </main>

    <div class="tl-readout" id="tlReadout"></div>

    <script src="/studio/app.js"></script>
  </body>
</html>
