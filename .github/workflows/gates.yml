name: framework gates

# The same static gates .githooks/pre-push runs. A film is one HTML page; the e2e job renders every
# page film and fixture page at half size and checks each mp4.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gates:
    name: static gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: gates
        run: |
          for g in no-emdash mistakes-check provenance rule-length skill-reach seo-surface; do
            make check GATE="$g"
          done

  e2e:
    name: e2e (page tests + draft renders of every page film)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: fetch the locked faces
        run: make gen X=fonts
      - run: make e2e
      - name: upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: quality/runs/e2e
          retention-days: 14
          if-no-files-found: warn
