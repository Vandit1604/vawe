name: framework gates

# The same gates .githooks/pre-push runs, minus doc-refs. There is no CI-only list: the point is
# that a push blocked here is a push that would have been blocked on the developer's machine.
#
# doc-refs is DELIBERATELY ABSENT, and this is not a softened gate. formats/scene/*.json is gitignored
# (see .gitignore: "Video/data instances are NOT the framework"), so a clone carries 40 of the 146
# scenes this tree holds. doc-refs resolves every repo path the docs cite, and 20 of those paths are
# scene files that no clone will ever have. Measured on a fresh clone of HEAD: 22 findings, 20 of them
# gitignored scene content. A job that reports 20 phantom findings on every run teaches everyone to
# ignore it. It keeps its teeth in pre-push, where the author has the content on disk.
#
# Runtime: about a minute, nearly all of it checkout and npm ci. The gates themselves are file reads
# and finish in under half a second.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gates:
    name: schema-check + lib-test + craft-coverage + arsenal-check + discovery + generated-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # No gate in this job opens a browser, so the 150MB Chromium that puppeteer's postinstall would
      # fetch is pure wall-clock. The browser jobs install it and cache it.
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: scripts/author/recency.mjs reads `git log --before=N.days` to compute registry
          # newness. A shallow checkout has no history, so two newness lib-tests fail on CI while passing
          # on a full local clone. scene-check.yml does this for the same reason.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: framework gates
        run: make schema-check lib-test craft-coverage arsenal-check discovery generated-check output-contract

      # Structured, readable failures. This step is the pass/fail authority's SIDECAR, not the authority:
      # it runs `if: always()`, writes to the job Summary and an artifact, and never sets the job status
      # (the `make` step above does). So it cannot mask a real exit code (docs/MISTAKES.md #401).
      - name: findings summary (json)
        if: always()
        run: |
          mkdir -p /tmp/findings
          # The findings-based gates emit a JSON array under --json (empty [] when clean).
          for g in discovery arsenal-check generated-check craft-coverage output-contract; do
            node "quality/gates/$g.mjs" --json > "/tmp/findings/$g.json" 2>/dev/null || true
          done
          node -e '
            const fs = require("fs"), d = "/tmp/findings";
            const out = {};
            for (const f of fs.readdirSync(d)) {
              const k = f.replace(/\.json$/, "");
              try { out[k] = JSON.parse(fs.readFileSync(`${d}/${f}`, "utf8")); } catch { out[k] = []; }
            }
            fs.writeFileSync("findings.json", JSON.stringify(out, null, 2));
            const total = Object.values(out).reduce((n, a) => n + (Array.isArray(a) ? a.length : 0), 0);
            console.log(`findings.json written, ${total} finding(s) across ${Object.keys(out).length} gate(s)`);
          '
          # lib-test is a test runner (no --json): surface its REAL failures, minus the rung-fixture noise
          # (the rung block deliberately injects bad tags to prove the gate catches them).
          libfail=$(node quality/gates/lib-test.mjs 2>&1 \
            | grep -E "✗|[0-9]+ failed" \
            | grep -viE "no-such-gate|no-such-code|untagged: THE BACKGROUND|up from|held up by prose|does not emit|decoration|claim an owner|catalogued by hand" \
            || true)
          {
            echo "## Framework gate findings"
            echo
            echo "### Gate findings (JSON)"
            echo '```json'
            cat findings.json
            echo '```'
            echo "### lib-test"
            echo '```'
            echo "${libfail:-all assertions passed}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload findings.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-findings
          path: findings.json
          if-no-files-found: ignore
