# Copies the files the docs app vendors to vawe-hq/vawe-docs, so it builds without this repository.
# The files here are the one source; nothing under vendor/vawe is edited in vawe-hq/vawe-docs.
# DOCS_DEPLOY_KEY is a deploy key with write access to vawe-hq/vawe-docs only.
name: sync docs vendor

on:
  push:
    branches: [main]
    paths:
      - "core/motion/**"
      - "site/lib/typo.mjs"
      - "site/lib/md/accept.ts"
      - ".github/workflows/sync-docs-vendor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-docs-vendor
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            core/motion
            site/lib/typo.mjs
            site/lib/md/accept.ts
          sparse-checkout-cone-mode: false

      - name: Push to vawe-hq/vawe-docs
        env:
          DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/docs
          chmod 600 ~/.ssh/docs
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/docs -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:vawe-hq/vawe-docs.git out 2>/dev/null \
            || { git init -q -b main out && git -C out remote add origin git@github.com:vawe-hq/vawe-docs.git; }
          mkdir -p out/vendor/vawe/core/motion out/vendor/vawe/site/lib/md
          rsync -a --delete core/motion/ out/vendor/vawe/core/motion/
          cp site/lib/typo.mjs out/vendor/vawe/site/lib/typo.mjs
          cp site/lib/md/accept.ts out/vendor/vawe/site/lib/md/accept.ts
          cd out
          git add -A
          if git diff --cached --quiet; then echo "vawe-hq/vawe-docs is current"; exit 0; fi
          git -c user.name="vawe-hq sync" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "sync from vawe-hq/vawe@${GITHUB_SHA::9}"
          git push origin HEAD:main
