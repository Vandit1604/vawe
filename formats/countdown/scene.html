<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>countdown</title>
    <link rel="stylesheet" href="/core/tokens.css" />
    <style>
      .cd-body { justify-content: flex-start; padding-top: 30px; }
      .cd-list { width: 100%; display: flex; flex-direction: column; gap: 14px; }
      .cd-row { display: flex; align-items: center; gap: 26px; height: 92px; padding: 0 28px; border-radius: 22px;
        background: linear-gradient(180deg, rgba(22,24,29,0.7), rgba(16,18,22,0.7)); border: 1px solid var(--line); }
      .cd-row .rk { font: 700 46px 'Space Grotesk', sans-serif; color: var(--dim); width: 72px; }
      .cd-row .ic { width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        font: 800 30px 'Inter', sans-serif; color: var(--text); background: linear-gradient(180deg, var(--surface), var(--surface-2)); border: 1px solid var(--line-strong); }
      .cd-row .nm { font: 700 50px 'Inter', sans-serif; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cd-row .vl { font: 700 50px 'Space Grotesk', sans-serif; font-feature-settings: 'tnum' 1; color: var(--text-2); }
      .cd-row .vl .u { font-size: 0.6em; color: var(--dim); font-weight: 500; }
      .cd-row.one { height: 124px; border-color: var(--accent); background: linear-gradient(180deg, rgba(34,38,24,0.9), rgba(20,22,16,0.9));
        box-shadow: var(--shadow-card), 0 0 56px var(--accent-dim); }
      .cd-row.one .rk { color: var(--accent); font-size: 50px; width: 80px; }
      .cd-row.one .nm { font-size: 46px; }
      .cd-row.one .vl { color: var(--up); font-size: 52px; }
      .cd-row { gap: 18px; }
      .cd-guess { position: absolute; left: 0; right: 0; top: 30px; height: 124px; line-height: 124px; text-align: center;
        font: 800 56px 'Inter', sans-serif; color: var(--accent); opacity: 0; z-index: 5; }
      .cd-guess b { color: var(--text); }
      .dim { position: absolute; inset: 0; background: #040405; opacity: 0; z-index: 4; pointer-events: none; }
      .flash { position: absolute; inset: 0; background: var(--accent); opacity: 0; z-index: 4; pointer-events: none; }
    </style>
  </head>
  <body>
    <div class="stage phase-hook" id="stage">
      <div class="chrome"><div class="progress" id="prog"></div></div>
      <div class="act act-body"><div class="safe cd-body"><div class="cd-guess" id="guess">🤔 Can you guess <b>#1?</b></div><div class="cd-list" id="list"></div></div></div>
      <div class="act act-hook">
        <div class="safe hook-wrap"><div class="kicker" id="kick">TOP 10</div><div class="hook-title" id="hook">title</div><div class="hook-sub" id="hsub">tease</div></div>
      </div>
      <div class="act act-cta"><div class="cta-screen"><div class="cta-bell">🔔</div><div class="cta-card" id="cta" data-layer="critical">Subscribe for more</div></div></div>
      <div class="dim" id="dimEl"></div><div class="flash" id="flashEl"></div>
      <div class="dbg"><div class="zone zt"></div><div class="zone zb"></div><div class="zone zl"></div><div class="zone zr"></div><div class="box"></div></div>
    </div>
    <script type="module">
      import { boot, clamp01, lerp, easeOutQuart, easeOutBack, punch, formatValue, seedFrom, pickDuration } from '/core/lib.js';
      const $ = (id) => document.getElementById(id);

      boot((data, fps) => {
        const items = data.items, n = items.length; // items[0] = #1
        const COLD = 2.2, GUESS = 2.0, SLAM = 0.6, HOLD = 3.0, CTA = 2.5;
        const target = pickDuration(seedFrom(items.map((i) => i.name + i.value).join()), 26, 34);
        // reveal #n..#2 briskly, then a "can you guess #1?" pause, then slam #1
        const STEP = Math.max(0.85, (target - COLD - GUESS - SLAM - HOLD - CTA) / (n - 2));
        const revealT = (rank) => (rank === 1 ? COLD + (n - 2) * STEP + GUESS : COLD + (n - rank) * STEP);
        const slamT = revealT(1), duration = slamT + SLAM + HOLD + CTA;
        const guessStart = COLD + (n - 2) * STEP + 0.45;
        const stings = [slamT];

        const rows = items.map((it, i) => {
          const rank = i + 1, row = document.createElement('div');
          row.className = 'cd-row' + (rank === 1 ? ' one' : '');
          const badge = it.icon || it.name.slice(0, 1).toUpperCase();
          row.innerHTML = `<div class="rk num" data-layer="critical">#${rank}</div><div class="ic">${badge}</div><div class="nm" data-layer="critical">${it.name}</div><div class="vl num" data-layer="critical"></div>`;
          $('list').appendChild(row);
          return { row, vl: row.querySelector('.vl'), nm: row.querySelector('.nm'), value: it.value, rank };
        });
        const stage = $('stage'), total = Math.round(duration * fps);

        function renderFrame(f) {
          const tt = f / fps;
          $('prog').style.width = (clamp01(f / (total - 1)) * 100).toFixed(3) + '%';
          const inCta = tt >= duration - CTA;
          stage.className = 'stage phase-' + (tt < COLD ? 'hook' : inCta ? 'cta' : 'body');
          if (tt < COLD) { $('kick').textContent = data.kicker || ('TOP ' + n); $('hook').textContent = data.hook || ''; $('hsub').textContent = data.teaseHook || ''; return; }
          if (inCta) $('cta').textContent = data.cta || data.outro || '';

          // "can you guess #1?" beat in the pause before the top reveal
          $('guess').style.opacity = (tt < guessStart ? 0 : tt < slamT ? clamp01((tt - guessStart) / 0.3) : clamp01(1 - (tt - slamT) / 0.2)).toFixed(2);

          for (const r of rows) {
            const t0 = revealT(r.rank);
            const app = clamp01((tt - t0) / 0.35);
            r.row.style.opacity = app.toFixed(2);
            r.row.style.transform = `translateX(${lerp(-22, 0, easeOutBack(app)).toFixed(1)}px)`;
            const ct = easeOutQuart(clamp01((tt - t0) / 0.4));
            const { num, unit } = formatValue(r.value * ct, data.unit || '');
            r.vl.innerHTML = num + (unit ? `<span class="u"> ${unit}</span>` : '');
            if (r.rank === 1 && tt >= slamT) { const s = punch(clamp01((tt - slamT) / SLAM)); r.nm.style.transform = `scale(${s})`; r.vl.style.transform = `scale(${s})`; }
          }
          $('dimEl').style.opacity = (tt >= slamT - 0.3 && tt < slamT) ? (0.26 * clamp01((tt - (slamT - 0.3)) / 0.3)).toFixed(2) : 0;
          $('flashEl').style.opacity = tt >= slamT ? (0.5 * (1 - clamp01((tt - slamT) / 0.23))).toFixed(2) : 0;
        }
        return { fps, duration, stings, renderFrame };
      });
    </script>
  </body>
</html>
