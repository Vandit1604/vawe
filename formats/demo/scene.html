<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>demo</title>
    <link rel="stylesheet" href="/core/tokens.css" />
    <style>
      /* demo — product WALKTHROUGH format. Shows the product actually working: a SKILL.md typing out,
         a deploy pipeline, a live API call (with a moving+clicking cursor), earnings ticking. Plus
         camera zoom-in/out, moving backgrounds, icons and varied transitions. All pure in n. */
      .chrome, .brand { display: none; }
      /* kill the shared tokens.css .stage dark bg + grid + vignette — the canvas owns the background */
      .stage { background: none !important; }
      .stage::before, .stage::after { display: none !important; }
      .dm { position: absolute; inset: 0; overflow: hidden; font-family: var(--font-sans, 'Inter'), sans-serif; color: #f4f5ff; }
      #cv { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; transform-origin: 50% 45%; }
      .sc { position: absolute; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; will-change: transform, opacity; }
      .cam { position: relative; will-change: transform; transform-origin: 50% 50%; display: flex; flex-direction: column; align-items: center; }

      /* ---- generic mock window (code / call) — SOLID dark so it's high-contrast on a white page ---- */
      .win { position: relative; width: 1180px; border-radius: 20px; overflow: hidden; background: #14161d; color: #e3e6f2;
        border: 1px solid rgba(180,190,255,0.14); box-shadow: 0 50px 130px rgba(20,20,30,0.28); }
      .code .v { color: #eef0f8 !important; }
      /* gloss: the sweeping band lives in an inner <i> INSIDE an overflow:hidden wrapper, so its
         translateX never inflates the window's scroll box (transformed children count in scrollWidth) */
      .win-gloss { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
      .win-gloss i { position: absolute; inset: 0; display: block;
        background: linear-gradient(114deg, transparent 34%, rgba(255,255,255,0.10) 46%, rgba(255,255,255,0.16) 50%, transparent 62%); transform: translateX(-120%); }
      .win-h { position: relative; z-index: 2; display: flex; align-items: center; gap: 14px; padding: 20px 26px; background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(180,190,255,0.1); }
      .win-b { position: relative; z-index: 2; }
      .win-h i { width: 15px; height: 15px; border-radius: 50%; background: #3a4180; display: inline-block; }
      .win-h .fn { margin-left: 12px; font: 600 30px var(--font-mono, 'Geist Mono'), monospace; color: #a9b4ff; letter-spacing: 0.01em; }
      .win-b { padding: 34px 40px; }

      /* code editor */
      .code { font: 500 38px var(--font-mono, 'Geist Mono'), monospace; line-height: 1.5; white-space: pre; }
      .code .ln { display: block; }
      .code .k { color: #7d8bff; } .code .s { color: #c7cbe8; } .code .v { color: #f4f5ff; } .code .c { color: #5a6296; }
      .cur-blink { display: inline-block; width: 3px; height: 40px; background: #1f3bff; vertical-align: -6px; margin-left: 2px; }
      .runbtn { margin-top: 34px; display: inline-flex; align-items: center; gap: 14px; padding: 20px 34px; border-radius: 12px;
        background: #1f3bff; color: #fff; font: 700 32px var(--font-sans, 'Inter'), sans-serif; box-shadow: 0 12px 40px rgba(31,59,255,0.5); }

      /* ---- pipeline / deploy ---- */
      .pipe { width: 1120px; display: flex; flex-direction: column; gap: 26px; }
      .pipe .row { display: flex; align-items: center; gap: 28px; padding: 28px 34px; border-radius: 16px; background: rgba(12,14,34,0.6);
        border: 1px solid rgba(169,180,255,0.16); }
      .pipe .ic { width: 54px; height: 54px; flex: 0 0 54px; display: flex; align-items: center; justify-content: center; color: #a9b4ff; }
      .pipe .lb { flex: 1; font: 700 40px var(--font-sans, 'Inter'), sans-serif; letter-spacing: -0.01em; }
      .pipe .st { width: 46px; height: 46px; }
      .spinner { width: 40px; height: 40px; border: 4px solid rgba(169,180,255,0.25); border-top-color: #1f3bff; border-radius: 50%; }
      .bar { margin-top: 8px; height: 8px; border-radius: 6px; background: rgba(169,180,255,0.16); overflow: hidden; }
      .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #1f3bff, #757dbb); border-radius: 6px; }
      .live { margin-top: 30px; display: flex; align-items: center; gap: 18px; justify-content: center; font: 700 42px var(--font-sans, 'Inter'); }
      .live .u { font: 600 34px var(--font-mono, 'Geist Mono'), monospace; color: #a9b4ff; }

      /* ---- API call ---- */
      .req { display: flex; align-items: center; gap: 18px; font: 600 34px var(--font-mono, 'Geist Mono'), monospace; }
      .req .m { padding: 8px 18px; border-radius: 8px; background: #1f3bff; color: #fff; font-weight: 700; }
      .req .u { color: #c7cbe8; }
      .sendbtn { margin-top: 30px; display: inline-flex; align-items: center; gap: 12px; padding: 18px 32px; border-radius: 12px;
        background: #1f3bff; color: #fff; font: 700 30px var(--font-sans, 'Inter'); box-shadow: 0 12px 40px rgba(31,59,255,0.5); }
      .resp { margin-top: 30px; border-radius: 16px; background: rgba(12,14,34,0.7); border: 1px solid rgba(169,180,255,0.18); padding: 30px 34px;
        font: 500 32px var(--font-mono, 'Geist Mono'), monospace; color: #c7cbe8; will-change: transform, opacity; }
      .resp .k { color: #7d8bff; }
      .badges { margin-top: 22px; display: flex; gap: 18px; }
      .badge { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border-radius: 999px; font: 700 28px var(--font-sans, 'Inter');
        background: rgba(31,59,255,0.16); color: #cfd6ff; border: 1px solid rgba(31,59,255,0.4); will-change: transform, opacity; }

      /* ---- earnings feed ---- */
      .earn { display: flex; gap: 70px; align-items: center; }
      .feed { width: 760px; display: flex; flex-direction: column; gap: 16px; }
      .feed .fr { display: flex; align-items: center; gap: 20px; padding: 22px 28px; border-radius: 14px; background: rgba(12,14,34,0.6);
        border: 1px solid rgba(169,180,255,0.14); font: 600 30px var(--font-sans, 'Inter'); will-change: transform, opacity; }
      .feed .fr .nm { flex: 1; color: #cfd6ff; }
      .feed .fr .pl { color: #8fe6b0; font-family: var(--font-mono, 'Geist Mono'), monospace; font-weight: 700; }
      .total { text-align: center; }
      .total .v { font: 800 150px var(--font-sans, 'Inter'); letter-spacing: -0.04em; font-feature-settings: 'tnum' 1; }
      .total .l { margin-top: 12px; font: 600 36px var(--font-sans, 'Inter'); color: #a9b4ff; }

      /* ---- generic text scenes ---- */
      .eyebrow { font: 600 30px var(--font-mono, 'Geist Mono'), monospace; letter-spacing: 0.04em; color: #a9b4ff; margin-bottom: 30px; text-align: center; }
      .big { font: 800 124px var(--font-sans, 'Inter'); line-height: 0.98; letter-spacing: -0.035em; text-align: center; max-width: 1500px; }
      .big em { font: italic 400 1.02em var(--font-serif, 'Instrument Serif'), serif; color: #a9b4ff; }
      .sub2 { margin-top: 26px; font: italic 400 66px var(--font-serif, 'Instrument Serif'), serif; color: #fff; text-align: center; }
      .kw { display: inline-block; white-space: pre; will-change: transform, opacity; }
      .ctaUrl { margin-top: 40px; display: inline-block; padding: 20px 42px; background: #0a0c1e; color: #fff;
        font: 600 44px var(--font-mono, 'Geist Mono'), monospace; border: 1px solid #1f3bff; box-shadow: 0 0 44px rgba(31,59,255,0.5); }

      .sec-title { font: 700 58px var(--font-sans, 'Inter'); letter-spacing: -0.02em; margin-bottom: 40px; text-align: center; }
      .sec-title em { font: italic 400 1.02em var(--font-serif, 'Instrument Serif'), serif; color: #a9b4ff; }

      /* ---- LIGHT scenes (white/paper bg): ink text + light cards + blue accents. The code/call
         windows stay dark on purpose — a dark code block on a white page reads premium + authentic. ---- */
      .sc.light { color: #181815; }
      .sc.light .eyebrow { color: #6e6e68; }
      .sc.light .big em, .sc.light .sec-title em, .sc.light .ctaH em { color: #1f3bff; }
      .sc.light .sub2 { color: #4a4a44; }
      .sc.light .total .v { color: #181815; }
      .sc.light .total .l { color: #6e6e68; }
      .sc.light .pipe .row { background: #fff; border-color: #e6e6e1; box-shadow: 0 20px 50px rgba(20,20,18,0.06); }
      .sc.light .pipe .ic { color: #1f3bff; }
      .sc.light .pipe .lb { color: #181815; }
      .sc.light .live { color: #181815; } .sc.light .live .u { color: #6e6e68; }
      .sc.light .bar { background: #e6e6e1; }
      .sc.light .feed .fr { background: #fff; border-color: #e6e6e1; color: #1f3bff; box-shadow: 0 16px 40px rgba(20,20,18,0.05); }
      .sc.light .feed .fr .nm { color: #181815; }
      .sc.light .cta-logo, .light .brandmk { }

      /* ---- cursor + click ripple ---- */
      .cursor { position: absolute; z-index: 60; width: 46px; height: 46px; left: 0; top: 0; opacity: 0; pointer-events: none;
        filter: drop-shadow(0 6px 10px rgba(0,0,0,0.4)); will-change: transform, opacity; }
      .ripple { position: absolute; z-index: 55; border: 3px solid #1f3bff; border-radius: 50%; opacity: 0; pointer-events: none; will-change: transform, opacity; }
      .brandmk { position: absolute; top: 54px; left: 60px; width: 58px; height: 58px; z-index: 30; border-radius: 15px; box-shadow: 0 8px 24px rgba(8,10,34,0.35); }
      .dm-dip { position: absolute; inset: 0; z-index: 45; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="dm">
        <canvas id="cv" width="1920" height="1080"></canvas>
        <div id="root"></div>
        <div class="ripple" id="ripple"></div>
        <svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M4 2l16 9-7 1.6-3.4 7z" fill="#fff" stroke="#12142e" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <img class="brandmk" id="brand" src="/engine/assets/plinth/icon.png" alt="" />
        <div class="dm-dip" id="dip"></div>
      </div>
    </div>
    <script type="module">
      import { boot, clamp01, lerp, interpolate, spring, sequence, easeInOutCubic, easeOutCubic, easeOutQuart, easeOutExpo, easeOutBack, formatNumber, icon } from '/core/lib.js';
      import { splitText, animateUnits } from '/core/kinetic.js';
      import { renderBg, bgPreset } from '/core/backgrounds.js';
      import { svgIcon } from '/core/icons.js';
      const $ = (id) => document.getElementById(id);
      const setT = (el, s) => Object.assign(el.style, s);
      const W = 1920, H = 1080;

      const LIGHT_BGS = ['paper', 'paperShapes', 'paperDots', 'soft', 'dotmatrix'];
      boot((data, fps) => {
        const ctx = $('cv').getContext('2d'), root = $('root');
        // shared timing contract (declared BEFORE buildScene runs — TDZ):
        // a scene is fully opaque from TRANS → dur−TRANS; payoffs must settle by settleBy(dur)
        // so they hold for HOLD seconds at full visibility before the exit begins.
        const TRANS = 0.5;                                  // must match SEGS transition below
        const HOLD = 0.6;                                   // steady-state hold before exit
        const settleBy = (dur) => dur - TRANS - HOLD;
        const IN0 = 0.28;                                   // content reveals start after the enter-fade
        const built = (data.scenes || []).map((sc, i) => buildScene(sc, i));
        const SEGS = built.map((b, i) => ({ name: 's' + i, dur: b.dur, transition: TRANS }));
        const duration = SEGS.reduce((a, s) => a + s.dur, 0);
        const bounds = []; let acc = 0; for (const s of SEGS) { bounds.push(acc + s.dur); acc += s.dur; }

        // ---------- scene builders ----------
        function win(fn, bodyHtml) { return `<div class="win" data-layer="critical"><div class="win-gloss"><i></i></div><div class="win-h"><i></i><i></i><i></i><span class="fn">${fn}</span></div><div class="win-b">${bodyHtml}</div></div>`; }
        const gloss = (cam, lt, t0) => { const g = cam.querySelector('.win-gloss i'); if (g) g.style.transform = `translateX(${interpolate(lt, [t0, t0 + 0.7], [-120, 130], { easing: easeOutQuart }).toFixed(1)}%)`; };
        function mkScene(inner, cls) { const el = document.createElement('div'); el.className = 'sc'; const cam = document.createElement('div'); cam.className = 'cam ' + (cls || ''); cam.innerHTML = inner; el.appendChild(cam); root.appendChild(el); return { el, cam }; }

        function buildScene(sc, i) {
          const dur = sc.dur || 5;
          const bgName = sc.bg || 'paper';
          const value = sc.value || (LIGHT_BGS.includes(bgName) ? 'light' : 'dark');
          const b = { i, dur, type: sc.type, bg: bgPreset(bgName, value), value, cursor: null, camera: sc.camera, animate: () => {} };

          if (sc.type === 'title' || sc.type === 'statement') {
            const { el, cam } = mkScene(`${sc.eyebrow ? `<div class="eyebrow" data-layer="critical">${sc.eyebrow}</div>` : ''}<div class="big" data-layer="critical">${sc.title || sc.text}</div>${sc.sub ? `<div class="sub2" data-layer="critical">${sc.sub}</div>` : ''}`);
            const words = splitText(cam.querySelector('.big'), 'word'), sub = cam.querySelector('.sub2'), eb = cam.querySelector('.eyebrow');
            b.el = el; b.cam = cam;
            b.animate = (lt) => { animateUnits(words, Math.max(0, lt - IN0), { preset: 'up', stagger: 0.055, each: 0.4, dist: 52 }); // words start after the scene enter-fade — no double-stacked opacity/transform
              if (eb) eb.style.opacity = interpolate(lt, [IN0, IN0 + 0.4], [0, 1]).toFixed(2);
              if (sub) { const s = interpolate(lt, [0.9 + IN0, 1.5 + IN0], [0, 1], { easing: easeOutCubic }); setT(sub, { opacity: s.toFixed(2), transform: `translateY(${lerp(22, 0, s).toFixed(1)}px)` }); } };

          } else if (sc.type === 'code') {
            const lines = sc.lines || [];
            const html = win(sc.file || 'summarize.SKILL.md', `<div class="code" id="code_${i}"></div><div class="runbtn" id="run_${i}">${svgIcon('bolt', { size: 30, color: '#fff' })} Publish</div>`);
            const { el, cam } = mkScene(html); b.el = el; b.cam = cam;
            const codeEl = cam.querySelector('.code'), runEl = cam.querySelector('.runbtn');
            // typing window derived from CONTENT + scene budget: typing must complete before the
            // publish beat (cursor travel + click), never faster than 8ms/char.
            const T0 = IN0 + 0.1;
            const natEnd = lines.reduce((m, l, li) => Math.max(m, li * 0.34 + l.length * 0.02), 0);
            const typeBudget = Math.max(0.8, (dur - 2.4) - T0);
            const tk = Math.min(1, typeBudget / Math.max(natEnd, 0.01));
            const lineDelay = 0.34 * tk, charDur = Math.max(0.008, 0.02 * tk);
            // cursor travels in from the lower-right, arrives at Publish, dwells, then clicks —
            // click + 0.5s ripple + camera settle all finish by settleBy(dur) (fully visible payoff)
            b.cursor = [{ t: dur - 3.2, x: 0.84, y: 0.88 }, { t: dur - 1.9, x: 0.31, y: 0.72 }, { t: dur - 1.6, x: 0.31, y: 0.72, click: true }];
            b.clickT = dur - 1.6;
            b.camera = sc.camera || [{ t: 0, s: 1.0, y: 0 }, { t: dur - 2.4, s: 1.07, y: -18 }, { t: settleBy(dur), s: 1.0, y: 26 }];
            b.animate = (lt) => {
              gloss(cam, lt, 0.25);
              let html2 = '', done = 0;
              lines.forEach((l, li) => {
                const st = T0 + li * lineDelay, shown = clamp01((lt - st) / (l.length * charDur));
                const n = Math.floor(shown * l.length);
                html2 += `<span class="ln">${colorCode(l.slice(0, n))}${(shown > 0 && shown < 1) ? '<span class="cur-blink"></span>' : ''}</span>`;
                if (shown >= 1) done++;
              });
              codeEl.innerHTML = html2;
              const rp = interpolate(lt, [b.clickT - 0.6, b.clickT - 0.2], [0, 1], { easing: easeOutBack });
              setT(runEl, { opacity: rp.toFixed(2), transform: `translateY(${lerp(16, 0, rp).toFixed(1)}px) scale(${(lt > b.clickT && lt < b.clickT + 0.15) ? 0.94 : 1})` });
            };

          } else if (sc.type === 'deploy') {
            const steps = sc.steps || [{ ic: 'braces', lb: 'Parse SKILL.md' }, { ic: 'layers', lb: 'Validate schema' }, { ic: 'shield', lb: 'Security scan' }, { ic: 'globe', lb: 'Publish to marketplace' }];
            const rows = steps.map((s, j) => `<div class="row"><span class="ic">${svgIcon(s.ic, { size: 46 })}</span><span class="lb">${s.lb}</span><span class="st" id="st_${i}_${j}"></span></div>`).join('');
            const html = `<div class="sec-title" data-layer="critical">${sc.title || 'Live in seconds'}</div><div class="pipe" data-layer="critical">${rows}<div class="bar"><i id="bar_${i}"></i></div><div class="live" id="live_${i}" style="opacity:0">${svgIcon('check', { size: 40, color: '#8fe6b0' })} Live <span class="u">${sc.url || 'api.plinth.dev/summarize'}</span></div></div>`;
            const { el, cam } = mkScene(html); b.el = el; b.cam = cam;
            // steps finish, then the "Live" payoff lands and HOLDS at full visibility (by settleBy)
            const each = (settleBy(dur) - 1.2) / steps.length;
            b.animate = (lt) => {
              steps.forEach((s, j) => { const doneAt = 0.6 + (j + 1) * each; const el2 = $(`st_${i}_${j}`); if (!el2) return;
                if (lt >= doneAt) el2.innerHTML = svgIcon('check', { size: 44, color: '#8fe6b0' });
                else if (lt >= doneAt - each) el2.innerHTML = `<div class="spinner" style="transform:rotate(${(lt * 720).toFixed(0)}deg)"></div>`;
                else el2.innerHTML = ''; });
              const bar = $(`bar_${i}`); if (bar) bar.style.width = (interpolate(lt, [0.6, 0.6 + steps.length * each], [0, 100], { easing: easeOutCubic })).toFixed(1) + '%';
              const lv = $(`live_${i}`); if (lv) { const p = interpolate(lt, [settleBy(dur) - 0.5, settleBy(dur)], [0, 1], { easing: easeOutBack }); lv.style.opacity = p.toFixed(2); lv.style.transform = `scale(${lerp(0.9, 1, p).toFixed(3)})`; } };

          } else if (sc.type === 'call') {
            const html = `<div class="sec-title" data-layer="critical">${sc.title || 'Anyone calls it'}</div>` + win(sc.file || 'REST · MCP', `<div class="req"><span class="m">POST</span><span class="u">${sc.url || '/agents/summarize'}</span></div><div class="sendbtn" id="send_${i}">${svgIcon('bolt', { size: 26, color: '#fff' })} Send</div><div class="resp" id="resp_${i}" style="opacity:0"><span class="k">"summary"</span>: "${sc.resp || 'Plinth turns one file into a paid API.'}"</div><div class="badges"><span class="badge" id="b1_${i}" style="opacity:0">${svgIcon('clock', { size: 26, color: '#cfd6ff' })} ${sc.latency || '412ms'}</span><span class="badge" id="b2_${i}" style="opacity:0; background:rgba(60,180,110,0.16); border-color:rgba(80,200,130,0.42); color:#a6f0c6">${sc.cost || '$0.002'} / call</span></div>`);
            const { el, cam } = mkScene(html); b.el = el; b.cam = cam;
            // cursor travels in from the right, arrives at Send, dwells, clicks
            b.cursor = [{ t: 0.35, x: 0.85, y: 0.74 }, { t: 1.45, x: 0.3, y: 0.5 }, { t: 1.72, x: 0.3, y: 0.5, click: true }];
            b.clickT = 1.72; // single source: cursor click keyframe + button press share this
            b.camera = sc.camera || [{ t: 0, s: 1.02, y: -10 }, { t: 2.4, s: 1.0, y: 0 }, { t: settleBy(dur), s: 1.03, y: 26 }];
            b.animate = (lt) => {
              gloss(cam, lt, 0.15);
              const send = $(`send_${i}`); if (send) send.style.transform = `scale(${(lt > b.clickT && lt < b.clickT + 0.15) ? 0.94 : 1})`;
              const resp = $(`resp_${i}`); if (resp) { const p = interpolate(lt, [2.1, 2.7], [0, 1], { easing: easeOutExpo }); resp.style.opacity = p.toFixed(2); resp.style.transform = `translateY(${lerp(26, 0, p).toFixed(1)}px)`; }
              const b1 = $(`b1_${i}`), b2 = $(`b2_${i}`);
              if (b1) { const p = interpolate(lt, [2.9, 3.2], [0, 1], { easing: easeOutBack }); b1.style.opacity = p.toFixed(2); b1.style.transform = `scale(${lerp(0.6, 1, p).toFixed(3)})`; }
              if (b2) { const p = interpolate(lt, [3.15, 3.5], [0, 1], { easing: easeOutBack }); b2.style.opacity = p.toFixed(2); b2.style.transform = `scale(${lerp(0.6, 1, p).toFixed(3)})`; } };

          } else if (sc.type === 'earn') {
            const calls = sc.calls || [{ nm: 'agent-scout', v: 0.002 }, { nm: 'inbox-app', v: 0.002 }, { nm: 'agent-atlas', v: 0.004 }, { nm: 'crm-sync', v: 0.002 }, { nm: 'agent-nova', v: 0.003 }];
            const feed = calls.map((c, j) => `<div class="fr" id="fr_${i}_${j}" style="opacity:0">${svgIcon('agent', { size: 34 })}<span class="nm">${c.nm} → summarize</span><span class="pl">+$${c.v.toFixed(3)}</span></div>`).join('');
            const html = `<div class="sec-title" data-layer="critical">${sc.title || 'You earn on <em>every call.</em>'}</div><div class="earn"><div class="feed">${feed}</div><div class="total" data-layer="critical"><div class="v" id="tot_${i}">$0.00</div><div class="l">you keep 80%</div></div></div>`;
            const { el, cam } = mkScene(html); b.el = el; b.cam = cam;
            const step = (settleBy(dur) - 0.8) / calls.length; // feed + count settle by settleBy(dur)
            const target = sc.total || 1247;
            b.animate = (lt) => {
              calls.forEach((c, j) => { const at = 0.4 + j * step; const fr = $(`fr_${i}_${j}`); if (!fr) return;
                const p = interpolate(lt, [at, at + 0.4], [0, 1], { easing: easeOutBack }); fr.style.opacity = p.toFixed(2); fr.style.transform = `translateX(${lerp(-30, 0, p).toFixed(1)}px)`; });
              const tot = $(`tot_${i}`); if (tot) tot.textContent = '$' + formatNumber(Math.round(target * interpolate(lt, [0.4, settleBy(dur)], [0, 1], { easing: easeOutCubic })), {}); };

          } else if (sc.type === 'cta') {
            const { el, cam } = mkScene(`<div class="cam" style="align-items:center">${sc.logo ? `<div style="width:130px;height:130px;margin:0 auto 28px">${icon(sc.logo, '')}</div>` : ''}<div class="big" data-layer="critical">${sc.cta}</div><div><span class="ctaUrl" data-layer="critical">${sc.url}</span></div></div>`);
            b.el = el; b.cam = cam;
            const words = splitText(cam.querySelector('.big'), 'word'), url = cam.querySelector('.ctaUrl').parentElement, logo = cam.querySelector('div');
            b.animate = (lt) => { animateUnits(words, Math.max(0, lt - IN0), { preset: 'up', stagger: 0.05, each: 0.4, dist: 40 });
              const u = interpolate(lt, [0.8 + IN0, 1.3 + IN0], [0, 1], { easing: easeOutQuart }); setT(url, { opacity: u.toFixed(2), transform: `translateY(${lerp(18, 0, u).toFixed(1)}px)` }); };
          } else if (sc.type === 'component') {
            // render a REAL UI component lifted off the site (scripts/capture-component.mjs), scaled to fit.
            const c = (window.__components && window.__components[sc.src]) || { html: '<div style="color:#888">component not captured</div>', w: 900, h: 560 };
            const fit = (sc.scale || 1) * Math.min(1360 / Math.max(1, c.w), 780 / Math.max(1, c.h), 1.6);
            const { el, cam } = mkScene(`${sc.title ? `<div class="sec-title" data-layer="critical">${sc.title}</div>` : ''}<div class="capwrap" style="position:relative;width:${c.w}px;height:${c.h}px;transform-origin:center;border-radius:18px;overflow:hidden;box-shadow:0 40px 100px rgba(20,20,30,0.16)">${c.html}</div>`);
            b.el = el; b.cam = cam;
            const wrap = cam.querySelector('.capwrap');
            b.camera = sc.camera; b.cursor = sc.cursor;
            b.animate = (lt) => { const p = interpolate(lt, [0.1, 0.55], [0, 1], { easing: easeOutExpo }); setT(wrap, { opacity: clamp01(p).toFixed(2), transform: `scale(${(fit * lerp(0.94, 1, p)).toFixed(3)})` }); };
          } else { const { el, cam } = mkScene(`<div class="big" data-layer="critical">${sc.text || ''}</div>`); b.el = el; b.cam = cam; }
          if (b.el) b.el.classList.add(value === 'light' ? 'light' : 'dark');
          return b;
        }

        function colorCode(s) {
          return s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/^(\s*)([\w-]+)(:)/, '$1<span class="k">$2</span>$3')
            .replace(/(\$[\d.]+)/g, '<span class="s">$1</span>')
            .replace(/(#.*)$/g, '<span class="c">$1</span>');
        }

        // camera keyframe interpolation → {s, x, y}
        function cameraAt(kf, lt) {
          if (!kf || !kf.length) return { s: 1, x: 0, y: 0 };
          let a = kf[0], b2 = kf[kf.length - 1];
          for (let i = 0; i < kf.length - 1; i++) { if (lt >= kf[i].t && lt <= kf[i + 1].t) { a = kf[i]; b2 = kf[i + 1]; break; } if (lt > kf[i + 1].t) a = b2 = kf[i + 1]; }
          const p = a === b2 ? 1 : easeInOutCubic(clamp01((lt - a.t) / (b2.t - a.t)));
          return { s: lerp(a.s ?? 1, b2.s ?? 1, p), x: lerp(a.x ?? 0, b2.x ?? 0, p), y: lerp(a.y ?? 0, b2.y ?? 0, p) };
        }

        function renderFrame(f) {
          const t = f / fps;
          const seq = sequence(f, fps, SEGS), idx = seq.index, cur = built[idx], lt = seq.localT;
          // moving background: internal drift + a slow CONTINUOUS breathe in absolute t —
          // per-scene lt/dur ramps reset at every cut (a visible 0.05 scale pop); sin(t) doesn't.
          renderBg(ctx, W, H, t, cur.bg);
          $('cv').style.transform = `scale(${(1.065 + 0.025 * Math.sin(t * 0.35)).toFixed(4)})`;
          $('brand').style.opacity = (cur.type === 'cta' ? 0 : interpolate(t, [0.3, 0.9], [0, 0.9])).toFixed(2);

          built.forEach((b, i) => {
            if (i !== idx) { b.el.style.display = 'none'; return; }
            b.el.style.display = 'flex';
            const enter = seq.enter, exit = seq.exit;
            // varied transitions by scene index: push / scale / rise
            const mode = i % 3;
            const tf = mode === 0 ? `translateY(${((1 - easeOutExpo(enter)) * 48).toFixed(1)}px)` : mode === 1 ? `scale(${lerp(0.94, 1, easeOutExpo(enter)).toFixed(4)})` : `translateX(${((1 - easeOutExpo(enter)) * -300).toFixed(1)}px)`;
            b.el.style.opacity = (easeOutCubic(clamp01(enter)) * (1 - exit)).toFixed(3); // eased: ~86% opaque by 0.2s so content reveals at IN0 don't stack on a half-faded scene
            b.el.style.transform = `${tf} scale(${lerp(1, 1.03, easeOutQuart(exit)).toFixed(4)})`;
            // camera zoom-in/out on the mockup
            const cam = cameraAt(b.camera, lt);
            b.cam.style.transform = `scale(${cam.s.toFixed(4)}) translate(${cam.x.toFixed(1)}px, ${cam.y.toFixed(1)}px)`;
          });

          // cursor + click ripple (scripted per scene)
          const cs = cur.cursor; const cursor = $('cursor'), ripple = $('ripple');
          if (cs && cs.length) {
            let a = cs[0], b2 = cs[cs.length - 1];
            for (let i = 0; i < cs.length - 1; i++) { if (lt >= cs[i].t && lt <= cs[i + 1].t) { a = cs[i]; b2 = cs[i + 1]; break; } if (lt > cs[i + 1].t) a = b2 = cs[i + 1]; }
            const p = a === b2 ? 1 : easeOutCubic(clamp01((lt - a.t) / (b2.t - a.t))); // ballistic: decelerate INTO target (Fitts)
            const cx = lerp(a.x, b2.x, p) * W, cy = lerp(a.y, b2.y, p) * H;
            const clickT = cs.find((w) => w.click)?.t ?? -9; const dd = lt - clickT;
            const press = dd > 0 && dd < 0.14 ? 0.82 : 1;
            cursor.style.opacity = interpolate(lt, [Math.max(0, cs[0].t - 0.3), cs[0].t], [0, 1]).toFixed(2);
            cursor.style.transform = `translate(${cx.toFixed(0)}px, ${cy.toFixed(0)}px) scale(${press})`;
            if (dd > 0 && dd < 0.5) { const rp = clamp01(dd / 0.5); const R = lerp(10, 70, rp); ripple.style.opacity = (0.7 * (1 - rp)).toFixed(2); setT(ripple, { left: (cx - R) + 'px', top: (cy - R) + 'px', width: 2 * R + 'px', height: 2 * R + 'px' }); }
            else ripple.style.opacity = '0';
          } else { cursor.style.opacity = '0'; ripple.style.opacity = '0'; }

          // dip transition at boundaries (brand blue)
          let dipA = 0; bounds.slice(0, -1).forEach((bnd) => { const d = Math.abs(t - bnd); if (d < 0.2) dipA = Math.max(dipA, 0.85 * (1 - d / 0.2)); });
          setT($('dip'), { opacity: dipA.toFixed(3), background: '#1f3bff' });

          cur.animate(lt, seq);
        }
        // segments: studio-timeline + motion-audit contract — {type,label,t0,t1,transition,scene}
        // (scene = index into data.scenes so the studio grip retimes data.scenes[i].dur)
        const segments = built.map((b, i) => ({ type: b.type, label: b.type, t0: bounds[i] - b.dur, t1: bounds[i], transition: TRANS, scene: i }));
        return { fps, duration, stings: bounds.slice(0, -1), segments, renderFrame };
      });
    </script>
  </body>
</html>
