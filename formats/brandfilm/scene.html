<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>brandfilm</title>
    <link rel="stylesheet" href="/core/tokens.css" />
    <style>
      /* brandfilm — long-form (30–90s) LANDSCAPE brand film. data.scenes[] = a reel of typed scenes
         (title/statement/steps/stats/features/quote/split/cta). Each scene gets a DISTINCT animated
         background (core/backgrounds.js) + value/hue, per the variety rule, joined by dip transitions.
         Cohesion held by one accent (#1F3BFF), type family, margins. All pure in n. */
      .chrome, .brand { display: none; }
      .stage { background: none !important; }
      .stage::before, .stage::after { display: none !important; }
      .bf { position: absolute; inset: 0; overflow: hidden; font-family: var(--font-sans, 'Inter'), sans-serif; }
      #cv { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; }
      .bf-vig { position: absolute; inset: 0; z-index: 2; pointer-events: none; box-shadow: inset 0 0 120px 0 rgba(20,24,64,0.06); }
      .bf-vig.light { box-shadow: none; }

      .sc { position: absolute; inset: 0; z-index: 10; display: none; flex-direction: column; justify-content: center;
        padding: 0 160px; will-change: transform, opacity; }
      .sc.dark { color: var(--on-dark, #f4f5ff); } .sc.light { color: var(--on-light, #12162e); }
      .sc.center { align-items: center; text-align: center; }

      .eyebrow { font: 600 30px var(--font-mono, 'Geist Mono'), monospace; letter-spacing: 0.04em; color: var(--em, #7d8bff); margin-bottom: 32px; }
      .light .eyebrow { color: var(--accent, #1f3bff); }
      .title { font: 800 122px var(--font-sans, 'Inter'), sans-serif; line-height: 0.98; letter-spacing: -0.035em; max-width: 1400px; text-shadow: 0 6px 60px rgba(6,8,30,0.5); }
      .title em, .stmt em, .ctaH em { font: italic 400 1.02em var(--font-serif, 'Instrument Serif'), serif; color: var(--em, #a9b4ff); }
      .light .title em, .light .stmt em, .light .ctaH em { color: var(--accent, #1f3bff); }
      .kw { display: inline-block; white-space: pre; will-change: transform, opacity; }
      .sub { margin-top: 28px; font: italic 400 74px var(--font-serif, 'Instrument Serif'), serif; color: #fff; }
      .light .sub { color: var(--muted, #2a3050); }
      .stmt { font: 800 132px var(--font-sans, 'Inter'), sans-serif; line-height: 0.98; letter-spacing: -0.038em; max-width: 1500px; }
      .stmt.serif { font: italic 400 150px var(--font-serif, 'Instrument Serif'), serif; letter-spacing: -0.01em; }

      .flow { display: flex; align-items: stretch; justify-content: center; }
      .card { position: relative; width: 430px; padding: 44px 40px; will-change: transform, opacity; }
      .dark .card { background: rgba(18,22,54,0.5); border: 1px solid rgba(169,180,255,0.18); box-shadow: 0 30px 70px rgba(6,8,30,0.4); }
      .light .card { background: rgba(255,255,255,0.76); border: 1px solid rgba(20,22,60,0.12); box-shadow: 0 30px 70px rgba(40,46,110,0.16); }
      .card .n { font: 600 26px var(--font-mono, 'Geist Mono'), monospace; color: var(--accent, #1f3bff); letter-spacing: 0.08em; }
      .light .card .n { color: var(--accent, #1f3bff); }
      .card .h { margin-top: 16px; font: 800 44px var(--font-sans, 'Inter'), sans-serif; letter-spacing: -0.02em; line-height: 1.02; }
      .card .d { margin-top: 14px; font: 500 29px var(--font-sans, 'Inter'), sans-serif; line-height: 1.26; opacity: 0.82; }
      .conn { align-self: center; width: 56px; height: 4px; background: var(--accent, #1f3bff); transform-origin: left center; box-shadow: 0 0 14px rgba(31,59,255,0.5); }

      .mtitle { text-align: center; font: 800 70px var(--font-sans, 'Inter'), sans-serif; letter-spacing: -0.022em; margin-bottom: 66px; }
      .mtitle em { font: italic 400 1.02em var(--font-serif, 'Instrument Serif'), serif; color: var(--accent, #1f3bff); }
      .light .mtitle em { color: var(--accent, #1f3bff); } .dark .mtitle em { color: var(--em, #a9b4ff); }

      .stats { display: flex; justify-content: center; gap: 130px; }
      .stat { text-align: center; will-change: transform, opacity; }
      .stat .v { font: 800 178px var(--font-sans, 'Inter'), sans-serif; letter-spacing: -0.04em; line-height: 0.88; font-feature-settings: 'tnum' 1; }
      .stat .l { margin-top: 18px; font: 600 38px var(--font-sans, 'Inter'), sans-serif; color: var(--em, #a9b4ff); }
      .light .stat .l { color: var(--muted, #444a6b); }

      .feats { display: grid; grid-template-columns: 1fr 1fr; gap: 40px 90px; max-width: 1560px; margin: 0 auto; }
      .feat { will-change: transform, opacity; }
      .feat .fh { font: 800 52px var(--font-sans, 'Inter'), sans-serif; letter-spacing: -0.02em; }
      .feat .fh:before { content: ''; display: inline-block; width: 18px; height: 18px; margin-right: 18px; background: var(--accent, #1f3bff); box-shadow: 0 0 14px rgba(31,59,255,0.6); vertical-align: middle; }
      .feat .fd { margin-top: 12px; padding-left: 36px; font: 500 32px var(--font-sans, 'Inter'), sans-serif; line-height: 1.28; opacity: 0.8; }

      .quote { font: italic 400 116px var(--font-serif, 'Instrument Serif'), serif; line-height: 1.06; max-width: 1500px; text-align: center; }
      .cite { margin-top: 40px; font: 600 34px var(--font-mono, 'Geist Mono'), monospace; color: var(--em, #a9b4ff); letter-spacing: 0.02em; }

      .split { display: flex; align-items: center; gap: 90px; }
      .split .sc-txt { flex: 1; } .split .sc-img { flex: 0 0 720px; }
      .split .sc-img img { width: 100%; display: block; filter: grayscale(1) contrast(1.05); }

      .mark { width: 132px; height: 132px; margin: 0 auto 30px; will-change: transform; filter: drop-shadow(0 16px 50px rgba(10,14,60,0.6)); }
      .mark img { width: 100%; height: 100%; object-fit: contain; }
      .ctaH { font: 800 104px var(--font-sans, 'Inter'), sans-serif; letter-spacing: -0.03em; line-height: 0.98; max-width: 1340px; }
      .ctaUrl { margin-top: 40px; display: inline-block; padding: 20px 42px; background: var(--ink, #0a0c1e); color: #fff;
        font: 600 44px var(--font-mono, 'Geist Mono'), monospace; border: 1px solid var(--accent, #1f3bff); box-shadow: 0 0 44px rgba(31,59,255,0.45); }

      .bf-dip { position: absolute; inset: 0; z-index: 40; opacity: 0; pointer-events: none; }
      /* persistent brand mark (the real plinthai.xyz favicon) — top-left, reads on light + dark */
      .bf-brand { position: absolute; top: 54px; left: 60px; width: 58px; height: 58px; z-index: 30;
        border-radius: 15px; box-shadow: 0 8px 24px rgba(8,10,34,0.35); }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="bf">
        <canvas id="cv" width="1920" height="1080"></canvas>
        <div class="bf-vig" id="vig"></div>
        <div id="root"></div>
        <img class="bf-brand" id="brand" src="/engine/assets/plinth/icon.png" alt="" />
        <div class="bf-dip" id="dip"></div>
      </div>
    </div>
    <script type="module">
      import { boot, clamp01, lerp, interpolate, spring, sequence, easeOutCubic, easeOutQuart, easeOutExpo, easeOutBack, formatNumber, icon } from '/core/lib.js';
      import { splitText, animateUnits } from '/core/kinetic.js';
      import { renderBg, bgPreset } from '/core/backgrounds.js';
      const $ = (id) => document.getElementById(id);
      const setT = (el, s) => Object.assign(el.style, s);
      const W = 1920, H = 1080;

      // auto-rotation: alternates value + engine so adjacent scenes differ (variety rule)
      const DARK_BGS = ['aurora', 'constellation', 'brandglow', 'mesh', 'spotlight'];
      function autoBg(i) { return i % 3 === 1 ? { name: 'dotmatrix', value: 'light' } : { name: DARK_BGS[i % DARK_BGS.length], value: 'dark' }; }

      boot((data, fps, theme) => {
        const PAL = theme && theme.bg; // brand's bg palette (from the colours pack) → recolours every preset
        if (data.brand) $('brand').src = data.brand; // brand watermark favicon (else default)
        const ctx = $('cv').getContext('2d'), root = $('root');
        const built = (data.scenes || []).map((sc, i) => buildScene(sc, i));
        const SEGS = built.map((b) => ({ name: 'sc' + b.i, dur: b.dur, transition: 0.5 }));
        const duration = SEGS.reduce((a, s) => a + s.dur, 0);
        const bounds = []; let acc = 0; for (const s of SEGS) { bounds.push(acc + s.dur); acc += s.dur; }
        const DIP = ['var(--accent, #1f3bff)', '#eef0ff'];

        function buildScene(sc, i) {
          const el = document.createElement('div');
          const auto = autoBg(i);
          const value = sc.value || auto.value;
          const bg = bgPreset(sc.bg || auto.name, value, PAL);
          el.className = 'sc ' + value + (sc.type === 'statement' || sc.type === 'stats' || sc.type === 'quote' || sc.type === 'cta' || sc.type === 'steps' || sc.type === 'features' ? ' center' : '');
          const dur = sc.dur || (sc.type === 'statement' ? 3.0 : sc.type === 'cta' ? 4.0 : 3.6);
          let animate = () => {};
          const b = { i, el, dur, bg, value, type: sc.type };

          if (sc.type === 'title') {
            el.innerHTML = `${sc.eyebrow ? `<div class="eyebrow">${sc.eyebrow}</div>` : ''}<div class="title">${sc.title}</div>${sc.sub ? `<div class="sub">${sc.sub}</div>` : ''}`;
            const words = splitText(el.querySelector('.title'), 'word');
            const eb = el.querySelector('.eyebrow'), sub = el.querySelector('.sub');
            animate = (lt) => { animateUnits(words, lt, { preset: 'up', stagger: 0.06, each: 0.5, dist: 54 });
              if (eb) eb.style.opacity = interpolate(lt, [0.1, 0.5], [0, 1]).toFixed(2);
              if (sub) { const s = interpolate(lt, [0.9, 1.5], [0, 1], { easing: easeOutCubic }); setT(sub, { opacity: s.toFixed(2), transform: `translateY(${lerp(24, 0, s).toFixed(1)}px)` }); } };
          } else if (sc.type === 'statement') {
            el.innerHTML = `<div class="stmt${sc.serif ? ' serif' : ''}">${sc.text}</div>`;
            const words = splitText(el.querySelector('.stmt'), 'word');
            animate = (lt) => animateUnits(words, lt, { preset: sc.serif ? 'up' : 'up', stagger: 0.07, each: 0.55, dist: 48 });
          } else if (sc.type === 'steps') {
            const inner = sc.title ? `<div class="mtitle">${sc.title}</div>` : '';
            const flow = document.createElement('div'); flow.className = 'flow';
            const cards = [], conns = [];
            sc.steps.forEach((s, j) => { if (j) { const c = document.createElement('div'); c.className = 'conn'; flow.appendChild(c); conns.push(c); }
              const cd = document.createElement('div'); cd.className = 'card'; cd.innerHTML = `<div class="n">${s.n || ('0' + (j + 1))}</div><div class="h">${s.h}</div><div class="d">${s.d}</div>`; flow.appendChild(cd); cards.push(cd); });
            el.innerHTML = inner; el.appendChild(flow);
            const mt = el.querySelector('.mtitle');
            animate = (lt) => { if (mt) { const t = interpolate(lt, [0.1, 0.6], [0, 1], { easing: easeOutExpo }); setT(mt, { opacity: t.toFixed(2), transform: `translateY(${lerp(28, 0, t).toFixed(1)}px)` }); }
              cards.forEach((cd, j) => { const s = spring(lt - 0.45 - j * 0.4, { bounce: 0.42, settle: 0.6 }); setT(cd, { opacity: clamp01((lt - 0.45 - j * 0.4) * 3).toFixed(2), transform: `translateY(${lerp(46, 0, s).toFixed(1)}px) scale(${lerp(0.92, 1, s).toFixed(3)})` }); });
              conns.forEach((c, j) => { c.style.transform = `scaleX(${interpolate(lt, [1.0 + j * 0.4, 1.4 + j * 0.4], [0, 1], { easing: easeOutQuart }).toFixed(3)})`; }); };
          } else if (sc.type === 'stats') {
            const wrap = document.createElement('div'); wrap.className = 'stats';
            const vs = sc.stats.map((s) => { const d = document.createElement('div'); d.className = 'stat'; d.innerHTML = `<div class="v"></div><div class="l">${s.l}</div>`; wrap.appendChild(d); return d.querySelector('.v'); });
            el.appendChild(wrap);
            animate = (lt) => sc.stats.forEach((s, j) => { const inn = interpolate(lt, [0.2 + j * 0.24, 1.1 + j * 0.24], [0, 1], { easing: easeOutExpo });
              vs[j].textContent = (s.compact ? formatNumber(s.v * inn, { compact: true }) : formatNumber(Math.round(s.v * inn), {})) + (s.suffix || '');
              const r = interpolate(lt, [0.1 + j * 0.24, 0.7 + j * 0.24], [0, 1], { easing: easeOutBack }); setT(vs[j].parentElement, { opacity: clamp01(r).toFixed(2), transform: `translateY(${lerp(44, 0, r).toFixed(1)}px)` }); });
          } else if (sc.type === 'features') {
            const inner = sc.title ? `<div class="mtitle">${sc.title}</div>` : '';
            const grid = document.createElement('div'); grid.className = 'feats';
            const items = sc.items.map((it) => { const f = document.createElement('div'); f.className = 'feat'; f.innerHTML = `<div class="fh">${it.h}</div><div class="fd">${it.d}</div>`; grid.appendChild(f); return f; });
            el.innerHTML = inner; el.appendChild(grid);
            const mt = el.querySelector('.mtitle');
            animate = (lt) => { if (mt) mt.style.opacity = interpolate(lt, [0.1, 0.5], [0, 1]).toFixed(2);
              items.forEach((f, j) => { const r = interpolate(lt, [0.3 + j * 0.12, 0.9 + j * 0.12], [0, 1], { easing: easeOutCubic }); setT(f, { opacity: r.toFixed(2), transform: `translateY(${lerp(34, 0, r).toFixed(1)}px)` }); }); };
          } else if (sc.type === 'quote') {
            el.innerHTML = `<div class="quote">${sc.text}</div>${sc.cite ? `<div class="cite">${sc.cite}</div>` : ''}`;
            const words = splitText(el.querySelector('.quote'), 'word'); const cite = el.querySelector('.cite');
            animate = (lt) => { animateUnits(words, lt, { preset: 'up', stagger: 0.05, each: 0.5, dist: 30 }); if (cite) cite.style.opacity = interpolate(lt, [1.0, 1.5], [0, 1]).toFixed(2); };
          } else if (sc.type === 'split') {
            el.classList.remove('center');
            el.innerHTML = `<div class="split"><div class="sc-txt">${sc.eyebrow ? `<div class="eyebrow">${sc.eyebrow}</div>` : ''}<div class="title">${sc.title}</div>${sc.sub ? `<div class="sub">${sc.sub}</div>` : ''}</div><div class="sc-img">${icon(sc.image, '')}</div></div>`;
            const words = splitText(el.querySelector('.title'), 'word'); const img = el.querySelector('.sc-img'), eb = el.querySelector('.eyebrow'), sub = el.querySelector('.sub');
            animate = (lt) => { animateUnits(words, lt, { preset: 'up', stagger: 0.06, each: 0.5, dist: 48 });
              if (eb) eb.style.opacity = interpolate(lt, [0.1, 0.5], [0, 1]).toFixed(2);
              if (sub) sub.style.opacity = interpolate(lt, [0.9, 1.4], [0, 1]).toFixed(2);
              const iv = interpolate(lt, [0.2, 1.0], [0, 1], { easing: easeOutExpo }); setT(img, { opacity: iv.toFixed(2), transform: `translateX(${lerp(60, 0, iv).toFixed(0)}px)` }); };
          } else if (sc.type === 'cta') {
            el.innerHTML = `${sc.logo ? `<div class="mark">${icon(sc.logo, '')}</div>` : ''}<div class="ctaH">${sc.cta}</div><div><span class="ctaUrl">${sc.url}</span></div>`;
            const mark = el.querySelector('.mark'), h = el.querySelector('.ctaH'), u = el.querySelector('.ctaUrl').parentElement;
            animate = (lt) => { if (mark) { const s = spring(lt - 0.12, { bounce: 0.46, settle: 0.58 }); setT(mark, { opacity: clamp01(lt / 0.25).toFixed(2), transform: `translateY(${lerp(30, 0, s).toFixed(1)}px) scale(${lerp(0.55, 1, s).toFixed(3)})` }); }
              const hp = interpolate(lt, [0.35, 0.95], [0, 1], { easing: easeOutExpo }); setT(h, { opacity: hp.toFixed(2), transform: `translateY(${lerp(26, 0, hp).toFixed(1)}px)` });
              const up = interpolate(lt, [0.8, 1.3], [0, 1], { easing: easeOutQuart }); setT(u, { opacity: up.toFixed(2), transform: `translateY(${lerp(20, 0, up).toFixed(1)}px)` }); };
          }
          root.appendChild(el);
          b.animate = animate; return b;
        }

        function renderFrame(f) {
          const t = f / fps;
          const seq = sequence(f, fps, SEGS);
          const idx = seq.index, cur = built[idx];
          renderBg(ctx, W, H, t, cur.bg);
          $('vig').className = 'bf-vig' + (cur.value === 'light' ? ' light' : '');
          $('brand').style.opacity = (cur.type === 'cta' ? 0 : interpolate(t, [0.3, 0.9], [0, 0.9])).toFixed(2);

          built.forEach((b, i) => {
            if (i !== idx) { b.el.style.display = 'none'; return; }
            b.el.style.display = 'flex';
            const enter = seq.enter, exit = seq.exit;
            const style = i % 2 === 0 ? `translateY(${((1 - easeOutExpo(enter)) * 50).toFixed(1)}px)` : `scale(${lerp(0.965, 1, easeOutExpo(enter)).toFixed(4)})`;
            setT(b.el, { opacity: (clamp01(enter) * (1 - exit)).toFixed(3), transform: `${style} scale(${lerp(1, 1.04, easeOutQuart(exit)).toFixed(4)})` });
          });

          let dipA = 0, dipC = 'var(--accent, #1f3bff)';
          bounds.slice(0, -1).forEach((bnd, i) => { const dd = Math.abs(t - bnd); if (dd < 0.2) { const a = 0.9 * (1 - dd / 0.2); if (a > dipA) { dipA = a; dipC = built[i + 1] && built[i + 1].value === 'light' ? DIP[1] : DIP[0]; } } });
          setT($('dip'), { opacity: dipA.toFixed(3), background: dipC });

          cur.animate(seq.localT, seq);
        }
        return { fps, duration, stings: bounds.slice(0, -1), renderFrame };
      });
    </script>
  </body>
</html>
