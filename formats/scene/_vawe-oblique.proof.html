<style>
/* QUIETED in the bolder pass: two 660px plates read LARGER than beat 4's single plate, so the film's
   quietest beat was outweighing its loudest one. 560 each, and the restating caption is gone: the pair
   and the equals sign already say it, and a line repeating them was volume with no evidence in it.
   BEAT 6 · THESIS: the ONLY symmetric frame in the film, and the symmetry is the argument. Every other
   beat is deliberately off-balance, so a viewer reads the balance here before reading a word of it.
   No measured diff figure is printed: nobody has run one for THIS film, and a number nobody ran breaks
   the honesty rule. The picture makes the claim instead. */
/* THE REFERENCE GRAMMAR, in vawe's palette, on the stage kit's ramps.
   Decoded off the together.ai film frame by frame: a faintly cool near-white ground, WHITE planes
   separated by depth and never a border, a large radius, planes tilted in 3D that run off the frame
   edge, and one word of each sentence in the accent.
   EVERY SIZE IS A KIT ROLE and every shadow a kit elevation level. Seven frames that each invent their
   own scale are seven films (ui-skills pbakaus/typeset). */
/* The ground is set per beat from the theme's own backdrop rotation, and it REMAPS the tokens:
   this fragment is written once against --text and --surface and renders on any of the three. */
.g-root{position:absolute;inset:0;overflow:hidden;container-type:size}
.tilt-r{transform:perspective(2000px) rotateY(-17deg) rotateX(5deg) rotateZ(-2deg)}
.say{letter-spacing:-0.03em;line-height:1.14}
.w{display:inline-block}
.w-accent{color:var(--accent)}
/* RHYTHM: tight INSIDE a group, generous BETWEEN groups. One spacing value repeated everywhere gives
   every element equal weight, which is the flat frame the squint test catches (ui-skills pbakaus/layout).
   Two intervals, used consistently, are the whole cadence. */
/* align-items:start, or a pill stretches to the column width and stops being a pill. */
.grp{display:flex;flex-direction:column;align-items:flex-start;gap:var(--kit-space-2)}
/* Sets NO colour. `inherit` was worse than the original: all three classes sit on ONE element, so
   inherit takes the PARENT colour and still beats the chip that element is. Declaring nothing lets
   .kit-chip own its own pair, which is the only way that pair stays measured. */
.eyebrow-num{display:flex;align-items:center;gap:var(--kit-space-2)}
.eyebrow-num s{text-decoration:none;color:inherit}
/* The film's spine, carried on beat 1 and paid back on beat 7. The current step is the only one at
   full ink, which makes the rail a position indicator rather than a decoration. */
.rail{position:absolute;left:var(--kit-margin);right:var(--kit-margin);bottom:var(--kit-space-6);
  display:flex;align-items:center;gap:var(--kit-space-4);color:var(--dim)}
.rail b{font-weight:600;color:var(--text)}
.rail i{flex:1;height:1px;background:var(--line);font-style:normal}
/* THE DOUBLE BEZEL, at plate scale. A rendered frame is a physical object in this film, so it sits in
   a tray rather than floating as a sticker: an outer shell with its own faint fill and hairline, and an
   inner core with a top highlight and a CONCENTRIC radius, which is the outer radius minus the padding.
   Any other inner radius and the two curves visibly disagree, and that disagreement is the tell.
   ui-skills leonxlnx/soft-skill, the Doppelrand. */
/* flex:none, because every stage here is a flex container and a plate is a fixed-size object: a
   shrunk plate silently stopped being the size its beat's weight was measured against. */
.plate{position:relative;flex:none;width:var(--pw);--bez:calc(var(--pw) * .013);padding:var(--bez);
  box-sizing:content-box;background:rgba(15,22,32,.035);border-radius:calc(var(--pw) * .045);
  box-shadow:0 0 0 1px rgba(15,22,32,.05), var(--kit-elev-3)}
.plate-core{position:relative;height:calc(var(--pw) * var(--par, .5625));background:var(--surface);
  border-radius:calc(var(--pw) * .045 - var(--bez));overflow:hidden;
  /* inset ONLY: the tray carries the elevation for the pair. A core with its own outer shadow makes
     the bezel read as a card inside a card, which is the tell the technique is meant to avoid. */
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95)}
.plate-in{position:absolute;inset:7% 9%;display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:calc(var(--pw) * .03);text-align:center}
.plate-word{margin:0;font:700 calc(var(--pw) * .175)/.9 var(--font-sans);letter-spacing:-.05em;color:var(--text)}
.plate-claim{margin:0;font:400 calc(var(--pw) * .043)/1.3 var(--font-sans);color:var(--dim)}

.pf-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:var(--kit-space-7);text-align:center}
.pf-pair{display:flex;align-items:center;gap:var(--kit-space-6)}
.pf-pane{display:flex;flex-direction:column;align-items:center;gap:var(--kit-space-3)}
.pf-label{letter-spacing:.14em;text-transform:uppercase;font-family:var(--font-mono);color:var(--dim)}
.pf-eq{margin:0;font:400 84px/1 var(--font-mono);color:var(--accent)}

</style>
