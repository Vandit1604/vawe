<!-- a glass rod, on `"glass": "refractThin"`: a lower index, a wider spread between the three passes,
     so the colour split is the loud thing. This is the film's spectacle beat.
     THE SHAPE IS A CAPSULE AND NOT A TORUS ON PURPOSE. `mask` and `clip-path` do NOT clip a
     `backdrop-filter` in this Chrome: the filter runs over the whole border box while the mask removes
     only the element's OWN paint, so a masked annulus refracts its hole and loses its rim doing it.
     Verified by rendering a masked circle beside a plain one: the refraction was identical. Any glass
     shape here has to be a shape border-radius can make. -->
<style>
.s{position:absolute;inset:0;border-radius:999px;
   box-shadow: inset 0 0 0 2px rgba(255,255,255,.52),
               inset 22px 0 40px rgba(255,255,255,.20),
               inset -22px 0 44px rgba(176,208,255,.18),
               0 0 60px rgba(0,0,0,.40)}
.k{position:absolute;inset:0;border-radius:inherit;background:
   linear-gradient(90deg, rgba(255,255,255,.00) 0 8%, rgba(255,255,255,.42) 17%,
                   rgba(255,255,255,.00) 34%, rgba(255,255,255,.00) 66%,
                   rgba(176,208,255,.34) 84%, rgba(255,255,255,.00) 96%)}
</style>
<div class="s"><div class="k"></div></div>
