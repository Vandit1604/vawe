<!-- a rounded solid, on the same `"glass": "refract"` layer prop. Flat faces, so the bevel insets are
     tighter and squarer and the light runs as an edge rather than as a dome. -->
<style>
.s{position:absolute;inset:0;border-radius:26%;
   box-shadow: inset 0 0 0 2px rgba(255,255,255,.46),
               inset 12px 14px 30px rgba(255,255,255,.22),
               inset -12px -16px 34px rgba(176,208,255,.16),
               0 26px 48px rgba(0,0,0,.46)}
.k{position:absolute;inset:0;border-radius:inherit;background:
   linear-gradient(128deg, rgba(255,255,255,.30) 0 9%, transparent 26%),
   radial-gradient(26% 9% at 34% 19%, rgba(255,255,255,.80), transparent 72%)}
</style>
<div class="s"><div class="k"></div></div>
