     Theme: plinth (dark blue/purple, Inter + one Instrument Serif accent word, cuts.accent "punch").
     Archetype: a dense instrument face, a 7/5 kit-grid with a DESCENDING scale inside the 5-column

<style>/* STAGEKIT:start (generated by `make stagekit`, DO NOT EDIT BY HAND, paste verbatim into every fragment) */
:scope{--kit-space-1:10px;--kit-space-2:20px;--kit-space-3:30px;--kit-space-4:40px;--kit-space-5:60px;--kit-space-6:80px;--kit-space-7:120px;--kit-space-8:160px;--kit-unit:10px;--kit-margin:160px;--kit-gutter:var(--kit-space-4)}
.kit-root{position:absolute;inset:0;container-type:size;background:color-mix(in srgb, var(--line) 10%, transparent)}
.kit-stage{position:absolute;left:var(--kit-margin);right:var(--kit-margin);top:0;bottom:0}
.kit-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--kit-gutter)}
.kit-col-1{grid-column:span 1}
.kit-col-2{grid-column:span 2}
.kit-col-3{grid-column:span 3}
.kit-col-4{grid-column:span 4}
.kit-col-5{grid-column:span 5}
.kit-col-6{grid-column:span 6}
.kit-col-7{grid-column:span 7}
.kit-col-8{grid-column:span 8}
.kit-col-9{grid-column:span 9}
.kit-col-10{grid-column:span 10}
.kit-col-11{grid-column:span 11}
.kit-col-12{grid-column:span 12}
.kit-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 2px 10px rgba(0,0,0,.4), 0 18px 44px rgba(0,0,0,0.42)}
.kit-panel{background:var(--surface-2);border-radius:22px}
.kit-radius-sm{border-radius:11px}
.kit-radius-md{border-radius:22px}
.kit-radius-lg{border-radius:38px}
.kit-shadow{box-shadow:0 2px 10px rgba(0,0,0,.4), 0 18px 44px rgba(0,0,0,0.42)}
.kit-divider{height:1px;background:var(--line);border:0}
.kit-hook{font:700 113px var(--font-sans);color:var(--text);margin:0}
.kit-headline{font:700 79px var(--font-sans);color:var(--text);margin:0}
.kit-body{font:400 46px var(--font-sans);color:var(--text-2);margin:0}
.kit-caption{font:400 31px var(--font-sans);color:var(--dim);margin:0}
.kit-eyebrow{font:600 29px var(--font-mono);color:var(--text-2);letter-spacing:0.14em;text-transform:uppercase;margin:0}
.kit-stat{font:700 130px var(--font-num);font-variant-numeric:tabular-nums;color:var(--text);margin:0}
.kit-accent{color:var(--accent)}
/* STAGEKIT:end */</style>
<style>
.if-primary{padding:var(--kit-space-6)}
.if-secondary{display:flex;flex-direction:column;justify-content:center;gap:var(--kit-space-5);height:100%}
.if-gauge b{display:block}
/* A descending scale carries the primary/secondary/tertiary read (LAYOUT.md §1: size, then weight,
   then colour), so the two smaller gauges never compete with the one that matters. */
.if-gauge.g2 b{font:600 56px var(--font-num);color:var(--text)}
.if-gauge.g3 b{font:600 40px var(--font-num);color:var(--text-2)}
</style>
<div class="kit-root">
  <div class="kit-stage" style="display:flex;align-items:center">
    <div class="kit-grid" style="width:100%">
      <!-- 7/5, not 6/6: the primary gauge earns more than half on purpose. -->
      <div class="kit-col-7">
        <div class="kit-panel if-primary" data-part-card>
          <p class="kit-eyebrow">Teammate load &middot; this week</p>
          <p class="kit-stat" style="margin-top:var(--kit-space-3)">1,204</p>
          <p class="kit-caption" style="margin-top:var(--kit-space-2)">tasks closed without a human touch</p>
          <div class="kit-divider" style="margin:var(--kit-space-5) 0 var(--kit-space-4)"></div>
          <p class="kit-body" style="max-width:34ch">Every one logged against the ticket it closed, not a weekly summary written after the fact.</p>
        </div>
      </div>
      <div class="kit-col-5">
        <div class="if-secondary">
          <div class="if-gauge g2">
            <p class="kit-eyebrow">Median response</p>
            <b>42s</b>
          </div>
          <div class="kit-divider"></div>
          <div class="if-gauge g3">
            <p class="kit-eyebrow">Escalated to a person</p>
            <b>9%</b>
          </div>
          <div class="kit-divider"></div>
          <p class="kit-caption" style="font-family:var(--font-serif);font-style:normal;font-size:34px;color:var(--text-2)">&ldquo;trusted with the inbox&rdquo;</p>
        </div>
      </div>
    </div>
  </div>
</div>
