<style>
/* RECREATION of refs/together-chat.mp4. Every colour is the theme's, which was eyedropped off the
   reference's own frames; every size is a kit role. The reference has NO hard cuts, so nothing here
   is a "slide": each surface overlaps the next and the film dissolves between states. */
.g{position:absolute;inset:0;background:var(--bg);overflow:hidden;container-type:size;
  font-family:var(--font-sans)}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:var(--kit-space-4);text-align:center}
/* One word per element: the reference builds every sentence word by word. */
.w{display:inline-block}
.w-accent{color:var(--accent)}
.w-ghost{color:var(--dim)}
/* The reference's card: white, big radius, a wide soft shadow and NO border anywhere. */
.card{background:var(--surface);border-radius:26px;box-shadow:var(--kit-elev-3)}
.tilt{transform:perspective(2200px) rotateY(-16deg) rotateX(6deg) rotateZ(-2deg)}
.ty-stack{position:relative;display:grid;place-items:center}
.ty-a,.ty-b{grid-area:1/1;margin:0;font:500 92px/1.15 var(--font-sans);letter-spacing:-.025em;color:var(--text);white-space:nowrap}
.ty-a{opacity:var(--o-a,1)}
.ty-b{opacity:var(--o-b,0)}
.ty-clip{position:relative;display:inline-block}
/* WHOLE CHARACTERS, not a continuous wipe. "Introducing" is 11 glyphs, so the reveal is quantised to
   11 steps: each frame either shows a new letter or shows the same word, which is what typing IS.
   A continuous clip reveals a two-pixel sliver per frame, which is invisible and reads as a smear. */
.ty-clip .ty-in{display:inline-block;
  clip-path:inset(0 calc((1 - round(down, var(--typed,1) * 11) / 11) * 100%) 0 0)}
.ty-caret{position:absolute;top:12%;bottom:12%;width:.045em;background:var(--text);
  /* the bar rides the same quantised edge, so it never sits mid-glyph */
  left:calc(round(down, var(--typed,1) * 11) / 11 * 100%);opacity:var(--caret,1)}
.ty-dot{color:var(--accent)}
.ty-chip{display:inline-block;vertical-align:middle;margin-left:18px;padding:8px 15px;border-radius:999px;
  background:var(--accent-dim);color:var(--accent);font:600 20px/1 var(--font-sans);letter-spacing:.06em;
  transform:scale(var(--chip,1));opacity:var(--chip,1)}
</style>
