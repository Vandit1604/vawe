<!-- post-tock.arm.html: the arm alone, its own LAYER (split from post-tock.scene1.html, see that
     file's header). The rod and its weight, nothing else: no pivot cap, no scale, no readout, no copy.
     Fills its own layer box, rod running from the BOTTOM CENTRE upward, because the scene keys the
     layer's anchor to its own foot (`ox: 50, oy: 100`) and rotates the LAYER, not a node inside it.
     No `transform` and no `transform-origin` here: both are the scene's to write on the layer element.
     Not full-bleed: this box is the arm's own bounding box, sized by the scene to whatever length the
     pose table wants, so the root gets a TRANSPARENT ground, not `.kit-root`'s tinted full-bleed one,
     which would paint a visible rectangle behind a thin rod.
     REFUSES: any background on the box itself; a pivot cap (that's the static face's, so it doesn't
     spin with the arm); bold weight; any accent colour beyond the theme's one cobalt.
     Preview: make preview HTML=formats/scene/post-tock.arm.html THEME=mercury -->

<style>
/* The box IS the arm's layer: no background (transparent ground), sized to the rod's own proportions
   (long, thin) so a preview at default scale reads the same shape the scene will place. container-type
   lets .tock-weight below key its position as a fraction of THIS box's own height, not the frame's. */
.tock-armbox{position:absolute; inset:0; container-type:size}

/* The rod: bottom-anchored, centred, a slight taper (wider at the foot, narrower at the tip) so it
   reads as machined rather than extruded. Runs the full height of the box, foot to tip. */
.tock-rod{
  position:absolute; left:50%; bottom:0; width:15px; height:100%; margin-left:-7.5px;
  background:var(--accent);
  clip-path:polygon(40% 0%, 60% 0%, 68% 100%, 32% 100%);
}

/* The weight: a machined block riding the rod partway up, the one place the arm reads as having mass
   rather than being a drawn line. 64.3cqh from the top keeps the same fraction of the rod's length the
   single-fragment draft used (36 of 56 units down from the tip). */
.tock-weight{
  position:absolute; left:50%; top:64.3cqh; width:38px; height:22px; margin-left:-19px;
  background:var(--accent); border-radius:3px;
}
</style>
<div class="tock-armbox">
  <div class="tock-rod"></div>
  <div class="tock-weight"></div>
</div>
