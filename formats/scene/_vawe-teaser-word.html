<!-- THE EFFECT HAS A NAME AND A RECIPE: it is a THERMAL BLUR, and every earlier attempt here failed
     because I was guessing at it instead of looking it up. In After Effects it is:
       white text -> Fast Box Blur -> COLORAMA with a thermal ramp -> Glow -> grain.
     The colour does NOT come from stacking coloured copies, which is what I kept building. It comes
     from a GRADIENT MAP applied to LUMINANCE: blur white text and the falloff is greyscale, then remap
     that greyscale through the ramp so bright becomes white, mid becomes orange, dim becomes blue, and
     the far field becomes black. That single fact explains everything the stacked version could not:
     the continuous transition, the organic edge, and the letters being EATEN, because the ramp remaps
     the glyph's own soft edge along with everything around it.

     Colorama's job is done here by `feComponentTransfer` with per-channel `tableValues`, which is
     literally a gradient map. The stops are the tutorial's own eight:
       #000000 #214F89 #4A8497 #E5504C #EF7E01 #F9BA3B #FDEBD1 #FFFFFF
     converted to 0..1 tables below.

     `--g` uses max(x, -x) and not abs(x): CSS `abs()` is recent and this renderer's Chrome does not
     have it, so `--g` resolved to an invalid value, `calc(var(--g) * 9px)` failed with it, and the
     browser dropped the ENTIRE filter declaration. Both plates computed `filter: none` and the thermal
     map never ran, with the frame looking merely plain and nothing reporting anything.

     `--t` is the scene clock in seconds. `--p` is the morph, `--h` is how much THERMAL is applied, kept
     separate so the text can arrive clean, heat up, morph, and cool down. -->
<div style="position:absolute;inset:0;container-type:size;
  --p:clamp(0, calc((var(--t,0) - 2.7) / 1.1), 1);
  --heat:clamp(0, calc((var(--t,0) - 1.45) / 0.85), 1);
  --cool:clamp(0, calc((var(--t,0) - 4.45) / 0.8), 1);
  --h:calc(var(--heat) - var(--cool));
  --g:calc(1 - max(calc(var(--p) * 2 - 1), calc(1 - var(--p) * 2)));
  --pa:clamp(0, calc((var(--p) - 0.42) / 0.28), 1);
  --pb:clamp(0, calc((var(--p) - 0.30) / 0.28), 1)">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <filter id="thermal" x="-40%" y="-70%" width="180%" height="240%" color-interpolation-filters="sRGB">
      <!-- Fast Box Blur. Three box passes is what AE's iterations do, and what makes it a BOX blur
           rather than a gaussian: the falloff is flatter and reaches further, which is why the reference
           glow has body instead of trailing off. -->
      <feGaussianBlur stdDeviation="2.5" edgeMode="none" result="b1"/>
      <feGaussianBlur in="b1" stdDeviation="3.5" edgeMode="none" result="b2"/>
      <feGaussianBlur in="b2" stdDeviation="4.5" edgeMode="none" result="soft"/>
      <!-- THE FAR FIELD, and why a chain of gaussians alone could not produce the blue rim. A box
           blur falls off LINEARLY and so carries real luminance a long way from the glyph; a gaussian
           dies exponentially. Chained gaussians stay gaussian, so at the radius that keeps the letter
           cores white the falloff was already black two stops before the ramp's blue, and the word came
           out orange with no rim at all. This is the missing tail: one wide pass, scaled down, ADDED to
           the tight one. Added and not merged: feMerge composites, and this plate is opaque, so a merge
           would simply cover the tight result instead of summing with it. -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" edgeMode="none" result="wide"/>
      <feColorMatrix in="wide" type="matrix" result="tail"
        values="0.42 0 0 0 0  0 0.42 0 0 0  0 0 0.42 0 0  0 0 0 1 0"/>
      <feComposite in="soft" in2="tail" operator="arithmetic" k2="1" k3="1" result="field"/>
      <!-- COLORAMA. A gradient map on luminance: the blurred grey falloff becomes the thermal ramp. -->
      <feComponentTransfer in="field" result="hot">
        <feFuncR type="table" tableValues="0.0 0.129 0.29 0.898 0.937 0.976 0.992 1.0"/>
        <feFuncG type="table" tableValues="0.0 0.31 0.518 0.314 0.494 0.729 0.922 1.0"/>
        <feFuncB type="table" tableValues="0.0 0.537 0.592 0.298 0.004 0.231 0.82 1.0"/>
        <feFuncA type="table" tableValues="0 1 1 1 1 1 1 1"/>
      </feComponentTransfer>
      <!-- NO Composite Original. Merging the sharp SourceGraphic back on top covers the very band the
           ramp exists to create: the map's own top stop is #FFFFFF, so the glyph cores come out white
           from the ramp itself and laying the original over them only hides the orange. AE's Composite
           Original is for a glow that sits BESIDE the source; a gradient map replaces the source, which
           is the whole point of it. -->
    </filter>
  </defs></svg>

  <!-- THE PLATE. White text on opaque black, because a gradient map reads LUMINANCE and needs a real
       black to map the far field from. `screen` drops that black back out over the scene. -->
  <div class="plate" style="filter:url(#thermal) blur(calc(var(--g) * 14px)) contrast(calc(1 + var(--g) * 9));
    opacity:var(--h)">
    <div class="mass"></div>
  </div>
  <!-- THE CLEAN STATE. Before the heat arrives and after it cools, the word is plain white with no
       effect at all, which is what was asked for and what the reference's own opening does. -->
  <div class="plate" style="opacity:calc(1 - var(--h));
    filter:blur(calc(var(--g) * 14px)) contrast(calc(1 + var(--g) * 9))">
    <div class="mass"></div>
  </div>

  <div style="position:absolute;inset:-45%;pointer-events:none;opacity:.20;mix-blend-mode:screen;
    transform:rotate(11deg);
    background-image:radial-gradient(#fff .45px,transparent .55px),radial-gradient(#fff .4px,transparent .5px);
    background-size:3px 3px,7px 5px;background-position:0 0,1px 2px"></div>

  <style>
    .plate { position:absolute; inset:0; background:#000; mix-blend-mode:screen;
             display:grid; place-items:center; }
    .mass  { position:relative; display:grid; place-items:center; }
    .mass::before, .mass::after {
      grid-area:1/1; color:#fff;
      font:700 clamp(40px,14cqw,196px)/1 var(--font-sans,system-ui),sans-serif;
      letter-spacing:-.04em; white-space:nowrap;
    }
    .mass::before { content:"launching soon"; opacity:calc(1 - var(--pa)); }
    .mass::after  { content:"vawe.dev";       opacity:var(--pb); }
  </style>
</div>
