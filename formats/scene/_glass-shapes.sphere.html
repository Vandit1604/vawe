<!-- a sphere. The REFRACTION is the layer's own `"glass": "refract"` (core/layers/util.js): the engine
     owns that recipe now, so this file is only the paint ON the shape, which is the half CSS does best.
     rim   = Fresnel. Reflectivity climbs at a grazing angle, so the edge is the bright part.
     insets= the bevel: a lit near face, and the light wrapping the far one.
     drop  = contact. Without it a glass shape reads as a decal rather than an object. -->
<style>
.s{position:absolute;inset:0;border-radius:50%;
   box-shadow: inset 0 0 0 2px rgba(255,255,255,.50),
               inset 16px 22px 44px rgba(255,255,255,.24),
               inset -18px -24px 50px rgba(176,208,255,.20),
               0 30px 54px rgba(0,0,0,.50)}
.k{position:absolute;inset:0;border-radius:inherit;background:
   radial-gradient(26% 13% at 33% 19%, rgba(255,255,255,.86), transparent 72%),
   radial-gradient(29% 8%  at 63% 85%, rgba(255,255,255,.30), transparent 76%)}
</style>
<div class="s"><div class="k"></div></div>
