     - flornkm/smooth-shadow-ring: principle only (this repo has no Tailwind shadow plugin, so the
       utility class is not installed) -- never pair a border/ring with a shadow on an elevated
       surface, or the two edges double up. Applied here as ONE box-shadow per card (kit-elev-3,
       already baked with an inset hairline) and no separate border, on the focused card and its
       two peeking neighbours.
     - s0xdk/refactoring-ui: principle only -- hierarchy from weight/color/size on a fixed scale,
       depth from emulated light (the kit's own elev ramp), never an ad hoc shadow value. The kit's
       own --kit-space-* / --kit-elev-* tokens already ARE this scale, so no new scale was invented.
     Refused: dammyjay93/interface-design and jakubkrehel/better-typography (already the two loaded
     for vawe-flow-editor/results per docs/CRAFT/SCREENS.md; a third and fourth builder skill on one
     surface is the stacking AGENTS.md warns against, and this frame is a grid/ring, not those two
     screen kinds). Local system wins on specifics: the kit's own type roles and 8px ramp, not a
     fetched skill's font or spacing defaults.
-->

<style>
  /* Ground wash: the first film's own measured colour, as a soft radial wash, so the resting
     frame already shows the device beat 6 turns on (AGENTS.md: "change bg colour according to
     each film's colour when browsing"). The engine crossfades this per film later; at rest it
     shows the focused film's own tint (#2763ea, the measured accent of out/vawe-launch.mp4 at 12s, the poster frame). The
     focused card now covers most of the frame, so this wash is what's left of the tint: a
     thin border of ground around the card, not a background behind a small ring. */
  #films-ground{
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse 80% 70% at 50% 46%, #2763ea 0%, color-mix(in srgb, #2763ea 62%, #000) 100%);
  }
  #films{
    position:absolute;inset:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;gap:var(--kit-space-3);
  }
  /* Contrast fix (owner feedback): the ink frame is what separates a card from the blue tint
     ground, not the shadow alone. The frame is the card itself, padded; the media (the actual
     playing film) sits inset with its own smaller radius, a hairline border and elevation, so
     it reads as a framed picture rather than a flat rectangle glued to the ground. */
  .film-card{
    position:relative;flex:none;overflow:hidden;border-radius:22px;aspect-ratio:16/9;
    background:var(--ink);padding:var(--kit-space-2);box-sizing:border-box;
  }
  .film-media{overflow:hidden;
    position:relative;width:100%;height:100%;overflow:hidden;
    border-radius:var(--kit-radius-md);border:1px solid rgba(255,255,255,.16);
    box-shadow:var(--kit-elev-2);
  }
  /* The still is a background-image DIV, not an <img>: an <img> tag here painted solid
     black in the real render pipeline (./bin/vawe) while it showed fine under `make screen`,
     confirmed by an isolated single-layer test scene. background-image on an absolutely
     positioned div renders correctly in both. Flag for the engine owner: this may affect
     any other fragment using a bare <img> tag. */
  /* Depth without a grey wash: each card shows its own image at full colour. A receding
     neighbour gets only a low-alpha black multiply (keeps hue, drops luminance) plus a
     smaller size and a lighter shadow, never `opacity` on the element itself. */
  .film-card .film-recede{position:absolute;inset:0;background:rgba(6,9,14,0)}
  .film-card .film-scrim{
    position:absolute;inset:0;
    background:linear-gradient(to top, rgba(8,12,20,.62) 0%, rgba(8,12,20,0) 42%);
  }
  .film-card .film-caption{min-width:0;
    position:absolute;left:var(--kit-space-3);right:var(--kit-space-3);bottom:var(--kit-space-3);
    display:flex;align-items:baseline;justify-content:space-between;gap:var(--kit-space-2);
  }
  /* Type stays on the kit's own ramp everywhere below: one size per role (.kit-body for the
     name, .kit-caption for the time/meta/label), never a one-off number. A receding card is
     told apart by the recede overlay, its shadow step and its width, not by shrinking type. */
  .film-card .film-name{color:#fff;font-weight:600;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .film-card .film-time{color:rgba(255,255,255,.82);margin:0;font-variant-numeric:tabular-nums}

  /* The redesign: the focused card is now the largest object in the film (about 1680x945,
     76.6% of the 1920x1080 frame), covering more than the terminal/timeline planes combined.
     The neighbours stay in the DOM (data-part, data-film, data-tint intact) but only their
     slivers show, partly off-frame, which is what "thin border of tint" means below. */
  .film-card[data-focus]{width:95.9cqw;padding:var(--kit-space-3);box-shadow:var(--kit-elev-3)}
  .film-card[data-ring="near"]{width:18cqw;padding:var(--kit-space-1);box-shadow:var(--kit-elev-2)}
  .film-card[data-ring="near"] .film-recede{background:rgba(6,9,14,.16)}
  .film-card[data-ring="outer"]{width:14cqw;padding:var(--kit-space-1);box-shadow:var(--kit-elev-1)}
  .film-card[data-ring="outer"] .film-recede{background:rgba(6,9,14,.30)}

  /* There is no room below the focused card (it nearly fills the frame vertically), so the
     eyebrow, the scrub bar and the meta line all sit ON the card, over its own dark-gradient
     strips, the same technique the name/time caption already used. */
  .film-card[data-focus] .film-scrim{
    background:linear-gradient(to top, rgba(8,12,20,1) 0%, rgba(8,12,20,1) 17%, rgba(8,12,20,0) 36%);
  }
  .film-card[data-focus] .film-top{
    position:absolute;left:0;right:0;top:0;height:16%;
    background:linear-gradient(to bottom, rgba(8,12,20,.55) 0%, rgba(8,12,20,0) 100%);
  }
  .film-card[data-focus] .film-label{
    position:absolute;left:var(--kit-space-4);top:var(--kit-space-3);
    display:flex;align-items:center;gap:var(--kit-space-2);
  }
  .film-card[data-focus] .film-label .dot{width:10px;height:10px;border-radius:999px;background:#fff}
  .film-card[data-focus] .film-label p{color:#fff;text-transform:uppercase;margin:0}
  .film-card[data-focus] .film-bottom{
    position:absolute;left:var(--kit-space-4);right:var(--kit-space-4);bottom:var(--kit-space-4);
    display:flex;flex-direction:column;gap:var(--kit-space-2);
  }
  .film-card[data-focus] .film-caption{position:static}
  /* The scrub bar: the beat's own claim ("each film should play, not be static") made concrete
     as a played-to position, plus a real meta line read with ffprobe off the actual file. */
  .film-scrub-row{display:flex;align-items:center;gap:var(--kit-space-3)}
  .film-scrub-row .track{position:relative;flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.28)}
  .film-scrub-row .played{position:absolute;left:0;top:0;bottom:0;width:31%;border-radius:999px;background:var(--accent)}
  .film-scrub-row .head{position:absolute;left:31%;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:999px;background:#fff;box-shadow:var(--kit-elev-1)}
  .film-scrub-row .meta{color:rgba(255,255,255,.82);margin:0;white-space:nowrap;font-variant-numeric:tabular-nums;font-family:var(--font-mono)}
</style>
