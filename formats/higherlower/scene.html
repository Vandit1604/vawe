<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>higherlower</title>
    <link rel="stylesheet" href="/core/tokens.css" />
    <style>
      .hl-body { justify-content: flex-start; gap: 18px; padding-top: 22px; }
      .hl-head { width: 100%; display: flex; justify-content: space-between; align-items: baseline; }
      .hl-head .r { font: 700 38px 'Space Grotesk', sans-serif; letter-spacing: 0.1em; color: var(--dim); }
      .hl-head .s { font: 700 48px 'Space Grotesk', sans-serif; letter-spacing: 0.04em; color: var(--accent); }
      .hl-q { font: 800 62px 'Inter', sans-serif; color: var(--text); letter-spacing: -0.01em; }
      .hl-q b { color: var(--accent); font-weight: 800; }

      .hl-cards { width: 100%; display: flex; flex-direction: column; align-items: center; position: relative; }
      .hl-card { width: 824px; height: 292px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-1); position: relative; transform-origin: center; }
      /* hierarchy: flag (visual) → name (identity) → value (data hero) */
      .hl-card .ic { width: 168px; height: 112px; border-radius: 14px; overflow: hidden; display: flex; align-items: center; justify-content: center;
        font-size: 96px; line-height: 1; border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5); }
      .hl-card .nm { font: 600 42px 'Inter', sans-serif; letter-spacing: 0.005em; color: var(--text-2); margin-top: 2px; }
      .hl-card .vl { font: 700 92px 'Space Grotesk', sans-serif; font-feature-settings: 'tnum' 1; color: var(--text); line-height: 1.02; }
      .hl-card .vl.guess { color: var(--accent); opacity: 0.5; font-weight: 800; }
      .hl-card .vl .u { font-size: 0.36em; color: var(--dim); font-weight: 500; margin-left: 8px; }
      .hl-card .st { position: absolute; top: 22px; right: 34px; font: 700 104px 'Space Grotesk', sans-serif; opacity: 0; transform: scale(0.3); }
      .hl-card.lose { opacity: 0.8; }
      .hl-card.lose .ic { filter: grayscale(0.55) drop-shadow(0 12px 22px rgba(0, 0, 0, 0.5)); }
      .hl-card.win { border-color: var(--up); box-shadow: var(--shadow-card), 0 0 60px rgba(63,208,122,0.35), inset 0 1px 0 rgba(255,255,255,0.05); }
      .hl-card.win .nm { color: var(--text); }
      .hl-card.win .vl { color: var(--up); }
      .hl-card.win .st { color: var(--up); }
      .hl-card.lose { border-color: var(--down); }
      .hl-card.lose .vl { color: var(--down); }
      .hl-card.lose .st { color: var(--down); }
      /* richer frosted surface — lighter top, deeper base (premium, not a flat dark slab) */

      .vs { width: 100px; height: 100px; border-radius: 50%; margin: -26px 0; z-index: 4; position: relative;
        background: radial-gradient(circle at 50% 35%, #1b1d22, #0c0d10); border: 2px solid var(--accent);
        box-shadow: 0 0 30px var(--accent-dim), inset 0 2px 6px rgba(0,0,0,0.6);
        display: flex; align-items: center; justify-content: center; font: 700 38px 'Space Grotesk', sans-serif; color: var(--text); }
      .stage.reveal .vs { opacity: 0; transform: scale(0.5); } /* removed once the answer is shown */

      /* difficulty stake (shown during the guess) — builds investment */
      .hl-diff { font: 700 32px 'Inter', sans-serif; color: var(--accent); letter-spacing: 0.01em;
        padding: 7px 24px; border: 1px solid var(--accent-dim); border-radius: 999px;
        background: rgba(194, 242, 59, 0.07); opacity: 0; }
      /* bottom slot: timer during the guess, awe-fact on the reveal */
      .hl-bottom { position: relative; width: 100%; height: 168px; margin-top: 2px; }
      .hl-timer { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); }
      .ring { transform: rotate(-90deg); }
      .ring .bg { fill: none; stroke: rgba(244,245,242,0.08); stroke-width: 14; }
      .ring .fg { fill: none; stroke: var(--accent); stroke-width: 14; stroke-linecap: round; filter: drop-shadow(0 0 10px var(--accent-dim)); }
      .hl-timer .secs { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font: 700 92px 'Space Grotesk', sans-serif; color: var(--accent); }
      .hl-fact { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 760px;
        text-align: center; font: 600 35px 'Inter', sans-serif; color: var(--text-2); line-height: 1.22; opacity: 0; }
      .hl-fact b { color: var(--accent); font-weight: 800; }

      .hl-card { margin: 0; }
      .hook-teaser { display: flex; align-items: center; justify-content: center; gap: 54px; margin: 8px 0; }
      .hook-teaser .tf { width: 210px; height: 140px; border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center;
        font-size: 130px; line-height: 1; border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 12px 24px rgba(0, 0, 0, 0.55); transform-origin: center; }
      .hook-teaser .tvs { font: 800 84px 'Space Grotesk', sans-serif; color: var(--accent); text-shadow: 0 0 30px var(--accent-dim); }
      .act-hook .kicker { letter-spacing: 0.1em; padding-left: 0.1em; }
      .act-hook .hook-title { font-size: 72px; line-height: 1.05; text-wrap: balance; max-width: 100%; }
      .act-hook .hook-sub { font-size: 42px; color: var(--text-2); }
      /* focal bloom on revealed values (CSS-driven by win/lose state) */
    </style>
  </head>
  <body>
    <div class="stage phase-hook" id="stage">
      <div class="chrome"><div class="progress" id="prog"></div></div>

      <div class="act act-body">
        <div class="safe hl-body">
          <div class="hl-head"><span class="r" id="round" data-layer="critical">ROUND 1/5</span><span class="s" id="score" data-layer="critical">SCORE 0/5</span></div>
          <div class="hl-q" id="q" data-layer="critical">Who has <b>MORE PEOPLE?</b></div>
          <div class="hl-diff" id="diff">🔥 Only 17% get this right</div>
          <div class="hl-cards" id="cards">
            <div class="hl-card card glass specular" id="cardA"><div class="ic" id="icA">🇮🇳</div><div class="nm" id="nameA" data-layer="critical">A</div><div class="vl num ca" id="valA" data-layer="critical">?</div><div class="st" id="stA">✓</div></div>
            <div class="vs" id="vs">VS</div>
            <div class="hl-card card glass specular" id="cardB"><div class="ic" id="icB">🇨🇦</div><div class="nm" id="nameB" data-layer="critical">B</div><div class="vl num ca" id="valB" data-layer="critical">?</div><div class="st" id="stB">✗</div></div>
          </div>
          <div class="hl-bottom">
            <div class="hl-timer" id="timer">
              <svg class="ring" width="204" height="204" viewBox="0 0 204 204"><circle class="bg" cx="102" cy="102" r="90" /><circle class="fg" id="ringfg" cx="102" cy="102" r="90" /></svg>
              <div class="secs num" id="secs">3</div>
            </div>
            <div class="hl-fact" id="fact" data-layer="critical"></div>
          </div>
        </div>
      </div>

      <div class="act act-hook">
        <div class="safe hook-wrap">
          <div class="kicker" id="kick"></div>
          <div class="hook-title" id="hook">Only 1% get all 5 right</div>
          <div class="hook-teaser"><span class="tf" id="tf1">🇷🇺</span><span class="tvs" id="tvs">?</span><span class="tf" id="tf2">🇧🇩</span></div>
          <div class="hook-sub" id="hsub">Which has more people?</div>
        </div>
      </div>

      <div class="act act-cta">
        <div class="cta-screen">
          <div class="cta-bell">🔔</div>
          <div class="cta-card" id="cta" data-layer="critical">Subscribe for more</div>
        </div>
      </div>
      <div class="dbg"><div class="zone zt"></div><div class="zone zb"></div><div class="zone zl"></div><div class="zone zr"></div><div class="box"></div></div>
    </div>

    <script type="module">
      import { boot, clamp01, lerp, interpolate, easeOutCubic, easeInOutCubic, easeOutQuart, easeOutBack, punch, icon, formatValue, seedFrom, pickDuration } from '/core/lib.js';
      const $ = (id) => document.getElementById(id);
      const RING = 2 * Math.PI * 90;

      boot((data, fps) => {
        const rounds = data.rounds, n = rounds.length;
        const target = pickDuration(seedFrom(rounds.map((r) => r.a + r.b + r.valA + r.valB).join()), 30, 40);
        const HOOK = 3.5, CTA = 2.5;
        const PER = (target - HOOK - CTA) / n;
        // calm, intentional per-round beats (no violent fly-in / hard cuts)
        const ENTER = 0.6, EXIT = 0.5, REVEALHOLD = 2.1;
        const GUESS = Math.max(2.2, PER - ENTER - EXIT - REVEALHOLD);
        const FLIP = ENTER + GUESS, guessSecs = GUESS;
        const duration = HOOK + n * PER + CTA;
        const stings = []; for (let i = 0; i < n; i++) stings.push(HOOK + i * PER + FLIP);
        // audio cues: whoosh on enter, ticks on the final countdown, reveal + correct chime
        const sfx = [{ t: HOOK - 0.12, name: 'whoosh' }];
        for (let i = 0; i < n; i++) {
          const base = HOOK + i * PER;
          sfx.push({ t: base + ENTER * 0.25, name: 'whoosh' });
          for (let s = 3; s >= 1; s--) { const tt = base + FLIP - s; if (tt > base + ENTER + 0.15) sfx.push({ t: tt, name: s === 1 ? 'beep3' : 'beep' }); }
          sfx.push({ t: base + FLIP, name: 'reveal' });
          sfx.push({ t: base + FLIP + 0.14, name: 'correct' });
        }
        const stage = $('stage'), total = Math.round(duration * fps);
        $('ringfg').style.strokeDasharray = RING;

        function setVal(el, value, unit, t) {
          const { num, unit: u } = formatValue(value * clamp01(t), unit);
          el.innerHTML = num + (u ? `<span class="u">${u}</span>` : '');
        }
        function setCard(side, round, revealed, aWins, ct) {
          const card = $('card' + side), name = side === 'A' ? round.a : round.b, value = side === 'A' ? round.valA : round.valB;
          const win = side === 'A' ? aWins : !aWins;
          $('name' + side).textContent = name;
          $('ic' + side).innerHTML = icon(side === 'A' ? round.iconA : round.iconB, (name || '?').slice(0, 1).toUpperCase());
          card.classList.remove('win', 'lose');
          if (!revealed) {
            $('val' + side).textContent = '?'; $('val' + side).classList.add('guess');
            $('val' + side).style.transform = 'scale(1)'; $('st' + side).style.opacity = 0;
          } else {
            card.classList.add(win ? 'win' : 'lose');
            $('val' + side).classList.remove('guess');
            setVal($('val' + side), value, round.unit, ct);
            // winner's number snaps in with a pop; loser just lands
            $('val' + side).style.transform = `scale(${(win ? punch(clamp01(ct * 1.3), 0.18) : 1).toFixed(3)})`;
            $('st' + side).textContent = win ? '✓' : '✗'; // follow the actual winner, not the card slot
            const ss = clamp01(ct * 1.5);
            $('st' + side).style.opacity = clamp01(ct * 4);
            $('st' + side).style.transform = `scale(${easeOutBack(ss).toFixed(3)})`;
          }
        }

        function renderFrame(f) {
          const tt = f / fps;
          $('prog').style.width = (clamp01(f / (total - 1)) * 100).toFixed(3) + '%';
          const inCta = tt >= duration - CTA;
          const phase = tt < HOOK ? 'hook' : inCta ? 'cta' : 'body';
          stage.className = 'stage phase-' + phase;
          if (phase === 'hook') {
            $('kick').textContent = data.kicker || ''; // no format name on the hook; opt-in via data.kicker
            $('hook').textContent = (data.hook || 'Only 1% score {n}/{n}').replaceAll('{n}', n);
            $('hsub').textContent = data.hookSub || 'Which has more people?';
            // animated teaser: a shocker matchup deals in (motion + format preview + curiosity)
            const tr = rounds[Math.min(3, n - 1)];
            $('tf1').innerHTML = icon(tr.iconA, (tr.a || '?').slice(0, 1).toUpperCase()); $('tf2').innerHTML = icon(tr.iconB, (tr.b || '?').slice(0, 1).toUpperCase());
            $('tf1').style.transform = `scale(${interpolate(tt, [0.25, 0.80], [0.2, 1.0], { easing: easeOutBack }).toFixed(3)})`;
            $('tf2').style.transform = `scale(${interpolate(tt, [0.55, 1.10], [0.2, 1.0], { easing: easeOutBack }).toFixed(3)})`;
            $('tvs').style.opacity = interpolate(tt, [0.9, 1.2], [0, 1]).toFixed(2);
            return;
          }
          const local = Math.max(0, tt - HOOK);
          let ri = Math.min(Math.floor(local / PER), n - 1);
          const rf = local - ri * PER, round = rounds[ri];
          const revealed = rf >= FLIP, aWins = round.valA >= round.valB;
          const ct = interpolate(rf, [FLIP, FLIP + 0.3], [0, 1], { easing: easeOutQuart }); // snappier count-up
          $('round').textContent = `ROUND ${ri + 1}/${n}`;
          $('score').textContent = `SCORE ${ri + (revealed ? 1 : 0)}/${n}`;
          $('q').innerHTML = round.label ? `<b>${round.label}</b>` : (data.question || 'Who has <b>MORE?</b>');

          // calm transition: the round fades + rises in, then fades + recedes out
          const enterT = interpolate(rf, [0, ENTER], [0, 1], { easing: easeOutCubic });
          let cOp = enterT, cY = (1 - enterT) * 48, cSc = 1;
          const exitStart = PER - EXIT;
          if (ri < n - 1 && rf > exitStart) {
            const xT = easeInOutCubic(clamp01((rf - exitStart) / EXIT));
            cOp = 1 - xT; cY = -26 * xT; cSc = 1 - 0.05 * xT;
          }
          $('cards').style.opacity = cOp.toFixed(3);
          $('cards').style.transform = `translateY(${cY.toFixed(1)}px) scale(${cSc.toFixed(3)})`;
          // winner surges forward (overshoot) + loser visibly drops back on reveal
          const surge = 1 + 0.07 * easeOutBack(clamp01(ct * 1.2)), drop = 1 - 0.06 * easeOutQuart(ct);
          $('cardA').style.transform = `scale(${(revealed ? (aWins ? surge : drop) : 1).toFixed(3)})`;
          $('cardB').style.transform = `scale(${(revealed ? (!aWins ? surge : drop) : 1).toFixed(3)})`;
          setCard('A', round, revealed, aWins, ct); setCard('B', round, revealed, aWins, ct);
          stage.classList.toggle('reveal', revealed);

          const guessing = !revealed && rf >= ENTER;
          // difficulty stake during the guess (the lower the %, the more it provokes)
          $('diff').textContent = round.pct != null ? `${round.pct <= 35 ? '🔥 ' : ''}Only ${round.pct}% get this right` : '';
          $('diff').style.opacity = (guessing && !inCta ? interpolate(rf, [ENTER, ENTER + 0.4], [0, 1]) : 0).toFixed(2);
          // countdown timer during the guess
          $('timer').style.opacity = guessing ? '1' : '0';
          if (guessing) {
            const remain = 1 - clamp01((rf - ENTER) / GUESS);
            $('ringfg').style.strokeDashoffset = (RING * (1 - remain)).toFixed(1);
            $('secs').textContent = String(Math.max(1, Math.ceil(remain * guessSecs)));
            const urgent = remain < 0.34; // last third turns red
            $('ringfg').style.stroke = urgent ? 'var(--down)' : 'var(--accent)';
            $('secs').style.color = urgent ? 'var(--down)' : 'var(--accent)';
            const frac = (remain * guessSecs) % 1;            // position within current second
            const pulse = 1 + 0.22 * clamp01(1 - frac * 5);   // pops right after each tick
            $('secs').style.transform = `translate(-50%, -50%) scale(${pulse.toFixed(3)})`;
          }
          // awe payoff fact on the reveal (fades in just after the values land)
          if (revealed && round.fact && !inCta) {
            $('fact').innerHTML = round.fact;
            $('fact').style.opacity = interpolate(rf, [FLIP + 0.3, FLIP + 0.7], [0, 1]).toFixed(2);
          } else { $('fact').style.opacity = '0'; }

          if (phase === 'cta') $('cta').textContent = data.cta || data.outro || '';
        }
        return { fps, duration, stings, sfx, renderFrame };
      });
    </script>
  </body>
</html>
