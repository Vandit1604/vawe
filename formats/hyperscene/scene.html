<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>hyperscene</title>
    <link rel="stylesheet" href="/core/tokens.css" />
    <style>
      /* hyperscene — the OPEN CANVAS. A generic, data-driven layered composition: the JSON is the
         video. No per-topic code, no sealed scenes — layers (text/image/component/rect) + timed
         windows + kinetic splits + the cut kit (core/transitions.js) + shader stings
         (core/shaders.js) + theme bg presets on canvas + a global camera. Everything pure in n. */
      .chrome { display: none; }
      .stage { background: none !important; }
      .stage::before, .stage::after { display: none !important; }
      /* stage fallback = the theme gradient (g0..g2) when no data.bg windows are declared */
      .hs-stage { position: absolute; inset: 0; overflow: hidden;
        background: radial-gradient(82% 60% at 66% 42%, var(--g2) 0%, var(--g1) 46%, var(--g0) 100%); }
      #cv { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; transform-origin: 50% 45%; }
      #cam { position: absolute; inset: 0; will-change: transform; transform-origin: 50% 50%; }
      .hs-layer { position: absolute; will-change: transform, opacity, filter; }
      .hs-text { color: var(--text); line-height: 1.04; }
      .hs-text b { color: var(--em, var(--accent)); }
      .hs-text em { font-style: italic; font-family: var(--font-serif); }
      .hs-img { display: block; object-fit: contain; }
      .hs-rect { box-sizing: border-box; }
      .hs-group { display: flex; box-sizing: border-box; }
      .hs-group > .hs-text, .hs-group > .hs-img-wrap { position: relative; }
      .hs-comp { transform-origin: 0 0; border-radius: 18px; overflow: hidden; box-shadow: 0 40px 100px rgba(20,20,30,0.16); }
      /* caption bar */
      .hs-cap { position: absolute; left: 60px; right: 180px; bottom: 300px; z-index: 90; text-align: center;
        font: 700 46px var(--font-sans), sans-serif; color: var(--text); text-shadow: 0 3px 24px rgba(0,0,0,0.7);
        opacity: 0; }
      .hs-cap.word { font-weight: 800; }
      /* pop: muted-social burned-in subtitle — big, bottom-third safe zone, high-contrast, accent emphasis */
      .hs-cap.pop { left: 8%; right: 8%; bottom: 12%; font: 800 64px var(--font-sans), sans-serif;
        letter-spacing: -0.01em; color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,0.9), 0 1px 3px rgba(0,0,0,0.95); }
      .hs-cap.pop b, .hs-cap.pop em { color: var(--accent); font-style: normal; }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="hs-stage" id="root">
        <canvas id="cv"></canvas>
        <div id="cam"></div>
      </div>
      <div class="hs-cap" id="cap" data-motion="loop"></div>
      <div class="dbg"><div class="zone zt"></div><div class="zone zb"></div><div class="zone zl"></div><div class="zone zr"></div><div class="box"></div></div>
    </div>
    <script type="module">
      import { boot, icon, clamp01, lerp, fitText, fitBox, kenBurns, interpolate, resolveEasing, trackingFor, hashSeed } from '/core/lib.js';
      import { driveClips, seekAll } from '/core/compose.js';
      import { splitText, animateUnits } from '/core/kinetic.js';
      import { renderBg, bgPreset, applyBgOver } from '/core/backgrounds.js';
      import { cutStyle } from '/core/transitions.js';
      import { createShaderOverlay, SHADER_FX } from '/core/shaders.js';
      import { cameraAt, motionAt } from '/core/timeline.js';
      const $ = (id) => document.getElementById(id);

      boot((data, fps, theme) => {
        const landscape = data.orientation === 'landscape' || data.orient === 'landscape';
        const [W, H] = landscape ? [1920, 1080] : [1080, 1920];
        const cam = $('cam'), cv = $('cv');
        cv.width = W; cv.height = H;
        const ctx = cv.getContext('2d');

        // ---- bg windows: [{preset, from, to, value}] drawn on canvas from the THEME's palette ----
        // bg seed: default = hash(theme name + preset) so the SAME preset looks different across brands;
        // override per-window with b.seed. Injected into every fx (dots/aurora/shapes/particles read it).
        const bgWins = (data.bg || []).map((b0) => {
          // use:"theme" pulls the brand's OWN authored backdrop from themes/<name>.json (bgDefault) —
          // so each brand has a custom bg it declares once, not a shared global preset name repeated
          // (the "customize, don't default" rule; fails loud if the theme never authored one).
          if (b0.use === 'theme' && !(theme && theme.bgDefault)) throw new Error(`bg use:"theme" but theme "${(theme && theme.name) || '?'}" defines no bgDefault`);
          const b = b0.use === 'theme' ? { ...theme.bgDefault, from: b0.from, to: b0.to } : b0;
          const spec = applyBgOver(bgPreset(b.preset || 'paper', b.value, (theme && theme.bg) || undefined), b.opts);
          const sd = b.seed != null ? b.seed : hashSeed(String((theme && theme.name) || 'x') + ':' + (b.preset || 'paper')) % 1000;
          for (const f of spec.fx || []) if (f.seed == null) f.seed = sd;
          return { from: b.from ?? 0, to: b.to ?? 1e9, preset: b.preset || 'paper', value: b.value, spec };
        });
        if (!bgWins.length) cv.style.display = 'none'; // fallback: the .hs-stage theme gradient
        // ink-aware default text color: a layer with no explicit color gets dark ink over light
        // bg windows and light text over dark ones (looked up at the layer's midpoint) — otherwise
        // a light-text theme (plinth) silently renders white-on-paper.
        const LIGHT_BGS = ['paper', 'paperShapes', 'paperDots', 'soft', 'dotmatrix'];
        const inkAt = (t) => {
          if (!bgWins.length) return null; // theme-gradient stage: keep the theme's own text color
          let w = bgWins[0];
          for (const b of bgWins) if (t >= b.from && t < b.to) w = b;
          const light = LIGHT_BGS.includes(w.preset) && w.value !== 'dark';
          return light ? 'var(--ink)' : 'var(--text)';
        };

        // ---- shader stings: [{t, fx, dur, seed, color?, intensity?}] — boundary effects on a WebGL overlay ----
        const hex01 = (h) => { const n = parseInt(String(h).replace('#', ''), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };
        const stings = (data.stings || []).filter((s) => SHADER_FX.includes(s.fx))
          .map((s) => ({ ...s, _tint: s.color ? hex01(s.color) : null, _intensity: s.intensity ?? 1, _pal: Array.isArray(s.colors) ? s.colors.map(hex01) : null }));
        const fxo = createShaderOverlay($('root'), W, H);

        // ---- relative TIMING: start may be "otherId+0.5" or "otherId.end-0.2" ----
        // Stagger chains become declared relationships instead of hand-added arithmetic
        // (the temporal twin of `anchor`). Multi-pass resolve; unresolvable → loud failure.
        {
          const byId = {};
          for (const L of data.layers || []) if (L.id) byId[L.id] = L;
          const RX = /^([\w-]+?)(\.end)?\s*([+-]\s*[\d.]+)?$/;
          for (let pass = 0; pass < 8; pass++) {
            let pending = 0;
            for (const L of data.layers || []) {
              if (typeof L.start !== 'string') continue;
              const m = RX.exec(L.start.trim());
              if (!m || !byId[m[1]]) throw new Error(`layer start "${L.start}": unknown reference`);
              const T = byId[m[1]];
              if (typeof T.start === 'string') { pending++; continue; } // resolve target first
              L.start = (T.start ?? 0) + (m[2] ? (T.duration ?? 2) : 0) + (m[3] ? parseFloat(m[3].replace(/\s+/g, '')) : 0);
            }
            if (!pending) break;
            if (pass === 7) throw new Error('relative starts: circular reference');
          }
        }
        // ---- anchoring: position a layer RELATIVE to another (id → anchor/at/dx/dy) ----
        // Annotations, chips and badges point at what they annotate by declared relationship
        // instead of eyeballed coordinates. Resolved purely from the JSON geometry before any
        // DOM exists (targets need w; h falls back to size*1.2 for text).
        {
          const byId = {};
          for (const L of data.layers || []) if (L.id) byId[L.id] = L;
          for (const L of data.layers || []) {
            const T = L.anchor && byId[L.anchor];
            if (!T) continue;
            const tw = T.w ?? 0, th = T.h ?? ((T.size ?? 96) * 1.2);
            const dx = L.dx ?? 0, dy = L.dy ?? 12, at = L.at || 'below';
            if (at.startsWith('below')) L.y = (T.y ?? 0) + th + dy;
            else if (at.startsWith('above')) L.y = (T.y ?? 0) - ((L.h ?? (L.size ?? 96) * 1.2) + dy);
            else L.y = (T.y ?? 0) + (L.dy ?? 0);
            if (at === 'right') L.x = (T.x ?? 0) + tw + (L.dx ?? 12);
            else if (at === 'left') L.x = (T.x ?? 0) - ((L.w ?? 300) + (L.dx ?? 12));
            else if (at.endsWith('center') && L.w != null) L.x = (T.x ?? 0) + tw / 2 - L.w / 2 + dx;
            else L.x = (T.x ?? 0) + dx;
          }
        }
        function styleText(el, L, midT) {
          const serif = L.font === 'serif', mono = L.font === 'mono';
          el.style.fontFamily = `var(--font-${serif ? 'serif' : mono ? 'mono' : 'sans'})`;
          el.style.fontStyle = serif ? 'italic' : 'normal';
          el.style.fontWeight = String(L.weight ?? (serif ? 400 : 800));
          el.style.letterSpacing = L.tracking ?? (serif ? '0' : (theme?.type?.optical ? trackingFor(L.size ?? 96) : '-0.03em'));
          el.style.fontSize = (L.size ?? 96) + 'px';
          if (L.w != null) el.style.width = L.w + 'px';
          if (L.align) el.style.textAlign = L.align;
          const auto = inkAt(midT);
          if (L.color) el.style.color = L.color; else if (auto) el.style.color = auto;
          el.innerHTML = L.type === 'count' ? '' : (L.text || '');
          if (L.type === 'count') { el.style.fontVariantNumeric = 'tabular-nums'; el.textContent = (L.prefix || '') + (L.from ?? 0).toFixed(L.decimals ?? 0) + (L.suffix || ''); }
        }
        function chipBox(el, L) { // shared box treatment: bg/pad/radius/border/shadow/elevation on ANY layer
          if (L.bg == null && !L.border && !L.shadow && !L.elevation) return;
          if (L.bg) el.style.background = L.bg; else if (L.elevation) el.style.background = 'var(--surface)';
          if (L.pad != null) el.style.padding = typeof L.pad === 'number' ? L.pad + 'px' : L.pad;
          el.style.borderRadius = (L.radius ?? 16) + 'px';
          if (L.border && !L.elevation) el.style.border = L.border === true ? '1px solid var(--line)' : L.border;
          if (L.elevation) {
            // physical depth, from linear.app's real CSS: inset hairline ring + lit top edge +
            // a STACK of decreasing-blur drops (one flat shadow is what reads as a flat div)
            const light = L.on === 'light';
            const stack = [
              light ? 'inset 0 0 0 1px rgba(0,0,0,0.08)' : 'inset 0 0 0 1px rgba(255,255,255,0.06)',
              light ? 'inset 0 1px 0 rgba(255,255,255,0.7)' : 'inset 0 1px 0 rgba(255,255,255,0.05)',
              '0 1px 1px rgba(0,0,0,0.07)', '0 2px 2px rgba(0,0,0,0.05)',
            ];
            const e = Math.min(4, Math.max(1, L.elevation | 0));
            if (e >= 2) stack.push('0 4px 8px rgba(0,0,0,0.2)');
            if (e >= 3) stack.push('0 12px 24px rgba(0,0,0,0.28)');
            if (e >= 4) stack.push('0 0 64px rgba(0,0,0,0.4)');
            if (L.glow) stack.push(`0 0 64px ${L.glow === true ? 'var(--accent-glow)' : hexA(L.glow, 0.25)}`);
            el.style.boxShadow = stack.join(', ');
          } else if (L.shadow) el.style.boxShadow = '0 24px 70px rgba(20,20,25,0.12)';
          if (el.classList.contains('hs-text')) el.style.display = 'inline-block';
        }
        // hexA('#5e6ad2', .25) → rgba string (glow/beam colors come as brand hex)
        function hexA(hex, a) {
          const m = /^#([0-9a-f]{6})$/i.exec(hex || '');
          if (!m) return hex;
          const n = parseInt(m[1], 16);
          return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
        }
        // fade: static edge mask. MUTUALLY EXCLUSIVE with `cut` — every cut presentation writes
        // maskImage identity each frame and would silently erase the fade.
        function applyFade(el, L) {
          if (!L.fade) return;
          if (L.cut) throw new Error(`layer "${L.text || L.type}": fade and cut are mutually exclusive — put the fade on an inner layer`);
          const g = { right: 'linear-gradient(90deg, #000 55%, transparent 98%)',
                      left: 'linear-gradient(270deg, #000 55%, transparent 98%)',
                      bottom: 'linear-gradient(180deg, #000 55%, transparent 98%)',
                      top: 'linear-gradient(0deg, #000 55%, transparent 98%)',
                      edges: 'radial-gradient(120% 120% at 50% 50%, #000 60%, transparent 100%)' }[L.fade];
          if (g) { el.style.maskImage = g; el.style.webkitMaskImage = g; }
        }
        const extra = []; // group children (any depth), animated on their root group's window

        // layout-by-containment: a group is a flex OR grid box; children flow with gap so a
        // label+value or a logo row can never collide. Mirrors another engine/another engine' flex-not-pixels rule.
        function layoutGroup(el, L) {
          if (L.layout === 'grid') {
            el.style.display = 'grid';
            el.style.gridTemplateColumns = `repeat(${L.gridCols ?? 2}, ${L.colw ? L.colw + 'px' : '1fr'})`;
            el.style.columnGap = (L.colGap ?? L.gap ?? 24) + 'px';
            el.style.rowGap = (L.rowGap ?? L.gap ?? 24) + 'px';
            el.style.justifyItems = L.items || L.align2 || 'stretch';
          } else {
            el.style.display = 'flex';
            // canonical: `layout` (row|column|grid), `items` (align-items), `justify` (justify-content).
            // Aliases kept for back-compat: `direction`→layout, `align2`→items.
            el.style.flexDirection = (L.layout || L.direction) === 'column' ? 'column' : 'row';
            el.style.gap = (L.gap ?? 24) + 'px';
            el.style.flexWrap = L.wrap ? 'wrap' : 'nowrap';
            el.style.alignItems = L.items || L.align2 || 'center';
            el.style.justifyContent = L.justify || 'flex-start';
          }
          if (L.pad != null) el.style.padding = typeof L.pad === 'number' ? L.pad + 'px' : L.pad;
          if (L.h != null) el.style.height = L.h + 'px';
        }
        // per-child flex sizing so a child can grow/fix within the row/grid
        function sizeChild(c, C, isImg) {
          if (C.grow != null) c.style.flexGrow = String(C.grow);
          if (C.basis != null) c.style.flexBasis = typeof C.basis === 'number' ? C.basis + 'px' : C.basis;
          if (!isImg) { if (C.w != null) c.style.width = C.w + 'px'; if (C.h != null) c.style.height = C.h + 'px'; }
        }
        // recursive: a child may itself be a group (real nested layout), or a text/image/count leaf.
        // Leaves join `extra` on the ROOT group's window so kinetic/count/motion animate in sync.
        function addGroupChild(parentEl, C, rootL) {
          const c = document.createElement('div');
          if (C.type === 'group') {
            c.className = 'hs-group';
            layoutGroup(c, C); chipBox(c, C); sizeChild(c, C, false);
            parentEl.appendChild(c);
            for (const gc of C.children || []) addGroupChild(c, gc, rootL);
            return;
          }
          c.className = C.type === 'image' ? 'hs-img-wrap' : 'hs-text';
          if (C.type === 'image') {
            c.innerHTML = icon(C.src, '');
            const im = c.querySelector('img'); if (im) { im.className = 'hs-img'; if (C.h) im.style.height = C.h + 'px'; if (C.w) im.style.width = C.w + 'px'; }
          } else {
            styleText(c, C, (rootL.start ?? 0) + (rootL.duration ?? 2) / 2);
            chipBox(c, C);
          }
          sizeChild(c, C, C.type === 'image');
          if (C.critical) c.setAttribute('data-layer', 'critical');
          parentEl.appendChild(c);
          extra.push({ L: { ...C, start: rootL.start, duration: rootL.duration }, el: c, units: C.split ? splitText(c, C.split) : null });
        }
        const layers = (data.layers || []).map((L, idx) => {
          const el = document.createElement('div');
          el.className = 'hs-layer ' + (L.type === 'image' ? 'hs-img-wrap' : L.type === 'rect' ? 'hs-rect' : L.type === 'component' ? 'hs-comp-wrap' : L.type === 'group' ? 'hs-group' : 'hs-text');
          const isCount = L.type === 'count'; // number that counts from→to (timer, stats) — styled as text
          el.style.left = (L.x ?? 60) + 'px';
          el.style.top = (L.y ?? 240) + 'px';
          if (L.w != null) el.style.width = L.w + 'px';
          if (L.align) el.style.textAlign = L.align;
          if (L.filter) el.style.filter = L.filter;
          if (L.mask) { el.style.webkitMaskImage = L.mask; el.style.maskImage = L.mask; }
          applyFade(el, L);
          if (L.reflect) el.style.webkitBoxReflect = `below 0 linear-gradient(transparent 62%, rgba(0,0,0,${L.reflect === true ? 0.12 : L.reflect}))`;
          // timing → data-attributes consumed by compose.driveClips
          el.dataset.start = String(L.start ?? 0);
          if (L.duration != null) el.dataset.duration = String(L.duration);
          el.dataset.track = String(L.track ?? idx);
          el.dataset.anim = (L.split || L.cut) ? 'none' : (L.anim || 'fade');
          if (L.cut === 'jitter') el.dataset.motion = 'loop'; // declared shake — exempt from shimmer checks
          if (L.split) el.dataset.enter = '0';
          else if (L.enterDur != null && !L.cut) el.dataset.enter = String(L.enterDur); // rhythm: per-layer entry pace
          if (L.out) el.dataset.out = L.out;
          if (L.exitDur != null) el.dataset.exitDur = String(L.exitDur);

          if (L.type === 'image') {
            el.innerHTML = icon(L.src, '');
            const im = el.querySelector('img'); if (im) { im.className = 'hs-img'; if (L.h) im.style.height = L.h + 'px'; if (L.w) im.style.width = L.w + 'px'; }
            // ken: tasteful slow zoom on the image INSIDE a clipped frame (photo treatment).
            // {from, to, fx, fy} or true for the 1.0→1.07 default; travels once, never reverses.
            if (L.ken && im) {
              Object.assign(el.style, { overflow: 'hidden', borderRadius: (L.radius ?? 18) + 'px' });
              im.style.objectFit = 'cover'; im.style.width = '100%'; im.style.height = '100%';
              if (L.h) el.style.height = L.h + 'px';
            }
            // edgeFade: the photo dissolves into a soft (white by default) blur on its LEFT + RIGHT
            // edges — editorial framing so an image blends into the bg instead of hard-cropping.
            // edgeFade: true | <fade%> ; edgeFadeColor overrides the fade colour (e.g. the dark bg).
            if (L.edgeFade && im) {
              const fw = typeof L.edgeFade === 'number' ? L.edgeFade : 14;
              const mask = `linear-gradient(90deg, transparent 0%, #000 ${fw}%, #000 ${(100 - fw)}%, transparent 100%)`;
              im.style.webkitMaskImage = mask; im.style.maskImage = mask;
              el.style.background = L.edgeFadeColor || '#ffffff';
            }
          } else if (L.type === 'group') {
            // layout-by-containment: a flex OR grid box; children (any depth) flow with gap so a
            // card+label+chip or a logo row can never desync. DOM ancestry = visual stacking.
            layoutGroup(el, L);
            chipBox(el, L);
            for (const C of L.children || []) addGroupChild(el, C, L);
          } else if (L.type === 'rect') {
            // a panel / card / pill: pure box, no text (put text in its own layer on a higher track)
            if (L.h != null) el.style.height = L.h + 'px';
            if (L.bg == null && !L.elevation) el.style.background = '#fff';
            chipBox(el, L);
          } else if (L.type === 'glow') {
            // soft light: radial center-glow, or a directional beam (the roadmap-trail look).
            // Pure gradient div — no canvas, no per-frame writes; place on a low track.
            const c = L.color === true || L.color == null ? 'var(--accent-glow)' : hexA(L.color, L.intensity ?? 0.25);
            if (L.h != null) el.style.height = L.h + 'px';
            const ang = { right: '90deg', left: '270deg', up: '0deg', down: '180deg' }[L.beam];
            el.style.background = ang ? `linear-gradient(${ang}, transparent, ${c})`
                                      : `radial-gradient(50% 50% at 50% 50%, ${c}, transparent 72%)`;
            el.style.pointerEvents = 'none';
          } else if (L.type === 'board') {
            // believable populated workspace from pure data: columns of mini issue-cards with
            // the elevation-1 treatment. Hard caps (4 cols × 5 cards); enters as ONE clip.
            const cols = (L.cols || []).slice(0, 4);
            const colW = ((L.w ?? 1200) - (cols.length - 1) * (L.gap ?? 28)) / Math.max(1, cols.length);
            const ring = 'inset 0 0 0 1px rgba(255,255,255,0.06), inset 0 1px 0 rgba(255,255,255,0.05), 0 1px 1px rgba(0,0,0,0.07), 0 2px 2px rgba(0,0,0,0.05)';
            el.style.display = 'flex'; el.style.gap = (L.gap ?? 28) + 'px';
            el.innerHTML = cols.map((c) => `
              <div style="width:${colW.toFixed(1)}px;display:flex;flex-direction:column;gap:14px">
                <div style="display:flex;gap:12px;align-items:baseline;font:600 ${L.headSize ?? 24}px var(--font-sans);color:var(--text)">${c.title || ''}<span style="font:500 ${(L.headSize ?? 24) - 4}px var(--font-mono);color:var(--dim)">${c.count ?? ''}</span></div>
                ${(c.cards || []).slice(0, 5).map((k) => `
                  <div style="background:var(--surface);border-radius:10px;padding:18px 20px;box-shadow:${ring}">
                    <div style="font:500 ${L.cardSize ?? 19}px var(--font-mono);color:var(--dim)">${k.id || ''}</div>
                    <div style="font:510 ${(L.cardSize ?? 19) + 3}px var(--font-sans);color:var(--text-2);margin-top:6px">${k.title || ''}</div>
                    ${(k.labels || []).length ? `<div style="display:flex;gap:10px;margin-top:12px">${k.labels.map((lb) => `<span style="font:500 ${(L.cardSize ?? 19) - 3}px var(--font-sans);color:var(--text-2);background:rgba(255,255,255,0.04);border-radius:5px;padding:3px 10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06)"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${lb.c || '#8a8f98'};margin-right:7px;vertical-align:1px"></span>${lb.t}</span>`).join('')}</div>` : ''}
                  </div>`).join('')}
              </div>`).join('');
          } else if (L.type === 'component') {
            // a REAL UI capture (capture-component.mjs), or one PART of a captured animated
            // scene (capture-scene.mjs) — parts carry their own w/h and are re-animated here.
            let c = (window.__components && window.__components[L.src]) || { html: '<div style="color:#888">component not captured</div>', w: 900, h: 560 };
            if (L.part && c.parts) c = c.parts.find((pp) => pp.name === L.part) || { html: `<div style="color:#888">part ${L.part} missing</div>`, w: 600, h: 300 };
            const fit = (L.w || 1200) / Math.max(1, c.w);
            el.style.width = Math.round(c.w * fit) + 'px';
            el.style.height = Math.round(c.h * fit) + 'px';
            el.innerHTML = `<div class="hs-comp" style="width:${c.w}px;height:${c.h}px;transform:scale(${fit.toFixed(4)})">${c.html}</div>`;
          } else {
            styleText(el, L, (L.start ?? 0) + (L.duration ?? 2) / 2);
            chipBox(el, L); // text with bg = button/pill/chip in one layer (no sibling rect to desync)
            if (L.fit && L.w) { // auto-size to the layer width; `fitH` → multi-line overflow-safe fit
              cam.appendChild(el); // needs to be in-DOM to measure
              const fam = getComputedStyle(el).fontFamily.split(',')[0].replace(/['"]/g, '');
              if (!document.fonts.check(`${L.weight ?? 800} 40px "${fam}"`)) console.warn(`fit: font "${fam}" not loaded — fit measurement may be off`);
              if (L.fitH) fitBox(el, { maxW: L.w, maxH: L.fitH, max: L.size ?? 96, min: 34 });
              else el.style.fontSize = fitText(el.textContent, L.w, { font: (px) => `${L.weight ?? 800} ${px}px ${fam}`, max: L.size ?? 96, min: 34 }) + 'px';
              el.remove();
            } else if (L.w && !L.split && (L.type === 'text' || !L.type) && L.text) {
              // AUTO-FIT SAFETY (default): a headline that overflows its box — wraps past ~5 lines, or a
              // word wider than L.w — gets shrunk to fit so it never clips the frame. Only fires on real
              // overflow (bug-fix: output changes only where it was already broken). Pure (measured once).
              cam.appendChild(el);
              const lh = parseFloat(getComputedStyle(el).lineHeight) || (L.size ?? 96) * 1.15;
              const maxLines = L.maxLines ?? 5, maxH = L.h ?? maxLines * lh;
              if (el.scrollHeight > maxH + 2 || el.scrollWidth > L.w + 1) fitBox(el, { maxW: L.w, maxH, max: L.size ?? 96, min: 34 });
              el.remove();
            }
          }
          // audit visibility: text layers ≥60px are critical unless opted out; anything can opt in
          if (L.critical === true || (L.critical !== false && !['rect', 'image', 'group', 'glow', 'board'].includes(L.type) && (L.size ?? 96) >= 60)) el.setAttribute('data-layer', 'critical');
          cam.appendChild(el);
          const units = L.split ? splitText(el, L.split) : null; // 'char' | 'word' | 'line'
          return { L, el, units };
        });

        layers.push(...extra); // group children join the per-frame animation loop
        // duration: explicit, else the last clip's end (+0.4 tail)
        const lastEnd = layers.reduce((m, { L }) => Math.max(m, (L.start ?? 0) + (L.duration ?? 2)), 0);
        const duration = data.duration || +(lastEnd + 0.4).toFixed(2);
        const caps = data.captions || [];
        const capMode = data.captionMode || 'sentence';
        const camKf = data.camera || []; // cameraAt/motionAt now live in /core/timeline.js (pure, tested)

        function renderFrame(f) {
          const t = f / fps;
          // theme bg on canvas (last matching window wins) + a continuous slow breathe
          if (bgWins.length) {
            let spec = bgWins[0].spec;
            for (const w of bgWins) if (t >= w.from && t < w.to) spec = w.spec;
            renderBg(ctx, W, H, t, spec);
            cv.style.transform = `scale(${(1.05 + 0.02 * Math.sin(t * 0.35)).toFixed(4)})`;
          }
          driveClips(cam, t); // declarative clip timing + enter/exit + z-order
          for (const { L, el, units } of layers) {
            const start = L.start ?? 0, end = start + (L.duration ?? 2);
            // cut kit: a declared cut owns this layer's enter/exit styling (over driveClips's fade)
            if (L.cut && t >= start && t < end) {
              const enD = L.enterDur ?? 0.5, exD = L.exitDur ?? 0.5;
              const enter = enD > 0 ? clamp01((t - start) / enD) : 1;
              const exit = exD > 0 ? clamp01((t - (end - exD)) / exD) : 0;
              Object.assign(el.style, cutStyle(L.cut, { enter, exit }, { dir: L.dir, dist: L.dist ?? 110, timing: L.cutTiming, cx: L.cx, cy: L.cy }));
            }
            // kinetic split-text on its local clock (clip appears instantly, units reveal).
            // presetOpts spreads any per-preset knob (gradient c1/c2, highlight color, blur px, tilt deg…).
            if (units && t >= start && t < end) animateUnits(units, t - start, { preset: L.preset || 'up', stagger: L.stagger ?? 0.06, each: L.each ?? 0.5, loop: L.loop, dist: L.dist, ...(L.presetOpts || {}) });
            // count layers: value is a pure fn of local time over [countStart, countStart+countDur]
            if (L.type === 'count' && t >= start && t < end) {
              const cs = L.countStart ?? 0.2, cd = L.countDur ?? 1.6;
              const v = interpolate(t - start, [cs, cs + cd], [L.from ?? 0, L.to ?? 100], { easing: resolveEasing(L.ease || 'easeOutCubic') });
              el.textContent = (L.prefix || '') + v.toFixed(L.decimals ?? 0) + (L.suffix || '');
            }
            // ken burns zoom on image layers (continuous over the whole window, identity outside)
            if (L.ken) { const im = el.querySelector('img'); if (im) Object.assign(im.style, t >= start && t < end
              ? kenBurns(t - start, L.duration ?? 2, L.ken === true ? {} : L.ken)
              : { transform: 'scale(1)', transformOrigin: '50% 50%' }); }
            // motion track: compose element choreography ON TOP of the enter/exit/cut transform (which
            // driveClips/cutStyle already wrote to el.style), and multiply into the composed opacity.
            if (L.motion && L.motion.length && t >= start && t < end) {
              const m = motionAt(L.motion, t - start);
              const base = el.style.transform && el.style.transform !== 'none' ? ' ' + el.style.transform : '';
              el.style.transform = `translate(${m.dx.toFixed(2)}px, ${m.dy.toFixed(2)}px) scale(${m.scale.toFixed(4)}) rotate(${m.rot.toFixed(2)}deg)${base}`;
              el.style.opacity = ((parseFloat(el.style.opacity) || 1) * m.opacity).toFixed(3);
            }
          }
          // captions: show the caption whose window contains t
          const cap = caps.find((c) => t >= c.t0 && t < c.t1);
          const capEl = $('cap');
          capEl.className = 'hs-cap ' + (capMode === 'word' ? 'word' : capMode === 'pop' ? 'pop' : '');
          if (cap) {
            capEl.innerHTML = cap.text;
            const in01 = clamp01((t - cap.t0) / 0.14), out01 = clamp01((cap.t1 - t) / 0.14);
            capEl.style.opacity = (in01 * out01).toFixed(2);
            // pop mode: a small rise + scale on entry (snappy social subtitle). Pure in t.
            capEl.style.transform = capMode === 'pop'
              ? `translateY(${((1 - in01) * 18).toFixed(1)}px) scale(${(0.95 + 0.05 * in01).toFixed(3)})` : 'none';
          } else { capEl.style.opacity = '0'; }
          // global camera
          const c = cameraAt(camKf, t);
          cam.style.transform = c ? `scale(${c.s.toFixed(4)}) translate(${c.x.toFixed(2)}px, ${c.y.toFixed(2)}px)` : 'none';
          // shader stings (each spans its dur centered on t)
          let drew = false;
          for (const s of stings) {
            const d = s.dur ?? 1.0;
            const p = (t - (s.t - d / 2)) / d;
            if (p > 0 && p < 1) { fxo.draw(s.fx, p, s.seed ?? 0, s._tint, s._intensity, s._pal); drew = true; }
          }
          if (!drew) fxo.clear();
          seekAll(t); // drive any registered/WAAPI paused timelines (adapter interface)
        }
        // auto sound-design: derive SFX cues deterministically from the scene's own cuts + stings
        // (audio:{auto:true}). whoosh on each cut, a heavier hit on each sting; the Go mixer beds the
        // music.wav under it. Pure — cue times are a function of the JSON, so the mix is reproducible.
        // Does NOT touch renderFrame, so frames stay byte-identical (audio is a separate track).
        let sfx = [];
        if (data.audio && data.audio.auto) {
          const cues = [];
          for (const { L } of layers) if (L.cut && L.cut !== 'none') cues.push({ t: +(L.start ?? 0).toFixed(2), name: 'whoosh' });
          for (const s of stings) cues.push({ t: +(+s.t).toFixed(2), name: 'reveal' });
          cues.sort((a, b) => a.t - b.t || (a.name < b.name ? -1 : 1));
          for (const c of cues) if (!sfx.length || c.t - sfx[sfx.length - 1].t > 0.09) sfx.push(c); // merge simultaneous
        }
        return { fps, duration, stings: stings.map((s) => s.t), sfx, renderFrame };
      });
    </script>
  </body>
</html>
