<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>launch</title>
    <link rel="stylesheet" href="/core/tokens.css" />
    <style>
      /* launch — editorial kinetic-type teaser. Left text column + a classical figure bleeding
         off the right (mirrors Plinth's hero). All pure closed-form in n: opacity/transform/filter only.
         Critical text lives inside the mobile-safe box x[60,900] y[240,1340]. */
      /* taste comes from the theme (data.theme). Fallbacks = Plinth periwinkle so the no-theme
         sample renders unchanged; --accent/--text/--g0..2/--font-* are all themeable. */
      .chrome { display: none; } /* editorial teaser — no progress chrome */

      .lx-stage { position: absolute; inset: 0; overflow: hidden;
        background: radial-gradient(80% 60% at 68% 44%, var(--g2, #c7cbe8) 0%, var(--g1, #757dbb) 46%, var(--g0, #454e92) 100%); }
      .lx-grid { position: absolute; inset: -2px; z-index: 1; pointer-events: none;
        background-image:
          linear-gradient(to right, rgba(20,20,26,0.06) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(20,20,26,0.06) 1px, transparent 1px);
        background-size: 72px 72px; }
      /* the classical figure — grayscale, dissolving into cloud, bleeding off the right edge */
      .lx-figure { position: absolute; right: -70px; bottom: -30px; z-index: 2; height: 1420px;
        filter: grayscale(1) contrast(1.05); opacity: 0; transform-origin: 70% 60%;
        -webkit-mask-image: linear-gradient(to bottom, #000 60%, transparent 97%);
        mask-image: linear-gradient(to bottom, #000 60%, transparent 97%); will-change: transform, opacity; }
      .lx-figure img { height: 100%; display: block; }
      .lx-scrim { position: absolute; inset: 0; z-index: 3; pointer-events: none;
        background:
          linear-gradient(to right, rgba(40,42,78,0.5) 0%, rgba(40,42,78,0.18) 42%, transparent 66%),
          linear-gradient(to bottom, transparent 66%, rgba(22,22,30,0.5) 100%); }

      /* left text column === the mobile-safe box */
      .lx-body { position: absolute; left: 60px; top: 240px; width: 840px; z-index: 4;
        display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; text-align: left; }

      /* Plinth-style sharp black tag, Geist Mono */
      .lx-tag { position: absolute; top: 150px; left: 60px; z-index: 5; }
      .lx-tag span { display: inline-flex; align-items: center; gap: 12px; padding: 12px 20px; background: #16161a; color: var(--text, #f5f5f2);
        font: 600 28px var(--font-mono, 'Geist Mono'), ui-monospace, monospace; letter-spacing: 0.02em; border: 1px solid rgba(255,255,255,0.14); }
      .lx-tag i { width: 11px; height: 11px; background: var(--accent, #1f3bff); box-shadow: 0 0 16px var(--accent, #1f3bff); font-style: normal; }

      /* teaser lines share the top of the column and hand off */
      .lx-lines { position: relative; width: 840px; min-height: 520px; }
      .lx-line { position: absolute; left: 0; top: 40px; width: 840px; color: var(--text, #f5f5f2);
        text-wrap: balance; opacity: 0; will-change: transform, opacity; text-shadow: 0 2px 40px rgba(18,20,45,0.6); }
      .lx-line.sans { font: 800 100px var(--font-sans, 'Inter'), sans-serif; line-height: 1.02; letter-spacing: -0.035em; }
      .lx-line.serif { font: italic 400 126px var(--font-serif, 'Instrument Serif'), serif; line-height: 0.96; letter-spacing: 0; }
      .lx-line b { color: #fff; }
      .lx-line em { font: italic 400 1.1em var(--font-serif, 'Instrument Serif'), serif; letter-spacing: 0; }

      /* the reveal — left-aligned wordmark lockup */
      .lx-reveal { position: absolute; left: 0; top: 20px; width: 840px; z-index: 5;
        display: flex; flex-direction: column; align-items: flex-start; gap: 20px; opacity: 0; will-change: transform, opacity; }
      .lx-mark { width: 150px; height: 150px; filter: drop-shadow(0 12px 60px rgba(20,20,50,0.55)); will-change: transform; }
      .lx-mark img { width: 100%; height: 100%; object-fit: contain; }
      .lx-name { font: 700 168px var(--font-sans, 'Inter'), sans-serif; letter-spacing: -0.045em; line-height: 0.9; color: var(--text, #f5f5f2);
        max-width: 840px; text-shadow: 0 3px 50px rgba(18,20,45,0.6); }
      .lx-rule { width: 0; height: 5px; background: var(--accent, #1f3bff); box-shadow: 0 0 24px var(--accent, #1f3bff); }
      .lx-tagline { font: italic 400 100px var(--font-serif, 'Instrument Serif'), serif; line-height: 0.96; color: #fff;
        max-width: 840px; text-shadow: 0 2px 40px rgba(18,20,45,0.6); will-change: transform, opacity; }
      .lx-date { margin-top: 12px; max-width: 840px; font: 600 32px var(--font-mono, 'Geist Mono'), ui-monospace, monospace; letter-spacing: 0.05em;
        color: rgba(255,255,255,0.94); text-shadow: 0 2px 24px rgba(18,20,45,0.65); }

      /* CTA — stay in the brand world: periwinkle + grid, sharp black button (overrides shared chrome) */
      .act-cta .cta-screen { position: absolute; inset: 0; width: auto; height: auto; max-width: none; border-radius: 0; background:
        radial-gradient(82% 58% at 50% 42%, var(--g2, #c7cbe8) 0%, var(--g1, #757dbb) 46%, var(--g0, #454e92) 100%); }
      .act-cta .cta-screen::before { content: ''; position: absolute; inset: 0; pointer-events: none;
        background-image:
          linear-gradient(to right, rgba(20,20,26,0.06) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(20,20,26,0.06) 1px, transparent 1px);
        background-size: 72px 72px; }
      .act-cta .cta-bell { display: none; }
      .act-cta .cta-card { position: relative; border-radius: 0; border-color: var(--accent, #1f3bff); background: #16161a; color: var(--text, #f5f5f2);
        box-shadow: 0 14px 60px rgba(20,20,50,0.4), 0 0 40px rgba(31,59,255,0.3); font-family: var(--font-mono, 'Geist Mono'), ui-monospace, monospace; }

      .flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 6; pointer-events: none; }
    </style>
  </head>
  <body>
    <div class="stage phase-body" id="stage">
      <div class="act act-body">
        <div class="lx-stage">
          <div class="lx-grid"></div>
          <div class="lx-figure" id="figure"></div>
          <div class="lx-scrim"></div>
        </div>
        <div class="lx-tag" id="tag"><span><i></i><b id="tagtext">NOW LIVE</b></span></div>
        <div class="lx-body">
          <div class="lx-lines" id="lines"></div>
          <div class="lx-reveal" id="reveal">
            <div class="lx-mark" id="mark"></div>
            <div class="lx-name" id="name" data-layer="critical">Name</div>
            <div class="lx-rule" id="rule"></div>
            <div class="lx-tagline" id="tagline" data-layer="critical">tagline</div>
            <div class="lx-date" id="date"></div>
          </div>
        </div>
      </div>
      <div class="act act-cta"><div class="cta-screen"><div class="cta-bell">🔔</div><div class="cta-card" id="cta" data-layer="critical">plinthai.xyz</div></div></div>
      <div class="flash" id="flashEl"></div>
      <div class="dbg"><div class="zone zt"></div><div class="zone zb"></div><div class="zone zl"></div><div class="zone zr"></div><div class="box"></div></div>
    </div>
    <script type="module">
      import { boot, clamp01, lerp, interpolate, spring, easeOutCubic, easeOutQuart, icon, motionDefaults } from '/core/lib.js';
      const $ = (id) => document.getElementById(id);

      boot((data, fps, theme) => {
        // data.accent stays a convenience override; the theme already set --accent from its palette.
        if (data.accent) document.documentElement.style.setProperty('--accent', data.accent);

        const fig = data.figure || data.reveal?.figure;
        if (fig) $('figure').innerHTML = icon(fig, ''); else $('figure').style.display = 'none';
        $('tagtext').textContent = data.kicker || 'NOW LIVE';

        // teaser lines — {text, serif?} drives the Inter-bold / Instrument-Serif-italic mix
        const lines = (data.lines || []).map((l) => (typeof l === 'string' ? { text: l } : l));
        const lineEls = lines.map((l) => {
          const el = document.createElement('div');
          el.className = 'lx-line ' + (l.serif ? 'serif' : 'sans');
          el.setAttribute('data-layer', 'critical');
          el.innerHTML = l.text;
          $('lines').appendChild(el);
          return el;
        });

        $('name').textContent = data.reveal?.name || data.name || '';
        $('tagline').textContent = data.reveal?.tagline || data.tagline || '';
        $('date').textContent = data.date || '';
        const mark = data.reveal?.logo || data.logo;
        if (mark) $('mark').innerHTML = icon(mark, ''); else $('mark').style.display = 'none';

        // motion personality from the theme: easing, spring bounce/settle, enter distance, pacing.
        const M = motionDefaults(theme);
        const DS = M.durationScale;
        const LINE = 2.05 * DS, ENTER = 0.55 * DS, EXIT = 0.45 * DS, HOLD = 3.4 * DS, CTA = 2.6 * DS;
        const revealT = lines.length * LINE;
        const duration = revealT + HOLD + CTA;
        const stings = [revealT];
        const stage = $('stage'), total = Math.round(duration * fps);

        function renderFrame(f) {
          const tt = f / fps;
          const inCta = tt >= duration - CTA;
          stage.className = 'stage phase-' + (inCta ? 'cta' : 'body');
          if (inCta) { $('cta').textContent = data.cta || data.outro || ''; return; }

          const revealed = tt >= revealT;
          $('lines').style.display = revealed ? 'none' : 'block';
          $('reveal').style.display = revealed ? 'flex' : 'none';
          $('tag').style.opacity = (interpolate(tt, [0.15, 0.6], [0, 1], { easing: easeOutQuart }) * (1 - clamp01((tt - (revealT - 0.4)) / 0.4))).toFixed(2);

          // figure: fade in, slow Ken-Burns drift, brighten at the reveal
          const figIn = interpolate(tt, [0.1, 1.4], [0, 0.5], { easing: easeOutCubic });
          const figOpac = revealed ? interpolate(tt, [revealT, revealT + 0.5], [0.5, 0.8]) : figIn;
          $('figure').style.opacity = figOpac.toFixed(3);
          const kb = interpolate(tt, [0, duration], [1.06, 1.13]);
          const rpop = revealed ? 1 + 0.018 * spring(tt - revealT, { bounce: M.bounce, settle: M.settle }) : 1;
          $('figure').style.transform = `scale(${(kb * rpop).toFixed(4)})`;

          // teaser lines: rise in, hold, lift out — hand off to the next
          lineEls.forEach((el, i) => {
            const t0 = i * LINE;
            const enter = clamp01((tt - t0) / ENTER);
            const exit = clamp01((tt - (t0 + LINE - EXIT)) / EXIT);
            el.style.opacity = (clamp01(enter) * (1 - exit)).toFixed(2);
            const y = (1 - M.easing(enter)) * M.enter - exit * M.enter;
            el.style.transform = `translateY(${y.toFixed(1)}px)`;
          });

          // reveal: mark springs, name rises, brand rule wipes, serif tagline follows
          if (revealed) {
            const rl = tt - revealT;
            $('reveal').style.opacity = clamp01(rl / 0.22).toFixed(2);
            const s = spring(rl, { bounce: M.bounce, settle: M.settle });
            $('mark').style.transform = `translateY(${lerp(24, 0, s).toFixed(1)}px) scale(${lerp(0.7, 1, s).toFixed(3)})`;
            const np = interpolate(tt, [revealT + 0.12, revealT + 0.5], [0, 1], { easing: M.easing });
            $('name').style.transform = `translateY(${lerp(22, 0, np).toFixed(1)}px)`;
            $('name').style.opacity = np.toFixed(2);
            $('rule').style.width = interpolate(tt, [revealT + 0.42, revealT + 0.82], [0, 120], { easing: easeOutQuart }).toFixed(0) + 'px';
            const tp = interpolate(tt, [revealT + 0.55, revealT + 0.95], [0, 1], { easing: easeOutCubic });
            $('tagline').style.opacity = tp.toFixed(2);
            $('tagline').style.transform = `translateY(${lerp(16, 0, tp).toFixed(1)}px)`;
            $('date').style.opacity = interpolate(tt, [revealT + 0.9, revealT + 1.3], [0, 1]).toFixed(2);
          }

          $('flashEl').style.opacity = tt >= revealT ? (0.42 * (1 - clamp01((tt - revealT) / 0.26))).toFixed(2) : 0;
        }
        return { fps, duration, stings, renderFrame };
      });
    </script>
  </body>
</html>
