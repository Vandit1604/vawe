<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>bracket</title>
    <link rel="stylesheet" href="/core/tokens.css" />
    <style>
      /* ===== panels (own visibility; we never rely on .act phase classes here,
         because bracket has more phases than hook/body/cta) ===== */
      .panel { position: absolute; left: var(--safe-left); right: var(--safe-right);
        top: var(--safe-top); bottom: var(--safe-bottom); z-index: 3;
        display: none; flex-direction: column; align-items: center; }
      .panel.on { display: flex; }

      /* ---- round card ---- */
      #pRound { justify-content: center; gap: 26px; text-align: center; }
      .rc-kick { font: 700 38px 'Space Grotesk', sans-serif; letter-spacing: 0.14em; color: var(--dim); }
      .rc-name { font: 700 104px 'Space Grotesk', sans-serif; line-height: 0.98; letter-spacing: -0.02em;
        color: var(--accent); text-shadow: 0 0 60px rgba(194,242,59,0.25); text-wrap: balance; }
      .rc-stat { font: 600 46px 'Inter', sans-serif; color: var(--text-2); }
      .rc-stat b { color: var(--text); font-weight: 800; }
      .rc-count { font: 600 34px 'Inter', sans-serif; color: var(--dim); }

      /* ---- match ---- */
      #pMatch { justify-content: flex-start; gap: 20px; padding-top: 8px; }
      .m-head { width: 100%; display: flex; justify-content: space-between; align-items: baseline; }
      .m-head .r { font: 700 34px 'Space Grotesk', sans-serif; letter-spacing: 0.08em; color: var(--dim); }
      .m-head .s { font: 700 40px 'Space Grotesk', sans-serif; letter-spacing: 0.04em; color: var(--accent); }
      .m-q { font: 800 50px 'Inter', sans-serif; color: var(--text); letter-spacing: -0.01em; text-align: center; }
      .m-q b { color: var(--accent); font-weight: 800; }
      .m-cards { width: 100%; display: flex; flex-direction: column; align-items: center; position: relative; }
      .m-card { width: 824px; height: 300px; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 4px; position: relative; transform-origin: center; }
      .m-card .ic { width: 150px; height: 150px; display: flex; align-items: center; justify-content: center;
        font-size: 120px; line-height: 1; }
      .m-card .nm { font: 600 44px 'Inter', sans-serif; color: var(--text-2); }
      .m-card .vl { font: 700 92px 'Space Grotesk', sans-serif; font-feature-settings: 'tnum' 1; color: var(--text); line-height: 1.02; }
      .m-card .vl.guess { color: var(--accent); opacity: 0.4; font-weight: 800; }
      .m-card .vl .u { font-size: 0.34em; color: var(--dim); font-weight: 500; margin-left: 8px; }
      .m-card .st { position: absolute; top: 18px; right: 30px; font: 700 104px 'Space Grotesk', sans-serif; opacity: 0; transform: scale(0.3); }
      .m-card.win { border-color: var(--up); box-shadow: var(--shadow-card), 0 0 60px rgba(63,208,122,0.35); }
      .m-card.win .vl, .m-card.win .st { color: var(--up); }
      .m-card.lose { border-color: var(--down); opacity: 0.82; }
      .m-card.lose .ic { filter: grayscale(0.55); }
      .m-card.lose .vl, .m-card.lose .st { color: var(--down); }
      .m-card.upset .st { color: var(--accent); }
      .m-vs { width: 96px; height: 96px; border-radius: 50%; margin: -22px 0; z-index: 4; position: relative;
        background: radial-gradient(circle at 50% 35%, #1b1d22, #0c0d10); border: 2px solid var(--accent);
        box-shadow: 0 0 30px var(--accent-dim), inset 0 2px 6px rgba(0,0,0,0.6);
        display: flex; align-items: center; justify-content: center; font: 700 34px 'Space Grotesk', sans-serif; color: var(--text); }
      .m-tag { font: 700 28px 'Inter', sans-serif; color: var(--accent); letter-spacing: 0.02em; margin-top: 6px;
        padding: 7px 22px; border: 1px solid var(--accent-dim); border-radius: 999px; background: rgba(194,242,59,0.07); opacity: 0; }
      .m-tag.upset { color: #ffd24d; border-color: rgba(255,210,77,0.4); background: rgba(255,210,77,0.08); }

      /* ---- bracket state (persistent survivor tree) — the macro-loop, fill the band ---- */
      #pBracket { justify-content: center; gap: 34px; }
      .bs-title { font: 700 44px 'Space Grotesk', sans-serif; letter-spacing: 0.1em; color: var(--text); }
      .bs-title b { color: var(--accent); }
      .bs-tree { width: 100%; display: flex; flex-direction: column; gap: 22px; }
      .bs-row { display: flex; flex-direction: column; gap: 10px; }
      .bs-row .lbl { font: 700 26px 'Space Grotesk', sans-serif; letter-spacing: 0.08em; color: var(--dim); }
      .bs-chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      .chip { display: flex; align-items: center; gap: 9px; padding: 9px 16px; border-radius: 14px;
        background: var(--surface-2); border: 1px solid var(--line-strong); }
      .chip .e { font-size: 32px; line-height: 1; }
      .chip .n { font: 600 28px 'Inter', sans-serif; color: var(--text-2); white-space: nowrap; }
      .chip.empty { color: var(--dim); }
      .chip.empty .e { opacity: 0.4; }
      .chip.champ { border-color: var(--accent); background: rgba(194,242,59,0.10); box-shadow: 0 0 24px var(--accent-dim); }
      .chip.champ .n { color: var(--text); font-weight: 800; }

      /* ===== landscape (16:9) layout — wider frame: fights go side-by-side, the
         survivor tree becomes left→right columns (which fills the width nicely) ===== */
      :root[data-orient="landscape"] #pMatch { justify-content: center; gap: 30px; padding-top: 0; }
      :root[data-orient="landscape"] .m-cards { flex-direction: row; align-items: center; justify-content: center; }
      :root[data-orient="landscape"] .m-card { width: 620px; height: 470px; }
      :root[data-orient="landscape"] .m-card .ic { width: 190px; height: 190px; font-size: 150px; }
      :root[data-orient="landscape"] .m-card .vl { font-size: 100px; }
      :root[data-orient="landscape"] .m-vs { margin: 0 -26px; }
      :root[data-orient="landscape"] .bs-tree { flex-direction: row; align-items: flex-start; gap: 18px; }
      :root[data-orient="landscape"] .bs-row { flex: 1; align-items: center; }
      :root[data-orient="landscape"] .bs-chips { flex-direction: column; flex-wrap: nowrap; width: 100%; }
      :root[data-orient="landscape"] .chip { width: 100%; justify-content: center; }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="chrome"><div class="progress" id="prog"></div></div>

      <!-- HOOK (reuse shared hook-wrap) -->
      <div class="panel" id="pHook" style="justify-content:center">
        <div class="hook-wrap">
          <div class="kicker" id="hKick"></div>
          <div class="hook-title" id="hTitle">16 enter. 1 wins.</div>
          <div class="hook-sub" id="hSub"></div>
        </div>
      </div>

      <!-- ROUND CARD -->
      <div class="panel" id="pRound">
        <div class="rc-kick" id="rcKick">THE BRACKET</div>
        <div class="rc-name" id="rcName">ROUND OF 16</div>
        <div class="rc-stat" id="rcStat"></div>
        <div class="rc-count" id="rcCount"></div>
      </div>

      <!-- MATCH -->
      <div class="panel" id="pMatch">
        <div class="m-head"><span class="r" id="mRound">ROUND OF 16</span><span class="s" id="mProg">1 / 8</span></div>
        <div class="m-q" id="mQ">Higher <b>POWER</b> wins</div>
        <div class="m-cards" id="mCards">
          <div class="m-card card" id="mCardA"><div class="ic" id="mIcA">🦁</div><div class="nm" id="mNameA">A</div><div class="vl num" id="mValA">?</div><div class="st" id="mStA">✓</div></div>
          <div class="m-vs">VS</div>
          <div class="m-card card" id="mCardB"><div class="ic" id="mIcB">🐻</div><div class="nm" id="mNameB">B</div><div class="vl num" id="mValB">?</div><div class="st" id="mStB">✗</div></div>
        </div>
        <div class="m-tag" id="mTag"></div>
      </div>

      <!-- BRACKET STATE -->
      <div class="panel" id="pBracket">
        <div class="bs-title" id="bsTitle">WHO'S LEFT</div>
        <div class="bs-tree" id="bsTree"></div>
      </div>

      <!-- CTA -->
      <div class="panel" id="pCta" style="justify-content:center">
        <div class="cta-screen">
          <div class="cta-bell">🏆</div>
          <div class="cta-card" id="ctaCard">Comment your winner 👇</div>
        </div>
      </div>

      <div class="dbg"><div class="zone zt"></div><div class="zone zb"></div><div class="zone zl"></div><div class="zone zr"></div><div class="box"></div></div>
    </div>

    <script type="module">
      import { boot, clamp01, easeOutCubic, easeOutQuart, easeOutBack, punch, icon, formatValue } from '/core/lib.js';
      const $ = (id) => document.getElementById(id);

      boot((data, fps) => {
        // ---------- resolve the bracket (PURE: computed once, read every frame) ----------
        const byId = {};
        (data.competitors || []).forEach((c) => { byId[c.id] = c; });
        const short = (c) => (c.short || c.name || '?');

        const rounds = [];
        let prevWinners = null;
        (data.rounds || []).forEach((rd) => {
          // pairs: explicit matchups, else positional auto-pairing of previous winners
          let pairs;
          if (rd.matchups && rd.matchups.length) {
            pairs = rd.matchups.map((m) => ({ a: byId[m.a], b: byId[m.b], winnerRef: m.winnerRef }));
          } else {
            pairs = [];
            const refs = rd.winnerRefs || [];
            for (let i = 0; i < prevWinners.length; i += 2) {
              pairs.push({ a: prevWinners[i], b: prevWinners[i + 1], winnerRef: refs[i / 2] });
            }
          }
          const stat = rd.stat;
          const matchups = pairs.map((p) => {
            const va = p.a.stats[stat], vb = p.b.stats[stat];
            // winnerRef override lets you hand-author an upset (funniest winner ≠ higher number)
            const winner = p.winnerRef ? byId[p.winnerRef] : (va >= vb ? p.a : p.b);
            const upset = winner !== (va >= vb ? p.a : p.b); // true only when the override beats the number
            return { a: p.a, b: p.b, va, vb, winner, upset, stat, unit: rd.unit };
          });
          prevWinners = matchups.map((m) => m.winner);
          rounds.push({ name: rd.name, stat, unit: rd.unit, matchups });
        });
        const champion = prevWinners && prevWinners[0];

        // ---------- timeline: hook -> per round {roundcard -> matches -> bracketState} -> cta ----------
        const P = data.pacing || {};
        const HOOK = P.hook ?? 4.0, CTA = P.cta ?? 3.2, ROUNDCARD = P.roundCard ?? 2.2, BRACKET = P.bracket ?? 3.6;
        const DEFAULT_MATCH = [3.4, 4.6, 6.2, 9.5]; // escalating R16 -> Final (read time -> slow payoff)
        const matchDur = (r) => (P.match && P.match[r] != null ? P.match[r] : (DEFAULT_MATCH[r] != null ? DEFAULT_MATCH[r] : 3.0));

        const seg = [];
        const sfx = [];
        let t = 0;
        seg.push({ type: 'hook', t0: 0, t1: HOOK }); t = HOOK;
        rounds.forEach((rd, r) => {
          seg.push({ type: 'roundcard', r, t0: t, t1: t + ROUNDCARD }); sfx.push({ t: t + 0.1, name: 'whoosh' }); t += ROUNDCARD;
          rd.matchups.forEach((m, i) => {
            const d = matchDur(r);
            const reveal = t + d * 0.42;
            seg.push({ type: 'match', r, i, t0: t, t1: t + d, reveal });
            sfx.push({ t: reveal, name: 'reveal' });
            sfx.push({ t: reveal + 0.14, name: m.upset ? 'wrong' : 'correct' });
            t += d;
          });
          seg.push({ type: 'bracket', r, t0: t, t1: t + BRACKET }); t += BRACKET;
        });
        const finalRevealAt = seg.filter((s) => s.type === 'match' && s.r === rounds.length - 1).map((s) => s.reveal)[0];
        const stings = finalRevealAt != null ? [finalRevealAt] : [];
        seg.push({ type: 'cta', t0: t, t1: t + CTA }); t += CTA;
        const duration = t;
        const total = Math.round(duration * fps);

        // ---------- paint helpers (ported from higherlower card/reveal/countup) ----------
        const PANELS = { hook: 'pHook', roundcard: 'pRound', match: 'pMatch', bracket: 'pBracket', cta: 'pCta' };
        function showPanel(type) {
          for (const k in PANELS) $(PANELS[k]).classList.toggle('on', k === type);
        }
        function setVal(el, value, unit, t01) {
          const { num, unit: u } = formatValue(Math.round(value * clamp01(t01)), unit);
          el.innerHTML = num + (u ? `<span class="u">${u}</span>` : '');
        }
        function setMatchCard(side, m, revealed, ct) {
          const c = side === 'A' ? m.a : m.b, value = side === 'A' ? m.va : m.vb;
          const win = (side === 'A' ? m.a : m.b) === m.winner;
          const card = $('mCard' + side), vEl = $('mVal' + side), stEl = $('mSt' + side);
          $('mName' + side).textContent = short(c);
          $('mIc' + side).innerHTML = icon(c.icon, short(c).slice(0, 1).toUpperCase());
          card.classList.remove('win', 'lose', 'upset');
          if (!revealed) {
            vEl.textContent = '?'; vEl.classList.add('guess');
            vEl.style.transform = 'scale(1)'; stEl.style.opacity = '0';
          } else {
            card.classList.add(win ? 'win' : 'lose');
            if (win && m.upset) card.classList.add('upset');
            vEl.classList.remove('guess');
            setVal(vEl, value, m.unit, ct);
            vEl.style.transform = `scale(${(win ? punch(clamp01(ct * 1.3), 0.18) : 1).toFixed(3)})`;
            stEl.textContent = win ? '✓' : '✗';
            stEl.style.opacity = clamp01(ct * 4).toFixed(2);
            stEl.style.transform = `scale(${easeOutBack(clamp01(ct * 1.5)).toFixed(3)})`;
          }
        }

        function paintHook(p) {
          $('hTitle').style.transform = `scale(${(0.9 + 0.1 * easeOutBack(clamp01(p / 0.4))).toFixed(3)})`;
        }
        function paintRound(r, p) {
          const rd = rounds[r];
          $('rcName').textContent = rd.name;
          $('rcStat').innerHTML = `decided by <b>${rd.stat.toUpperCase()}</b>`;
          $('rcCount').textContent = `${rd.matchups.length} ${rd.matchups.length === 1 ? 'match' : 'matchups'}`;
          $('rcName').style.transform = `translateY(${((1 - easeOutCubic(clamp01(p / 0.4))) * 30).toFixed(1)}px)`;
          $('rcName').style.opacity = clamp01(p / 0.3).toFixed(2);
        }
        function paintMatch(r, i, s, tt) {
          const rd = rounds[r], m = rd.matchups[i], d = s.t1 - s.t0, local = tt - s.t0;
          const revealed = tt >= s.reveal;
          const ct = easeOutQuart(clamp01((tt - s.reveal) / 0.3));
          $('mRound').textContent = rd.name;
          $('mProg').textContent = `${i + 1} / ${rd.matchups.length}`;
          $('mQ').innerHTML = `Higher <b>${rd.stat.toUpperCase()}</b> wins`;
          // enter: cards rise+fade in
          const enterT = easeOutCubic(clamp01(local / 0.45));
          $('mCards').style.opacity = enterT.toFixed(3);
          $('mCards').style.transform = `translateY(${((1 - enterT) * 46).toFixed(1)}px)`;
          // winner surges, loser drops
          const aWin = m.a === m.winner;
          const surge = 1 + 0.07 * easeOutBack(clamp01(ct * 1.2)), drop = 1 - 0.06 * easeOutQuart(ct);
          $('mCardA').style.transform = `scale(${(revealed ? (aWin ? surge : drop) : 1).toFixed(3)})`;
          $('mCardB').style.transform = `scale(${(revealed ? (!aWin ? surge : drop) : 1).toFixed(3)})`;
          setMatchCard('A', m, revealed, ct);
          setMatchCard('B', m, revealed, ct);
          // tag: name the winner (or call out the upset)
          const tag = $('mTag');
          if (revealed) {
            tag.textContent = m.upset ? `🤯 UPSET — ${short(m.winner)} advances` : `${short(m.winner)} advances`;
            tag.classList.toggle('upset', m.upset);
            tag.style.opacity = clamp01((tt - s.reveal - 0.25) / 0.3).toFixed(2);
          } else { tag.style.opacity = '0'; }
        }
        function chip(c, isChamp) {
          if (!c) return `<div class="chip empty"><span class="e">·</span><span class="n">?</span></div>`;
          const cls = 'chip' + (isChamp ? ' champ' : '');
          return `<div class="${cls}"><span class="e">${icon(c.icon, short(c).slice(0, 1))}</span><span class="n">${short(c)}</span></div>`;
        }
        function paintBracket(afterRound, p) {
          // persistent tree: one row per round; survivors fill in as rounds complete; champion path highlighted
          $('bsTitle').innerHTML = afterRound >= rounds.length - 1 ? `🏆 <b>${short(champion)}</b> wins it all` : `WHO'S <b>LEFT</b>`;
          let html = '';
          for (let r = 0; r < rounds.length; r++) {
            const rd = rounds[r];
            const decided = r <= afterRound;
            const winners = rd.matchups.map((m) => (decided ? m.winner : null));
            html += `<div class="bs-row"><span class="lbl">${rd.name}${decided ? ' ✓' : ''}</span><div class="bs-chips">`;
            html += winners.map((w) => chip(w, w && champion && w.id === champion.id)).join('');
            html += `</div></div>`;
          }
          $('bsTree').innerHTML = html;
          $('bsTree').style.opacity = clamp01(p / 0.25).toFixed(2);
        }
        // ---------- static-from-data text: written ONCE, never per-frame, so no hidden
        //            panel can carry render-order-dependent state ----------
        $('hKick').textContent = data.kicker || data.title || '';
        $('hTitle').textContent = data.hook || '16 enter. 1 wins.';
        $('hSub').textContent = data.hookSub || '';
        $('rcKick').textContent = data.kicker || 'THE BRACKET';
        $('ctaCard').textContent = data.cta || 'Comment your winner 👇';

        // ---------- the ONLY per-frame entry point — PURE in n ----------
        function renderFrame(n) {
          const tt = n / fps;
          $('prog').style.width = (clamp01(total > 1 ? n / (total - 1) : 0) * 100).toFixed(3) + '%';
          // active segment = last one whose t0 <= tt (segments are contiguous + sorted)
          let s = seg[0];
          for (let k = 0; k < seg.length; k++) { if (tt >= seg[k].t0) s = seg[k]; else break; }
          showPanel(s.type);
          const p = clamp01((tt - s.t0) / Math.max(1e-6, s.t1 - s.t0));
          if (s.type === 'hook') paintHook(p);
          else if (s.type === 'roundcard') paintRound(s.r, p);
          else if (s.type === 'match') paintMatch(s.r, s.i, s, tt);
          else if (s.type === 'bracket') paintBracket(s.r, p);
          // cta: static text set once in build(); showPanel handles visibility
        }

        return { fps, duration, stings, sfx, renderFrame };
      });
    </script>
  </body>
</html>
