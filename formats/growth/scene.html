<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>growth</title>
    <link rel="stylesheet" href="/core/tokens.css" />
    <style>
      .gr-chart { position: absolute; left: 0; right: 0; top: 980px; height: 720px; z-index: 1; }
      .gr-chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
      .gr-line { fill: none; stroke: url(#lg); stroke-width: 10; stroke-linejoin: round; stroke-linecap: round; filter: drop-shadow(0 0 14px rgba(63, 208, 122, 0.55)); }
      .gr-dot { fill: var(--accent); filter: drop-shadow(0 0 18px var(--accent)); }
      .pin { position: absolute; top: 0; bottom: 0; width: 0; }
      .pin .ln { position: absolute; top: 0; width: 0; border-left: 2px dashed currentColor; opacity: 0.55; }
      .pin .dot { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: currentColor; transform: translate(-50%, -50%); box-shadow: 0 0 14px currentColor; }
      .pin .chip { position: absolute; top: -8px; left: 50%; transform: translate(-50%, -100%); white-space: nowrap;
        font: 700 32px 'Space Grotesk', sans-serif; color: var(--bg); background: currentColor; padding: 10px 20px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }

      .gr-body { justify-content: flex-start; padding-top: 188px; gap: 18px; z-index: 2; }
      .ticker { display: inline-flex; align-items: center; gap: 20px; font: 700 60px 'Space Grotesk', sans-serif; }
      .ticker .tk { width: 84px; height: 84px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 16px;
        font: 800 38px 'Inter', sans-serif; color: var(--text); background: linear-gradient(180deg, var(--surface), var(--surface-2));
        border: 1px solid var(--line-strong); box-shadow: var(--shadow-card); }
      .hero {
        font: 700 168px 'Space Grotesk', sans-serif; line-height: 0.92; letter-spacing: -0.03em; font-feature-settings: 'tnum' 1;
        background: linear-gradient(180deg, var(--up-2), var(--up)); -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 0 40px rgba(63, 208, 122, 0.28)); white-space: nowrap;
      }
      .rule { height: 7px; width: 0; border-radius: 4px; background: var(--accent); box-shadow: 0 0 18px var(--accent-dim); }
      .delta { font: 700 44px 'Space Grotesk', sans-serif; color: var(--up); }
      .sub { font: 500 40px 'Inter', sans-serif; color: var(--dim); }
      .flash { position: absolute; inset: 0; background: var(--accent); opacity: 0; z-index: 4; pointer-events: none; }
      .dim { position: absolute; inset: 0; background: #040405; opacity: 0; z-index: 4; pointer-events: none; }
      .hook-q { font: 700 62px 'Space Grotesk', sans-serif; color: var(--accent); letter-spacing: -0.01em; }
      .hook-title.payoff { background: linear-gradient(180deg, var(--up-2), var(--up)); -webkit-background-clip: text; background-clip: text;
        color: transparent; filter: drop-shadow(0 0 44px rgba(63,208,122,0.3)); }
    </style>
  </head>
  <body>
    <div class="stage phase-hook" id="stage">
      <div class="chrome"><div class="progress" id="prog"></div></div>

      <div class="act act-body">
        <div class="gr-chart">
          <svg id="svg" viewBox="0 0 1080 720" preserveAspectRatio="none">
            <defs>
              <clipPath id="rev"><rect id="clip" x="0" y="0" width="0" height="720" /></clipPath>
              <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f9e63" /><stop offset="1" stop-color="#6ff0a4" /></linearGradient>
              <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(63,208,122,0.30)" /><stop offset="1" stop-color="rgba(63,208,122,0)" /></linearGradient>
            </defs>
            <path id="area" fill="url(#ag)" clip-path="url(#rev)" />
            <path id="line" class="gr-line" />
            <circle id="dot" class="gr-dot" r="10" />
          </svg>
          <div id="pins"></div>
        </div>
        <div class="safe gr-body">
          <div class="ticker" data-layer="critical"><span class="tk" id="tkb"></span><span id="ticker">NVDA</span></div>
          <div class="hero num bloom-up ca" id="hero" data-layer="critical">$1,000</div>
          <div class="rule" id="rule"></div>
          <div class="delta" id="delta" data-layer="critical"></div>
          <div class="sub" id="sub" data-layer="critical"></div>
        </div>
      </div>

      <div class="act act-hook">
        <div class="safe hook-wrap">
          <div class="hook-q" id="hk">$1,000 in NVDA in 2015 =</div>
          <div class="hook-title num" id="hookNum">$???,???</div>
          <div class="hook-kick2" id="hsub">…is now worth</div>
        </div>
      </div>

      <div class="act act-cta"><div class="cta-screen"><div class="cta-bell">🔔</div><div class="cta-card" id="cta" data-layer="critical">Subscribe for more</div></div></div>
      <div class="dim" id="dimEl"></div>
      <div class="flash" id="flashEl"></div>
      <div class="dbg"><div class="zone zt"></div><div class="zone zb"></div><div class="zone zl"></div><div class="zone zr"></div><div class="box"></div></div>
    </div>

    <script type="module">
      import { boot, clamp01, lerp, rangeT, interpolate, easeInOutCubic, easeOutBack, punch, icon, formatNumber, scrambleDigits, seedFrom, pickDuration } from '/core/lib.js';
      const $ = (id) => document.getElementById(id);
      const VBW = 1080, VBH = 720, PADL = 70, PADR = 70, PADT = 40, PADB = 60;

      boot((data, fps) => {
        const series = data.series, values = series.map((p) => p.value), n = values.length;
        const invest = data.startCash || 1000, shares = invest / values[0];
        const P = (i) => values[i] * shares;
        const finalP = P(n - 1);
        const min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
        const xs = (i) => PADL + (VBW - PADL - PADR) * (i / (n - 1));
        const ys = (v) => VBH - PADB - (VBH - PADT - PADB) * ((v - min) / span);

        let d = `M ${xs(0)} ${ys(values[0])}`;
        for (let i = 1; i < n; i++) d += ` L ${xs(i)} ${ys(values[i])}`;
        $('line').setAttribute('d', d);
        $('area').setAttribute('d', `${d} L ${xs(n - 1)} ${VBH} L ${xs(0)} ${VBH} Z`);
        const L = $('line').getTotalLength();

        // schedule (seconds), 58–62s seeded
        const COLD = 2.4, ORIGIN = 0.8, PAUSE = 1.1, MICRO = 0.3, SLAM = 0.5, HOLD = 4.4;
        const beats = (data.beats || []).map((b) => ({ ...b, idx: series.findIndex((p) => p.date === b.atDate) })).filter((b) => b.idx > 0 && b.idx < n - 1).sort((a, b) => a.idx - b.idx);
        const target = pickDuration(seedFrom((data.ticker || '') + n + Math.round(finalP)), 22, 30);
        const RIP = Math.max(2, (target - COLD - ORIGIN - beats.length * PAUSE - MICRO - SLAM - HOLD) / (beats.length + 1));

        let t = COLD + ORIGIN;
        const segs = [{ type: 'origin', s: COLD, e: COLD + ORIGIN, idx: 0 }];
        const stings = []; let prev = 0;
        for (const b of beats) { segs.push({ type: 'rip', s: t, e: t + RIP, from: prev, to: b.idx }); t += RIP; stings.push(t); segs.push({ type: 'pause', s: t, e: t + PAUSE, idx: b.idx, beat: b }); t += PAUSE; prev = b.idx; }
        segs.push({ type: 'rip', s: t, e: t + RIP, from: prev, to: n - 1 }); t += RIP;
        segs.push({ type: 'micro', s: t, e: t + MICRO, idx: n - 1 }); t += MICRO;
        const slamT = t; stings.push(slamT);
        segs.push({ type: 'slam', s: t, e: t + SLAM, idx: n - 1 }); t += SLAM;
        segs.push({ type: 'hold', s: t, e: t + HOLD, idx: n - 1 }); t += HOLD;
        const duration = t;

        // beat pin DOM
        const pins = beats.map((b) => {
          const ps = segs.find((s) => s.type === 'pause' && s.beat === b);
          const dip = values[b.idx] < values[b.idx - 1];
          const el = document.createElement('div'); el.className = 'pin';
          el.style.color = dip ? 'var(--down)' : 'var(--accent)';
          el.style.left = (xs(b.idx) / VBW * 100) + '%';
          const dy = ys(values[b.idx]) / VBH * 100;
          el.innerHTML = `<div class="ln" style="height:${dy}%"></div><div class="dot" style="top:${dy}%"></div><div class="chip">${b.label || ''}</div>`;
          $('pins').appendChild(el);
          return { el, ps };
        });

        $('ticker').textContent = data.ticker || '';
        $('tkb').innerHTML = icon(data.icon, (data.ticker || '?').slice(0, 1).toUpperCase());
        const stage = $('stage'), total = Math.round(duration * fps);

        function renderFrame(f) {
          const tt = f / fps;
          $('prog').style.width = (clamp01(f / (total - 1)) * 100).toFixed(3) + '%';

          if (tt < COLD) {
            stage.className = 'stage phase-hook';
            $('hk').textContent = data.hook || '';
            $('hsub').textContent = '…is now worth 👀';
            // WITHHOLD the payoff — only ever show a scramble in the cold open, so the
            // real number is earned at the slam, not given away.
            $('hookNum').className = 'hook-title num';
            $('hookNum').textContent = scrambleDigits(f, formatNumber(finalP, { currency: true }));
            return;
          }
          const inCta = tt >= duration - 2.0;
          stage.className = 'stage phase-' + (inCta ? 'cta' : 'body');

          let seg = segs[segs.length - 1];
          for (const s of segs) if (tt >= s.s && tt < s.e) { seg = s; break; }
          const headIdx = seg.type === 'rip' ? interpolate(tt, [seg.s, seg.e], [seg.from, seg.to], { easing: easeInOutCubic }) : seg.idx;
          const p01 = clamp01(headIdx / (n - 1));
          const fi = Math.min(Math.floor(headIdx), n - 1), frac = headIdx - fi;
          const price = fi >= n - 1 ? values[n - 1] : lerp(values[fi], values[fi + 1], frac);
          const port = price * shares;
          const atSlam = tt >= slamT;

          $('line').style.strokeDasharray = L;
          $('line').style.strokeDashoffset = (L * (1 - p01)).toFixed(2);
          const head = $('line').getPointAtLength(L * p01);
          $('dot').setAttribute('cx', head.x); $('dot').setAttribute('cy', head.y);
          $('clip').setAttribute('width', head.x.toFixed(1));

          let chipAct = 0;
          for (const pin of pins) {
            const ca = clamp01(tt <= pin.ps.e ? rangeT(tt, pin.ps.s, pin.ps.s + 0.35) : 1 - rangeT(tt, pin.ps.e, pin.ps.e + 0.6));
            chipAct = Math.max(chipAct, ca);
            pin.el.style.opacity = tt >= pin.ps.s ? 1 : 0;
            pin.el.querySelector('.chip').style.opacity = ca.toFixed(2);
          }

          $('hero').textContent = formatNumber(port, { currency: true });
          const slamT01 = atSlam ? rangeT(tt, slamT, slamT + SLAM) : 0;
          $('hero').style.transform = `scale(${atSlam ? punch(slamT01, 0.08).toFixed(3) : 1})`;
          $('rule').style.width = atSlam ? Math.round(520 * easeOutBack(clamp01(slamT01 * 1.3))) + 'px' : '0';
          const mult = port / invest;
          $('delta').textContent = mult >= 2 ? `▲ ${formatNumber((mult - 1) * 100, { decimals: 0 })}%` : '';
          $('delta').style.opacity = (1 - chipAct).toFixed(2);
          $('sub').textContent = data.startNote || '';
          $('sub').style.opacity = (1 - chipAct).toFixed(2);

          $('dimEl').style.opacity = seg.type === 'micro' ? (0.26 * rangeT(tt, seg.s, seg.e)).toFixed(2) : 0;
          $('flashEl').style.opacity = atSlam ? (0.5 * (1 - rangeT(tt, slamT, slamT + 0.23))).toFixed(2) : 0;
          if (inCta) $('cta').textContent = data.cta || data.outro || '';
        }

        return { fps, duration, stings, renderFrame };
      });
    </script>
  </body>
</html>
