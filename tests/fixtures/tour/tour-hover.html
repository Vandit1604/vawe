<!doctype html>
<meta charset="utf-8">
<title>tour fixture</title>
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; height: 1800px; background: #111; color: #eee; font: 16px sans-serif; }
  #card { position: absolute; top: 40px; left: 40px; width: 120px; height: 50px; background: #357; transition: transform 0.5s, background 0.5s; }
  #card:hover { transform: translateX(60px); background: #7a3; }
  #spin { position: absolute; top: 120px; left: 40px; width: 30px; height: 30px; background: #fa0; animation: slide 2s linear infinite; }
  @keyframes slide { from { translate: 0; } to { translate: 150px; } }
  #low { position: absolute; top: 1000px; left: 40px; }
</style>
<div id="card">hover</div>
<div id="spin"></div>
<h2 id="low">low</h2>
