<!doctype html><html><head><meta charset="utf-8"><meta name="duration" content="2"><style>
html,body{margin:0;height:100%;background:linear-gradient(90deg,#e33,#38f)}
#card{position:absolute;left:40px;top:60px;width:200px;height:200px;background:rgba(255,255,255,.35);backdrop-filter:blur(8px);border:4px solid #000}
</style></head><body><div id="card"></div>
<script>
document.getElementById('card').animate([{ translate: '0 0' }, { translate: '500px 0' }], { duration: 2000, easing: 'linear', fill: 'both' });
</script></body></html>
