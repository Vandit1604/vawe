<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="duration" content="4">
<meta name="aspect" content="16:9">
<style>
*{margin:0}html,body{background:#12161f;overflow:hidden}
.card{position:absolute;width:22vw;height:30vh;top:35vh;border-radius:1.5vw;opacity:0}
</style>
</head><body>
<div style="position:absolute;left:8vw;top:12vh;width:30vw;height:4vh;background:#e8ecf5"></div>
<div class="card" style="left:8vw;background:#ff5a3c"></div>
<div class="card" style="left:39vw;background:#f5c542"></div>
<div class="card" style="left:70vw;background:#3cc8ff"></div>
<script>
const cards = [...document.querySelectorAll('.card')];
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
window.seek = (t) => {
  cards.forEach((c, i) => {
    const p = ease((t - 0.6 - i * 0.9) / 0.5);
    c.style.opacity = p;
    c.style.transform = `translateY(${(1 - p) * 8}vh)`;
  });
};
</script></body></html>
