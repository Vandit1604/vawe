<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="duration" content="2">
<meta name="aspect" content="16:9">
<style>
*{margin:0}
html,body{height:100%;background:#fbfbf9;overflow:hidden}
.ground{position:absolute;inset:0;overflow:hidden}
.ground i{position:absolute;left:-8%;top:-35%;width:calc(var(--vh)*1.3);height:calc(var(--vh)*1.3);border-radius:50%;background:radial-gradient(closest-side,#f8c9b0,transparent)}
h1{position:absolute;left:7%;top:55%;font:700 110px sans-serif;color:#17313b;letter-spacing:-0.03em}
</style></head><body>
<div class="ground"><i></i></div>
<h1>Every school email</h1>
<script>
document.querySelector('i').animate([{ translate: '0 0' }, { translate: 'calc(var(--vw) * -0.3) calc(var(--vh) * 0.16)' }], { duration: 2000, easing: 'ease-in-out', fill: 'both' });
document.querySelector('h1').animate([{ translate: '0 0.4em', scale: '0.9', filter: 'blur(8px)' }, { translate: '0 0', scale: '1', filter: 'blur(0px)' }], { duration: 800, easing: 'ease-out', fill: 'both' });
</script></body></html>
