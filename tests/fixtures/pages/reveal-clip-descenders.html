<!doctype html><html><head><meta charset="utf-8"><meta name="duration" content="2"><style>
html,body{margin:0;height:100%;background:#fff}
.mask{position:absolute;left:80px;top:120px;height:66px;overflow:hidden}
.mask h1{margin:0;font:700 72px/1 system-ui;color:#000;animation:rise .5s ease-out both}
@keyframes rise{from{transform:translateY(60px)}to{transform:translateY(0)}}
.ok{position:absolute;left:80px;top:260px;height:120px;overflow:hidden}
.ok h1{margin:0;font:700 72px/1.4 system-ui;color:#000;animation:rise .5s ease-out both}
</style></head><body>
<div class="mask"><h1>Colour, gypsy jelly</h1></div>
<div class="ok"><h1>Colour, gypsy jelly</h1></div>
</body></html>
