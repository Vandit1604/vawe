<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="duration" content="0.3">
<style>*{margin:0}html,body{background:#000;color:#fff}
#w{display:none;position:absolute;left:0;top:100px;font:700 100px 'FitFont',serif;white-space:nowrap}
#m{position:absolute;left:0;top:400px;font:40px monospace}</style>
</head><body><div id="w">Anybody</div><div id="m"></div>
<script>
const face = new FontFace('FitFont', 'url(/assets/fonts/Anybody.woff2)');
document.fonts.add(face);
window.addEventListener('load', () => face.load());
let fitted = false;
window.seek = () => {
  if (fitted) return;
  fitted = true;
  const w = document.getElementById('w');
  w.style.display = 'block';
  w.style.fontSize = (100 * 900 / w.offsetWidth) + 'px';
  document.getElementById('m').textContent = 'fit=' + Math.round(w.offsetWidth) + ' status=' + face.status;
};
</script></body></html>
