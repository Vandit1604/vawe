<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="duration" content="1">
<meta name="aspect" content="16:9">
<style>*{margin:0}html,body{background:#101820}
#fixed{position:absolute;left:1500px;top:100px;width:240px;height:240px;background:#ffd400}
#mover{position:absolute;left:100px;top:600px;width:200px;height:200px;background:#f4f4f4;animation:slide 1s linear both}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(800px)}}</style>
</head><body><div id="fixed"></div><div id="mover"></div></body></html>
