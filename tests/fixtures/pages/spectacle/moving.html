<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="duration" content="5"><meta name="spectacle" content="3">
<style>*{margin:0}html,body{background:#000}canvas{display:block;width:100vw;height:100vh}</style>
</head><body><canvas id="c" width="320" height="180"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d');
window.seek = (t) => {
  ctx.fillStyle = '#101820';
  ctx.fillRect(0, 0, 320, 180);
  if (t >= 3) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 320, 180); ctx.fillStyle = '#c00'; ctx.fillRect(20 + (t - 3) * 120, 60, 60, 60); return; }
  ctx.fillStyle = '#ffd400';
  ctx.fillRect(20 + (t * 90) % 240, 70, 40, 40);
};
</script></body></html>
