<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="duration" content="6">
<meta name="aspect" content="16:9">
<style>
*{margin:0}
html,body{height:100%;background:#f4f1ea;overflow:hidden}
.card{position:absolute;width:12%;height:20%;border-radius:12px;background:#1d3a5f;opacity:0}
</style></head><body>
<script type="module">
import { easeFn } from '../../../core/motion/presets.js';
const eases = [easeFn('nudge'), easeFn('land')];
const cards = Array.from({ length: 12 }, (_, i) => {
  const el = document.createElement('div');
  el.className = 'card';
  el.style.left = `${6 + (i % 6) * 15}%`;
  el.style.top = `${i < 6 ? 15 : 55}%`;
  document.body.append(el);
  return el;
});
const pr = (t, at, len) => Math.min(1, Math.max(0, (t - at) / len));
window.vawe.onFrame((t) => {
  cards.forEach((el, i) => {
    const p = eases[i % 2](pr(t, 0.3 + i * 0.4, 0.7));
    el.style.transform = `translateY(${(1 - p) * 90}px)`;
    el.style.opacity = String(Math.min(1, pr(t, 0.3 + i * 0.4, 0.7) * 3));
  });
});
</script></body></html>
