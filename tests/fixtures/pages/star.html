<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="duration" content="1">
<meta name="aspect" content="16:9">
<script type="importmap">{"imports":{"three":"../../../assets/vendor/three.module.min.js"}}</script>
<style>
  *{margin:0}
  html,body{background:#020204;overflow:hidden}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
  #bg{position:absolute;inset:0}
  canvas{position:absolute;left:0;top:0}
</style>
</head>
<body>
<div id="stage"><div id="bg"></div></div>
<script type="module">
import * as THREE from 'three';
window.THREE = THREE;
import '../../../core/engine/page-api.js';
import { createStar } from '../../../core/shapes/star.js';

const stage = document.getElementById('stage');
stage.style.transform = `scale(${window.innerWidth / 1920})`;
const mk = (look) => {
  const c = document.createElement('canvas');
  c.width = 1920; c.height = 1080;
  stage.appendChild(c);
  return createStar(c, { look });
};
const dark = mk('iridescent');
const pale = mk('glass');
const pale2 = mk('glass');
const bg = document.getElementById('bg');

window.seek = (t) => {
  const onDark = t < 3;
  bg.style.background = onDark
    ? 'radial-gradient(ellipse 400px 560px at 1900px 330px, #2270ec 0%, rgba(19,62,171,.55) 62%, #020204 100%) #020204'
    : '#fafafa';
  dark.draw({ x: 960, y: 500, size: onDark ? 270 : 0, spin: 0.35, tilt: 0.2 });
  pale.draw({ x: 960, y: 555, size: !onDark && t < 15 ? 600 : 0, spin: 0.5, tilt: 0.3 });
  pale2.draw({ x: 320, y: 285, size: t >= 15 ? 240 : 0, spin: 0.6, tilt: 0.5 });
};
window.seek(0);
</script>
</body>
</html>
