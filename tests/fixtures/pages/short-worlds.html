<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="duration" content="4">
<meta name="aspect" content="16:9">
<style>
*{margin:0}
html,body{height:100%;background:#fbfbf9;overflow:hidden}
[data-world]{position:absolute;inset:0;visibility:hidden}
</style></head><body>
<section data-world="a" style="background:#f8c9b0"></section>
<section data-world="b" style="background:#b0c9f8"></section>
<section data-world="c" style="background:#c9f8b0"></section>
<script>
const show = (id, at, len) => document.querySelector(`[data-world="${id}"]`).animate([{ visibility: 'visible' }, { visibility: 'visible' }], { delay: at * 1000, duration: len * 1000 });
show('a', 0.5, 0.1);
show('b', 1, 0.25);
show('c', 2, 1);
</script></body></html>
