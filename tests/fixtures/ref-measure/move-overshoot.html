<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="duration" content="2.4">
<meta name="aspect" content="16:9">
<style>*{margin:0}html,body{background:#101820;overflow:hidden}
#b{position:absolute;left:10vw;top:38vh;width:14vw;height:24vh;background:#ffd400}</style>
</head><body><div id="b"></div>
<script>
// truth: translateX 0 -> 50vw, start 0.5 s, duration 0.8 s (ends 1.3 s), cubic-bezier(0.34, 1.56, 0.64, 1) (one overshoot of about 1.1)
document.getElementById('b').animate([{ transform: 'translateX(0)' }, { transform: 'translateX(50vw)' }],
  { delay: 500, duration: 800, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)', fill: 'both' });
</script></body></html>
