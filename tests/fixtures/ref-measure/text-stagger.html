<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="duration" content="5">
<meta name="aspect" content="16:9">
<style>*{margin:0}html,body{background:#101820;overflow:hidden}
.l{position:absolute;left:0;width:100vw;text-align:center;font:700 9vh Helvetica,Arial,sans-serif;color:#f1faee;white-space:nowrap}
.l span{display:inline-block;margin:0 0.5vw;opacity:0}
#l1{top:12vh}#l2{top:42vh}#l3{top:72vh}
</style>
</head><body>
<div class="l" id="l1"></div><div class="l" id="l2"></div><div class="l" id="l3"></div>
<script>
// truth (font 9vh = 97 px at 1080; a word box is about 0.8 of that tall):
// line 1 "Good motion design travels", left-to-right, first word 0.50 s, 0.15 s between words, each fades in over 0.2 s.
// line 2 "Simple systems always scale", right-to-left, first word (scale) 1.50 s, 0.20 s between words.
// line 3 "Good ideas Good ideas", all four words at 3.00 s together (a repeated word, two appearances of each).
const rows = [['l1', ['Good', 'motion', 'design', 'travels'], (i, n) => 0.5 + 0.15 * i],
  ['l2', ['Simple', 'systems', 'always', 'scale'], (i, n) => 1.5 + 0.2 * (n - 1 - i)],
  ['l3', ['Good', 'ideas', 'Good', 'ideas'], () => 3.0]];
for (const [id, words, at] of rows) {
  const el = document.getElementById(id);
  words.forEach((w, i) => {
    const s = document.createElement('span');
    s.textContent = w;
    el.appendChild(s);
    s.animate([{ opacity: 0, transform: 'translateY(2vh)' }, { opacity: 1, transform: 'translateY(0)' }],
      { delay: at(i, words.length) * 1000, duration: 200, easing: 'linear', fill: 'both' });
  });
}
</script></body></html>
