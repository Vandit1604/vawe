<!DOCTYPE html><html data-aspect="16:9"><head><meta charset="utf-8">
<meta name="duration" content="3">
<audio data-synth="tick" data-at="0.2" data-gain="-11"></audio>
<audio data-synth="tap" data-at="1.2" data-gain="-9"></audio>
<audio data-synth="air" data-at="2.2" data-gain="-11"></audio>
<style>
*{margin:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#161821;color:#f3efe6;font-family:system-ui,sans-serif}
.world{position:absolute;inset:0;opacity:0}
.copy{position:absolute;left:8vw;top:36vh;font:700 11vh/1 system-ui;letter-spacing:-0.03em}
.bar{position:absolute;left:8vw;top:70vh;width:12vw;height:2vh;background:#f3efe6}
.lit{position:absolute;inset:0}.lit i{position:absolute;border-radius:50%;filter:blur(8vh)}.lit i:nth-child(1){left:50vw;top:10vh;width:50vh;height:50vh;background:#e8553b}.lit i:nth-child(2){left:5vw;top:55vh;width:45vh;height:45vh;background:#3b5fe8}</style></head><body>
<section class="world" data-world="a"><div class="lit" aria-hidden="true"><i></i><i></i></div><p class="copy">Ship it</p><div class="bar"></div></section>
<section class="world" data-world="b"><div class="lit" aria-hidden="true" style="filter:hue-rotate(90deg)"><i></i><i></i></div><p class="copy">Then test it</p><div class="bar"></div></section>
<section class="world" data-world="c"><div class="lit" aria-hidden="true" style="filter:hue-rotate(200deg)"><i></i><i></i></div><p class="copy">Then keep it</p><div class="bar"></div></section>
<script>
const show = (el, a, b) => el.animate([{ opacity: 0, offset: 0 }, { opacity: 1, offset: 0.001 }, { opacity: 1, offset: 0.999 }, { opacity: 0, offset: 1 }], { delay: a * 1000, duration: (b - a) * 1000, fill: 'both' });
const move = (el, a, b) => el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(30vw)' }], { delay: a * 1000, duration: (b - a) * 1000, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'both' });
const [a, b, c] = document.querySelectorAll('.world');
show(a, 0, 1); show(b, 1, 2); show(c, 2, 3);
document.querySelectorAll('.bar').forEach((bar, i) => move(bar, i, i + 1));
</script></body></html>
