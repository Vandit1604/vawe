<!doctype html>
<html data-aspect="{{aspect}}">
<head>
<meta charset="utf-8">
<meta name="duration" content="{{length}}">
<meta name="aspect" content="{{aspect}}">
<meta name="message" content="one thing to remember">
<meta name="spectacle" content="{{spectacle}}">
<meta name="signature" content="{{signature}}">
<title>{{title}}</title>
<!-- a story: s1 the problem, s2 the mechanism (a token runs the steps), s3 a rule picks the route, s4 the number, s5 the gap closing and s6 the check (no words), s7 the end with the brand (the spectacle: the mark lands).
  The mark is the thread: it rides over every cut and ends as the end card's mark. Replace the three steps with the real mechanism, the numbers with the real ones,
  the square with the brand mark, the grey with the palette and the face with the brand's; keep the order. -->
<style>
  @font-face { font-family: "{{family}}"; src: url("assets/{{font}}") format("woff2"); font-weight: 100 900; }
  :root { --ground: {{ground}} /* unchosen: palette dial */; --ink: {{ink}} /* unchosen: palette dial */; --unit: min(var(--vh), calc(var(--vw) * 0.56)); {{beats}} }
  html, body { margin: 0; height: 100%; background: var(--ground); overflow: hidden; font-family: "{{family}}", sans-serif; }
  .world { position: absolute; inset: 0; isolation: isolate; box-sizing: border-box; display: grid; align-content: center; justify-items: start; gap: calc(var(--unit) * 0.04);
           padding: 0 calc(var(--vw) * 0.08); }
{{groundCss}}
  h1, h2, p { margin: 0; letter-spacing: -0.03em; }
  h1 { font-size: calc(var(--unit) * 0.14); font-weight: 700; line-height: 1; }
  .line { font-size: calc(var(--unit) * 0.09); font-weight: 500; }
  .flow { position: relative; display: flex; align-items: center; width: calc(var(--vw) * 0.84); }
  .node { flex: none; padding: calc(var(--unit) * 0.02) calc(var(--unit) * 0.03); border: calc(var(--unit) * 0.008) solid currentColor; border-radius: calc(var(--unit) * 0.04); font-size: calc(var(--unit) * 0.09); font-weight: 600; letter-spacing: -0.01em; }
  .link { flex: 1; height: calc(var(--unit) * 0.008); background: currentColor; transform-origin: left; }
  .token { z-index: 1; position: absolute; left: 0; top: 50%; width: calc(var(--unit) * 0.05); height: calc(var(--unit) * 0.05); margin-top: calc(var(--unit) * -0.025); border-radius: 50%; background: currentColor; }
  .chips { display: flex; gap: calc(var(--unit) * 0.04); }
  .chip { padding: calc(var(--unit) * 0.04) calc(var(--unit) * 0.07); border: calc(var(--unit) * 0.008) solid currentColor; border-radius: 999px; font-size: calc(var(--unit) * 0.14); font-weight: 600; letter-spacing: -0.01em; }
  .disc { width: calc(var(--unit) * 0.9); height: calc(var(--unit) * 0.9); border-radius: 50%; background: currentColor; display: grid; place-items: center; align-self: center; justify-self: center; }
  .disc svg { width: 55%; overflow: visible; }
  .disc polyline { fill: none; stroke: var(--ink); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; }
  h2 span { grid-area: 1 / 1; }
  h2 { display: grid; font-size: calc(var(--unit) * 0.4); letter-spacing: -0.05em; font-weight: 700; line-height: 1; }
  .gap { display: grid; gap: calc(var(--unit) * 0.05); width: calc(var(--vw) * 0.84); }
  .gap i { display: block; height: calc(var(--unit) * 0.16); background: currentColor; transform-origin: left; }
  .gap .before i { width: 100%; opacity: 0.4; }
  .gap .after i { width: 33%; }
  .card { padding-top: calc(var(--unit) * 0.3); }
  .thread { position: absolute; left: 0; top: 0; width: calc(var(--unit) * 0.14); height: calc(var(--unit) * 0.14); color: var(--ink); }
</style>
<script type="module">
import { enter, layer, stagger, keys, EASE } from '../../core/motion/presets.js';
const root = document.documentElement;
const beat = (n) => parseFloat(getComputedStyle(root).getPropertyValue('--beat-' + n));
const meta = (name) => parseFloat(document.querySelector('meta[name="' + name + '"]').content);
const end = meta('duration');
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const worlds = [...$$('[data-world]')];
const cutTo = (el, visibility, at, fill) => el.animate([{ visibility: visibility === 'visible' ? 'hidden' : 'visible' }, { visibility }], { delay: at * 1000, duration: 1, fill });
// each ground blob drifts by [x, y] fractions of the frame while its world shows
const DRIFT = [[-0.2, 0.1], [0.18, -0.2], [0.14, -0.16]];
// the cut frame already carries the first thing moving: a blank frame there fails the draft check
const span = worlds.map((_, i) => [i ? beat(i + 1) - 0.03 : 0, i + 1 === worlds.length ? end : beat(i + 2) - 0.03]);
worlds.forEach((world, i) => {
  const [from, to] = span[i];
  if (i) cutTo(world, 'visible', from, 'both');
  if (i + 1 < worlds.length) cutTo(world, 'hidden', to, 'forwards');
  world.querySelectorAll('.ground i').forEach((blob, k) => blob.animate([{ translate: '0 0' }, { translate: 'calc(var(--vw) * ' + DRIFT[k][0] + ') calc(var(--vh) * ' + DRIFT[k][1] + ')' }], { delay: (from + 0.35) * 1000, duration: (to - from - 0.35) * 1000, easing: EASE.glide, fill: 'both' }));
});

// the thread sits above the grounds, so its ink flips with them: even worlds are --ink
worlds.slice(1).forEach((_, k) => $('.thread').animate([{ color: k % 2 ? 'var(--ink)' : 'var(--ground)' }], { delay: span[k + 1][0] * 1000, duration: 1, fill: 'forwards' }));
// one place per world, [x, y] as fractions of the frame; the mark winds up, leaves its place 0.23 s before each cut and lands in the next 0.27 s after it
const PLACE = [[0.78, 0.22], [0.86, 0.14], [0.9, 0.1], [0.8, 0.2], [0.8, 0.12], [0.86, 0.14], [0.08, 0.26]];
const at = (k, back = 0, next = PLACE[Math.min(k + 1, PLACE.length - 1)]) => 'calc(var(--vw) * ' + (PLACE[k][0] - back * (next[0] - PLACE[k][0])) + ') calc(var(--vh) * ' + (PLACE[k][1] - back * (next[1] - PLACE[k][1])) + ')';
const carry = worlds.slice(1).flatMap((_, k) => [[span[k][1] - 0.4, at(k)], [span[k][1] - 0.23, at(k, 0.06), 'fling'], [span[k][1] + 0.27, at(k + 1), 'hang']]);
enter($('.thread'), { at: 0.3, band: 'energy', from: '0 0', scale: 0.4, ease: 'pop' });
keys($('.thread'), 'translate', [[0, at(0)], ...carry, [end, at(worlds.length - 1)]]);
$('.thread').animate([{ rotate: '0deg' }, { rotate: '90deg' }], { delay: (beat(7) + 0.5) * 1000, duration: (end - beat(7) - 0.5) * 1000, easing: EASE.land, fill: 'both' });

// s1 the problem: rises from below
layer($('h1'), $('.problem .line'), { at: 0.05, band: 'professional', blur: 10, from: '0 0.4em', secondary: { blur: 6 } });

// s2 the mechanism: the steps arrive from the right and the links draw; the token runs step to step and each step pops as it arrives
const [step] = span[1];
const nodes = [...$$('.node')];
stagger(nodes, { at: step, band: 'professional', from: '2em 0', nudgeEvery: 2 });
$$('.link').forEach((link, k) => link.animate([{ scale: '0 1' }, { scale: '1 1' }], { delay: (step + 0.3 + k * 0.2) * 1000, duration: 500, easing: EASE.land, fill: 'both' }));
const left = (el) => el.getBoundingClientRect().left;
const [HOP, REST] = [0.5, 0.15];
const run = nodes.slice(1).map((node) => left(node) - left(nodes[0]) - $('.token').offsetWidth);
enter($('.token'), { at: step + 0.5, band: 'energy', from: '0 0', scale: 0.4 });
keys($('.token'), 'translate', [[step + 0.8, '0 0'], ...run.flatMap((x, k) => [[step + 0.8 + k * (HOP + REST) + HOP, x + 'px 0', { in: 'hang' }], [step + 0.8 + (k + 1) * (HOP + REST), x + 'px 0']])]);
nodes.forEach((node, k) => {
  const lit = step + 0.8 + (k ? (k - 1) * (HOP + REST) + HOP : 0);
  node.animate([{ backgroundColor: 'transparent', color: 'var(--ground)' }, { backgroundColor: 'color-mix(in srgb, var(--ground), white 40%)', color: 'var(--ink)' }], { delay: lit * 1000, duration: 300, easing: EASE.land, fill: 'both' });
  if (k) node.animate([{ scale: '1' }, { scale: '1.12' }, { scale: '1' }], { delay: lit * 1000, duration: 400, easing: EASE.nudge, fill: 'both' });
});

// s3 a rule picks the route: the chips drop in from above and the chosen one pops
const [pick] = span[2];
stagger($$('.chip'), { at: pick, band: 'professional', from: '0 -1em', nudgeEvery: 1 });
$('.chip.chosen').animate([{ scale: '1', backgroundColor: 'transparent' }, { scale: '1.15', backgroundColor: 'var(--ink)', color: 'var(--ground)' }, { scale: '1.1', backgroundColor: 'var(--ink)', color: 'var(--ground)' }], { delay: (pick + 1.1) * 1000, duration: 600, easing: EASE.pop, fill: 'both' });

$$('.chip:not(.chosen)').forEach((chip) => chip.animate([{ scale: '1' }, { scale: '0.88' }], { delay: (pick + 1.8) * 1000, duration: 900, easing: EASE.land, fill: 'both' }));

// s4 the number counts up: it drops in, the figure changes twice and its line rises under it
const [count] = span[3];
enter($('.count h2'), { at: count, band: 'professional', from: '0 -0.5em' });
enter($('.count .line'), { at: count + 0.5, band: 'professional', from: '0 0.4em', ease: 'nudge' });
const figures = [...$$('.count h2 span')];
figures.forEach((figure, k) => {
  figure.animate([{ opacity: 0 }, { opacity: 1 }], { delay: (count + k * 0.6) * 1000, duration: 1, fill: 'both' });
  if (k + 1 < figures.length) figure.animate([{ opacity: 1 }, { opacity: 0 }], { delay: (count + (k + 1) * 0.6) * 1000, duration: 1, fill: 'forwards' });
});

// s5 the gap closes, with no words: the long bar slides in from the right, the short one lands
const [gap] = span[4];
$$('.gap > div').forEach((row, k) => enter(row, { at: gap + k * 0.5, band: 'professional', from: '3em 0' }));
$('.gap .after i').animate([{ scale: '1' }, { scale: '1.15 1.4' }, { scale: '1' }], { delay: (gap + 1.1) * 1000, duration: 600, easing: EASE.pop, fill: 'both' });

// s6 the check, with no words: the disc pops in and the tick draws itself
const [done] = span[5];
$('.disc').animate([{ scale: '0.2' }, { scale: '1' }], { delay: done * 1000, duration: 600, easing: EASE.land, fill: 'both' });
$('.disc polyline').animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { delay: (done + 0.6) * 1000, duration: 1200, easing: EASE.glide, fill: 'both' });

// s7 the end card: the mark lands, the name and one line arrive with it (the spectacle: the mark lands)
const [card] = span[6];
layer($('.card h1'), $('.card .line'), { at: card + 0.05, band: 'professional', from: '0 0.4em' });
</script>
</head>
<body>
<main class="world problem" data-world="s1">
  <div class="ground" aria-hidden="true"><i></i><i></i><i></i></div>
  <h1>{{title}}</h1>
  <p class="line">why it matters</p>
</main>
<section class="world" data-world="s2">
  <div class="ground" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="flow"><span class="node">Input</span><i class="link"></i><span class="node">Rule</span><i class="link"></i><span class="node">Output</span><i class="token"></i></div>
</section>
<section class="world" data-world="s3">
  <div class="ground" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="chips"><span class="chip">Fast</span><span class="chip chosen">Cheap</span><span class="chip">Safe</span></div>
</section>
<section class="world count" data-world="s4">
  <div class="ground" aria-hidden="true"><i></i><i></i><i></i></div>
  <h2><span>1x</span><span>2x</span><span>3x</span></h2>
  <p class="line">faster than before</p>
</section>
<section class="world" data-world="s5">
  <div class="ground" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="gap"><div class="before"><i></i></div><div class="after"><i></i></div></div>
</section>
<section class="world" data-world="s6">
  <div class="ground" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="disc"><svg viewBox="0 0 100 100"><polyline points="22,52 42,72 78,30" pathLength="1"/></svg></div>
</section>
<section class="world card" data-world="s7">
  <div class="ground" aria-hidden="true"><i></i><i></i><i></i></div>
  <h1>Brand name</h1>
  <p class="line">name.example</p>
</section>
<svg class="thread" viewBox="0 0 100 100" role="img" aria-label="mark"><rect x="20" y="20" width="60" height="60" rx="14" fill="currentColor"/></svg>
</body>
</html>
