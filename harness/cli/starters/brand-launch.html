<!doctype html>
<html data-aspect="{{aspect}}">
<head>
<meta charset="utf-8">
<meta name="duration" content="{{length}}">
<meta name="aspect" content="{{aspect}}">
<meta name="message" content="one thing to remember">
<meta name="spectacle" content="{{spectacle}}">
<meta name="signature" content="{{signature}}">
<title>{{title}}</title>
<script type="application/json" id="authoring">{"allow": ["static-window@0-{{b2}}", "static-window@{{b2}}-{{b3}}", "static-window@{{b3}}-{{b4}}", "static-window@{{b4}}-{{length}}", "tile-run@0-{{b2}}", "tile-run@{{b2}}-{{b3}}", "tile-run@{{b3}}-{{b4}}"], "_why": {
  "static-window@0-{{b2}}": "world s1, 0-{{b2}} s: the hook is held for its read time",
  "static-window@{{b2}}-{{b3}}": "world s2, {{b2}}-{{b3}} s: the meter fills and the punch-in lands inside this hold",
  "static-window@{{b3}}-{{b4}}": "world s3, {{b3}}-{{b4}} s: the wordless graph rests the eye",
  "static-window@{{b4}}-{{length}}": "world s4, {{b4}}-{{length}} s: the end card is held for its read time",
  "tile-run@0-{{b2}}": "world s1, 0-{{b2}} s: the hook is held for its read time",
  "tile-run@{{b2}}-{{b3}}": "world s2, {{b2}}-{{b3}} s: the meter fills and the punch-in lands inside this hold",
  "tile-run@{{b3}}-{{b4}}": "world s3, {{b3}}-{{b4}} s: the wordless graph rests the eye"}}</script>
<!-- a brand launch: s1 hook, s2 the product working (statuses change on screen), s3 proof (no words: the graph carries it), s4 the end card with the brand (the spectacle: the mark lands on it).
  The mark is the thread: it rides over every cut and ends as the end card's mark. Replace the stand-in rows with the product's real screen and
  numbers, the square with the brand mark, the grey with the palette and the face with the brand's; keep the order. -->
<style>
  @font-face { font-family: "{{family}}"; src: url("assets/{{font}}") format("woff2"); font-weight: 100 900; }
  :root { --ground: {{ground}} /* unchosen: palette dial */; --ink: {{ink}} /* unchosen: palette dial */; --unit: min(var(--vh), calc(var(--vw) * 0.56)); {{beats}} }
  html, body { margin: 0; height: 100%; background: var(--ground); overflow: hidden; font-family: "{{family}}", sans-serif; }
  .world { position: absolute; inset: 0; isolation: isolate; box-sizing: border-box; display: grid; align-content: center; justify-items: start; gap: calc(var(--unit) * 0.04);
           padding: 0 calc(var(--vw) * 0.08); }
{{groundCss}}
  h1, p { margin: 0; letter-spacing: -0.03em; }
  h1 { font-size: calc(var(--unit) * 0.14); font-weight: 700; line-height: 1; }
  .line { font-size: calc(var(--unit) * 0.09); font-weight: 500; }
  .panel { width: calc(var(--unit) * 1.1); padding: calc(var(--unit) * 0.04); border-radius: calc(var(--unit) * 0.03); font-size: calc(var(--unit) * 0.06); letter-spacing: 0;
           background: color-mix(in srgb, var(--ground), white 10%); color: var(--ink); box-shadow: 0 calc(var(--unit) * 0.03) calc(var(--unit) * 0.08) rgb(0 0 0 / 0.3); }
  .panel header { font-weight: 700; margin-bottom: 0.4em; }
  .panel ul { margin: 0; padding: 0; list-style: none; }
  .panel li { display: flex; justify-content: space-between; align-items: center; padding: 0.35em 0; border-top: 1px solid color-mix(in srgb, var(--ink), transparent 80%); }
  .panel code { font-family: ui-monospace, Menlo, monospace; font-size: 0.8em; }
  .status { position: relative; display: inline-grid; justify-items: end; font-weight: 600; }
  .status span + span { position: absolute; right: 0; }
  .meter { height: 0.25em; margin-top: 0.6em; background: color-mix(in srgb, var(--ink), transparent 85%); }
  .meter i { display: block; height: 100%; background: var(--ink); transform-origin: left; }
  .bars { display: flex; align-items: end; gap: calc(var(--unit) * 0.03); height: calc(var(--unit) * 0.5); }
  .bars i { width: calc(var(--unit) * 0.14); background: currentColor; }
  .card { padding-top: calc(var(--unit) * 0.3); }
  .thread { position: absolute; left: 0; top: 0; width: calc(var(--unit) * 0.14); height: calc(var(--unit) * 0.14); color: var(--ink); }
</style>
<script type="module">
import { enter, layer, stagger, keys, EASE } from '../../core/motion/presets.js';
const root = document.documentElement;
const beat = (n) => parseFloat(getComputedStyle(root).getPropertyValue('--beat-' + n));
const meta = (name) => parseFloat(document.querySelector('meta[name="' + name + '"]').content);
const end = meta('duration');
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const worlds = [...$$('[data-world]')];
const cutTo = (el, visibility, at, fill) => el.animate([{ visibility: visibility === 'visible' ? 'hidden' : 'visible' }, { visibility }], { delay: at * 1000, duration: 1, fill });
// each ground blob drifts by [x, y] fractions of the frame while its world shows
const DRIFT = [[-0.2, 0.1], [0.18, -0.2], [0.14, -0.16]];
// the cut frame already carries the first thing moving: a blank frame there fails the draft check
const span = worlds.map((_, i) => [i ? beat(i + 1) - 0.03 : 0, i + 1 === worlds.length ? end : beat(i + 2) - 0.03]);
worlds.forEach((world, i) => {
  const [from, to] = span[i];
  if (i) cutTo(world, 'visible', from, 'both');
  if (i + 1 < worlds.length) cutTo(world, 'hidden', to, 'forwards');
  world.querySelectorAll('.ground i').forEach((blob, k) => blob.animate([{ translate: '0 0' }, { translate: 'calc(var(--vw) * ' + DRIFT[k][0] + ') calc(var(--vh) * ' + DRIFT[k][1] + ')' }], { delay: from * 1000, duration: (to - from) * 1000, easing: EASE.glide, fill: 'both' }));
});

// the thread sits above the grounds, so its ink flips with them: even worlds are --ink
worlds.slice(1).forEach((_, k) => $('.thread').animate([{ color: k % 2 ? 'var(--ink)' : 'var(--ground)' }], { delay: span[k + 1][0] * 1000, duration: 1, fill: 'forwards' }));
// one place per world, [x, y] as fractions of the frame; the mark winds up, leaves its place 0.23 s before each cut and lands in the next 0.27 s after it
const PLACE = [[0.78, 0.22], [0.86, 0.14], [0.8, 0.62], [0.08, 0.26]];
const at = (k, back = 0, next = PLACE[Math.min(k + 1, PLACE.length - 1)]) => 'calc(var(--vw) * ' + (PLACE[k][0] - back * (next[0] - PLACE[k][0])) + ') calc(var(--vh) * ' + (PLACE[k][1] - back * (next[1] - PLACE[k][1])) + ')';
const carry = worlds.slice(1).flatMap((_, k) => [[span[k][1] - 0.4, at(k)], [span[k][1] - 0.23, at(k, 0.06), 'fling'], [span[k][1] + 0.27, at(k + 1), 'hang']]);
enter($('.thread'), { at: 0.3, band: 'energy', from: '0 0', scale: 0.4, ease: 'pop' });
keys($('.thread'), 'translate', [[0, at(0)], ...carry, [end, at(worlds.length - 1)]]);
$('.thread').animate([{ rotate: '0deg' }, { rotate: '90deg' }], { delay: (beat(4) + 0.5) * 1000, duration: (end - beat(4) - 0.5) * 1000, easing: EASE.land, fill: 'both' });

// s1 hook: rises from below
layer($('h1'), $('.hook .line'), { at: 0.05, band: 'professional', blur: 10, from: '0 0.4em', secondary: { blur: 6 } });

// s2 the product working: the panel slides in from the right and its rows follow; the meter fills slowly and the statuses change together
const [ui, uiEnd] = span[1];
enter($('.panel'), { at: ui, band: 'professional', from: '3em 0', ease: 'nudge' });
stagger($$('.panel header, .panel li'), { at: ui + 0.5, band: 'professional', from: '0 0.6em' });
$('.meter i').animate([{ scale: '0.15 1' }, { scale: '1 1' }], { delay: (ui + 0.9) * 1000, duration: (uiEnd - ui - 1.3) * 1000, easing: EASE.glide, fill: 'both' });
const flip = ui + 1.6;
$$('.status > :first-child').forEach((old, k) => old.animate([{ opacity: 1 }, { opacity: 0 }], { delay: (flip + k * 0.08) * 1000, duration: 150, easing: EASE.land, fill: 'both' }));
stagger($$('.status > :last-child'), { at: flip, band: 'energy', from: '0 0.4em' });
// the punch-in lands as the statuses change, and the view settles back near the end of the world
const punch = (at, to) => $('.panel').animate([{ scale: to[0] }, { scale: to[1] }], { delay: at * 1000, duration: 500, easing: EASE.land, fill: 'both' });
punch(flip, [1, 1.12]);
punch(flip + 1.4, [1.12, 1]);

// s3 proof, with no words: the bars rise from below
stagger($$('.bars i'), { at: span[2][0], band: 'energy', from: '0 6em', nudgeEvery: 1 });

// s4 end card: the mark lands, the name and one line arrive with it (the spectacle: the mark lands)
const [card] = span[3];
layer($('.card h1'), $('.card .line'), { at: card + 0.05, band: 'professional', from: '0 0.4em' });
</script>
</head>
<body>
<main class="world hook" data-world="s1">
  <div class="ground" aria-hidden="true"><i></i><i></i><i></i></div>
  <h1>{{title}}</h1>
  <p class="line">why it matters</p>
</main>
<section class="world" data-world="s2">
  <div class="ground" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="panel" data-ui>
    <header>Shipments</header>
    <ul>
      <li>Order <code>4821</code><span class="status"><span>Delayed</span><span>Rerouted</span></span></li>
      <li>Order <code>4822</code><span class="status"><span>Packed</span><span>Shipped</span></span></li>
      <li>Order <code>4823</code><span class="status"><span>Queued</span><span>Packed</span></span></li>
    </ul>
    <div class="meter"><i></i></div>
  </div>
</section>
<section class="world" data-world="s3">
  <div class="ground" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="bars"><i style="height: 30%"></i><i style="height: 55%"></i><i style="height: 100%"></i></div>
</section>
<section class="world card" data-world="s4">
  <div class="ground" aria-hidden="true"><i></i><i></i><i></i></div>
  <h1>Brand name</h1>
  <p class="line">name.example</p>
</section>
<svg class="thread" viewBox="0 0 100 100" role="img" aria-label="mark"><rect x="20" y="20" width="60" height="60" rx="14" fill="currentColor"/></svg>
</body>
</html>
