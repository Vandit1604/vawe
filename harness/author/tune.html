<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
 @font-face{font-family:'JetBrains Mono';src:url(/assets/fonts/JetBrainsMono.woff2) format('woff2');font-weight:100 800;font-display:swap}
 :root{color-scheme:dark;
   --bg:#16151a;--panel:#212025;--panel-2:#27262c;--raised:#2f2e35;--raised-2:#393840;--field:#16151a;
   --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);
   --ink:#ffffff;--ink-2:#d8d8da;--ink-3:#97969b;--accent:#0a87ff;
   --mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,sans-serif;
   display:grid;grid-template-columns:minmax(320px,420px) 1fr;grid-template-rows:100vh}
 h1{font-size:13px;font-weight:600;margin:0 0 8px;color:var(--ink-2)}
 #rail{overflow:auto;padding:14px;border-right:1px solid var(--line);background:var(--panel)}
 #stagebar{display:flex;flex-direction:column;height:100vh}
 #stage{flex:1;display:flex;align-items:center;justify-content:center;background:#000;position:relative;overflow:hidden}
 #sc{border:0;background:#000}
 #transport{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-top:1px solid var(--line)}
 #scrub{flex:1;accent-color:var(--accent)}
 #read{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
 .layer{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:12px}
 .layer h2{font-size:12px;margin:0 0 8px;color:var(--ink)}
 .layer h2 code{color:var(--ink-3);font-family:var(--mono);font-weight:400}
 .key{border-top:1px solid var(--line);padding:8px 0}
 .key:first-child{border-top:0}
 .row{display:flex;align-items:center;gap:6px;margin:3px 0;flex-wrap:wrap}
 .row label{width:44px;flex:none;color:var(--ink-3);font-family:var(--mono);font-size:11px}
 input[type=number]{width:72px}
 input[type=number],select{background:var(--field);color:var(--ink);border:1px solid var(--line-2);
   border-radius:5px;padding:4px 6px;font:12px var(--mono)}
 input[type=number]:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
 button{font:500 12px system-ui,sans-serif;color:var(--ink);background:var(--raised);border:0;border-radius:6px;
   height:28px;padding:0 10px;cursor:pointer}
 button:hover{background:var(--raised-2)}
 button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
 .actions{display:flex;gap:8px;margin-top:10px}
 pre{white-space:pre-wrap;background:var(--field);border:1px solid var(--line-2);border-radius:6px;
   padding:8px;font:11px/1.5 var(--mono);max-height:240px;overflow:auto}
 .add>ins{background:#0a3a1e;color:#8fe6ab;text-decoration:none;display:block}
 .del>ins{background:#3a0a0e;color:#e68f8f;text-decoration:none;display:block}
 #note{color:var(--ink-3);font-size:11px;margin-top:6px;min-height:14px}
 [hidden]{display:none!important}
 .curves{border-top:1px solid var(--line);padding:8px 0;margin-top:4px}
 .curves h3{font-size:11px;font-weight:600;margin:0 0 6px;color:var(--ink-3);display:flex;align-items:center;gap:8px}
 .curves select{background:var(--field);color:var(--ink);border:1px solid var(--line-2);border-radius:5px;
   padding:3px 5px;font:11px var(--mono)}
 .graph{width:100%;display:block;background:var(--field);border:1px solid var(--line-2);border-radius:6px}
 .graph .grid{stroke:var(--line);stroke-width:1}
 .graph .curve{fill:none;stroke:var(--accent);stroke-width:1.6}
 .graph .zero{stroke:var(--line-2);stroke-width:1;stroke-dasharray:2,3}
 .graph .handle{fill:var(--panel-2);stroke:var(--ink);stroke-width:1.5;cursor:grab}
 .graph .handle:hover,.graph .handle:focus{fill:var(--accent);stroke:var(--ink)}
 .graph .handle:focus{outline:none}
 .graph .handle.dragging{cursor:grabbing}
 .graph .stem{stroke:var(--ink-3);stroke-width:1}
 .graph .keydot{fill:var(--ink-2)}
 .glabel{font-size:9px;fill:var(--ink-3);font-family:var(--mono)}
 .curves .hint{font-size:10px;color:var(--ink-3);margin-top:4px}
</style>
</head>
<body>
<div id="rail"><div id="layers"></div></div>
<div id="stagebar">
  <div id="stage"><iframe id="sc" src="{{IFRAME_SRC}}"></iframe></div>
  <div id="transport">
    <input type="range" id="scrub" min="0" max="0" value="0" step="1">
    <span id="read">0f</span>
  </div>
</div>
<script type="module" src="/tune/tune.js"></script>
</body>
</html>
