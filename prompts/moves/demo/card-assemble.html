<!doctype html>
<html data-aspect="16:9" data-look="chrome">
<head>
<meta charset="utf-8">
<meta name="duration" content="1.9">
<meta name="blank" content="0-0.05">
<title>move: card assemble</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  .card { width: calc(var(--u) * 150); padding: calc(var(--u) * 5.6) calc(var(--u) * 6.4) calc(var(--u) * 6.4); opacity: 0; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .who { display: flex; align-items: center; gap: var(--s3); }
  .avatar { --size: calc(var(--u) * 12); background: var(--ink); color: var(--surface); box-shadow: none; }
  .avatar .logo-mark { width: 52%; height: 52%; }
  .name { font: 700 var(--t-head)/1.1 var(--sans); letter-spacing: -0.02em; }
  .sub { margin-top: var(--s1); font: 500 var(--t-body)/1.2 var(--sans); color: var(--muted); }
  .amount { font: 800 calc(var(--u) * 10.6)/1 var(--sans); letter-spacing: -0.045em; }
  .rule { margin: calc(var(--u) * 4.8) 0 var(--s1); transform-origin: 0 50%; }
  .item { display: flex; justify-content: space-between; padding: calc(var(--u) * 2.6) 0; font: 500 var(--t-lead)/1 var(--sans); color: var(--muted); }
  .item b { font-weight: 600; color: var(--ink); }
  .pay { margin-top: var(--s3); padding: calc(var(--u) * 3.2) calc(var(--u) * 5.4); font-size: var(--t-lead); }
  .pay .icon { width: calc(var(--u) * 5); height: calc(var(--u) * 5); stroke: var(--on-accent); stroke-width: 2; }
  .part { opacity: 0; }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="who"><div class="avatar part" data-from="-14vh 0" data-logo="fernbank"></div><div class="part" data-from="-12vh 0"><div class="name">Fernbank Studio</div><div class="sub">Invoice 2041, due Oct 14</div></div></div>
    <div class="amount part" data-from="14vh 0">$4,280</div>
  </div>
  <div class="rule divider part" data-from="0 0"></div>
  <div class="item part" data-from="0 9vh"><span>Launch film, three aspects</span><b>$2,880</b></div>
  <div class="item part" data-from="0 9vh"><span>Sound design and mix</span><b>$1,400</b></div>
  <div class="pay btn primary part" data-from="0 12vh"><span>Pay invoice</span><svg class="icon" viewBox="0 0 24 24"><path class="arrow" d="M4 12 H19 M13 6 L19 12 L13 18"/></svg></div>
</div>
<script type="module">
import '/prompts/moves/demo/assets/logos.js';
import { curveToLinear, CURVES } from '/core/motion/springs.js';
const settle = curveToLinear(CURVES.expoOut), land = curveToLinear(CURVES.spring);
const q = (s) => document.querySelector(s);
const card = q('.card');
// the shell lands first, so the parts have something to arrive onto
card.animate([{ scale: 0.96, translate: '0 3vh' }, { scale: 1, translate: '0 0' }], { duration: 650, easing: settle, fill: 'both' });
card.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 90, easing: 'linear', fill: 'both' });
// each part travels in from the side its slot is on, 80 ms after the last; the rule draws instead of moving
[...document.querySelectorAll('.part')].forEach((el, i) => {
  const at = 350 + i * 80;
  if (el.classList.contains('rule')) {
    el.animate([{ opacity: 1, scale: '0 1' }, { opacity: 1, scale: '1 1' }], { duration: 600, delay: at, easing: settle, fill: 'both' });
    return;
  }
  el.animate([{ opacity: 0, translate: el.dataset.from, filter: 'blur(6px)' }, { opacity: 1, translate: '0 0', filter: 'blur(0px)' }],
    { duration: 900, delay: at, easing: el.classList.contains('pay') ? land : settle, fill: 'both' });
});
q('.arrow').animate([{ translate: '0 0' }, { translate: '4px 0', offset: 0.4 }, { translate: '0 0' }], { duration: 400, delay: 1520, easing: settle, fill: 'both' });
</script>
</body>
</html>
