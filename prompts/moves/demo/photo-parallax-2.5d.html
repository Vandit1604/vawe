<!doctype html>
<html data-aspect="16:9" data-look="daylight">
<head>
<meta charset="utf-8">
<meta name="duration" content="3.4">
<title>move: photo parallax 2.5d</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; position: relative; overflow: hidden; }
  /* three cut-outs of one 3000 px photo; each is wider than the frame so no edge shows at the end of the push */
  .layer { position: absolute; left: 50%; top: 46%; width: 112vw; aspect-ratio: 4 / 3; translate: -50% -50%; transform-origin: 46% 54%; will-change: transform; }
  .layer img { display: block; width: 100%; height: 100%; }
  .caption { position: absolute; left: var(--s5); top: var(--s5); width: 33vw; padding: var(--s3) var(--s4); animation: lift 0.8s var(--settle) 0.35s both; }
  .caption .head { margin: 0; text-wrap: balance; }
  .caption .head .em { color: var(--accent); }
  .caption .body { margin: var(--s1) 0 0; color: var(--muted); text-wrap: pretty; }
  .mask { display: block; overflow: hidden; padding: 0.1em 0.1em 0.25em; margin: -0.1em -0.1em -0.25em; }
  .mask > span { display: block; translate: 0 118%; animation: rise 0.7s var(--settle) both; animation-delay: calc(0.55s + var(--i) * 0.12s); }
  @keyframes rise { to { translate: 0 0; } }
  @keyframes lift { from { opacity: 0; translate: 0 6vh; } to { opacity: 1; translate: 0 0; } }
  .caption .body { animation: lift 0.7s var(--settle) 0.95s both; }
</style>
</head>
<body>
<div class="layer" id="far"><img src="/prompts/moves/demo/assets/photos/ridge-far.webp" alt=""></div>
<div class="layer" id="mid"><img src="/prompts/moves/demo/assets/photos/ridge-mid.webp" alt=""></div>
<div class="layer" id="near"><img src="/prompts/moves/demo/assets/photos/ridge-near.webp" alt=""></div>
<div class="caption card">
  <h1 class="head"><span class="mask" style="--i:0"><span>Depth from</span></span><span class="mask" style="--i:1"><span class="em">one photo.</span></span></h1>
  <p class="body">Three cuts, one push, one drift.</p>
</div>
<script type="module">
import '/core/engine/page-api.js';
import { curveToLinear, CURVES } from '/core/motion/springs.js';

document.documentElement.style.setProperty('--settle', curveToLinear(CURVES.expoOut));
// push: scale gained by the end; drift: sideways travel in vw. Near moves 3x or more than far on both.
const rig = { far: { push: 0.04, drift: 0.8 }, mid: { push: 0.13, drift: 2.4 }, near: { push: 0.30, drift: 7.0 } };
const dur = 3.4;
const ease = (u) => 0.5 * u + 0.5 * u * u * (3 - 2 * u);
const layers = Object.entries(rig).map(([id, v]) => [document.getElementById(id), v]);
vawe.onFrame((t) => {
  const p = ease(Math.min(1, Math.max(0, t / dur))), vw = innerWidth / 100;
  window.__rig = {};
  for (const [el, v] of layers) {
    const s = 1 + v.push * p, x = v.drift * vw * p;
    el.style.transform = `translate3d(${x.toFixed(3)}px, 0, 0) scale(${s.toFixed(5)})`;
    window.__rig[el.id] = { scale: s, x };
  }
});
</script>
</body>
</html>
