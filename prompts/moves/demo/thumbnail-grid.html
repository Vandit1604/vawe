<!doctype html>
<html data-aspect="16:9" data-look="swiss">
<head>
<meta charset="utf-8">
<meta name="duration" content="3.4">
<title>move: thumbnail grid</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; }
  #layers { position: absolute; inset: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; background: var(--ground); }
  .world { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .cell { position: absolute; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: calc(var(--u) * 8) calc(var(--u) * 10); background: var(--bg); color: var(--fg); }
  .cell .k { font: 500 calc(var(--u) * 4.4)/1 var(--label); letter-spacing: var(--label-track); text-transform: var(--label-case); opacity: 0.7; }
  .cell b { font: 700 calc(var(--u) * 34)/1 var(--sans); letter-spacing: -0.05em; }
  .cell .rail { height: calc(var(--u) * 1.6); background: color-mix(in srgb, var(--fg) 22%, transparent); }
  .cell .rail i { display: block; height: 100%; width: var(--fill); background: var(--fg); transform-origin: 0 50%; }
  .sel { position: absolute; border: calc(var(--u) * 5) solid var(--ink); pointer-events: none; }
  .title { position: absolute; left: var(--margin); top: calc(var(--u) * 3.6); display: flex; align-items: center; gap: var(--s2); z-index: 2; }
  .title h1 { margin: 0; font: 700 var(--t-lead)/1 var(--sans); letter-spacing: -0.03em; }
  .title .pill { font-family: var(--mono); }
</style>
</head>
<body>
<template id="scene">
  <div class="layer">
    <div class="world"></div>
    <div class="title"><h1>All projects</h1><span class="pill">9</span></div>
  </div>
</template>
<div id="layers"></div>
<script type="module">
import '/core/engine/page-api.js';
import { easeFn } from '/core/motion/presets.js';
const W = innerWidth, H = innerHeight, u = H / 100, N = 8, FRAME = 1 / 60, clamp = (v) => Math.min(1, Math.max(0, v));
const settle = easeFn('settle'), land = easeFn('land');
const AT = 0.7, DUR = 1.5, S_END = 0.24, GAP = 6 * u;   // the pull back: one eased move in log space, no push after it
const SCENES = [   // [column, row, label, big, background, ink, fill]; the middle one is the shot we start in
  [0, 0, 'Launch film', '41 s', '--surface', '--ink', 0.8], [1, 0, 'Brand kit', '12', '--paper', '--paper-ink', 0.4], [2, 0, 'Pricing', '$9', '--raised', '--ink', 0.6],
  [0, 1, 'Docs site', '128', '--paper', '--paper-ink', 0.7], [1, 1, 'Q3 renders', '12,480', '--accent', '--on-accent', 0.55], [2, 1, 'Support', '99.9%', '--surface', '--ink', 0.9],
  [0, 2, 'Pipeline', '3x', '--raised', '--ink', 0.3], [1, 2, 'Changelog', '24', '--surface', '--ink', 0.5], [2, 2, 'Roadmap', 'Q4', '--paper', '--paper-ink', 0.65],
];
const host = document.getElementById('layers');
const layers = Array.from({ length: N }, (_, j) => {
  const el = document.createElement('div');
  el.append(...document.getElementById('scene').content.cloneNode(true).firstElementChild.children);
  el.className = 'layer'; el.style.opacity = 1 / (j + 1);   // stacked at 1, 1/2, 1/3 ...: copies at shutter times average into one exposure
  host.append(el);
  const world = el.querySelector('.world');
  const cells = SCENES.map(([c, r, k, big, bg, fg, fill]) => {
    const cell = document.createElement('div'); cell.className = 'cell';
    cell.style.cssText = `--bg: var(${bg}); --fg: var(${fg}); --fill: ${fill * 100}%; left: ${(c - 1) * (W + GAP) - W / 2}px; top: ${(r - 1) * (H + GAP) - H / 2}px; width: ${W}px; height: ${H}px`;
    cell.innerHTML = `<span class="k">${k}</span><b>${big}</b><div class="rail"><i></i></div>`;
    world.append(cell);
    return cell;
  });
  const sel = document.createElement('div'); sel.className = 'sel';
  sel.style.cssText = `left: ${-W / 2 - 5 * u}px; top: ${-H / 2 - 5 * u}px; width: ${W + 10 * u}px; height: ${H + 10 * u}px`;
  world.append(sel);
  const title = el.querySelector('.title'); title.style.left = `${(W - (3 * W + 2 * GAP) * S_END) / 2}px`;   // the title sits on the grid's left edge
  return { el, world, cells, sel, title };
});
const P = (t) => settle(clamp((t - AT) / DUR));
vawe.onFrame((t) => {
  const moving = Math.abs(P(t + FRAME) - P(t - FRAME)) > 1e-5;
  layers.forEach((l, j) => {
    const tj = t + (j / (N - 1) - 0.5) * 0.5 * FRAME;   // 180 degree shutter
    const p = P(tj), s = Math.exp(Math.log(S_END) * p);   // log path: the same share of the way every frame
    l.el.style.visibility = j === 0 || moving ? 'visible' : 'hidden';
    l.world.style.transform = `scale(${s})`;
    const r = 7 * u * p;   // world units: the shot we start in has square corners
    l.cells.forEach((c, i) => { c.style.borderRadius = `${r}px`; c.querySelector('i').style.transform = `scaleX(${i === 4 ? 0.35 + 0.65 * clamp(tj / 0.7) : 1})`; });
    l.sel.style.borderRadius = `${r + 5 * u}px`;
    l.sel.style.opacity = land(clamp((tj - 2.1) / 0.3));
    const e = land(clamp((tj - 2.0) / 0.45));
    l.title.style.opacity = e; l.title.style.transform = `translateY(${(1 - e) * -2 * u}px)`;
  });
});
</script>
</body>
</html>
