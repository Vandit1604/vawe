<!doctype html>
<html data-aspect="16:9" data-look="swiss">
<head>
<meta charset="utf-8">
<meta name="duration" content="1.6">
<meta name="blank" content="0-0.13">
<title>move: blur word cascade</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  @font-face { font-family: 'Instrument Serif'; font-style: italic; font-display: block; src: url('/assets/fonts/InstrumentSerif-Italic.woff2') format('woff2'); }
  body { display: block; position: relative; }
  p { position: absolute; left: 9vw; top: 50vh; translate: 0 -50%; margin: 0; width: 78vw; font: 600 calc(var(--u) * 16)/1.02 var(--sans); letter-spacing: -0.052em; text-wrap: balance; }

  /* no mask and no clip: each word resolves in place, so nothing can cut a descender */
  .w { display: inline-block; opacity: 0; filter: blur(0.14em); translate: 0 0.22em;
       animation-name: resolve; animation-duration: 0.8s; animation-delay: calc(0.12s + var(--i) * 0.09s);
       animation-timing-function: var(--soft); animation-fill-mode: both; }
  /* the word that carries the line changes face, not colour; 1.14em matches the serif's x-height to the grotesk's, and /0.9 keeps the line box at 1.02 */
  .w.hot { font: italic 400 1.14em/0.9 'Instrument Serif', serif; letter-spacing: -0.02em; }
  /* opacity finishes before the blur does, so a word is readable while it is still soft */
  @keyframes resolve { 45% { opacity: 1; } to { opacity: 1; filter: blur(0); translate: 0 0; } }
</style>
</head>
<body>
<p id="line">Motion that reads like it was designed by hand</p>
<script type="module">
import { EASE } from '/core/motion/presets.js';
document.documentElement.style.setProperty('--soft', EASE.land);
const line = document.getElementById('line');
line.innerHTML = line.textContent.split(' ').map((t, i) => `<span class="w${t === 'hand' ? ' hot' : ''}" style="--i:${i}">${t}</span>`).join(' ');
</script>
</body>
</html>
