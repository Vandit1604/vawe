<!doctype html>
<html data-aspect="16:9" data-look="editorial" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="duration" content="5">
<title>move: letter 3d swap</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<script type="application/json" id="authoring">{"allow": ["text-unreadable-hold", "text-moves-before-hold", "static-window@4.0-4.6", "world-held@0.0-5.0"], "_why": {"text-unreadable-hold": "each phrase holds 1.0 s or more between rolls in a 5 s clip, and the check asks 5.4 s", "text-moves-before-hold": "the line leaves at 4.6 s, 0.4 s before the 5 s end, short of the 5.4 s the check asks", "static-window@4.0-4.6": "the last phrase holds 0.6 s as a still row of blocks", "world-held@0.0-5.0": "one row of letter blocks holds 5.0 s: two rolls at 0.5 s and 2.3 s"}}</script>
<style>
  body { display: block; position: relative; }
  :root { --cube: calc(var(--u) * 24); --depth: calc(var(--u) * 24); }
  .row { position: absolute; left: 0; right: 0; top: calc(50% - var(--cube) / 2); display: flex; justify-content: center; gap: calc(var(--u) * 0.9); }
  .cell { position: relative; width: calc(var(--cube) * 0.6); height: var(--cube); perspective: calc(var(--cube) * 3.6); }
  .cell.gap { width: calc(var(--cube) * 0.3); }
  .block { position: absolute; inset: 0; transform-style: preserve-3d; transform: translateZ(calc(var(--depth) / -2)); }
  .face { position: absolute; inset: 0; display: grid; place-items: center; backface-visibility: hidden; border-radius: calc(var(--u) * 1.2);
          background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line), inset 0 calc(var(--u) * 0.3) 0 rgba(255, 255, 255, 0.9);
          font: 400 calc(var(--cube) * 0.78)/1 var(--sans); letter-spacing: -0.02em; }
  .shade { position: absolute; inset: 0; border-radius: inherit; background: #1b1713; opacity: 0; }
  .f1 .shade, .f2 .shade { opacity: 0.5; }
  .f0 { transform: translateZ(calc(var(--depth) / 2)); }
  .f1 { transform: rotateX(-90deg) translateZ(calc(var(--depth) / 2)); }
  .f2 { transform: rotateX(-180deg) translateZ(calc(var(--depth) / 2)); }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script type="module">
import '/core/engine/page-api.js';
import { springLinear, springDuration } from '/core/motion/springs.js';
import { leave, arrive } from '/prompts/moves/demo/assets/stage.js';

const PHRASES = ['rough draft', 'final print', 'live today'];
const K = 160, D = 25, STAGGER = 40, ROLLS = [500, 2300];   // spring stiffness and damping, ms between letters, ms each roll starts
const pad = (s) => s.padStart(11, ' ');
const row = document.getElementById('row');
const spring = { duration: springDuration(K, D) * 1000, easing: springLinear(K, D), fill: 'forwards' };
const shade = (face, from, to, at) => face.querySelector('.shade').animate([{ opacity: from }, { opacity: to }], { delay: at, duration: spring.duration, easing: springLinear(K, D), fill: 'forwards' });

const cells = [...pad(PHRASES[0])].map((_, i) => {
  const cell = document.createElement('div');
  cell.className = 'cell' + (pad(PHRASES[0])[i] === ' ' ? ' gap' : '');
  cell.innerHTML = '<div class="block">' + PHRASES.map((p, n) => `<div class="face f${n}"><span>${pad(p)[i].trim()}</span><i class="shade"></i></div>`).join('') + '</div>';
  row.append(cell);
  return cell;
});
cells.forEach((cell, i) => {
  const block = cell.querySelector('.block');
  const faces = [...cell.querySelectorAll('.face')];
  ROLLS.forEach((at, r) => {
    const start = at + i * STAGGER;
    block.animate([{ transform: `translateZ(calc(var(--depth) / -2)) rotateX(${90 * r}deg)` }, { transform: `translateZ(calc(var(--depth) / -2)) rotateX(${90 * (r + 1)}deg)` }], { delay: start, ...spring });
    shade(faces[r], 0, 0.5, start);
    shade(faces[r + 1], 0.5, 0, start);
  });
});
arrive(row, 100, { ms: 260, from: '0.8vh' });
leave(row, 5000);
</script>
</body>
</html>
