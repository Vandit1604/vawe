<!doctype html>
<html data-aspect="16:9" data-look="swiss">
<head>
<meta charset="utf-8">
<meta name="duration" content="1.8">
<title>move: letter 3d swap</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; position: relative; }
  #t { position: absolute; left: 9vw; top: 50vh; translate: 0 -50%; width: 82vw; font: 700 calc(var(--u) * 12)/1 var(--sans); letter-spacing: -0.03em; text-transform: lowercase; color: var(--ink); background: var(--ground); }
  .l3 { display: flex; flex-wrap: wrap; position: relative; }
  .l3-word { display: inline-flex; }
  .l3-box { transform-style: preserve-3d; }
  .l3-face { backface-visibility: hidden; height: 1lh; background: var(--ground); color: var(--ink); }
  .l3-front { position: relative; }
  .l3-second { position: absolute; top: 0; left: 0; }
  .l3-space { white-space: pre; }
</style>
</head>
<body>
<p id="t"></p>
<script type="module">
import '/core/engine/page-api.js';
import { motionSpringEasing } from '/core/motion/motion-spring.js';
import { rng } from '/core/motion/springs.js';

const graphemes = (s) => Array.from(new Intl.Segmenter('en', { granularity: 'grapheme' }).segment(s), (x) => x.segment);
const make = (cls, parent, text) => {
  const e = document.createElement('span');
  e.className = cls;
  if (text !== undefined) e.textContent = text;
  parent?.append(e);
  return e;
};

const SECOND_FACE = {
  top: 'rotateX(-90deg) translateZ(0.5lh)',
  right: 'rotateY(90deg) translateX(50%) rotateY(-90deg) translateX(-50%) rotateY(-90deg) translateX(50%)',
  bottom: 'rotateX(90deg) translateZ(0.5lh)',
  left: 'rotateY(90deg) translateX(50%) rotateY(-90deg) translateX(50%) rotateY(-90deg) translateX(50%)',
};
const ROTATE = { top: 'rotateX(90deg)', right: 'rotateY(90deg)', bottom: 'rotateX(-90deg)', left: 'rotateY(90deg)' };

function letter3dSwap(el, text, { rotateDirection = 'right', stagger = 0.05, from = 'first', spring = { stiffness: 300, damping: 30 }, at = 0, seed = 1 } = {}) {
  const vertical = rotateDirection === 'top' || rotateDirection === 'bottom';
  const front = vertical ? 'translateZ(0.5lh)' : rotateDirection === 'left' ? 'rotateY(90deg) translateX(50%) rotateY(-90deg)' : 'rotateY(-90deg) translateX(50%) rotateY(90deg)';
  const rand = rng(seed);
  const words = text.split(' ').map(graphemes);
  const total = words.reduce((n, w) => n + w.length, 0);
  const delayOf = (i) => {
    if (from === 'first') return i * stagger;
    if (from === 'last') return (total - 1 - i) * stagger;
    if (from === 'center') return Math.abs(Math.floor(total / 2) - i) * stagger;
    if (from === 'random') return Math.abs(Math.floor(rand() * total) - i) * stagger;
    return Math.abs(from - i) * stagger;
  };
  el.classList.add('l3');
  el.replaceChildren();
  const boxes = [];
  words.forEach((chars, w) => {
    const word = make('l3-word', el);
    chars.forEach((ch) => {
      const box = make('l3-box', word);
      box.style.transform = vertical ? 'translateZ(-0.5lh)' : 'rotateY(90deg) translateX(50%) rotateY(-90deg)';
      make('l3-face l3-front', box, ch).style.transform = front;
      make('l3-face l3-second', box, ch).style.transform = SECOND_FACE[rotateDirection];
      boxes.push(box);
    });
    if (w < words.length - 1) make('l3-space', word, ' ');
  });
  const delays = boxes.map((_, i) => delayOf(i));
  const { duration, easing } = motionSpringEasing(spring);
  const reset = (at + Math.max(...delays)) * 1000 + duration;
  boxes.forEach((box, i) => {
    box.animate([{ transform: box.style.transform }, { transform: ROTATE[rotateDirection] }], { delay: (at + delays[i]) * 1000, duration, easing, fill: 'both' });
    box.animate([{ transform: 'rotateX(0deg) rotateY(0deg)' }], { delay: reset, duration: 0, fill: 'forwards' });
  });
}

letter3dSwap(document.getElementById('t'), 'Set your mind to it', { rotateDirection: 'top', stagger: 0.03, spring: { stiffness: 160, damping: 25 }, at: 0.2 });
</script>
</body>
</html>
