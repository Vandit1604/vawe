<!doctype html>
<html data-aspect="16:9" data-look="brutal">
<head>
<meta charset="utf-8">
<meta name="duration" content="2">
<title>move: text as mask</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { position: relative; display: block; }
  .stage { position: absolute; left: 50%; top: 50%; translate: -50% -50%; transform-origin: 50% 50%; }
  /* the type is the window: transparent fill clipped to the glyphs, the scene is the background */
  .title { margin: 0; font: 900 calc(var(--u) * 33)/0.86 var(--sans); font-stretch: 125%; letter-spacing: -0.03em; text-transform: uppercase; text-align: left; white-space: nowrap;
           color: transparent; filter: drop-shadow(calc(var(--u) * 1.3) calc(var(--u) * 1.3) 0 #000);
           -webkit-background-clip: text; background-clip: text;
           background-repeat: no-repeat;
           background-image:
             url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 300' preserveAspectRatio='none'><path d='M0 300V170L90 120L170 190L270 90L360 170L450 110L540 200L640 100L730 180L830 130L920 190L1000 150V300Z' fill='%2312082e'/></svg>"),
             url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 300' preserveAspectRatio='none'><path d='M0 300V140L120 60L230 140L340 40L470 130L580 70L700 150L820 50L920 120L1000 90V300Z' fill='%23412166'/></svg>"),
             radial-gradient(circle at 50% 50%, #fffbe0 0 24%, #ffd25e 27% 40%, rgba(255, 150, 50, 0) 70%),
             radial-gradient(ellipse 60% 70% at 62% 70%, rgba(255, 120, 60, 0.9), rgba(255, 120, 60, 0) 72%),
             linear-gradient(180deg, #2a1c86 0%, #8b2fb0 34%, #ff5c7c 62%, #ffb04a 90%);
           background-size: 150% 34%, 130% 48%, 46% 92%, 100% 100%, 100% 100%;
           background-position: 0% 100%, 0% 100%, 62% 100%, 50% 100%, 0 0; }
  .title span { display: block; }
</style>
</head>
<body>
<div class="stage"><h1 class="title"><span>Golden</span><span>Hour</span></h1></div>
<script type="module">
import '/core/engine/page-api.js';
import { CURVES } from '/core/motion/springs.js';
const q = (s) => document.querySelector(s);
const title = q('.title'), stage = q('.stage');
const S = 3.2, t0 = 0.05, dur = 1.15, total = 2;

// the scene moves inside the fixed type: near ridge fastest, far ridge slower, the sun rises out of the far ridge
const lerp = (a, b, u) => a + (b - a) * u;
vawe.onFrame((t) => {
  const u = Math.min(1, Math.max(0, (t - t0) / dur)), p = CURVES.expoOut(u);
  const s = Math.exp(Math.log(S) * (1 - p));
  const k = Math.min(1, t / total);
  stage.style.scale = (s * (1 + 0.035 * k)).toFixed(4);
  const sunY = lerp(100, 46, CURVES.expoOut(Math.min(1, t / 1.8)));
  title.style.backgroundPosition = `${lerp(0, 22, k).toFixed(2)}% 100%, ${lerp(0, 12, k).toFixed(2)}% 100%, 62% ${sunY.toFixed(2)}%, 50% 100%, 0 0`;
});
</script>
</body>
</html>
