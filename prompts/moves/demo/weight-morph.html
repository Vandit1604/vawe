<!doctype html>
<html data-aspect="16:9" data-look="swiss">
<head>
<meta charset="utf-8">
<meta name="duration" content="1.2">
<title>move: weight morph</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  /* a real axis: Archivo carries wght 100 to 900, so the glyphs reshape instead of a fake bold via stroke */
  h1 { margin: 0; font: 200 calc(var(--u) * 18)/1 var(--sans); letter-spacing: -0.02em;
       animation-name: thicken; animation-duration: 0.9s; animation-delay: 0.15s;
       animation-timing-function: var(--settle); animation-fill-mode: both; }
  @keyframes thicken { to { font-weight: 900; letter-spacing: -0.04em; } }
  .rule { width: 0; height: calc(var(--u) * 0.7); border-radius: 999px; background: var(--accent); margin-top: var(--s2);
          animation-name: draw; animation-duration: 0.5s; animation-delay: 0.45s;
          animation-timing-function: var(--settle); animation-fill-mode: both; }
  @keyframes draw { to { width: calc(var(--u) * 39); } }
</style>
</head>
<body>
<div><h1>weight</h1><div class="rule"></div></div>
<script type="module">
import { EASE } from '/core/motion/presets.js';
document.documentElement.style.setProperty('--settle', EASE.land);
</script>
</body>
</html>
