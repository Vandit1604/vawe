<!doctype html>
<html data-aspect="16:9" data-look="editorial">
<head>
<meta charset="utf-8">
<meta name="duration" content="5">
<title>move: grain field</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; position: relative; }
  .copy { position: absolute; left: 9vw; top: 50vh; translate: 0 -50%; width: 56vw; }
  .copy .title { margin: 0; font: 300 calc(var(--u) * 16)/1.02 var(--sans); letter-spacing: -0.04em; }
  .copy .lead { margin: calc(var(--u) * 4) 0 0; max-width: 20em; font: 400 calc(var(--u) * 4.8)/1.3 var(--sans); color: var(--muted); text-wrap: pretty; }

  .mask { display: block; overflow: hidden; padding: 0.1em 0.1em 0.25em; margin: -0.1em -0.1em -0.25em; }
  .mask > span { display: block; translate: 0 118%; animation: rise 0.7s var(--settle) both; animation-delay: calc(0.12s + var(--i) * 0.14s); }
  @keyframes rise { to { translate: 0 0; } }

  .w { display: inline-block; opacity: 0; filter: blur(0.14em); translate: 0 0.22em;
       animation: resolve 0.8s var(--soft) both; animation-delay: calc(0.5s + var(--i) * 0.09s); }
  @keyframes resolve { 45% { opacity: 1; } to { opacity: 1; filter: blur(0); translate: 0 0; } }
</style>
<script type="application/json" id="authoring">{"allow": ["text-unreadable-hold", "text-moves-before-hold", "world-held@0.0-5.0"], "_why": {"text-unreadable-hold": "the copy holds 2.6 s after its last word lands at 2.0 s in a 5 s clip, and the check asks 5.4 s", "text-moves-before-hold": "the copy leaves at 4.6 s, 0.4 s before the 5 s end, so it holds 2.6 s, short of the 5.4 s the check asks", "world-held@0.0-5.0": "one title holds 5.0 s: the grain turns over 24 times a second the whole clip and rises from 0.2 to 1.4 s, and the copy leaves at 4.6 s"}}</script>
</head>
<body>
<main class="copy" id="copy">
  <h1 class="title"><span class="mask" style="--i:0"><span>A ground</span></span><span class="mask" style="--i:1"><span>with a pulse.</span></span></h1>
  <p class="lead" id="lead">Film grain turns over 24 times a second on a flat tone.</p>
</main>
<script type="module">
import '/core/engine/page-api.js';
import { shaderField } from '/core/surfaces/shader-field.js';
import { EASE } from '/core/motion/presets.js';
import { leave } from '/prompts/moves/demo/assets/stage.js';

const root = document.documentElement;
root.style.setProperty('--settle', EASE.land);
root.style.setProperty('--soft', EASE.land);
const lead = document.getElementById('lead');
lead.innerHTML = lead.textContent.split(' ').map((t, i) => `<span class="w" style="--i:${i}">${t}</span>`).join(' ');

const tokens = getComputedStyle(root);
const rgb = (name) => { const h = tokens.getPropertyValue(name).trim(); return [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255); };

// A flat tone with one soft light from the top, and film grain that is a hash of the pixel cell and the frame number at 24 fps.
const frag = `
uniform vec3 u_ground, u_lift;
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7)) + u_seed * 17.0) * 43758.5453); }
void main() {
  float aspect = u_res.x / u_res.y;
  vec2 p = gl_FragCoord.xy / u_res.y;
  float key = smoothstep(1.0, 0.0, distance(p, vec2(0.6 * aspect, 1.1)) / 1.2);
  vec3 col = mix(u_ground, u_lift, key);
  float frame = floor(u_time * 24.0 + 0.001);
  vec2 cell = floor(gl_FragCoord.xy / 2.0) + vec2(frame * 17.31, frame * 5.77);
  float grain = hash(cell) + hash(cell + 41.7) - 1.0;
  float amp = 0.012 + 0.04 * smoothstep(0.2, 1.4, u_time);
  gl_FragColor = vec4(col + grain * amp, 1.0);
}`;

const field = shaderField(frag, { seed: 5, uniforms: { u_ground: rgb('--raised'), u_lift: rgb('--ground') } });
vawe.onFrame((t) => field.draw(t));
leave(document.getElementById('copy'), 5000);
</script>
</body>
</html>
