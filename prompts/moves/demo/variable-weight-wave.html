<!doctype html>
<html data-aspect="16:9" data-look="brutal">
<head>
<meta charset="utf-8">
<meta name="duration" content="2.4">
<meta name="blank" content="0-0.05">
<title>move: variable weight wave</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  /* Anybody carries wght 100 to 900 and wdth 75 to 125 (demo.css declares both ranges), so each letter reshapes: stems thicken and the glyph widens */
  h1 { margin: 0; display: flex; font: 300 calc(var(--u) * 24)/1 'Anybody', sans-serif; font-stretch: 80%; letter-spacing: -0.02em; }
  h1 span { display: block; animation-name: crest; animation-duration: 1.1s; animation-delay: calc(0.1s + var(--i) * 0.085s);
            animation-timing-function: linear; animation-fill-mode: both; }
  /* rest light and narrow, crest heavy and wide, settle at a firm weight: the wave is the letters passing the crest in turn */
  @keyframes crest {
    0%   { font-weight: 300; font-stretch: 80%; animation-timing-function: var(--rise); }
    38%  { font-weight: 900; font-stretch: 125%; animation-timing-function: var(--settle); }
    100% { font-weight: 640; font-stretch: 100%; }
  }
  .axes { margin-top: var(--s3); font: 500 var(--t-small)/1 var(--mono); letter-spacing: 0.04em; text-transform: uppercase;
          animation-name: fade; animation-duration: 0.4s; animation-delay: 0.5s; animation-timing-function: var(--settle); animation-fill-mode: both; }
  @keyframes fade { from { opacity: 0; translate: 0 0.3em; } }
</style>
</head>
<body>
<div><h1 id="word">Elastic</h1><div class="axes">wght 100 to 900 / wdth 75 to 125</div></div>
<script type="module">
import { curveToLinear, CURVES } from '/core/motion/springs.js';
const root = document.documentElement.style;
root.setProperty('--settle', curveToLinear(CURVES.expoOut));
root.setProperty('--rise', curveToLinear('easeInCubic'));
const w = document.getElementById('word');
w.innerHTML = [...w.textContent].map((c, i) => `<span style="--i:${i}">${c}</span>`).join('');
</script>
</body>
</html>
