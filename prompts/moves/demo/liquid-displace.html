<!doctype html>
<html data-aspect="16:9" data-look="field">
<head>
<meta charset="utf-8">
<meta name="duration" content="2.6">
<title>move: liquid displace</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  main { display: grid; justify-items: center; gap: var(--s3); }
  h1 { margin: 0; filter: url(#liquid); }
  .eyebrow { color: var(--muted); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="liquid" x="-10%" y="-30%" width="120%" height="160%" color-interpolation-filters="sRGB">
    <feTurbulence id="noise" type="fractalNoise" baseFrequency="0.004 0.02" numOctaves="2" seed="7" result="n"/>
    <feGaussianBlur in="n" stdDeviation="4" result="s"/>
    <feDisplacementMap id="disp" in="SourceGraphic" in2="s" scale="0" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<main>
  <h1 class="hero" id="title">Tidepool</h1>
  <p class="eyebrow lead" id="sub">Motion that settles</p>
</main>
<script type="module">
import '/core/engine/page-api.js';
import { CURVES } from '/core/motion/springs.js';
import { enter } from '/core/motion/presets.js';
const title = document.getElementById('title'), noise = document.getElementById('noise'), disp = document.getElementById('disp');
const vh = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--vh'));
const T0 = 0.05, DUR = 1.1;   // fully sharp at 1.15 s, then holds until 2.6 s
vawe.onFrame((t) => {
  const left = 1 - CURVES.expoOut(Math.min(1, Math.max(0, (t - T0) / DUR)));   // 1 at the start, 0 when settled
  const still = left < 0.002;
  disp.setAttribute('scale', (vh * 0.3 * left).toFixed(2));
  noise.setAttribute('baseFrequency', `${(0.004 + 0.012 * left).toFixed(5)} ${(0.02 + 0.03 * left).toFixed(5)}`);
  title.style.filter = still ? 'none' : 'url(#liquid)';
});
title.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, delay: 50, easing: 'linear', fill: 'both' });
enter(document.getElementById('sub'), { at: 1.2, band: 'professional', from: '0 0.4em' });
</script>
</body>
</html>
