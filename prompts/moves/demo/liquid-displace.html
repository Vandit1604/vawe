<!doctype html>
<html data-aspect="16:9" data-look="field">
<head>
<meta charset="utf-8">
<meta name="duration" content="2.6">
<title>move: liquid displace</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  main { display: grid; justify-items: center; gap: var(--s3); }
  .stack { display: grid; }
  .stack > h1 { grid-area: 1 / 1; margin: 0; }
  #title { filter: url(#liquid); }
  #clean { opacity: 0; }
  .eyebrow { color: var(--muted); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="liquid" x="-20%" y="-40%" width="140%" height="180%" color-interpolation-filters="sRGB">
    <feTurbulence id="noise" type="fractalNoise" baseFrequency="0.004 0.008" numOctaves="2" seed="7" result="n"/>
    <feGaussianBlur in="n" stdDeviation="8" result="s"/>
    <feDisplacementMap id="disp" in="SourceGraphic" in2="s" scale="0" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<main>
  <div class="stack">
    <h1 class="hero" id="title">Tidepool</h1>
    <h1 class="hero" id="clean" aria-hidden="true">Tidepool</h1>
  </div>
  <p class="eyebrow lead" id="sub">Motion that settles</p>
</main>
<script type="module">
import '/core/engine/page-api.js';
import { enter, easeFn } from '/core/motion/presets.js';
const title = document.getElementById('title'), clean = document.getElementById('clean'), noise = document.getElementById('noise'), disp = document.getElementById('disp');
const vh = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--vh'));
const T0 = 0.05, DUR = 1.1;   // the bend is gone by 1.15 s
const SWAP = 0.5, SWAP_LEN = 0.16;   // the unfiltered copy fades in over 0.5 to 0.66 s: the settle ends on plain type
vawe.onFrame((t) => {
  const left = 1 - easeFn('land')(Math.min(1, Math.max(0, (t - T0) / DUR)));   // 1 at the start, 0 when settled
  const swap = Math.min(1, Math.max(0, (t - SWAP) / SWAP_LEN));
  disp.setAttribute('scale', (vh * 0.3 * left ** 1.75).toFixed(2));
  noise.setAttribute('baseFrequency', `${(0.004 + 0.012 * left).toFixed(5)} ${(0.008 + 0.03 * left).toFixed(5)}`);
  clean.style.opacity = easeFn('swap')(swap).toFixed(3);
  title.style.opacity = swap >= 1 ? 0 : 1;
});
document.querySelector('.stack').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, delay: 50, easing: 'linear', fill: 'both' });
enter(document.getElementById('sub'), { at: 1.2, band: 'professional', from: '0 0.4em' });
</script>
</body>
</html>
