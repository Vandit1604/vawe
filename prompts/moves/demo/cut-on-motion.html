<!doctype html>
<html data-aspect="16:9">
<head>
<meta charset="utf-8">
<meta name="duration" content="1">
<title>move: cut on motion</title>
<style>
  :root { --paper: #f4f1ea; --ink: #14161a; --accent: #2b5cff; }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; }
  body { position: relative; font: 700 10vh/1 system-ui, sans-serif; }
  .scene { position: absolute; inset: 0; display: grid; align-content: end; padding: 0 6vw 10vh; }
  .before { color: var(--ink); }
  /* the cut is a step at 50%: the scene under the shape changes, the shape does not stop */
  .after { background: var(--ink); color: var(--paper);
           animation-name: cut; animation-duration: 1s; animation-timing-function: linear; animation-fill-mode: both; }
  @keyframes cut { 0%, 49.9% { opacity: 0; } 50%, 100% { opacity: 1; } }

  /* one shape, one path across both scenes; only its colour flips at the cut */
  .ball { position: absolute; top: 40vh; left: -12vh; width: 12vh; height: 12vh; border-radius: 50%; background: var(--accent);
          animation-name: travel, flip; animation-duration: 1s, 1s; animation-timing-function: var(--through), linear;
          animation-fill-mode: both, both; }
  /* a symmetric curve puts the shape mid-frame at peak speed exactly on the cut */
  @keyframes travel { to { translate: 118vw 0; } }
  @keyframes flip { 0%, 49.9% { background: var(--accent); } 50%, 100% { background: var(--paper); } }
</style>
</head>
<body>
<div class="scene before">before</div>
<div class="scene after">after</div>
<div class="ball"></div>
<script type="module">
import { curveToLinear } from '/core/motion/springs.js';
document.documentElement.style.setProperty('--through', curveToLinear((u) => u * u * (3 - 2 * u)));
</script>
</body>
</html>
