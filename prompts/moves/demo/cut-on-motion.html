<!doctype html>
<html data-aspect="16:9" data-look="brutal">
<head>
<meta charset="utf-8">
<meta name="duration" content="1">
<title>move: cut on motion</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { position: relative; display: block; }
  .scene { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: var(--s2); padding: 0 8vw calc(var(--u) * 11); }
  .scene .title { font-size: calc(var(--u) * 15); }
  .scene .lead { font-family: var(--mono); letter-spacing: -0.02em; }
  .before .lead { color: var(--muted); }
  /* the cut is a step at 50%: the scene under the shape changes, the shape does not stop */
  .after { background: var(--paper); color: var(--paper-ink); animation-name: cut; animation-duration: 1s; animation-timing-function: linear; animation-fill-mode: both; }
  .after .lead { color: var(--paper-muted); }
  @keyframes cut { 0%, 49.9% { opacity: 0; } 50%, 100% { opacity: 1; } }

  /* one shape, one path across both scenes; only its colour flips at the cut */
  .ball { position: absolute; top: calc(var(--u) * 38); left: calc(var(--u) * -14); width: calc(var(--u) * 14); height: calc(var(--u) * 14); border-radius: 50%; background: var(--accent);
          animation-name: travel, flip; animation-duration: 1s, 1s; animation-timing-function: var(--through), linear;
          animation-fill-mode: both, both; }
  /* a symmetric curve puts the shape mid-frame at peak speed exactly on the cut */
  @keyframes travel { to { translate: 118vw 0; } }
  @keyframes flip { 0%, 49.9% { background: var(--accent); } 50%, 100% { background: var(--paper-ink); } }
</style>
</head>
<body>
<div class="scene before"><div class="title">Draft cut</div><div class="lead">launch.html, 1080p, 30 fps</div></div>
<div class="scene after"><div class="title">Final render</div><div class="lead">launch.mp4, 4K, 60 fps</div></div>
<div class="ball"></div>
<script type="module">
import { curveToLinear } from '/core/motion/springs.js';
document.documentElement.style.setProperty('--through', curveToLinear((u) => u * u * (3 - 2 * u)));
</script>
</body>
</html>
