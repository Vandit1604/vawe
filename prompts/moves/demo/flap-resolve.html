<!doctype html>
<html data-aspect="16:9" data-look="product" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="duration" content="6">
<meta name="variants" content="dark">
<title>move: split-flap resolve</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<script type="application/json" id="authoring">{"allow": ["text-unreadable-hold", "text-moves-before-hold", "static-window@4.6-5.6", "world-held@0.0-6.0", "tile-run@0.5-4.6"], "_why": {"text-unreadable-hold": "the board holds 1.0 s after its last flip at 4.6 s in a 6 s clip, and the check asks 5.4 s", "text-moves-before-hold": "the board leaves at 5.6 s, so the settled board holds 1.0 s, short of the 5.4 s the check asks", "static-window@4.6-5.6": "split-flap board, 1.0 s from 4.6 s: a settled board holds still as the real one does, no part of it moves between changes", "world-held@0.0-6.0": "one departure board holds 6.0 s: the tiles flip from 0.5 s, one gate changes at 4.0 s and the board leaves at 5.6 s", "tile-run@0.5-4.6": "75 near-identical tiles flip from 0.5 s to 4.6 s: a flap board turns one tile at a time, each tile under 2% of the frame"}}</script>
<style>
  :root { --tw: calc(var(--u) * 8.2); --th: calc(var(--u) * 12.4); --gap: calc(var(--u) * 0.5); --glyph: #ece9df; --slat: #1f1f22; --slat-low: #1a1a1d; --plate: #0b0b0c; --frame: #151516; }
  body { font-family: 'Big Shoulders', 'Archivo', sans-serif; }
  .board { padding: calc(var(--u) * 2.6) calc(var(--u) * 4) calc(var(--u) * 4); border-radius: calc(var(--u) * 2); background: var(--frame); box-shadow: var(--win-shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.07); color: var(--glyph); }
  .labels, .row { display: flex; align-items: flex-end; gap: calc(var(--u) * 5); }
  .labels { height: calc(var(--u) * 4.6); padding-left: calc(var(--u) * 1.4); font: 600 calc(var(--u) * 2.2)/1 'Big Shoulders', sans-serif; letter-spacing: 0.14em; color: #a9a69c; }
  .rows { display: grid; gap: calc(var(--u) * 1.1); padding: calc(var(--u) * 1.4); border-radius: calc(var(--u) * 1); background: var(--plate); }
  .row { align-items: center; }
  .col { display: flex; gap: var(--gap); }
  .c-time { width: calc(var(--tw) * 4 + var(--gap) * 2 + var(--u) * 3.6); }
  .c-dest { width: calc(var(--tw) * 9 + var(--gap) * 8); }
  .c-gate { width: calc(var(--tw) * 2 + var(--gap)); }
  .colon { align-self: center; width: calc(var(--u) * 3.6); text-align: center; font: 700 calc(var(--u) * 8)/1 'Big Shoulders', sans-serif; color: var(--glyph); }
  .tile { position: relative; flex: none; width: var(--tw); height: var(--th); perspective: calc(var(--u) * 70); font: 700 calc(var(--u) * 11.6)/1 'Big Shoulders', sans-serif; }
  .h { position: absolute; left: 0; width: 100%; height: calc(50% - 0.5px); overflow: hidden; background: var(--slat); }
  .h.top { top: 0; border-radius: calc(var(--u) * 0.6) calc(var(--u) * 0.6) 0 0; }
  .h.bot { bottom: 0; border-radius: 0 0 calc(var(--u) * 0.6) calc(var(--u) * 0.6); background: var(--slat-low); }
  .g { position: absolute; left: 0; width: 100%; height: var(--th); display: grid; place-items: center; padding-top: calc(var(--u) * 0.3); }
  .bot .g { top: calc(var(--th) / -2 + 0.5px); }
  .shade { position: absolute; inset: 0; background: #000; opacity: 0; }
  .flap { position: absolute; z-index: 4; left: 0; top: 0; width: 100%; height: calc(50% - 0.5px); transform-origin: 50% 100%; transform-style: preserve-3d; }
  .flap .h { backface-visibility: hidden; top: 0; bottom: auto; height: 100%; }
  .flap .back { transform: rotateX(180deg); }
  .tile::after { content: ''; position: absolute; z-index: 6; left: 0; right: 0; top: calc(50% - 0.5px); height: 1px; background: var(--plate); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06); }
  .pin { position: absolute; z-index: 7; top: calc(50% - var(--u) * 0.6); width: calc(var(--u) * 0.55); height: calc(var(--u) * 1.2); background: var(--plate); }
  .pin.l { left: 0; border-radius: 0 calc(var(--u) * 0.3) calc(var(--u) * 0.3) 0; }
  .pin.r { right: 0; border-radius: calc(var(--u) * 0.3) 0 0 calc(var(--u) * 0.3); }
</style>
</head>
<body>
<div class="board">
  <div class="labels" data-chrome><span class="c-time">TIME</span><span class="c-dest">DESTINATION</span><span class="c-gate">GATE</span></div>
  <div class="rows"></div>
</div>
<script type="module">
import '/core/engine/page-api.js';
import { arrive, leave } from '/prompts/moves/demo/assets/stage.js';
const END = 6000, FLIP = 70, START = 500, COL_MS = 45, ROW_MS = 170, CHANGE_AT = 4000;
const LETTERS = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ', DIGITS = ' 0123456789';
const ROWS = [['0905', 'BERLIN', 'A3'], ['0915', 'LISBON', 'B7'], ['0930', 'OSLO', 'C2'], ['0945', 'DUBLIN', 'A9'], ['1005', 'ATHENS', 'B1']];
const board = document.querySelector('.board'), rows = document.querySelector('.rows');

const half = (cls) => { const d = document.createElement('div'); d.className = `h ${cls}`; d.innerHTML = '<b class="g"></b><i class="shade"></i>'; return d; };
const tileEl = () => {
  const el = document.createElement('div'); el.className = 'tile';
  const top = half('top'), bot = half('bot'), flap = document.createElement('div');
  flap.className = 'flap';
  const front = half('top front'), back = half('bot back');
  flap.append(front, back);
  el.append(top, bot, flap);
  el.insertAdjacentHTML('beforeend', '<span class="pin l"></span><span class="pin r"></span>');
  return { el, top, bot, flap, front, back };
};

const tiles = [];
ROWS.forEach(([time, dest, gate], r) => {
  const row = document.createElement('div'); row.className = 'row';
  const col = (cls) => { const c = document.createElement('div'); c.className = `col ${cls}`; row.append(c); return c; };
  const ct = col('c-time'), cd = col('c-dest'), cg = col('c-gate');
  const add = (c, ch, drum, i) => {
    const t = tileEl(); c.append(t.el);
    tiles.push({ ...t, drum, legs: [{ at: START + r * ROW_MS + i * COL_MS, from: 0, to: drum.indexOf(ch) }], cur: null });
  };
  [...time].forEach((ch, i) => { add(ct, ch, DIGITS, i); if (i === 1) ct.insertAdjacentHTML('beforeend', '<span class="colon">:</span>'); });
  [...dest.padEnd(9)].forEach((ch, i) => add(cd, ch, LETTERS, 4 + i));
  [...gate].forEach((ch, i) => add(cg, ch, i ? DIGITS : LETTERS, 13 + i));
  rows.append(row);
});

// one gate changes after the board settles: its digit drum turns on from 7 to 9
const gateTile = tiles[15 + 14];
gateTile.legs.push({ at: CHANGE_AT, from: gateTile.legs[0].to, to: DIGITS.indexOf('9') });

const set = (el, ch, shade) => { el.firstChild.textContent = ch; el.lastChild.style.opacity = shade; };
const stateAt = (tile, ms) => {
  const leg = tile.legs.filter((l) => ms >= l.at).pop();
  if (!leg) return { done: true, to: 0 };
  const len = tile.drum.length, steps = (leg.to - leg.from + len) % len, k = (ms - leg.at) / FLIP;
  if (k >= steps) return { done: true, to: leg.to };
  const n = Math.floor(k);
  return { done: false, p: k - n, a: (leg.from + n) % len, b: (leg.from + n + 1) % len };
};

// every tile is a pure function of t: the drum steps through its characters in order, one flap per character
vawe.onFrame((s) => {
  const ms = s * 1000;
  tiles.forEach((t) => {
    const st = stateAt(t, ms);
    const key = st.done ? `d${st.to}` : `${st.a}.${st.b}.${st.p.toFixed(3)}`;
    if (key === t.cur) return;
    t.cur = key;
    if (st.done) {
      const ch = t.drum[st.to];
      set(t.top, ch, 0); set(t.bot, ch, 0);
      t.flap.style.display = 'none';
      return;
    }
    const old = t.drum[st.a], next = t.drum[st.b], angle = 180 * st.p * st.p;
    t.flap.style.display = '';
    t.flap.style.transform = `rotateX(${-angle}deg)`;
    set(t.top, next, 0.38 * (1 - st.p));
    set(t.bot, old, 0.3 * st.p);
    set(t.front, old, angle < 90 ? 0.6 * (angle / 90) : 0);
    set(t.back, next, angle >= 90 ? 0.6 * (1 - (angle - 90) / 90) : 0);
  });
});

arrive(board, 100, { ms: 220, from: '0.8vh' });
leave(board, END);
</script>
</body>
</html>
