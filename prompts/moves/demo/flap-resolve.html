<!doctype html>
<html data-aspect="16:9">
<head>
<meta charset="utf-8">
<meta name="duration" content="1.2">
<title>move: split-flap resolve</title>
<style>
  @font-face { font-family: 'Archivo'; font-weight: 100 900; font-display: block; src: url('/assets/fonts/Archivo.woff2') format('woff2'); }
  :root { --ground: #16151a; --ink: #fff; --accent: #0a87ff; }
  html, body { margin: 0; height: 100%; background: var(--ground); overflow: hidden; }
  body { display: grid; place-items: center; font: 700 16vh/1 'Archivo', sans-serif; color: var(--ink); text-transform: uppercase; }
  h1 { margin: 0; display: flex; gap: 0.04em; }
  /* each cell is one glyph tall and clips a column of glyphs; steps() flips through them and stops on the last, the real letter */
  .cell { overflow: hidden; height: 1em; }
  .cell span { display: block; width: max-content; height: 1em; margin: 0 auto; }
</style>
</head>
<body>
<h1>Resolve</h1>
<script type="module">
import { rng } from '/core/motion/springs.js';
const h1 = document.querySelector('h1'), pool = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789', flips = 8;
const rand = rng(7);
const cells = [...h1.textContent].map((ch) => {
  const cell = document.createElement('div'), col = document.createElement('div');
  cell.className = 'cell';
  for (let i = 0; i < flips; i++) col.append(Object.assign(document.createElement('span'), { textContent: pool[Math.floor(rand() * pool.length)] }));
  col.append(Object.assign(document.createElement('span'), { textContent: ch }));
  cell.append(col);
  return cell;
});
h1.replaceChildren(...cells);
// the cell keeps the final glyph's width, so the word does not breathe while wider glyphs flip past
cells.forEach((cell) => { cell.style.width = `${cell.firstChild.lastChild.getBoundingClientRect().width}px`; });
// 55 ms per flip is one real flap board; 60 ms between cells resolves the word left to right
cells.forEach((cell, i) => cell.firstChild.animate(
  [{ translate: '0 0' }, { translate: `0 -${flips}em` }],
  { duration: flips * 55, delay: 100 + i * 60, easing: `steps(${flips}, end)`, fill: 'both' },
));
</script>
</body>
</html>
