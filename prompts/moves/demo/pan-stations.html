<!doctype html>
<html data-aspect="16:9" data-look="vawe">
<head>
<meta charset="utf-8">
<meta name="duration" content="2">
<title>move: pan stations</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; }
  .dots { position: absolute; left: 0; top: 0; width: 400vw; height: 100vh; background: radial-gradient(var(--dot) calc(var(--u) * 0.45), transparent calc(var(--u) * 0.55)) 0 0 / calc(var(--u) * 6) calc(var(--u) * 6); }
  .world { position: absolute; left: 0; top: 0; width: 300vw; height: 100vh; filter: url(#motion); }
  .rail { position: absolute; inset: 0; width: 300vw; height: 100vh; overflow: visible; }
  .rail path { fill: none; stroke: var(--ink); stroke-width: calc(var(--u) * 0.25); stroke-dasharray: calc(var(--u) * 1.2) calc(var(--u) * 1.2); opacity: 0.35; }
  .node { position: absolute; width: calc(var(--u) * 3.2); height: calc(var(--u) * 3.2); margin: calc(var(--u) * -1.6) 0 0 calc(var(--u) * -1.6); border-radius: 50%; background: var(--ground); box-shadow: inset 0 0 0 calc(var(--u) * 0.35) var(--ink); }
  .node i { position: absolute; inset: calc(var(--u) * 0.7); border-radius: 50%; background: var(--accent); transform: scale(0); }
  .station { position: absolute; width: 58vw; height: calc(var(--u) * 50); padding: var(--s5); display: flex; flex-direction: column; justify-content: space-between; }
  .station > div { max-width: 26vw; }
  .station .shot { position: absolute; top: var(--s3); right: var(--s3); bottom: var(--s3); width: 24vw; border-radius: var(--r-chip); overflow: hidden; }
  .station .shot img { border-radius: var(--r-chip); }
  .station .k { font: 700 var(--t-body)/1 var(--mono); color: var(--accent); letter-spacing: 0; }
  .station h2 { margin: 0; font: 400 var(--t-title)/0.98 var(--sans); letter-spacing: -0.02em; }
  .station p { margin: 0; font: 400 var(--t-lead)/1.2 var(--sans); color: var(--muted); }
</style>
</head>
<body>
<svg width="0" height="0" style="position: absolute"><filter id="motion" x="-10%" width="120%"><feGaussianBlur id="mb" stdDeviation="0 0"/></filter></svg>
<div class="dots"></div>
<div class="world">
  <svg class="rail"></svg>
  <div class="station card"><span class="k">01</span><figure class="shot" style="margin:0"><img class="photo" src="/prompts/moves/demo/assets/photos/desk.jpg" alt=""></figure><div><h2>Capture</h2><p>Record the real screen</p></div></div>
  <div class="station card"><span class="k">02</span><figure class="shot" style="margin:0"><img class="photo" src="/prompts/moves/demo/assets/photos/reel.jpg" alt=""></figure><div><h2>Cut</h2><p>Every cut lands on the beat</p></div></div>
  <div class="station card"><span class="k">03</span><figure class="shot" style="margin:0"><img class="photo" src="/prompts/moves/demo/assets/photos/meadow.jpg" alt=""></figure><div><h2>Ship</h2><p>Three aspects, one render</p></div></div>
</div>
<script type="module">
import '/core/engine/page-api.js';
import { CURVES } from '/core/motion/springs.js';
const W = innerWidth, H = innerHeight, vw = W / 100, vh = H / 100;
const world = document.querySelector('.world'), dots = document.querySelector('.dots'), blur = document.getElementById('mb');
// station centres on the canvas: each one a frame apart, stepping down then up so the pans are not one flat rail
const at = [{ x: 50, y: 50 }, { x: 150, y: 58 }, { x: 250, y: 44 }];   // vw, vh
const PANS = [0.5, 1.2], PAN = 0.42, DRIFT = 0.8;                       // pan starts (s), pan length (s), hold drift (vw per s)
const cards = [...document.querySelectorAll('.station')];
cards.forEach((c, i) => { c.style.left = `${at[i].x - 29}vw`; c.style.top = `${at[i].y - 29}vh`; });
// the rail runs node to node under the cards, past both ends, so every pan follows a line
const rail = document.querySelector('.rail'), NS = 'http://www.w3.org/2000/svg';
const pts = [{ x: -20, y: 80 }, ...at.map((p) => ({ x: p.x - 20, y: p.y + 36 })), { x: 320, y: 70 }];
const path = document.createElementNS(NS, 'path');
path.setAttribute('d', pts.map((p, i) => `${i ? 'L' : 'M'}${p.x * vw} ${p.y * vh}`).join(' '));
rail.append(path);
const nodes = at.map((p) => {
  const n = document.createElement('div'); n.className = 'node'; n.innerHTML = '<i></i>';
  n.style.left = `${p.x - 20}vw`; n.style.top = `${p.y + 36}vh`; world.append(n);
  return n.firstChild;
});
// quintic smoothstep: zero speed at both ends, so the camera leaves and lands each station without a jolt
const inout = (u) => u * u * u * (u * (u * 6 - 15) + 10);
const clamp = (u) => Math.min(1, Math.max(0, u));
const cam = (t) => {
  let k = 0;
  PANS.forEach((s) => { k += inout(clamp((t - s) / PAN)); });
  const i = Math.min(at.length - 2, Math.floor(k)), f = k - i;
  const x = at[i].x + (at[i + 1].x - at[i].x) * f, y = at[i].y + (at[i + 1].y - at[i].y) * f;
  return { x: x + DRIFT * t, y };
};
vawe.onFrame((t) => {
  const c = cam(t), n = cam(t + 1 / 60);
  const tx = (50 - c.x) * vw, ty = (50 - c.y) * vh;
  world.style.transform = `translate(${tx}px, ${ty}px)`;
  dots.style.transform = `translate(${tx * 0.55}px, ${ty * 0.55}px)`;   // the far layer moves at 55 percent
  blur.setAttribute('stdDeviation', `${(Math.abs(n.x - c.x) * vw * 0.35).toFixed(2)} 0`);
  // each station's node lights as the camera arrives on it
  const arrive = [0, PANS[0] + PAN * 0.8, PANS[1] + PAN * 0.8];
  nodes.forEach((d, i) => { d.style.transform = `scale(${CURVES.spring(clamp((t - arrive[i]) / 0.5)).toFixed(3)})`; });
});
</script>
</body>
</html>
