<!doctype html>
<html data-aspect="16:9" data-look="dusk">
<head>
<meta charset="utf-8">
<meta name="duration" content="1.1">
<title>move: spotlight dim</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { position: relative; display: block; }

  .tile { position: absolute; width: 35vw; height: calc(var(--u) * 34); padding: var(--s4) var(--s4); border-radius: calc(var(--u) * 3); background: var(--surface); box-shadow: var(--shadow-card); }
  .tile h2 { margin: 0 0 var(--s3); font: 500 var(--t-body)/1 var(--sans); color: var(--muted); }
  .tile b { display: block; font: 700 calc(var(--u) * 14)/1 var(--sans); letter-spacing: -0.045em; }
  .tile p { margin: var(--s1) 0 0; font: 500 var(--t-small)/1.2 var(--sans); color: var(--faint); }
  .t1 { left: 14vw; top: calc(var(--u) * 14); } .t2 { left: 51vw; top: calc(var(--u) * 14); } .t3 { left: 14vw; top: calc(var(--u) * 52); } .t4 { left: 51vw; top: calc(var(--u) * 52); }
  /* the hole is the spotlight: its shadow is the dim, so nothing but the target is left lit */
  .hole { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; border-radius: 0; box-shadow: 0 0 0 100vmax var(--dim); pointer-events: none; }
</style>
</head>
<body>
<div class="tile t1"><h2>Renders today</h2><b>128</b><p>14 since 9:00</p></div>
<div class="tile t2"><h2>Median render</h2><b>41 s</b><p>Last 7 days</p></div>
<div class="tile t3"><h2>Uptime, 30 days</h2><b>99.98%</b><p>One incident, 4 min</p></div>
<div class="tile t4"><h2>In queue</h2><b>3</b><p>Next starts in 12 s</p></div>
<div class="hole"></div>
<script type="module">
import { curveToLinear, CURVES } from '/core/motion/springs.js';
const settle = curveToLinear(CURVES.expoOut);
const pad = '0.6vh';
document.querySelector('.hole').animate([
  { left: '0px', top: '0px', width: '100vw', height: '100vh', borderRadius: '0px' },
  { left: `calc(14vw - ${pad})`, top: `calc(52vh - ${pad})`, width: `calc(35vw + 2 * ${pad})`, height: `calc(34vh + 2 * ${pad})`, borderRadius: '3.6vh' }],
  { duration: 800, delay: 150, easing: settle, fill: 'both' });
// the lit tile leans in a little, on the same curve
document.querySelector('.t3').animate([{ scale: 1 }, { scale: 1.04 }], { duration: 800, delay: 150, easing: settle, fill: 'both' });
</script>
</body>
</html>
