<!doctype html>
<html data-aspect="16:9">
<head>
<meta charset="utf-8">
<meta name="duration" content="1.25">
<title>move: match cut</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  :root { --paper: #ecebf1; }
  body { position: relative; display: block; }

  .shot { position: absolute; inset: 0; }
  .b { background: var(--paper); color: var(--ground); opacity: 0; }
  /* the same ring in both shots: same centre, radius, stroke and angle; only the ground and the meaning change */
  .ring { position: absolute; left: 33vw; top: 50vh; width: calc(var(--u) * 44); height: calc(var(--u) * 44); margin: calc(var(--u) * -22) 0 0 calc(var(--u) * -22); overflow: visible; }
  .ring circle { fill: none; stroke-width: 9; stroke-linecap: round; }
  .a .ring circle { stroke: var(--ink); }
  .b .ring circle { stroke: var(--ground); }
  .label { position: absolute; left: 33vw; top: 50vh; translate: -50% -50%; font: 700 calc(var(--u) * 11)/1 var(--sans); letter-spacing: -0.045em; }
  .side { position: absolute; left: 58vw; top: calc(var(--u) * 41); }
  .side h2 { margin: 0 0 var(--s2); font: 700 var(--t-title)/1 var(--sans); letter-spacing: -0.035em; }
  .side p { margin: 0; font: 500 var(--t-body)/1 var(--mono); letter-spacing: -0.03em; color: #6b6a72; }
  .a .side p { color: var(--muted); }
</style>
</head>
<body>
<section class="shot a">
  <svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" pathLength="100" stroke-dasharray="28 72"/></svg>
  <div class="side"><h2>Rendering</h2><p>launch-16x9, 60 fps</p></div>
</section>
<section class="shot b">
  <svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" pathLength="100" stroke-dasharray="28 72"/></svg>
  <div class="label">41 s</div>
  <div class="side"><h2>Rendered</h2><p>launch-16x9, 60 fps</p></div>
</section>
<script type="module">
import { curveToLinear, CURVES } from '/core/motion/springs.js';
const settle = curveToLinear(CURVES.expoOut);
const T = 1250, cut = 500;
// the cut is a one-millisecond step at 0.5 s; the ring's angle is one animation shared by both rings, so it cannot jump
document.querySelector('.b').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 1, delay: cut, fill: 'both' });
const spin = [{ rotate: '0deg' }, { rotate: '220deg', offset: cut / T, easing: settle }, { rotate: '272deg' }];
document.querySelectorAll('.ring').forEach((r) => r.animate(spin, { duration: T, fill: 'both' }));
// shot B: the arc closes into a full ring as the number lands
const arc = document.querySelector('.b circle');
arc.animate([{ strokeDasharray: '28 72' }, { strokeDasharray: '100 0' }], { duration: 1000, delay: cut, easing: settle, fill: 'both' });
document.querySelector('.b .label').animate([{ opacity: 0, translate: '-50% -30%' }, { opacity: 1, translate: '-50% -50%' }],
  { duration: 700, delay: cut + 60, easing: settle, fill: 'both' });
document.querySelector('.b .side').animate([{ opacity: 0, translate: '3vw 0' }, { opacity: 1, translate: '0 0' }],
  { duration: 800, delay: cut + 120, easing: settle, fill: 'both' });
</script>
</body>
</html>
