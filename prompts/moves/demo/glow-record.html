<!doctype html>
<html data-aspect="16:9" data-look="vawe">
<head>
<meta charset="utf-8">
<meta name="duration" content="3.8">
<title>move: glow record</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  :root { --red: #ff1f33; }
  body { display: block; position: relative; }
  #host { position: absolute; inset: 0; }
  .shot { position: absolute; inset: 0; background: var(--ground); }
  .a .win { position: absolute; left: 12vw; right: 12vw; top: calc(var(--u) * 7); bottom: calc(var(--u) * 7); padding: var(--s4) var(--s5); }
  .a .bar { display: flex; justify-content: space-between; align-items: center; height: calc(var(--u) * 10); margin-bottom: var(--s3); }
  .a .bar .head { font-size: var(--t-head); }
  .a .bell { position: relative; width: calc(var(--u) * 7.5); height: calc(var(--u) * 7.5); color: var(--ink); }
  .a .bell svg { width: 100%; height: 100%; }
  .badge { position: absolute; right: calc(var(--u) * -1.6); top: calc(var(--u) * -1.2); width: calc(var(--u) * 4.4); height: calc(var(--u) * 4.4); border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font: 700 calc(var(--u) * 2.6) / 1 var(--sans); overflow: hidden; }
  .badge span { position: absolute; }
  .a .list { display: grid; gap: var(--s2); }
  .row { display: flex; align-items: center; gap: var(--s3); height: calc(var(--u) * 17); padding: 0 var(--s4); border-radius: var(--r4); background: var(--raised); box-shadow: var(--ring); }
  .row .avatar { --size: calc(var(--u) * 10); }
  .row .txt { flex: 1; }
  .row b { display: block; font: 600 var(--t-body)/1.2 var(--sans); margin-bottom: calc(var(--u) * 0.8); }
  .row .sub { color: var(--muted); font: 500 var(--t-small)/1.2 var(--sans); }
  .row .time { color: var(--faint); font: 500 var(--t-small)/1 var(--sans); }
  .b { visibility: hidden; }
  .b .rec { position: absolute; left: 8vw; top: calc(var(--u) * 6); height: calc(var(--u) * 9); display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s4) 0 var(--s2); border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-card); font: 600 var(--t-lead)/1 var(--mono); letter-spacing: 0.02em; }
  .b .rec .slot { width: calc(var(--u) * 3); height: calc(var(--u) * 3); margin-left: calc(var(--u) * 1); }
  .b .rec small { font: 500 var(--t-body)/1 var(--mono); color: var(--muted); }
  .b .stop { position: absolute; right: 8vw; top: calc(var(--u) * 6.5); padding: calc(var(--u) * 2.4) var(--s4); }
  .b .view { position: absolute; left: 8vw; right: 8vw; top: calc(var(--u) * 20); height: calc(var(--u) * 52); border-radius: var(--r-card); background: linear-gradient(135deg, #1a2447 0%, #2c3b73 50%, #1a1f3a 100%); box-shadow: var(--shadow-hero); overflow: hidden; }
  .b .view .sk { position: absolute; border-radius: var(--r2); background: rgba(255, 255, 255, 0.09); }
  .b .view .tag { position: absolute; left: 50%; bottom: calc(var(--u) * 5); transform: translateX(-50%); }
  .b .view i { position: absolute; width: calc(var(--u) * 5); height: calc(var(--u) * 5); border: 0 solid rgba(255, 255, 255, 0.6); }
  .b .wave { position: absolute; left: 8vw; right: 8vw; bottom: calc(var(--u) * 7); height: calc(var(--u) * 8); display: flex; align-items: center; gap: calc(var(--u) * 0.7); }
  .b .wave i { flex: 1; border-radius: 999px; background: var(--faint); height: 100%; transform-origin: 50% 50%; }
  #flood, #body { position: absolute; inset: 0; pointer-events: none; }
  #body { z-index: 4; }
  #flood { z-index: 5; mix-blend-mode: screen; }
  #dot { position: absolute; z-index: 6; border-radius: 50%; background: var(--red); }
</style>
</head>
<body>
<div id="host">
  <section class="shot a" id="a"><div class="win card">
    <div class="bar"><div class="head title">Inbox</div><div class="bell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17h12l-1.5-2V10a4.5 4.5 0 0 0-9 0v5z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><div class="badge" id="badge"><span id="n2">2</span><span id="n3">3</span></div></div></div>
    <div class="list">
      <div class="row"><div class="avatar">R</div><div class="txt"><b>Ravi, design</b><div class="sub">New cut is ready for review</div></div><div class="time">2m</div></div>
      <div class="row"><div class="avatar">S</div><div class="txt"><b>Studio</b><div class="sub">Your export finished</div></div><div class="time">1h</div></div>
      <div class="row"><div class="avatar">B</div><div class="txt"><b>Billing</b><div class="sub">Invoice 0412 was paid</div></div><div class="time">3h</div></div>
    </div>
  </div></section>
  <section class="shot b" id="b">
    <div class="rec"><div class="slot" id="slot"></div>REC <small id="tc">00:00</small></div>
    <div class="btn stop">Stop</div>
    <div class="view" id="view">
      <div class="sk" style="left: 5vw; top: calc(var(--u) * 6); width: 30vw; height: calc(var(--u) * 5)"></div>
      <div class="sk" style="left: 5vw; top: calc(var(--u) * 15); width: 52vw; height: calc(var(--u) * 3)"></div>
      <div class="sk" style="left: 5vw; top: calc(var(--u) * 21); width: 44vw; height: calc(var(--u) * 3)"></div>
      <div class="sk" style="right: 5vw; top: calc(var(--u) * 6); width: 18vw; height: calc(var(--u) * 28)"></div>
      <div class="pill tag">Recording your screen</div>
      <i style="left: 2.5vw; top: calc(var(--u) * 3); border-width: 2px 0 0 2px"></i><i style="right: 2.5vw; top: calc(var(--u) * 3); border-width: 2px 2px 0 0"></i><i style="left: 2.5vw; bottom: calc(var(--u) * 3); border-width: 0 0 2px 2px"></i><i style="right: 2.5vw; bottom: calc(var(--u) * 3); border-width: 0 2px 2px 0"></i>
    </div>
    <div class="wave" id="wave"></div>
  </section>
</div>
<div id="body"></div><div id="flood"></div><div id="dot"></div>
<script type="module">
import '/core/engine/page-api.js';
import { easeFn } from '/core/motion/presets.js';
const W = innerWidth, H = innerHeight, u = H / 100;
const clamp = (x) => Math.min(1, Math.max(0, x)), lerp = (p, q, k) => p + (q - p) * k;
const land = easeFn('land');
const $ = (id) => document.getElementById(id);
const body = $('body'), host = $('host'), a = $('a'), b = $('b'), flood = $('flood'), dot = $('dot'), badge = $('badge');
const wave = $('wave');
for (let i = 0; i < 48; i++) wave.appendChild(document.createElement('i'));
const bars = [...wave.children];
const bb = badge.getBoundingClientRect();
const SRC = { x: bb.left + bb.width / 2, y: bb.top + bb.height / 2, r: bb.width / 2 };   // the badge
const sl = $('slot').getBoundingClientRect();
const DST = { x: sl.left + sl.width / 2, y: sl.top + sl.height / 2, r: sl.width / 2 };   // the recording light
const FAR = Math.max(...[[0, 0], [W, 0], [0, H], [W, H]].map(([x, y]) => Math.hypot(SRC.x - x, SRC.y - y)));
const T = { pop: 0.55, wind: 1.2, flood: 1.35, floodDur: 0.35, hold: 0.08, gather: 0.8 };
const T_FULL = T.flood + T.floodDur, T_GATHER = T_FULL + T.hold, T_END = T_GATHER + T.gather;
const A = 1, BODY = 0.7, FEATHER = 0.2, RED = '255, 31, 51';
const R_FULL = (FAR * 1.02) / (1 - FEATHER);                  // the opaque core, R minus the feather, must reach the farthest corner
dot.style.width = dot.style.height = `${2 * DST.r}px`;
vawe.onFrame((t) => {
  // the badge: the count rolls 2 to 3, then it swells just before the light leaves it
  const roll = land(clamp((t - T.pop) / 0.2));
  $('n2').style.transform = `translateY(${-100 * roll}%)`;
  $('n3').style.transform = `translateY(${100 * (1 - roll)}%)`;
  const swell = 1 + 0.35 * Math.sin(Math.PI * 0.5 * clamp((t - T.wind) / (T.flood - T.wind)));
  badge.style.transform = `scale(${swell})`;
  // the light: a disc that leaves the badge, reaches the farthest corner in floodDur, holds a moment, then gathers into the recording light
  const e = land(clamp((t - T.flood) / T.floodDur)), g = land(clamp((t - T_GATHER) / T.gather));
  const cx = lerp(SRC.x, DST.x, g), cy = lerp(SRC.y, DST.y, g);
  const R = t < T_GATHER ? lerp(SRC.r, R_FULL, e) : lerp(R_FULL, DST.r, g);
  const f = Math.max(R * FEATHER, 0.25 * u);
  const live = t >= T.flood && t < T_END;
  const gel = (alpha) => live ? `radial-gradient(circle at ${cx}px ${cy}px, rgba(${RED}, ${alpha}) ${Math.max(R - f, 0)}px, rgba(${RED}, 0) ${R}px)` : 'none';
  flood.style.background = gel(A);
  body.style.background = gel(BODY);
  const lit = t >= T_GATHER ? 1 - g : (t >= T_FULL ? 1 : e);
  host.style.filter = `brightness(${(1 + 0.45 * lit).toFixed(3)})`;   // the frame over-exposes while the light is on it
  const swapped = t >= T_FULL;
  a.style.visibility = swapped ? 'hidden' : 'visible';
  b.style.visibility = swapped ? 'visible' : 'hidden';
  // the light ends as the recording dot: the same colour and size as the disc that gathered into it
  const beat = t > T_END ? 0.5 + 0.5 * Math.cos(2 * Math.PI * (t - T_END)) : 1;
  dot.style.left = `${DST.x - DST.r}px`; dot.style.top = `${DST.y - DST.r}px`;
  dot.style.opacity = t >= T_END - 0.05 ? (0.55 + 0.45 * beat).toFixed(3) : 0;
  const sec = Math.max(0, t - T_END);
  $('tc').textContent = `00:${String(Math.floor(sec)).padStart(2, '0')}`;
  const on = clamp((t - T_GATHER - 0.2) / 0.6);
  bars.forEach((el, i) => { el.style.transform = `scaleY(${(0.15 + 0.85 * Math.abs(Math.sin(i * 0.9 + t * 7) * Math.cos(i * 0.37 - t * 3))) * land(on)})`; });
});
</script>
</body>
</html>
