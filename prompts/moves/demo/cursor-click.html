<!doctype html>
<html data-aspect="16:9" data-look="daylight">
<head>
<meta charset="utf-8">
<meta name="duration" content="2">
<title>move: cursor click</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { position: relative; }
  .card { width: calc(var(--u) * 128); padding: calc(var(--u) * 5.6) calc(var(--u) * 6) calc(var(--u) * 5.6); }
  .head { display: flex; align-items: center; gap: var(--s3); }
  .file { position: relative; flex: none; width: calc(var(--u) * 12); height: calc(var(--u) * 15.6); border-radius: var(--r-chip); overflow: hidden; background: var(--surface); box-shadow: var(--ring), var(--stack); }
  .file img { height: 62%; border-radius: 0; }
  .file .logo-mark { position: absolute; left: calc(var(--u) * 1.4); bottom: calc(var(--u) * 1.3); width: calc(var(--u) * 3.4); height: calc(var(--u) * 3.4); color: var(--ink); }
  h1 { margin: 0; font: 700 var(--t-head)/1.1 var(--sans); letter-spacing: -0.025em; }
  .meta { margin: var(--s1) 0 0; font: 500 var(--t-body)/1.2 var(--sans); color: var(--muted); }
  .rule { margin: calc(var(--u) * 5) 0 calc(var(--u) * 4.4); }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .who { display: flex; align-items: center; gap: var(--s2); font: 500 var(--t-body)/1 var(--sans); color: var(--muted); }
  .who .avatar { --size: calc(var(--u) * 7.4); }
  .btn { position: relative; display: grid; place-items: center; min-width: calc(var(--u) * 38); padding: calc(var(--u) * 3) calc(var(--u) * 4.6); font-size: var(--t-lead); overflow: hidden; }
  .btn .l { grid-area: 1 / 1; display: flex; align-items: center; gap: var(--s2); white-space: nowrap; }
  .btn .l.done { opacity: 0; }
  .btn .l.done .icon { width: calc(var(--u) * 5.4); height: calc(var(--u) * 5.4); stroke: currentColor; stroke-width: 2.2; }
  .btn .l.done { color: var(--on-accent); }

  .cur { position: absolute; left: 0; top: 0; }
  .cur .y { will-change: transform; }
  .cur svg { display: block; width: calc(var(--u) * 6.4); height: calc(var(--u) * 6.4); transform-origin: 0 0; overflow: visible; }
  .cur path { fill: var(--cursor); stroke: var(--cursor-edge); stroke-width: 1.4; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="file"><img class="photo" src="/prompts/moves/demo/assets/photos/ridge.jpg"><span data-logo="northwind"></span></div>
    <div><h1>Q3 launch report</h1><p class="meta">Northwind, 14 pages, edited 2 min ago</p></div>
  </div>
  <div class="rule divider"></div>
  <div class="row"><div class="who"><div class="avatars"><div class="avatar"><img src="/prompts/moves/demo/assets/photos/av-david.jpg"></div><div class="avatar"><img src="/prompts/moves/demo/assets/photos/av-loft.jpg"></div><div class="avatar"><img src="/prompts/moves/demo/assets/photos/av-shore.jpg"></div></div>3 reviewers</div>
    <div class="btn"><span class="l idle">Export PDF</span><span class="l done"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Exported</span></div>
  </div>
</div>
<div class="cur"><div class="x"><div class="y"><svg viewBox="0 0 24 24"><path d="M2 2 L2 19 L6.6 14.8 L9.6 21.6 L12.6 20.3 L9.6 13.6 L15.8 13.4 Z"/></svg></div></div></div>
<script type="module">
import '/prompts/moves/demo/assets/logos.js';
import { EASE } from '/core/motion/presets.js';
const q = (s) => document.querySelector(s);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const W = innerWidth, H = innerHeight, b = q('.btn').getBoundingClientRect();
const from = { x: W * 0.16, y: H * 0.9 }, to = { x: b.left + b.width * 0.86, y: b.top + b.height * 0.72 };
const at = { go: 200, dur: 760, press: 1080, release: 1190 };

// x settles on expoOut while y follows a smoothstep, so the path bows like a hand, not a straight rail
q('.x').animate([{ translate: `${from.x}px 0` }, { translate: `${to.x}px 0` }], { duration: at.dur, delay: at.go, easing: EASE.land, fill: 'both' });
q('.y').animate([{ translate: `0 ${from.y}px` }, { translate: `0 ${to.y}px` }], { duration: at.dur, delay: at.go, easing: EASE.settle, fill: 'both' });
// hover as the cursor arrives, then the press: the cursor dips 14 percent, the button dips 3 percent and turns accent
q('.btn').animate([{ background: css('--raised') }, { background: css('--hover') }], { duration: 160, delay: 780, easing: 'linear', fill: 'both' });
q('.cur svg').animate([{ scale: 1 }, { scale: 0.86 }, { scale: 1 }], { duration: 230, delay: at.press, easing: EASE.landSoft, fill: 'both' });
q('.btn').animate([{ scale: 1 }, { scale: 0.965, offset: 0.4 }, { scale: 1 }], { duration: 300, delay: at.press, easing: EASE.landSoft, fill: 'both' });
q('.btn').animate([{ background: css('--hover') }, { background: css('--accent') }], { duration: 120, delay: at.press, easing: 'linear', fill: 'forwards' });
// the result: the label rolls up and the confirmed state rolls in
q('.idle').animate([{ translate: '0 0', opacity: 1 }, { translate: '0 -3.4vh', opacity: 0 }], { duration: 260, delay: at.release, easing: EASE.launch, fill: 'both' });
q('.done').animate([{ translate: '0 3.4vh', opacity: 0 }, { translate: '0 0', opacity: 1 }], { duration: 380, delay: at.release + 40, easing: EASE.landSoft, fill: 'both' });
// the cursor leaves faster than it came, accelerating out of the frame
q('.x').animate([{ translate: `${to.x}px 0` }, { translate: `${W * 1.06}px 0` }], { duration: 380, delay: 1560, easing: EASE.launch, fill: 'forwards' });
q('.y').animate([{ translate: `0 ${to.y}px` }, { translate: `0 ${H * 0.86}px` }], { duration: 380, delay: 1560, easing: EASE.launch, fill: 'forwards' });
</script>
</body>
</html>
