<!doctype html>
<html data-aspect="16:9" data-look="daylight">
<head>
<meta charset="utf-8">
<meta name="duration" content="1">
<title>move: push with directional blur</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { position: relative; display: block; }
  .under { position: absolute; left: 7vw; bottom: calc(var(--u) * 11); }
  .under .kicker { margin-bottom: var(--s2); font: 500 var(--t-body)/1 var(--mono); color: var(--muted); letter-spacing: -0.02em; }
  .panel { position: absolute; top: calc(var(--u) * 10); left: 46vw; width: 48vw; height: calc(var(--u) * 80); display: flex; flex-direction: column; justify-content: flex-end; gap: var(--s2);
           padding: var(--s5); border-radius: var(--r-card); background: var(--accent); color: var(--on-accent); filter: url(#motion);
           box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22); }
  .panel .title { font-size: calc(var(--u) * 13); }
  .panel .lead { color: color-mix(in srgb, var(--on-accent) 80%, transparent); }
  .panel .still { position: absolute; left: var(--s2); right: var(--s2); top: var(--s2); height: 50%; width: calc(100% - var(--s2) * 2); border-radius: calc(var(--r-card) - var(--s2)); --img-edge: rgba(255, 255, 255, 0.14); }
</style>
</head>
<body>
<svg width="0" height="0" style="position: absolute"><filter id="motion" x="-30%" width="160%"><feGaussianBlur id="mb" stdDeviation="0 0"/></filter></svg>
<div class="under"><div class="kicker">step 2 of 3</div><div class="title">Preview</div></div>
<div class="panel"><img class="photo still" src="/prompts/moves/demo/assets/photos/meadow.jpg"><div class="title">Publish</div><div class="lead">Ships in 3 aspects</div></div>
<script type="module">
import '/core/engine/page-api.js';
import { EASE, easeFn } from '/core/motion/presets.js';
const panel = document.querySelector('.panel'), blur = document.getElementById('mb');
const land = easeFn('land'), t0 = 0.1, dur = 0.7, travel = 0.6 * window.innerWidth;
panel.animate([{ translate: `${travel}px 0` }, { translate: '0 0' }],
  { duration: dur * 1000, delay: t0 * 1000, easing: EASE.land, fill: 'both' });
// SVG filters cannot be keyframed, so the blur follows the same curve per frame: half of one frame's travel, x only
vawe.onFrame((t) => {
  const u = Math.min(1, Math.max(0, (t - t0) / dur)), du = 1 / 240;
  const slope = (land(Math.min(1, u + du)) - land(u)) / du;
  const pxPerFrame = (slope / dur) * travel / 60;
  blur.setAttribute('stdDeviation', `${(u > 0 && u < 1 ? pxPerFrame * 0.5 : 0).toFixed(2)} 0`);
});
</script>
</body>
</html>
