<!doctype html>
<html data-aspect="16:9">
<head>
<meta charset="utf-8">
<meta name="duration" content="1">
<title>move: push with directional blur</title>
<style>
  :root { --paper: #f4f1ea; --ink: #14161a; --accent: #2b5cff; }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; }
  body { position: relative; font: 700 10vh/1 system-ui, sans-serif; color: var(--ink); }
  .under { position: absolute; left: 6vw; bottom: 10vh; }
  .panel { position: absolute; top: 12vh; left: 42vw; width: 52vw; height: 76vh; display: grid; place-items: center;
           background: var(--accent); color: #fff; filter: url(#motion); }
</style>
</head>
<body>
<svg width="0" height="0" style="position: absolute"><filter id="motion" x="-30%" width="160%"><feGaussianBlur id="mb" stdDeviation="0 0"/></filter></svg>
<div class="under">push</div>
<div class="panel">in</div>
<script type="module">
import '/core/engine/page-api.js';
import { curveToLinear, CURVES } from '/core/motion/springs.js';
const panel = document.querySelector('.panel'), blur = document.getElementById('mb');
const t0 = 0.1, dur = 0.7, travel = 0.6 * window.innerWidth;
panel.animate([{ translate: `${travel}px 0` }, { translate: '0 0' }],
  { duration: dur * 1000, delay: t0 * 1000, easing: curveToLinear(CURVES.expoOut), fill: 'both' });
// SVG filters cannot be keyframed, so the blur follows the same curve per frame: half of one frame's travel, x only
vawe.onFrame((t) => {
  const u = Math.min(1, Math.max(0, (t - t0) / dur)), du = 1 / 240;
  const slope = (CURVES.expoOut(Math.min(1, u + du)) - CURVES.expoOut(u)) / du;
  const pxPerFrame = (slope / dur) * travel / 60;
  blur.setAttribute('stdDeviation', `${(u > 0 && u < 1 ? pxPerFrame * 0.5 : 0).toFixed(2)} 0`);
});
</script>
</body>
</html>
