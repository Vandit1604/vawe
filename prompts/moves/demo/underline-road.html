<!doctype html>
<html data-aspect="16:9" data-look="product" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="duration" content="5">
<title>move: underline road</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<script type="application/json" id="authoring">{"allow": ["world-held@0.0-5.0", "text-unreadable-hold", "text-moves-before-hold", "static-window@3.6-4.9"], "_why": {"world-held@0.0-5.0": "one map screen: a route preview does not cut or pan, the route draws on the held map", "text-unreadable-hold": "the directions card shows from 3.2 s and holds 1.7 s, as a maps app holds its result", "text-moves-before-hold": "the card arrives at 3.2 s and the map holds still after it, as the product does", "static-window@3.6-4.9": "the finished route holds still and only the start dot pulses, as a maps app does"}}</script>
<style>
  body { display: block; background: #f1efe9; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; }
  #map text { font-family: 'Inter', system-ui, sans-serif; paint-order: stroke fill; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
  .box { position: absolute; background: #fff; color: #202124; border-radius: calc(var(--u) * 1.4); box-shadow: 0 1px 2px rgba(60, 64, 67, 0.3), 0 2px 6px 2px rgba(60, 64, 67, 0.15); font-family: 'Inter', system-ui, sans-serif; }
  .dirs { left: calc(var(--u) * 3); top: calc(var(--u) * 3); width: calc(var(--u) * 62); padding: calc(var(--u) * 1.8) calc(var(--u) * 2); }
  .dirs .r { display: flex; align-items: center; gap: calc(var(--u) * 1.6); height: calc(var(--u) * 8); font-size: calc(var(--u) * 3.6); }
  .dirs .r + .r { border-top: 1px solid #e8eaed; }
  .dirs .o { width: calc(var(--u) * 3); height: calc(var(--u) * 3); border-radius: 50%; border: calc(var(--u) * 0.45) solid #5f6368; box-sizing: border-box; }
  .dirs svg { width: calc(var(--u) * 3); height: calc(var(--u) * 4); }
  .eta { right: calc(var(--u) * 3); bottom: calc(var(--u) * 3); width: calc(var(--u) * 56); padding: calc(var(--u) * 2.6) calc(var(--u) * 3); }
  .eta .big { font-size: calc(var(--u) * 8); font-weight: 600; line-height: 1; color: #188038; letter-spacing: -0.01em; }
  .eta .big span { font-size: calc(var(--u) * 4.4); font-weight: 500; color: #5f6368; margin-left: calc(var(--u) * 1); }
  .eta .sub { margin-top: calc(var(--u) * 1.4); font-size: calc(var(--u) * 3.4); color: #5f6368; }
  .eta .sub b { color: #202124; font-weight: 600; }
</style>
</head>
<body>
<svg id="map" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
<div class="box dirs" id="dirs" data-chrome>
  <div class="r"><i class="o"></i><span>14 Cedar Avenue</span></div>
  <div class="r"><svg viewBox="0 0 24 32"><path d="M12 1C6 1 1.5 5.4 1.5 11c0 7.5 10.5 20 10.5 20s10.5-12.500 10.500-20C22.500 5.400 18 1 12 1z" fill="#ea4335"/><circle cx="12" cy="11" r="4" fill="#fff"/></svg><span>Linden Cafe</span></div>
</div>
<div class="box eta" id="eta"><div class="big">14<span>min</span></div><div class="sub"><b>3.2 km</b> via Pine Street, fastest route</div></div>
<script type="module">
import '/core/engine/page-api.js';
import { arrive } from '/prompts/moves/demo/assets/stage.js';
const NS = 'http://www.w3.org/2000/svg', map = document.getElementById('map');
const clamp = (x) => Math.min(1, Math.max(0, x)), inOut = (x) => (x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2);
const add = (parent, tag, attrs, text) => { const e = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v)); if (text) e.textContent = text; parent.appendChild(e); return e; };

// the street grid (viewBox units): the route runs on street centres
const VX = [150, 380, 640, 900, 1150, 1420], HY = [120, 330, 520, 700];
const MAJOR_V = new Set([2, 5]), MAJOR_H = new Set([2]);
const RIVER_Y = 800;
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

add(map, 'rect', { x: 0, y: 0, width: 1600, height: 900, fill: '#f1efe9' });
// blocks: pale footprints, a few parks
const xs = [-60, ...VX, 1660], ys = [-60, ...HY, RIVER_Y + 20];
const PARKS = new Set(['4,2', '1,2', '2,0']);
for (let j = 0; j < ys.length - 1; j++) for (let i = 0; i < xs.length - 1; i++) {
  const x0 = xs[i] + 22, y0 = ys[j] + 22, x1 = xs[i + 1] - 22, y1 = ys[j + 1] - 22;
  if (PARKS.has(`${i},${j}`)) { add(map, 'rect', { x: x0, y: y0, width: x1 - x0, height: y1 - y0, rx: 8, fill: '#c8e6c4' }); continue; }
  const n = 2 + Math.floor(rnd() * 3), w = (x1 - x0) / n;
  for (let k = 0; k < n; k++) {
    const hgt = (y1 - y0) * (0.55 + rnd() * 0.4);
    add(map, 'rect', { x: x0 + k * w + 5, y: y0 + 6, width: w - 10, height: hgt, rx: 3, fill: '#e8e3da' });
  }
}
// water
add(map, 'path', { d: `M-20 ${RIVER_Y} C300 ${RIVER_Y - 30} 600 ${RIVER_Y + 40} 900 ${RIVER_Y} S1400 ${RIVER_Y - 30} 1620 ${RIVER_Y + 10} V920 H-20 Z`, fill: '#aadaff' });
// roads: casings first, then fills, so crossings join
const roads = [];
VX.forEach((x, i) => roads.push({ d: `M${x} -20 V${RIVER_Y + 10}`, major: MAJOR_V.has(i) }));
HY.forEach((y, j) => roads.push({ d: `M-20 ${y} H1620`, major: MAJOR_H.has(j) }));
roads.forEach((r) => add(map, 'path', { d: r.d, fill: 'none', stroke: r.major ? '#f0b94d' : '#d6d3cc', 'stroke-width': r.major ? 40 : 28 }));
roads.forEach((r) => add(map, 'path', { d: r.d, fill: 'none', stroke: r.major ? '#fde293' : '#fff', 'stroke-width': r.major ? 34 : 22 }));
// names
const label = (text, x, y, rot = 0, size = 26, fill = '#5f6368') => add(map, 'text', { x, y, 'font-size': size, 'font-weight': 500, fill, 'text-anchor': 'middle', transform: `rotate(${rot} ${x} ${y})`, dy: '0.35em' }, text);
label('Cedar Avenue', 760, HY[0]); label('Oak Street', 1290, HY[1]); label('Pine Street', 1280, HY[2], 0, 24); label('Mill Lane', 1050, HY[3]);
label('Cedar Avenue', 260, HY[0]); label('Oak Street', 520, HY[1]); label('Mill Lane', 250, HY[3]);
label('3rd Street', VX[0], 520, -90); label('Elm Street', VX[1], 220, -90); label('Market Street', VX[2], 220, -90, 24);
label('4th Street', VX[3], 600, -90); label('Willow Avenue', VX[4], 620, -90); label('Harbor Road', VX[5], 300, -90, 24);
label('Linden Park', 1040, 420, 0, 26, "#188038"); label('Mill River', 560, 862, 0, 26, "#5b8fc9");

// the route: origin dot, up Elm Street, along Pine Street, up 4th Street, along Oak Street to the cafe
const pts = [[VX[1], HY[3]], [VX[1], HY[2]], [VX[3], HY[2]], [VX[3], HY[1]], [VX[4], HY[1]]];
const R = 38;
const d = pts.map(([x, y], i) => {
  if (i === 0) return `M${x} ${y}`;
  if (i === pts.length - 1) return `L${x} ${y}`;
  const [px, py] = pts[i - 1], [nx, ny] = pts[i + 1], a = Math.hypot(x - px, y - py), b = Math.hypot(nx - x, ny - y);
  return `L${x - ((x - px) / a) * R} ${y - ((y - py) / a) * R} Q${x} ${y} ${x + ((nx - x) / b) * R} ${y + ((ny - y) / b) * R}`;
}).join(' ');
const casing = add(map, 'path', { d, fill: 'none', stroke: '#1a5fcf', 'stroke-width': 17, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
const line = add(map, 'path', { d, fill: 'none', stroke: '#4285f4', 'stroke-width': 11, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
const total = line.getTotalLength();
[casing, line].forEach((p) => { p.style.strokeDasharray = `${total} ${total}`; });
const [ox, oy] = pts[0], [dx, dy] = pts.at(-1);
const halo = add(map, 'circle', { cx: ox, cy: oy, r: 30, fill: '#4285f4' });
const origin = add(map, 'circle', { cx: ox, cy: oy, r: 15, fill: '#fff', stroke: '#4285f4', 'stroke-width': 8 });
const pin = add(map, 'g', { transform: `translate(${dx} ${dy})` });
const body = add(pin, 'g', {});
add(body, 'path', { d: 'M0 0C-8 -16 -30 -34 -30 -58a30 30 0 0 1 60 0c0 24 -22 42 -30 58z', fill: '#ea4335', stroke: '#b3261e', 'stroke-width': 3 });
add(body, 'circle', { cx: 0, cy: -58, r: 11, fill: '#fff' });

const T_ORIGIN = 0.7, T_GO = 1.0, D_GO = 1.9, T_PIN = T_GO + D_GO, T_CARD = T_PIN + 0.3;
arrive(document.getElementById('dirs'), 250, { ms: 220, from: '0.8vh' });
vawe.onFrame((t) => {
  const s = total * inOut(clamp((t - T_GO) / D_GO));
  [casing, line].forEach((p) => { p.style.strokeDashoffset = String(total - s); p.style.visibility = s < 1 ? 'hidden' : 'visible'; });
  origin.style.opacity = String(t < T_ORIGIN ? 0 : 1);
  halo.style.opacity = String(t < T_ORIGIN ? 0 : 0.28 * (1 - ((t - T_ORIGIN) % 1.6) / 1.6));
  halo.setAttribute('r', String(15 + 25 * (((t - T_ORIGIN) % 1.6) / 1.6)));
  const up = clamp((t - T_PIN) / 0.25);
  pin.style.opacity = String(up > 0 ? 1 : 0);
  body.setAttribute('transform', `translate(0 ${-30 * (1 - up) ** 2})`);
  pin.style.opacity = String(Math.min(1, up * 3));
});
arrive(document.getElementById('eta'), T_CARD * 1000, { ms: 220, from: '0.8vh' });
</script>
</body>
</html>
