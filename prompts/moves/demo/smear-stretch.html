<!doctype html>
<html data-aspect="16:9" data-look="field">
<head>
<meta charset="utf-8">
<meta name="duration" content="1.4">
<title>move: smear stretch</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; }
  .shot { position: absolute; inset: 0; overflow: hidden; }
  .shot .fg { position: absolute; inset: 0; filter: url(#smear); }
  .a { background: var(--ground); }
  .a .fg { transform-origin: 0 50%; }
  .b { background: var(--paper); color: var(--paper-ink); }
  .b .fg { transform-origin: 100% 50%; }
  .a .word, .b .word { position: absolute; left: 9vw; top: calc(var(--u) * 30); font: 800 calc(var(--u) * 30)/0.9 var(--sans); letter-spacing: -0.05em; }
  .a .bar { position: absolute; left: 9.4vw; top: calc(var(--u) * 64); width: 36vw; height: calc(var(--u) * 5); border-radius: 999px; background: var(--accent); }
  .a .note { position: absolute; left: 9.4vw; top: calc(var(--u) * 73); font: 600 var(--t-body)/1 var(--mono); color: var(--muted); }
  .b .word { left: auto; right: 9vw; }
  .b .meta { position: absolute; right: 9.4vw; top: calc(var(--u) * 63); display: flex; align-items: center; gap: var(--s3); }
  .b .avatar { --size: calc(var(--u) * 9); }
  .b .avatars .avatar { box-shadow: 0 0 0 calc(var(--u) * 0.5) var(--paper); }
  .b .tag { padding: calc(var(--u) * 1.8) calc(var(--u) * 3.2); border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 700 var(--t-body)/1 var(--sans); }
</style>
</head>
<body>
<svg width="0" height="0" style="position: absolute"><filter id="smear" x="-5%" width="110%"><feGaussianBlur id="mb" stdDeviation="0 0"/></filter></svg>
<div class="shot b"><div class="fg"><div class="word">Final</div><div class="meta"><div class="avatars"><div class="avatar"><img src="/prompts/moves/demo/assets/photos/av-david.jpg" alt=""></div><div class="avatar"><img src="/prompts/moves/demo/assets/photos/av-bust.jpg" alt=""></div><div class="avatar"><img src="/prompts/moves/demo/assets/photos/av-shore.jpg" alt=""></div></div><div class="tag">Approved</div></div></div></div>
<div class="shot a"><div class="fg"><div class="word">Draft</div><div class="bar"></div><div class="note">cut 3 of 4</div></div></div>
<script type="module">
import '/core/engine/page-api.js';
import { spring, springDuration } from '/core/motion/springs.js';
const a = document.querySelector('.a'), fa = a.firstElementChild, fb = document.querySelector('.b .fg'), blur = document.getElementById('mb');
const clamp = (u) => Math.min(1, Math.max(0, u));
const OUT = 0.5, OUT_DUR = 0.16, IN_DUR = 0.62, PEAK = 9;   // stretch start (s), stretch length (s), snap-back length (s), peak scaleX
const K = 300, D = 20, TS = springDuration(K, D);               // an under-damped spring: the snap passes 1 and squashes once
const cut = OUT + OUT_DUR;
// stretch amount: rises on an ease-in into the cut, then falls on the spring after it
const stretch = (t) => {
  if (t < cut) return Math.pow(clamp((t - OUT) / OUT_DUR), 2);
  return 1 - spring(clamp((t - cut) / IN_DUR) * TS, K, D);
};
vawe.onFrame((t) => {
  const s = stretch(t), sx = s > 0 ? 1 + (PEAK - 1) * s : 1 + 0.6 * s;   // the spring's undershoot is a squash of a few percent, not a ninth of the stretch
  const sy = s > 0 ? 1 - 0.1 * Math.min(1, s * 1.5) : 1 - 0.5 * s;       // it thins as it stretches and bulges as it squashes
  const speed = Math.abs(stretch(t + 1 / 60) - s) * PEAK;
  const shot = t < cut ? fa : fb;
  a.style.visibility = t < cut ? 'visible' : 'hidden';
  shot.style.transform = `scale(${sx.toFixed(4)}, ${sy.toFixed(4)})`;
  blur.setAttribute('stdDeviation', `${(speed * 14).toFixed(2)} 0`);
  if (t >= cut + IN_DUR) fb.style.transform = `translateX(${(-(t - cut - IN_DUR) * 1.2).toFixed(3)}vw)`;   // a slow drift after it lands
});
</script>
</body>
</html>
