<!doctype html>
<html data-aspect="16:9" data-look="field">
<head>
<meta charset="utf-8">
<meta name="duration" content="2">
<meta name="blank" content="0-0.05">
<title>move: notification pop</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  .note { display: flex; align-items: center; gap: var(--s3); width: calc(var(--u) * 150); padding: calc(var(--u) * 2.8); padding-right: var(--s4); border-radius: calc(var(--u) * 4.8); transform-origin: 50% 0; opacity: 0; }
  .note .chip { --size: calc(var(--u) * 13); border-radius: calc(var(--u) * 2); }
  .note .icon { width: calc(var(--u) * 7); height: calc(var(--u) * 7); stroke: var(--on-accent); stroke-width: 2; }
  .text { flex: 1; min-width: 0; }
  .title { font: 650 var(--t-lead)/1.15 var(--sans); letter-spacing: -0.015em; }
  .sub { margin-top: calc(var(--u) * 0.7); font: 500 var(--t-body)/1.25 var(--sans); color: var(--muted); }
  .thumb { flex: none; width: calc(var(--u) * 21); aspect-ratio: 16 / 9; height: auto; border-radius: calc(var(--u) * 2); }
  .when { align-self: flex-start; padding-top: var(--s1); font: 500 var(--t-small)/1 var(--sans); color: var(--muted); }
</style>
</head>
<body>
<div class="note card">
  <div class="chip accent-fill app"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <div class="text"><div class="title">Render finished</div><div class="sub">meadow-launch.mp4, 12.4 s at 60 fps</div></div>
  <img class="photo thumb" src="/prompts/moves/demo/assets/photos/meadow.jpg" alt=""><div class="when">now</div>
</div>
<script type="module">
import { curveToLinear, CURVES } from '/core/motion/springs.js';
const settle = curveToLinear(CURVES.expoOut), drop = curveToLinear(CURVES.overshoot), leave = curveToLinear((u) => u * u * u);
const q = (s) => document.querySelector(s);
const note = q('.note');
// the banner drops from above the frame and dips just past its slot before it settles; the width closes from 92 percent, so it lands as an object, not a slide
note.animate([{ translate: '0 -62vh', scale: '0.92 0.96' }, { translate: '0 0', scale: '1 1' }], { duration: 700, easing: drop, fill: 'both' });
note.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 90, easing: 'linear', fill: 'both' });
// contents follow the shell: the icon pops first, the text resolves 80 ms after it
q('.app').animate([{ scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1 }], { duration: 520, delay: 200, easing: drop, fill: 'both' });
[['.text', 280], ['.when', 340]].forEach(([s, at]) => q(s).animate([{ translate: '0 1.4vh', opacity: 0, filter: 'blur(4px)' }, { translate: '0 0', opacity: 1, filter: 'blur(0px)' }], { duration: 420, delay: at, easing: settle, fill: 'both' }));
// the exit is shorter than the entrance and accelerates: 260 ms, cubic in, and it ends on the last frame
note.animate([{ translate: '0 0', opacity: 1 }, { translate: '0 -34vh', opacity: 0 }], { duration: 260, delay: 1740, easing: leave, fill: 'forwards' });
</script>
</body>
</html>
