<!doctype html>
<html data-aspect="16:9" data-look="field">
<head>
<meta charset="utf-8">
<meta name="duration" content="2">
<title>move: parallax dive</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; }
  .stage { position: absolute; inset: 0; perspective: 80vh; perspective-origin: 50% 50%; }
  .rig { position: absolute; inset: 0; transform-style: preserve-3d; }
  /* every layer sits at its own depth (z, in vh); the camera is the rig moving toward us */
  .layer { position: absolute; left: 50%; top: 50%; translate: calc(var(--x) * 1vw - 50%) calc(var(--y) * 1vh - 50%); transform: translateZ(calc(var(--z) * 1vh)); }
  .far { --x: 0; --y: 0; --z: -240; width: 600vw; height: 600vh; background: radial-gradient(var(--dot) calc(var(--u) * 0.7), transparent calc(var(--u) * 0.8)) 0 0 / calc(var(--u) * 14) calc(var(--u) * 14); }
  .tile { width: 44vh; height: 27vh; padding: calc(var(--u) * 3) calc(var(--u) * 3.2); }
  .tile .k { display: flex; align-items: center; gap: var(--s2); font: 500 var(--t-body)/1 var(--sans); color: var(--muted); }
  .tile .k .icon { width: calc(var(--u) * 4.4); height: calc(var(--u) * 4.4); }
  .tile b { display: block; margin-top: calc(var(--u) * 2.4); font: 700 calc(var(--u) * 9.6)/1 var(--sans); letter-spacing: -0.045em; }
  .slab { width: 70vh; height: 44vh; background: var(--raised); border-radius: calc(var(--u) * 4.4); box-shadow: var(--shadow-card); }
  .title { --x: 0; --y: 0; --z: -120; white-space: nowrap; font: 700 calc(var(--u) * 22)/1 var(--sans); letter-spacing: -0.05em; }
  .title i { color: var(--accent); font-style: normal; }
</style>
</head>
<body>
<div class="stage"><div class="rig">
  <div class="layer far"></div>
  <div class="layer tile card" style="--x:-40; --y:-26; --z:-100"><span class="k"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10 9.5v5l4.2-2.5z"/></svg>Renders</span><b>128</b></div>
  <div class="layer tile card" style="--x:38; --y:24; --z:-100"><span class="k"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 8.5V13l3 2M9.5 3h5"/></svg>Median time</span><b>41 s</b></div>
  <div class="layer tile card" style="--x:-30; --y:30; --z:-170"><span class="k"><svg class="icon" viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Frame rate</span><b>60</b></div>
  <div class="layer tile card" style="--x:32; --y:-32; --z:-170"><span class="k"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M8 3v4M16 17v4"/></svg>Aspect ratios</span><b>3</b></div>
  <div class="layer title">Dive in<i>.</i></div>
  <div class="layer slab near" style="--x:-58; --y:-28; --z:30"></div>
  <div class="layer slab near" style="--x:56; --y:30; --z:30"></div>
</div></div>
<script type="module">
import '/core/engine/page-api.js';
import { CURVES } from '/core/motion/springs.js';
const rig = document.querySelector('.rig'), near = [...document.querySelectorAll('.near')];
const t0 = 0.1, dur = 1.8, dive = 120;   // dive is the camera travel in vh: the title starts 120 vh deep and ends at z 0
const ease = (u) => 0.35 * u + 0.65 * CURVES.expoOut(u);
vawe.onFrame((t) => {
  const p = ease(Math.min(1, Math.max(0, (t - t0) / dur)));
  const vh = window.innerHeight / 100;
  rig.style.transform = `translate3d(${(-3 * p).toFixed(3) * vh * 0.5625}px, 0, ${(dive * p * vh).toFixed(2)}px)`;
  // a slab that reaches the camera fades out before it can cover the frame
  near.forEach((n) => { n.style.opacity = Math.min(1, Math.max(0, (52 - dive * p) / 22)).toFixed(3); });
});
</script>
</body>
</html>
