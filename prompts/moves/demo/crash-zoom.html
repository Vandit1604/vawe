<!doctype html>
<html data-aspect="16:9" data-look="swiss">
<head>
<meta charset="utf-8">
<meta name="duration" content="1.6">
<title>move: crash zoom</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; }
  .layer { position: absolute; inset: 0; overflow: hidden; }
  .w { position: absolute; inset: 0; transform-origin: 0 0; background: var(--ground); }
  .head { position: absolute; left: 8vw; top: calc(var(--u) * 10); font: 600 var(--t-lead)/1 var(--sans); letter-spacing: -0.02em; }
  .head span { color: var(--muted); font-weight: 500; }
  .stats { position: absolute; left: 8vw; right: 8vw; top: calc(var(--u) * 22); display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(var(--u) * 2.4); }
  .stat { padding: var(--s3); border-radius: var(--r-card); background: var(--surface); box-shadow: var(--ring); }
  .stat .k { font: 500 var(--t-small)/1 var(--mono); color: var(--muted); }
  .stat b { display: block; margin-top: var(--s2); font: 600 var(--t-head)/1 var(--sans); letter-spacing: -0.03em; }
  .stat.hit b { color: var(--accent); }
  .chart { position: absolute; left: 8vw; right: 8vw; top: calc(var(--u) * 50); height: calc(var(--u) * 38); border-radius: var(--r-card); background: var(--surface); box-shadow: var(--ring); }
  .chart svg { position: absolute; inset: var(--s3); width: calc(100% - var(--s3) * 2); height: calc(100% - var(--s3) * 2); overflow: visible; }
  .chart polyline { fill: none; stroke: var(--ink); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .chart line { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
</style>
</head>
<body>
<template id="world"><div class="w">
  <div class="head">Status <span>last 30 days</span></div>
  <div class="stats">
    <div class="stat hit"><div class="k">uptime</div><b>99.98%</b></div>
    <div class="stat"><div class="k">p95 latency</div><b>41 ms</b></div>
    <div class="stat"><div class="k">renders</div><b>1,284</b></div>
    <div class="stat"><div class="k">errors</div><b>3</b></div>
  </div>
  <div class="chart"><svg viewBox="0 0 100 40" preserveAspectRatio="none"><line x1="0" y1="10" x2="100" y2="10"/><line x1="0" y1="20" x2="100" y2="20"/><line x1="0" y1="30" x2="100" y2="30"/><polyline points="0,28 8,24 16,26 24,19 32,21 40,15 48,17 56,12 64,14 72,9 80,11 88,6 100,5"/></svg></div>
</div></template>
<div id="layers"></div>
<script type="module">
import '/core/engine/page-api.js';
import { CURVES } from '/core/motion/springs.js';
const W = innerWidth, H = innerHeight, N = 16, clamp = (u) => Math.min(1, Math.max(0, u));
const host = document.getElementById('layers');
const layers = Array.from({ length: N }, (_, j) => {
  const el = document.createElement('div'); el.className = 'layer';
  el.append(document.getElementById('world').content.cloneNode(true));
  el.style.opacity = 1 / (j + 1);   // 1, 1/2, 1/3 ...: stacked they average into one exposure
  host.append(el);
  return el.firstElementChild;
});
const r = layers[0].querySelector('.hit b').getBoundingClientRect();
const target = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
const HIT = 0.55, PUSH = 0.13, S = 2.6, OVER = 1.05, RECOIL = 0.32;   // the beat (s), push (s), rest scale, overshoot, recoil (s)
// ease-in push (accelerates into the hit), then a short recoil from 5 percent past the rest scale, then a slow creep
const scaleAt = (t) => {
  if (t < HIT) return 1 + 0.02 * t;
  const u = clamp((t - HIT) / PUSH);
  if (u < 1) return 1.011 + (S * OVER - 1.011) * u * u * u;
  const v = CURVES.expoOut(clamp((t - HIT - PUSH) / RECOIL));
  return S * OVER + (S - S * OVER) * v + 0.08 * Math.max(0, t - HIT - PUSH - RECOIL);
};
vawe.onFrame((t) => {
  const s0 = scaleAt(t), spread = (180 / 360) * (scaleAt(t + 1 / 60) - s0);   // a 180 degree shutter
  layers.forEach((w, j) => {
    const s = s0 + (j / (N - 1) - 0.5) * spread, k = clamp((s - 1) / (S - 1));
    const px = target.x + (W / 2 - target.x) * k, py = target.y + (H / 2 - target.y) * k;   // the target travels to the centre
    w.style.transform = `translate(${px - s * target.x}px, ${py - s * target.y}px) scale(${s})`;
  });
});
</script>
</body>
</html>
