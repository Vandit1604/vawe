<!doctype html>
<html data-aspect="16:9" data-look="brutal">
<head>
<meta charset="utf-8">
<meta name="duration" content="1.4">
<title>move: underline draw</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  p { margin: 0; text-align: center; font: 700 calc(var(--u) * 13)/1.2 var(--sans); letter-spacing: -0.04em; }

  .key { position: relative; display: inline-block; }
  /* below the descender line (0.3em under the baseline), so the g and y are never struck through */
  .key svg { position: absolute; left: -0.02em; top: 100%; width: 104%; height: 0.24em; overflow: visible; }
  .key path { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round;
              stroke-dasharray: 1; stroke-dashoffset: 1;
              animation-name: draw; animation-duration: 0.6s; animation-delay: 0.3s;
              animation-timing-function: var(--draw); animation-fill-mode: both; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<p>Launch films that get<br><span class="key">noticed<svg viewBox="0 0 300 20" preserveAspectRatio="none"><path pathLength="1" d="M4 12 C 70 5, 190 4, 296 9"/></svg></span></p>
<script type="module">
import { EASE } from '/core/motion/presets.js';
document.documentElement.style.setProperty('--draw', EASE.land);
</script>
</body>
</html>
