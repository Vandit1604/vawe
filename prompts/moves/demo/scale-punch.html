<!doctype html>
<html data-aspect="16:9" data-look="brutal">
<head>
<meta charset="utf-8">
<meta name="duration" content="1">
<meta name="blank" content="0-0.1">
<title>move: scale punch</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  /* the word lands from 1.4x on the overshoot curve, so it dips to 0.97 and comes back: the recoil is what reads as impact */
  h1 { margin: 0; font: 800 calc(var(--u) * 22)/1 var(--sans); letter-spacing: -0.045em; scale: 1.4; opacity: 0;
       animation-name: punch, appear; animation-duration: 0.55s, 0.12s; animation-delay: 0.1s, 0.1s;
       animation-timing-function: var(--recoil), linear; animation-fill-mode: both, both; }
  @keyframes punch { to { scale: 1; } }
  @keyframes appear { to { opacity: 1; } }
  .dot { display: inline-block; width: 0.16em; height: 0.16em; margin-left: 0.06em; border-radius: 50%; background: var(--accent);
         scale: 0; animation-name: pop; animation-duration: 0.35s; animation-delay: 0.32s;
         animation-timing-function: var(--recoil); animation-fill-mode: both; }
  @keyframes pop { to { scale: 1; } }
</style>
</head>
<body>
<h1>punch<span class="dot"></span></h1>
<script type="module">
import { curveToLinear, CURVES } from '/core/motion/springs.js';
document.documentElement.style.setProperty('--recoil', curveToLinear(CURVES.overshoot));
</script>
</body>
</html>
