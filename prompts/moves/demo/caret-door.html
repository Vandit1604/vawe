<!doctype html>
<html data-aspect="16:9" data-look="product" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="duration" content="6">
<title>move: caret door</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<link rel="stylesheet" href="/prompts/moves/demo/assets/terminal.css">
<style>
  .win.term .tbody { padding-top: calc(var(--u) * 2.6); font-size: calc(var(--u) * 4.2); line-height: 1.5; }
  .sh .ln { white-space: pre; }
  .sh .ps, .sh .out { color: var(--muted); }
  .sh .ok { color: var(--ok); }
  .caret { position: absolute; z-index: 3; background: var(--ink); }
  .door { position: absolute; z-index: 2; top: -20vh; height: 140vh; background: #f3f3f0; visibility: hidden; will-change: transform; }
  .fx { position: absolute; top: 20vh; width: 100vw; height: 100vh; color: #0d0d0d; font-family: var(--sans); }
  .fx-head { position: absolute; left: 19vw; top: calc(var(--u) * 3.4); display: flex; align-items: center; gap: calc(var(--u) * 1.6); }
  .fx-head b { font: 600 calc(var(--u) * 4.4)/1 var(--sans); letter-spacing: -0.02em; }
  .fx-head span { font: 500 calc(var(--u) * 2.8)/1 var(--sans); color: #5d5d5d; }
  .fx-live { display: inline-flex; align-items: center; gap: calc(var(--u) * 0.8); padding: calc(var(--u) * 0.8) calc(var(--u) * 1.6); border-radius: 999px; background: #0d0d0d; color: #fff; font: 600 calc(var(--u) * 2.6)/1 var(--sans); }
  .fx-live i { width: calc(var(--u) * 1.2); height: calc(var(--u) * 1.2); border-radius: 50%; background: #3ecf6b; }
  .fx-player { position: absolute; left: 19vw; top: calc(var(--u) * 11); width: 62vw; height: calc(var(--u) * 62); border-radius: calc(var(--u) * 1.2); overflow: hidden; background: #000; box-shadow: var(--win-shadow); }
  .fx-player img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fx-ctl { position: absolute; left: 0; right: 0; bottom: 0; padding: calc(var(--u) * 5) calc(var(--u) * 2) calc(var(--u) * 1.6); background: linear-gradient(transparent, rgba(0, 0, 0, 0.65)); color: #fff; }
  .fx-track { position: relative; height: calc(var(--u) * 0.6); border-radius: 99px; background: rgba(255, 255, 255, 0.35); }
  .fx-track i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: 0 50%; border-radius: 99px; background: #fff; }
  .fx-row { display: flex; align-items: center; gap: calc(var(--u) * 1.6); margin-top: calc(var(--u) * 1.4); font: 500 calc(var(--u) * 2.6)/1 var(--sans); }
  .fx-row svg { width: calc(var(--u) * 3); height: calc(var(--u) * 3); fill: #fff; stroke: none; }
  .fx-row .sp { flex: 1; }
  .fx-fmt { position: absolute; left: 19vw; top: calc(var(--u) * 77); display: flex; gap: calc(var(--u) * 1.6); }
  .fx-fmt span { display: inline-flex; align-items: center; gap: calc(var(--u) * 1); padding: calc(var(--u) * 1.3) calc(var(--u) * 2.2); border-radius: 999px; background: #fff; box-shadow: 0 0 0 1px rgba(13, 13, 13, 0.1); font: 500 calc(var(--u) * 2.7)/1 var(--sans); }
  .fx-fmt svg { width: calc(var(--u) * 2.6); height: calc(var(--u) * 2.6); fill: none; stroke: #1a7f37; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
</style>
<script type="application/json" id="authoring">{"allow": ["text-unreadable-hold", "text-moves-before-hold", "world-held@0.0-6.0", "static-window@2.7-3.0"], "_why": {"text-unreadable-hold": "the release page holds 1.2 s after the door lands at 4.4 s in a 6 s clip, and the check asks 5.4 s", "text-moves-before-hold": "the page leaves at 5.6 s, 0.4 s before the 6 s end, so the finished page holds 1.2 s, short of the 5.4 s the check asks", "world-held@0.0-6.0": "one shell session then one release page: the command types from 0.5 s, the door turns from 3.5 s and the page leaves at 5.6 s", "static-window@2.7-3.0": "terminal at 2.8 s: the caret waits on the last prompt before it grows, blinking every 0.28 s"}}</script>
</head>
<body>
<div class="win term">
  <div class="tbar" data-chrome><span class="lights"><i></i><i></i><i></i></span><span class="ttl"><span>films: zsh</span></span></div>
  <div class="tbody sh">
    <div class="ln"><span class="ps">films % </span><span>vawe frames launch</span></div>
    <div class="ln out"><span>wrote 3 frames to out/launch</span></div>
    <div class="ln" id="now"><span class="t"><span class="ps">films % </span><span id="typed"></span></span></div>
    <div class="ln out" id="r1"><span>build 16:9  </span><span class="ok">done</span><span>  12.1 s</span></div>
    <div class="ln out" id="r2"><span>build 9:16  </span><span class="ok">done</span><span>  11.8 s</span></div>
    <div class="ln out" id="r3"><span>14 checks  </span><span class="ok">passed</span></div>
    <div class="ln" id="next"><span class="t"><span class="ps">films % </span></span></div>
  </div>
</div>
<div class="caret" id="caret"></div>
<div class="door" id="door"><div class="fx" id="face">
  <div class="fx-head"><b>launch.mp4</b><span>41 s, three formats</span><span class="fx-live" id="live"><i></i>Live</span></div>
  <div class="fx-player"><img src="/prompts/moves/demo/assets/photos/harbour.jpg" alt="">
    <div class="fx-ctl"><div class="fx-track"><i id="prog"></i></div>
      <div class="fx-row"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg><svg viewBox="0 0 24 24"><path d="M4 9.5h4l5-4v13l-5-4H4z"/></svg><span id="tc">0:00 / 0:41</span><span class="sp"></span><span>CC</span><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zM14 4h6v6h-2V6h-4zM4 14h2v4h4v2H4zM18 14h2v6h-6v-2h4z"/></svg></div>
    </div>
  </div>
  <div class="fx-fmt"><span><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2 9.3-9.4"/></svg>16:9</span><span><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2 9.3-9.4"/></svg>9:16</span><span><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2 9.3-9.4"/></svg>1:1</span></div>
</div></div>
<script type="module">
import '/core/engine/page-api.js';
import { easeFn } from '/core/motion/presets.js';
import { leave, arrive, show, typeTimes, typedCount } from '/prompts/moves/demo/assets/stage.js';
const q = (s) => document.querySelector(s);
const W = innerWidth, H = innerHeight, u = H / 100, clamp = (x) => Math.min(1, Math.max(0, x));
const land = easeFn('land'), settle = easeFn('settle'), launch = easeFn('launch'), pop = easeFn('pop');
const CMD = 'vawe ship launch';
const END = 6000, TYPE_MS = 500, ENTER_MS = 1600, NEXT_MS = 2500;
const T_GROW = 3.0, D_GROW = 0.5, T_OPEN = 3.5, D_OPEN = 0.9, RETRACT = 0.3, PERSPECTIVE = 1.7 * W;
const caret = q('#caret'), door = q('#door'), face = q('#face'), typed = q('#typed');
const times = typeTimes(CMD, TYPE_MS);

arrive(q('.win'), 100, { ms: 220, from: '0.8vh' });
show(q('#r1'), ENTER_MS + 100); show(q('#r2'), ENTER_MS + 400); show(q('#r3'), ENTER_MS + 700);
show(q('#next'), NEXT_MS);
leave(door, END);

const blinkOn = (ms, since) => ms - since < 500 || Math.floor((ms - since) / 280) % 2 === 0;
vawe.onFrame((t) => {
  const ms = t * 1000;
  typed.textContent = CMD.slice(0, typedCount(times, ms));
  const anchor = (ms < NEXT_MS ? q('#now .t') : q('#next .t')).getBoundingClientRect();
  const cx = anchor.right + 1.2 * u, cy = (anchor.top + anchor.bottom) / 2, ch = 4.8 * u;
  const g = land(clamp((t - T_GROW) / D_GROW)), dip = Math.sin(Math.PI * clamp((t - T_GROW + 0.12) / 0.12)) * 0.08;
  const h = (ch * (1 - dip) + (1.04 * H - ch) * g) * (1 - launch(clamp((t - T_OPEN) / RETRACT)));
  const cw = 2.4 * u + (1.2 * u - 2.4 * u) * g;
  const since = ms < ENTER_MS ? (times.filter((x) => x <= ms).pop() ?? 0) : NEXT_MS;
  const shown = t >= T_OPEN ? t < T_OPEN + RETRACT : t >= T_GROW || (ms < ENTER_MS || ms >= NEXT_MS) && blinkOn(ms, since);
  caret.style.visibility = shown ? 'visible' : 'hidden';
  caret.style.left = `${cx - cw / 2}px`; caret.style.width = `${cw}px`;
  caret.style.top = `${cy - h / 2 + (H / 2 - cy) * g}px`; caret.style.height = `${h}px`;
  q('.win').style.display = t > T_OPEN + D_OPEN + 0.05 ? 'none' : 'flex';
  const opening = t >= T_OPEN;
  door.style.visibility = opening ? 'visible' : 'hidden';
  door.style.left = `${cx - W}px`; door.style.width = `${2 * W}px`;
  face.style.left = `${W - cx}px`;
  door.style.transform = `perspective(${PERSPECTIVE}px) rotateY(${90 * (1 - settle(clamp((t - T_OPEN) / D_OPEN)))}deg)`;
  const lands = T_OPEN + D_OPEN;
  q('#live').style.scale = String(t < lands - 0.1 ? 0 : pop(clamp((t - lands + 0.1) / 0.5)));
  const play = Math.max(0, t - lands);
  q('#prog').style.transform = `scaleX(${(play * 0.011).toFixed(4)})`;
  q('#tc').textContent = `0:0${Math.floor(play)} / 0:41`;
});
</script>
</body>
</html>
