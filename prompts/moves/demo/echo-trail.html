<!doctype html>
<html data-aspect="16:9" data-look="dusk">
<head>
<meta charset="utf-8">
<meta name="duration" content="2.6">
<title>move: echo trail</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; position: relative; }
  .tile { position: absolute; left: 50%; top: 42%; width: calc(var(--u) * 17); height: calc(var(--u) * 17); margin: calc(var(--u) * -8.5) 0 0 calc(var(--u) * -8.5);
          display: grid; place-items: center; border-radius: var(--r-card); background: var(--accent); color: var(--on-accent);
          font: 800 calc(var(--u) * 9)/1 var(--display); box-shadow: var(--accent-edge); }
  .name { position: absolute; left: 0; right: 0; top: 62%; margin: 0; text-align: center; font: 700 var(--t-head)/1 var(--head); letter-spacing: var(--head-track); }
</style>
</head>
<body>
<div class="tile" id="lead">P</div>
<p class="name" id="name">Parcelo</p>
<script type="module">
import '/core/engine/page-api.js';
import { enter } from '/core/motion/presets.js';
const lead = document.getElementById('lead');
const vh = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--vh'));
const HIT = 1.05, FLY = 0.85, N = 5, LAG = 0.035, SPREAD = 0.22;   // copy i shows the lead's own frame i * LAG seconds ago
const copies = Array.from({ length: N }, () => {
  const c = lead.cloneNode(true);
  c.removeAttribute('id'); c.setAttribute('aria-hidden', 'true');
  c.textContent = '';                                        // copies carry the tile shape only, never the glyph
  return c;
});
[...copies].reverse().forEach((c) => lead.before(c));        // the oldest copy sits lowest, the lead on top
const ease = (u) => u * u * u;                               // accelerates into the hit
const pos = (t) => {                                          // the one moving element, a pure function of time
  const u = ease(Math.min(1, Math.max(0, (t - (HIT - FLY)) / FLY)));
  return { x: (1 - u) * -62 * vh / 100, y: (1 - u) * 26 * vh / 100 };
};
const squash = (t) => (t < HIT ? 0 : Math.exp(-14 * (t - HIT)) * Math.cos(34 * (t - HIT)));
vawe.onFrame((t) => {
  const collapse = Math.min(1, Math.max(0, (t - (HIT - SPREAD)) / SPREAD));   // linear: the total lag (5 * LAG) over SPREAD must stay under 1, or a copy runs backwards
  copies.forEach((c, i) => {
    const p = pos(t - (i + 1) * LAG * (1 - collapse));
    c.style.translate = `${p.x.toFixed(2)}px ${p.y.toFixed(2)}px`;
    c.style.opacity = (0.6 * (1 - i / N) * (1 - collapse)).toFixed(3);
  });
  const p = pos(t), s = squash(t);
  lead.style.translate = `${p.x.toFixed(2)}px ${p.y.toFixed(2)}px`;
  lead.style.scale = `${(1 - 0.18 * s).toFixed(4)} ${(1 + 0.18 * s).toFixed(4)}`;
});
enter(document.getElementById('name'), { at: HIT + 0.35, band: 'professional', from: '0 0.4em' });
</script>
</body>
</html>
