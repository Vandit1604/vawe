<!doctype html>
<html data-aspect="16:9" data-look="night">
<head>
<meta charset="utf-8">
<meta name="duration" content="1">
<meta name="blank" content="0.52-0.58">
<title>move: flash cut</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { position: relative; display: block; }

  .shot { position: absolute; inset: 0; }
  .b { opacity: 0; }
  .a .card { position: absolute; left: 14vw; top: calc(var(--u) * 24); width: 66vw; padding: var(--s5); }
  .a h2 { margin: 0 0 var(--s3); font: 600 var(--t-body)/1 var(--mono); letter-spacing: -0.02em; color: var(--muted); }
  .a p { margin: 0; font: 700 var(--t-title)/1.05 var(--sans); letter-spacing: -0.035em; }
  .a .meta { margin-top: var(--s4); display: flex; gap: var(--s2); }
  .a .card { display: grid; grid-template-columns: 1fr calc(var(--u) * 26); gap: var(--s4); align-items: center; }
  .a .still { height: calc(var(--u) * 32); border-radius: calc(var(--r-card) - var(--s2)); }
  .b h1 { position: absolute; left: 14vw; top: calc(var(--u) * 28); margin: 0; font: 700 calc(var(--u) * 26)/1 var(--sans); letter-spacing: -0.06em; }
  .b h1 i { color: var(--accent); font-style: normal; }
  .b p { position: absolute; left: 14.4vw; top: calc(var(--u) * 62); margin: 0; font: 500 var(--t-lead)/1 var(--sans); color: var(--muted); }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
</style>
</head>
<body>
<section class="shot a"><div class="card"><div><h2>draft 7 of 7</h2><p>Almost ready to ship</p><div class="meta"><span class="pill">12.4 s</span><span class="pill">3 aspects</span></div></div><img class="photo still" src="/prompts/moves/demo/assets/photos/shore.jpg"></div></section>
<section class="shot b"><h1>Ship<i>.</i></h1><p>one page in, one film out</p></section>
<div class="flash"></div>
<script type="module">
import { curveToLinear, CURVES } from '/core/motion/springs.js';
const settle = curveToLinear(CURVES.expoOut);
const beat = 500;   // ms; the flash peaks on the beat and the cut lands inside the peak
const cutAt = beat + 20;
// one frame up, about three at full white, then a decay like an exposure: fast, then a long tail
document.querySelector('.flash').animate(
  [{ opacity: 0 }, { opacity: 1, offset: 0.04 }, { opacity: 1, offset: 0.16, easing: settle }, { opacity: 0 }],
  { duration: 420, delay: beat, fill: 'both' });
document.querySelector('.b').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 1, delay: cutAt, fill: 'both' });
document.querySelector('.a').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1, delay: cutAt, fill: 'both' });
document.querySelector('.a .card').animate([{ translate: '0 0' }, { translate: '-2vw 0' }], { duration: cutAt, fill: 'both' });
// B is overexposed at the cut and settles to its true exposure with the flash
document.querySelector('.b').animate([{ filter: 'brightness(2.4)', scale: 1.06 }, { filter: 'brightness(1)', scale: 1 }],
  { duration: 700, delay: cutAt, easing: settle, fill: 'both' });
</script>
</body>
</html>
