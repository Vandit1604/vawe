<!doctype html>
<html data-aspect="16:9" data-look="brutal">
<head>
<meta charset="utf-8">
<meta name="duration" content="2.2">
<meta name="blank" content="0-0.05">
<title>move: overwhelm collapse</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { position: relative; display: block; }
  .junk { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: var(--s2); padding: calc(var(--u) * 1.6) calc(var(--u) * 2.4); background: var(--surface); box-shadow: var(--ring), var(--lift); font: 700 var(--t-small)/1.1 var(--sans); white-space: nowrap; will-change: transform; }
  .junk .dot { width: calc(var(--u) * 3.4); height: calc(var(--u) * 3.4); border-radius: 50%; background: var(--c, var(--accent)); box-shadow: inset 0 0 0 calc(var(--u) * 0.3) #000; flex: none; }
  .junk.tag { padding: calc(var(--u) * 1) calc(var(--u) * 2); border-radius: 999px; }
  .junk.flag { padding: calc(var(--u) * 1.2) calc(var(--u) * 2); background: var(--accent); color: var(--on-accent); }
  .clean { position: absolute; left: 50%; top: 50%; display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); background: var(--surface); box-shadow: var(--ring), var(--lift); margin: calc(var(--u) * -9) 0 0 calc(var(--u) * -34); width: calc(var(--u) * 68); height: calc(var(--u) * 18); opacity: 0; }
  .clean .chip { --size: calc(var(--u) * 11); background: var(--accent); color: var(--on-accent); }
  .clean .icon { stroke: var(--on-accent); stroke-width: 2.5; }
  .clean b { display: block; font: 800 var(--t-lead)/1.05 var(--sans); }
  .clean span { display: block; margin-top: calc(var(--u) * 0.6); font: 600 var(--t-small)/1.1 var(--sans); }
</style>
</head>
<body>
<div id="pile"></div>
<div class="clean"><div class="chip"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div><b>Inbox zero</b><span>12 apps, one feed</span></div></div>
<script type="module">
import { curveToLinear, CURVES, rng } from '/core/motion/springs.js';
const pop = curveToLinear(CURVES.overshoot), suck = curveToLinear((u) => u * u * u), settle = curveToLinear(CURVES.expoOut);
const W = innerWidth, H = innerHeight, rand = rng(7);
const items = [
  ['Deploy failed', '#ff3b30'], ['3 new comments', '#1a2bff'], ['Invoice overdue', '#ff3b30'], ['Standup in 5 min', '#00b86b'],
  ['PR needs review', '#1a2bff'], ['Payment declined', '#ff3b30'], ['@you in #launch', '#1a2bff'], ['Slack: 27 unread', '#8a3ffc'],
  ['Backup complete', '#00b86b'], ['Update available', '#ff9500'], ['New sign-in', '#ff3b30'], ['Sprint ends today', '#ff9500'],
  ['Reminder: call', '#1a2bff'], ['Storage 98% full', '#ff3b30'], ['12 mentions', '#8a3ffc'], ['Alert: CPU', '#ff3b30'],
  ['Meeting moved', '#ff9500'], ['Task overdue', '#ff3b30'], ['Build queued', '#00b86b'], ['2FA code', '#ff9500'],
  ['Calendar clash', '#ff3b30'], ['You were tagged', '#8a3ffc'], ['Trial ends', '#ff9500'], ['Ticket #4471', '#1a2bff'],
  ['Renew domain', '#ff3b30'], ['Weekly digest', '#8a3ffc'],
];
const kinds = ['note', 'tag', 'note', 'flag'];
const pile = document.getElementById('pile');
const cx = W / 2, cy = H / 2;
let at = 120;          // ms; the gap shrinks with every item, so the flood speeds up
items.forEach(([label, c], i) => {
  const el = Object.assign(document.createElement('div'), { className: `junk ${kinds[i % 4]}` });
  el.style.setProperty('--c', c);
  el.innerHTML = kinds[i % 4] === 'flag' ? label : `<i class="dot"></i>${label}`;
  pile.append(el);
  const w = el.offsetWidth, h = el.offsetHeight;
  const x = (0.02 + rand() * 0.9) * W - w * 0.2, y = (0.04 + rand() * 0.84) * H, rot = (rand() - 0.5) * 16;
  el.style.left = `${x}px`; el.style.top = `${y}px`;
  const dx = cx - (x + w / 2), dy = cy - (y + h / 2);
  el.animate([{ scale: 0.4, rotate: `${rot}deg`, opacity: 0 }, { scale: 1, rotate: `${rot}deg`, opacity: 1 }], { duration: 380, delay: at, easing: pop, fill: 'both' });
  // collapse: outer items leave first, each on a cubic-in path into the centre; blur follows the speed
  const d = Math.hypot(dx, dy) / Math.hypot(cx, cy);
  const go = 1340 + (1 - d) * 90 + rand() * 40;
  el.animate([{ translate: '0 0', scale: 1, filter: 'blur(0px)', opacity: 1 }, { translate: `${dx}px ${dy}px`, scale: 0.12, filter: `blur(${(d * 6 + 1.5).toFixed(1)}px)`, opacity: 1, offset: 0.9 }, { translate: `${dx}px ${dy}px`, scale: 0.1, opacity: 0 }],
    { duration: 300, delay: go, easing: suck, fill: 'forwards' });
  at += 62 - i * 1.8;
});
const clean = document.querySelector('.clean');
clean.animate([{ opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1 }], { duration: 640, delay: 1610, easing: pop, fill: 'both' });
clean.querySelector('.chip').animate([{ scale: 0.6 }, { scale: 1 }], { duration: 520, delay: 1730, easing: pop, fill: 'both' });
clean.animate([{ translate: '0 0' }, { translate: '0 -1.2vh' }], { duration: 700, delay: 1610, easing: settle, fill: 'both' });
</script>
</body>
</html>
