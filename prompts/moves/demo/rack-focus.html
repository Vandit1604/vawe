<!doctype html>
<html data-aspect="16:9" data-look="night">
<head>
<meta charset="utf-8">
<meta name="duration" content="1.4">
<title>move: rack focus</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; position: relative; }
  .far, .near { position: absolute; inset: 0; }
  .lights i { position: absolute; width: calc(var(--u) * 3.4); height: calc(var(--u) * 3.4); border-radius: 50%; background: var(--star); }
  .card { position: absolute; left: 50vw; top: 28vh; width: 38vw; height: 44vh; padding: calc(var(--u) * 5); }
  .card .k { display: flex; align-items: center; gap: var(--s2); font: 500 var(--t-body)/1 var(--mono); color: var(--muted); letter-spacing: -0.02em; }
  .card .k .icon { width: calc(var(--u) * 4.4); height: calc(var(--u) * 4.4); }
  .card b { display: block; margin-top: calc(var(--u) * 4); font: 700 calc(var(--u) * 16)/0.9 var(--sans); letter-spacing: -0.055em; }
  .card .pill { margin-top: calc(var(--u) * 4); }
  .near h1 { position: absolute; left: 7vw; top: 38vh; margin: 0; font: 800 calc(var(--u) * 36)/1 var(--sans); letter-spacing: -0.06em; }
</style>
</head>
<body>
<div class="far"><div class="lights"></div><div class="card"><div class="k"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10 9.5v5l4.2-2.5z"/></svg>launch-16x9</div><b>41 s</b><span class="pill up">Shipped</span></div></div>
<div class="near"><h1>Draft</h1></div>
<script type="module">
import { curveToLinear, CURVES } from '/core/motion/springs.js';
import { rng } from '/core/motion/springs.js';
const E = CURVES.expoOut;
const pull = curveToLinear((u) => (u < 0.5 ? 0.5 * (1 - E(1 - 2 * u)) : 0.5 + 0.5 * E(2 * u - 1)));
const far = document.querySelector('.far'), near = document.querySelector('.near'), lights = document.querySelector('.lights');
const rand = rng(11);
for (let i = 0; i < 16; i++) {
  const dot = document.createElement('i');
  dot.style.left = `${rand() * 96}vw`; dot.style.top = `${rand() * 90}vh`; dot.style.opacity = (0.35 + rand() * 0.6).toFixed(2);
  lights.appendChild(dot);
}
const beat = { duration: 700, delay: 550, easing: pull, fill: 'both' };
near.animate([{ filter: 'blur(0px)' }, { filter: 'blur(1.9vh)' }], beat);
far.animate([{ filter: 'blur(1.9vh)' }, { filter: 'blur(0px)' }], beat);
// focus breathing: the lens changes its field of view a little as focus moves, the far plane grows and the near one shrinks
far.animate([{ scale: 1.015 }, { scale: 1 }], beat);
near.animate([{ scale: 1 }, { scale: 0.985 }], beat);
near.animate([{ opacity: 1 }, { opacity: 0.55 }], beat);
</script>
</body>
</html>
