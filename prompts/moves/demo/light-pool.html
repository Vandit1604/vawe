<!doctype html>
<html data-aspect="16:9" data-look="editorial" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="duration" content="4.5">
<title>move: light pool</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<script type="application/json" id="authoring">{"allow": ["text-unreadable-hold", "text-moves-before-hold", "world-held@0.0-4.5"], "_why": {"text-unreadable-hold": "the copy holds 3.0 s after its last word at 1.0 s, and the check asks 5.4 s", "text-moves-before-hold": "the copy leaves at 4.1 s, 0.4 s before the 4.5 s end, short of the 5.4 s the check asks", "world-held@0.0-4.5": "one ribbed wall holds 4.5 s: the type rises from 0.1 s and the light wanders through the clip"}}</script>
<style>
  body { display: block; position: relative; --rib: calc(var(--u) * 6); }
  .wall, .lit { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, #cfc9bd 0, #d8d3c8 calc(var(--rib) * 0.2), #cdc7ba calc(var(--rib) * 0.55), #b9b2a4 var(--rib)); }
  .lit { background: repeating-linear-gradient(90deg, #f3eee3 0, #fffaf0 calc(var(--rib) * 0.2), #eee8dc calc(var(--rib) * 0.55), #d3ccbd var(--rib));
         -webkit-mask-image: radial-gradient(closest-side, #000 0%, rgb(0 0 0 / 0.78) 30%, rgb(0 0 0 / 0.32) 62%, transparent 100%); -webkit-mask-repeat: no-repeat;
         -webkit-mask-size: calc(var(--u) * 120) calc(var(--u) * 92); -webkit-mask-position: var(--px, 60%) var(--py, 40%); }
  .fall { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgb(60 50 35 / 0.22) 100%); }
  .copy { position: absolute; left: 9vw; top: 0; bottom: 0; width: 56vw; z-index: 2; color: #26211b; display: flex; flex-direction: column; justify-content: center; }
  .copy .title { margin: 0; font-size: calc(var(--u) * 17); line-height: 1.04; font-weight: 300; }
  .copy .lead { margin: var(--s3) 0 0; max-width: 24em; font-weight: 400; }
  .mask { display: block; overflow: hidden; padding: 0.1em 0.1em 0.25em; margin: -0.1em -0.1em -0.25em; }
  .mask > span { display: block; translate: 0 118%; animation: rise 0.7s var(--settle) both; animation-delay: calc(0.12s + var(--i) * 0.14s); }
  @keyframes rise { to { translate: 0 0; } }
</style>
</head>
<body>
<div class="wall"></div>
<div class="lit" id="lit"></div>
<div class="fall"></div>
<main class="copy" id="copy">
  <h1 class="title"><span class="mask" style="--i:0"><span>One light,</span></span><span class="mask" style="--i:1"><span>wandering.</span></span></h1>
  <p class="lead">A soft pool crosses a ribbed wall on a seeded path.</p>
</main>
<script type="module">
import '/core/engine/page-api.js';
import { noise1 } from '/core/motion/springs.js';
import { EASE } from '/core/motion/presets.js';
import { leave, arrive } from '/prompts/moves/demo/assets/stage.js';

const root = document.documentElement;
root.style.setProperty('--settle', EASE.land);
const copy = document.getElementById('copy');
arrive(copy.querySelector('.lead'), 800, { ms: 420, from: '1.2vh' });
leave(copy, 4500);

// The pool is a mask over a brighter copy of the same ribs, so each rib lights where the pool is. noise1 is a pure function of the seek time and the seed.
const lit = document.getElementById('lit');
const RATE = 1.3;                                      // noise steps a second
const AMP_X = 0.36, AMP_Y = 0.26;                      // travel as shares of the frame width and height
vawe.onFrame((t) => {
  const W = innerWidth, H = innerHeight, mw = 1.2 * H, mh = 0.92 * H;
  const x = W * (0.52 + AMP_X * noise1(t * RATE, 11)) - mw / 2;
  const y = H * (0.45 + AMP_Y * noise1(t * RATE, 23)) - mh / 2;
  lit.style.setProperty('--px', `${x.toFixed(1)}px`);
  lit.style.setProperty('--py', `${y.toFixed(1)}px`);
});
</script>
</body>
</html>
