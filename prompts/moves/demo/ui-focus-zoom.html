<!doctype html>
<html data-aspect="16:9" data-look="soft">
<head>
<meta charset="utf-8">
<meta name="duration" content="1.3">
<title>move: ui focus zoom</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; position: relative; }
  .world { position: absolute; inset: 0; transform-origin: 0 0; }
  .win { position: absolute; left: 9vw; top: 16vh; width: 82vw; height: 68vh; padding: calc(var(--u) * 4.6) calc(var(--u) * 5); border-radius: calc(var(--u) * 3.2); }
  .bar { display: flex; align-items: center; justify-content: space-between; }
  .bar h2 { margin: 0; font: 700 var(--t-head)/1 var(--sans); letter-spacing: -0.025em; }
  .bar .small { color: var(--muted); }
  .row { display: grid; grid-template-columns: 1fr 12vw 22vw 8vw; align-items: center; height: calc(var(--u) * 11.4); border-top: 1px solid var(--line); color: var(--muted); font: 500 var(--t-body)/1 var(--sans); }
  .row b { display: flex; align-items: center; gap: var(--s2); color: var(--ink); font-weight: 600; }
  .row b .thumb { flex: none; width: calc(var(--u) * 10.4); height: calc(var(--u) * 6.4); border-radius: calc(var(--u) * 1.2); }
  .row b small { font: 500 var(--t-small)/1 var(--mono); letter-spacing: -0.02em; color: var(--faint); }
  .row.head { height: calc(var(--u) * 7); margin-top: var(--s3); border-top: 0; font-size: var(--t-small); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); }
  .row .t { text-align: right; }
  .pill { justify-self: start; padding: calc(var(--u) * 1.3) calc(var(--u) * 2.6); font-size: var(--t-body); }
  .cursor path { fill: var(--cursor); stroke: var(--cursor-edge); stroke-width: 1.6; stroke-linejoin: round; }
  .cursor { position: absolute; width: calc(var(--u) * 4.4); height: calc(var(--u) * 4.4); }
</style>
</head>
<body>
<div class="world">
  <div class="win card">
    <div class="bar"><h2>Renders</h2><span class="small">Fernbank Studio, 4 films, 6 outputs</span></div>
    <div class="row head"><span>film</span><span>aspect</span><span>status</span><span class="t">time</span></div>
    <div class="row"><b><img class="photo thumb" src="/prompts/moves/demo/assets/photos/meadow.jpg">launch <small>v12</small></b><span>16:9</span><span><span class="pill up">Shipped</span></span><span class="t">41 s</span></div>
    <div class="row"><b><img class="photo thumb" src="/prompts/moves/demo/assets/photos/shore.jpg">launch <small>v12</small></b><span>9:16</span><span>Rendering, 64%</span><span class="t">27 s</span></div>
    <div class="row"><b><img class="photo thumb" src="/prompts/moves/demo/assets/photos/loft.jpg">changelog <small>v3</small></b><span>1:1</span><span>Queued</span><span class="t">-</span></div>
    <div class="row"><b><img class="photo thumb" src="/prompts/moves/demo/assets/photos/ridge.jpg">teaser <small>v1</small></b><span>4:5</span><span>Queued</span><span class="t">-</span></div>
  </div>
  <svg class="cursor" viewBox="0 0 24 24"><path d="M3 2l17 8-7.5 2.2L9.8 20z"/></svg>
</div>
<script type="module">
import { curveToLinear, CURVES } from '/core/motion/springs.js';
const world = document.querySelector('.world');
const r = document.querySelector('.pill').getBoundingClientRect();
const W = window.innerWidth, H = window.innerHeight;
const cur = document.querySelector('.cursor');
cur.style.left = `${r.left + r.width * 0.72}px`; cur.style.top = `${r.top + r.height * 0.55}px`;   // the cursor lands on the target before the camera moves
const s = (0.36 * W) / r.width;                          // the target fills 36% of the frame width
const tx = W * 0.5 - s * (r.left + r.width / 2), ty = H * 0.5 - s * (r.top + r.height / 2);
cur.animate([{ translate: '-16vw 12vh' }, { translate: '0 0' }],
  { duration: 500, delay: 50, easing: curveToLinear(CURVES.expoOut), fill: 'both' });
// the camera is one translate and one scale on the same curve: the target's centre travels straight to the middle of the frame
world.animate([{ translate: '0 0', scale: 1 }, { translate: `${tx}px ${ty}px`, scale: s }],
  { duration: 1000, delay: 550, easing: curveToLinear(CURVES.spring), fill: 'both' });
</script>
</body>
</html>
