<!doctype html>
<html data-aspect="16:9" data-look="vawe">
<head>
<meta charset="utf-8">
<meta name="duration" content="3.8">
<title>move: word portal</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; }
  .a-label { position: absolute; top: calc(var(--u) * 33); margin: 0; font: 500 var(--t-lead)/1 var(--mono); color: var(--muted); z-index: 1; white-space: pre; }
  .a-label.done { top: calc(var(--u) * 23); color: var(--faint); }
  .caret { position: absolute; left: 0; top: 0; z-index: 1; background: var(--accent); transform-origin: 0 0; }
  svg.m { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; visibility: hidden; pointer-events: none; }
  svg.m text, svg.clip text { font: 800 calc(var(--u) * 26) var(--head); letter-spacing: -0.04em; }
  .b { position: absolute; inset: 0; z-index: 2; background: var(--accent); color: var(--on-accent); clip-path: url(#portal); }
  .b h1 { position: absolute; left: 0; right: 0; top: calc(var(--u) * 12); margin: 0; text-align: center; font: 800 calc(var(--u) * 14)/1 var(--head); letter-spacing: -0.05em; }
  .b .tiles { position: absolute; left: 0; right: 0; top: calc(var(--u) * 33); display: flex; justify-content: center; align-items: center; gap: var(--s3); }
  .b .tile { position: relative; height: calc(var(--u) * 36); border-radius: var(--r4); background: var(--paper); color: var(--paper-ink); box-shadow: var(--stack); }
  .b .tile span { position: absolute; left: var(--s2); top: var(--s2); font: 600 var(--t-small)/1 var(--mono); }
  .b .tile i { position: absolute; left: var(--s2); right: var(--s2); bottom: var(--s2); height: calc(var(--u) * 1.1); border-radius: 999px; background: color-mix(in srgb, var(--paper-ink) 14%, transparent); overflow: hidden; }
  .b .tile i::after { content: ''; position: absolute; inset: 0 0 0 0; border-radius: inherit; background: var(--paper-ink); }
  .b .t11 { width: calc(var(--u) * 36); } .b .t169 { width: calc(var(--u) * 64); } .b .t916 { width: calc(var(--u) * 20.25); }
  .b .url { position: absolute; left: 0; right: 0; top: calc(var(--u) * 78); margin: 0; text-align: center; font: 500 var(--t-lead)/1 var(--mono); }
</style>
</head>
<body>
<svg class="m" aria-hidden="true"><text id="measure" x="0" y="0">launch</text></svg>
<svg class="clip" width="0" height="0" style="position:absolute" aria-hidden="true"><defs><clipPath id="portal" clipPathUnits="userSpaceOnUse"><text id="ptext" x="0" y="0" ></text></clipPath></defs></svg>
<p class="a-label done" id="done">✓ 3 formats rendered</p>
<p class="a-label" id="label">$ vawe ship --to</p>
<div class="caret" id="caret"></div>
<section class="b" id="b">
  <div class="tiles">
    <div class="tile t11 pop"><span>1:1</span><i></i></div>
    <div class="tile t169 pop"><span>16:9</span><i></i></div>
    <div class="tile t916 pop"><span>9:16</span><i></i></div>
  </div>
  <h1 class="pop">Live in 41 s</h1>
  <p class="url pop">vawe.dev/launch</p>
</section>
<script type="module">
import '/core/engine/page-api.js';
import { easeFn } from '/core/motion/presets.js';
const W = innerWidth, H = innerHeight, u = H / 100, clamp = (x) => Math.min(1, Math.max(0, x));
const WORD = 'launch', F = 26 * u, Y0 = 64 * u;
const measure = document.getElementById('measure'), ptext = document.getElementById('ptext'), caret = document.getElementById('caret'), b = document.getElementById('b');
const pops = [...b.querySelectorAll('.pop')], labels = [document.getElementById('label'), document.getElementById('done')];
const land = easeFn('land'), swap = easeFn('swap');
const TYPE = 0.3, STEP = 0.14, T0 = 1.6, DUR = 1.15;            // the portal opens on a lit caret, the last blink after the typing
const END = TYPE + STEP * (WORD.length - 1);
const STEM = 0.19;                                              // ink width of the l's stem as a share of the font size
measure.setAttribute('y', Y0);
vawe.onFrame((t) => {
  const X0 = (W - measure.getComputedTextLength()) / 2;          // the word sits centred; measured per frame, the face may load after the first paint
  measure.setAttribute('x', X0);
  labels.forEach((el) => { el.style.left = `${X0 + 0.02 * F}px`; });
  const typed = t < TYPE ? 0 : Math.min(WORD.length, Math.floor((t - TYPE) / STEP) + 1);
  const ext = measure.getExtentOfChar(0);
  const ox = ext.x + ext.width / 2, oy = Y0 - 0.37 * F;          // the middle of the stem of the first letter
  const S = (1.15 * W) / (STEM * F);
  const q = clamp((t - T0) / DUR), p = 0.4 * q + 0.6 * swap(q);  // a linear share keeps the growth readable through the middle
  const s = Math.exp(Math.log(S) * p);
  const px = ox + (W / 2 - ox) * p, py = oy + (H / 2 - oy) * p;   // the stem drifts to the middle as it grows
  const m = `translate(${px - s * ox}px, ${py - s * oy}px) scale(${s})`;
  ptext.textContent = WORD.slice(0, typed);
  ptext.setAttribute('x', X0); ptext.setAttribute('y', Y0); 
  ptext.setAttribute('transform', `translate(${px - s * ox} ${py - s * oy}) scale(${s})`);
  const cx = X0 + (typed ? measure.getSubStringLength(0, typed) : 0) + 0.02 * F;
  const lit = t < END + STEP + 0.02 || Math.floor((t - END - STEP) / 0.3) % 2 === 0;
  caret.style.width = `${0.075 * F}px`; caret.style.height = `${0.8 * F}px`;
  caret.style.left = `${cx}px`; caret.style.top = `${Y0 - 0.72 * F}px`;
  caret.style.transform = m;
  caret.style.visibility = lit && t > TYPE - 0.1 ? 'visible' : 'hidden';
  b.style.clipPath = q >= 1 ? 'none' : 'url(#portal)';
  pops.forEach((el, i) => {
    const k = land(clamp((t - T0 - 0.1 - i * 0.12) / 0.7));
    el.style.translate = `0 ${(1 - k) * 7 * u}px`;
    el.style.opacity = String(clamp(k * 4));
  });
});
</script>
</body>
</html>
