<!doctype html>
<html data-aspect="16:9" data-look="daylight">
<head>
<meta charset="utf-8">
<meta name="duration" content="3.6">
<title>move: cursor spotlight</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; position: relative; }
  .shot { position: absolute; inset: 0; }
  .a .card { position: absolute; left: 15vw; top: calc(var(--u) * 20); width: 70vw; height: calc(var(--u) * 60); display: grid; grid-template-columns: 1fr auto; align-items: stretch; padding: var(--s5); }
  .a .copy { display: flex; flex-direction: column; justify-content: space-between; }
  .a h1 { margin: var(--s1) 0 var(--s2); font-size: var(--t-head); }
  .a .rows { display: grid; gap: var(--s2); width: 27vw; }
  .a .row { display: flex; justify-content: space-between; padding-bottom: var(--s2); border-bottom: 1px solid var(--line); }
  .a .side { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; }
  .a .btn { padding-block: calc(var(--u) * 3.2); padding-inline: calc(var(--u) * 7); font-size: var(--t-lead); }
  .a .spark { width: 18vw; height: calc(var(--u) * 15); display: flex; align-items: flex-end; gap: calc(var(--u) * 1.2); }
  .a .spark i { flex: 1; border-radius: var(--r1); background: var(--dot); }
  .a .spark i:last-child { background: var(--accent); }
  .a { z-index: 1; }
  .b { z-index: 5; background: linear-gradient(135deg, #3a2ec9 0%, #4f3df0 55%, #6a5bff 100%); color: #fff; }
  .b .wrap { position: absolute; inset: 0; }
  .b .eyebrow { position: absolute; left: 8vw; top: calc(var(--u) * 22); color: rgba(255, 255, 255, 0.72); }
  .b .big { position: absolute; left: 8vw; top: calc(var(--u) * 28); margin: 0; font: 600 calc(var(--u) * 24)/1 var(--sans); letter-spacing: -0.05em; }
  .b .delta { position: absolute; left: 8.3vw; top: calc(var(--u) * 57); background: rgba(255, 255, 255, 0.16); color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28); }
  .bars { position: absolute; left: 50vw; right: 8vw; top: calc(var(--u) * 22); height: calc(var(--u) * 40); display: flex; align-items: flex-end; gap: calc(var(--u) * 2.2); }
  .bars i { flex: 1; height: 100%; background: rgba(255, 255, 255, 0.34); border-radius: var(--r2) var(--r2) 0 0; transform-origin: 50% 100%; }
  .bars i:last-child { background: #fff; }
  .days { position: absolute; left: 50vw; right: 8vw; top: calc(var(--u) * 65); display: flex; gap: calc(var(--u) * 2.2); font: 500 var(--t-small)/1 var(--sans); color: rgba(255, 255, 255, 0.72); }
  .days span { flex: 1; text-align: center; }
  .cursor { position: absolute; left: 0; top: 0; z-index: 10; width: calc(var(--u) * 5.2); height: calc(var(--u) * 5.2); overflow: visible; transform-origin: 0 0; }
  .cursor path { fill: #fff; stroke: #0f2033; stroke-width: 1.4; stroke-linejoin: round; }
  .cur { position: absolute; left: 0; top: 0; z-index: 10; }
</style>
</head>
<body>
<section class="shot b"><div class="wrap">
  <div class="eyebrow">Weekly report</div>
  <h2 class="big" id="num">4,210</h2>
  <div class="pill delta">+31% vs last week</div>
  <div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="days"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
</div></section>
<section class="shot a" id="a">
  <div class="card">
    <div class="copy">
      <div><div class="eyebrow">Reports</div><h1 class="title">Weekly report</h1><span class="lead muted">Ready to open</span></div>
      <div class="rows"><div class="row body"><span>Signups</span><b>4,210</b></div><div class="row body"><span>Activation</span><b>61%</b></div></div>
    </div>
    <div class="side"><div class="spark"><i style="height:34%"></i><i style="height:50%"></i><i style="height:42%"></i><i style="height:62%"></i><i style="height:55%"></i><i style="height:78%"></i><i style="height:100%"></i></div><div class="btn primary" id="btn">Open report</div></div>
  </div>
</section>
<div class="cur" id="cur"><svg class="cursor" id="arrow" viewBox="0 0 24 24"><path transform="translate(-2 -2)" d="M2 2 L2 19 L6.6 14.8 L9.6 21.6 L12.6 20.3 L9.6 13.6 L15.8 13.4 Z"/></svg></div>
<script type="module">
import '/core/engine/page-api.js';
import { easeFn } from '/core/motion/presets.js';
const W = innerWidth, H = innerHeight, u = H / 100;
const clamp = (x) => Math.min(1, Math.max(0, x)), lerp = (p, q, k) => p + (q - p) * k;
const land = easeFn('land'), settle = easeFn('settle'), launch = easeFn('launch');
const a = document.getElementById('a'), b = document.querySelector('.b'), btn = document.getElementById('btn');
const cur = document.getElementById('cur'), arrow = document.getElementById('arrow');
const bars = [...document.querySelectorAll('.bars i')], num = document.getElementById('num');
const r = btn.getBoundingClientRect();
const P = { x: r.left + r.width * 0.78, y: r.top + r.height * 0.7 };       // the point that clicks: the tip
const FROM = { x: 0.2 * W, y: 0.88 * H };
const T = { travel: [0.3, 1.1], press: 1.4, grow: 1.5, growDur: 0.8, leave: 2.9 };
const R0 = 0.9 * u;                                                         // the circle is born as a tip-sized spot
const DRIFT = { x: 0.02 * W, y: 0.012 * H };
const FAR = Math.max(...[[0, 0], [W, 0], [0, H], [W, H]].map(([x, y]) => Math.hypot(P.x + DRIFT.x - x, P.y + DRIFT.y - y)));
const EDGE = 1.2 * u;                                                       // the edge softness stays a constant width, so it reads as a mask edge at every size
const RMAX = FAR + EDGE * 1.5;                                              // the opaque core, R minus the edge, must reach the farthest corner
const BAR = [0.34, 0.5, 0.42, 0.62, 0.55, 0.78, 1];
vawe.onFrame((t) => {
  const tr = clamp((t - T.travel[0]) / (T.travel[1] - T.travel[0]));
  const k = clamp((t - T.grow) / T.growDur);
  const drift = settle(clamp((t - T.press) / 1.0));                         // the hand keeps going a little after the click, so the tip is never frozen under the circle
  const x = lerp(FROM.x, P.x, land(tr)) + DRIFT.x * drift, y = lerp(FROM.y, P.y, settle(tr)) + DRIFT.y * drift;
  const lv = clamp((t - T.leave) / 0.35);
  cur.style.transform = `translate(${x + 0.3 * W * launch(lv)}px, ${y + 0.4 * H * launch(lv)}px)`;
  const dip = Math.sin(Math.PI * clamp((t - T.press) / 0.22));
  arrow.style.transform = `scale(${1 - 0.14 * dip})`;
  btn.style.transform = `scale(${1 - 0.035 * dip})`;
  const g = k * k * (3 - 2 * k) * 0.35 + settle(k) * 0.65;
  const R = lerp(R0, RMAX, g), f = Math.min(Math.max(R * 0.3, 0.3 * u), EDGE);
  const m = `radial-gradient(circle at ${x}px ${y}px, #000 ${Math.max(R - f, 0)}px, transparent ${R}px)`;
  b.style.visibility = t < T.grow ? 'hidden' : 'visible';
  b.style.webkitMaskImage = m; b.style.maskImage = m;
  b.firstElementChild.style.transform = `scale(${lerp(1.06, 1, land(k))})`;
  bars.forEach((el, i) => { el.style.transform = `scaleY(${BAR[i] * (0.7 + 0.3 * land(clamp((t - T.grow - 0.5 - i * 0.05) / 0.8)))})`; });
  const n = Math.round(lerp(3210, 4210, land(clamp((t - T.grow - 0.5) / 1.1))));
  num.textContent = n.toLocaleString('en-US');
});
</script>
</body>
</html>
