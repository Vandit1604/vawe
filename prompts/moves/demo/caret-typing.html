<!doctype html>
<html data-aspect="16:9">
<head>
<meta charset="utf-8">
<meta name="duration" content="1">
<title>move: caret typing</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  .line { display: flex; align-items: center; gap: 0.6em; font: 500 calc(var(--u) * 12)/1 var(--mono); letter-spacing: -0.02em; }
  .prompt { color: var(--faint); }

  /* the caret is the next flex item, so it moves with every character the text reveals */
  .type { display: inline-flex; align-items: center; }
  .text { overflow: hidden; white-space: nowrap; width: 0;
          animation-name: type; animation-duration: 0.5s; animation-delay: 0.05s;
          animation-timing-function: steps(9, end); animation-fill-mode: both; }
  .caret { width: 0.08em; height: 1em; margin-left: 0.06em; background: var(--accent);
           animation-name: become; animation-duration: 0.35s; animation-delay: 0.6s;
           animation-timing-function: var(--settle); animation-fill-mode: both; }
  @keyframes type { to { width: 9ch; } }
  /* the caret becomes the rule under the word: no new element enters, the one on screen changes job */
  @keyframes become { to { width: 9ch; height: 0.12em; translate: calc(-9ch - 0.06em) 0.64em; } }
</style>
</head>
<body>
<div class="line"><span class="prompt">$</span><div class="type"><span class="text">vawe ship</span><span class="caret"></span></div></div>
<script type="module">
import { curveToLinear, CURVES } from '/core/motion/springs.js';
document.documentElement.style.setProperty('--settle', curveToLinear(CURVES.expoOut));
</script>
</body>
</html>
