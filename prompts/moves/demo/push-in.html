<!doctype html>
<html data-aspect="16:9" data-look="swiss">
<head>
<meta charset="utf-8">
<meta name="duration" content="2">
<title>move: push in</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; position: relative; }
  .bg { position: absolute; inset: -10%; background: radial-gradient(var(--dot) calc(var(--u) * 0.2), transparent calc(var(--u) * 0.26)) 0 0 / calc(var(--u) * 4.4) calc(var(--u) * 4.4); transform-origin: 34% 50%; }
  .world { position: absolute; inset: 0; transform-origin: 34vw 46vh; }
  .card { position: absolute; left: 14vw; top: 16vh; width: 62vw; height: 68vh; padding: calc(var(--u) * 5.4) calc(var(--u) * 5.6); }
  .top { display: flex; align-items: center; gap: var(--s3); }
  .top .chip { --size: calc(var(--u) * 8); }
  .top .icon { width: calc(var(--u) * 4.4); height: calc(var(--u) * 4.4); }
  .top .name { font: 600 var(--t-body)/1 var(--mono); letter-spacing: -0.02em; color: var(--muted); }
  .top .pill { margin-left: auto; }
  .num { margin-top: calc(var(--u) * 3.6); font: 700 calc(var(--u) * 24)/0.9 var(--sans); letter-spacing: -0.055em; }
  .num small { margin-left: var(--s2); font: 600 var(--t-head)/1 var(--sans); letter-spacing: -0.02em; color: var(--muted); }
  .cap { margin-top: var(--s2); font: 500 var(--t-body)/1.2 var(--sans); color: var(--muted); }
  .bars { position: absolute; left: calc(var(--u) * 5.6); right: calc(var(--u) * 5.6); bottom: calc(var(--u) * 5.4); display: flex; gap: var(--s2); align-items: flex-end; height: calc(var(--u) * 15); }
  .bars i { flex: 1; background: var(--raised); border-radius: calc(var(--u) * 0.8); box-shadow: var(--ring); }
  .bars i:last-child { background: var(--accent); box-shadow: none; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="world">
  <div class="card">
    <div class="top"><div class="chip"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10 9.5v5l4.2-2.5z"/></svg></div><span class="name">launch-16x9</span><span class="pill up">Live</span></div>
    <div class="num">41<small>seconds</small></div>
    <div class="cap">Median render time, last 7 films</div>
    <div class="bars"><i style="height:38%"></i><i style="height:52%"></i><i style="height:45%"></i><i style="height:66%"></i><i style="height:58%"></i><i style="height:80%"></i><i style="height:100%"></i></div>
  </div>
</div>
<script type="module">
import { curveToLinear, CURVES } from '/core/motion/springs.js';
// half constant speed, half expoOut: the camera keeps moving to the last frame and still lands soft
const push = curveToLinear((u) => 0.5 * u + 0.5 * CURVES.expoOut(u));
const opts = { duration: 2000, easing: push, fill: 'both' };
// the subject scales further than the ground behind it, so the two layers separate as the camera closes in
document.querySelector('.world').animate([{ scale: 1 }, { scale: 1.2 }], opts);
document.querySelector('.bg').animate([{ scale: 1 }, { scale: 1.05 }], opts);
</script>
</body>
</html>
