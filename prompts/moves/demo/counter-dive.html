<!doctype html>
<html data-aspect="16:9" data-look="field">
<head>
<meta charset="utf-8">
<meta name="duration" content="3.6">
<title>move: counter dive</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; }
  #layers { position: absolute; inset: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; background: var(--accent); }
  .a, .b { position: absolute; inset: 0; transform-origin: 0 0; }
  .a { background: var(--ground); z-index: 1; display: grid; place-items: center; align-content: center; gap: var(--s3); }
  .word { margin: 0; font: 800 calc(var(--u) * 40)/1 var(--head); letter-spacing: var(--head-track); white-space: nowrap; }
  .word .o { display: inline-block; width: calc(var(--u) * 24); height: calc(var(--u) * 24); margin: 0 calc(var(--u) * 0.6); border-radius: 50%; background: var(--ink); }
  .tag { font: 500 var(--t-lead)/1 var(--sans); color: var(--muted); }
  .b { background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
  .b .panel { width: calc(var(--u) * 120); display: flex; flex-direction: column; gap: var(--s3); }
  .b .eyebrow { color: var(--on-accent); opacity: 0.7; }
  .b b { font: 800 calc(var(--u) * 22)/1 var(--head); letter-spacing: var(--head-track); }
  .b .bars { display: flex; align-items: flex-end; gap: var(--s2); height: calc(var(--u) * 26); }
  .b .bars i { flex: 1; display: block; border-radius: var(--r2) var(--r2) 0 0; background: var(--ground); transform-origin: 50% 100%; }
  .b .bars i:last-child { background: var(--on-accent); }
</style>
</head>
<body>
<template id="scene">
  <div class="layer">
    <div class="b"><div class="panel"><span class="eyebrow">Views this week</span><b>128,400</b><div class="bars"><i style="height: 38%"></i><i style="height: 52%"></i><i style="height: 47%"></i><i style="height: 74%"></i><i style="height: 100%"></i></div></div></div>
    <div class="a"><h1 class="word">Fl<span class="o"></span>w</h1><span class="tag">One page in, one film out</span></div>
  </div>
</template>
<div id="layers"></div>
<script type="module">
import '/core/engine/page-api.js';
import { easeFn } from '/core/motion/presets.js';
const W = innerWidth, H = innerHeight, u = H / 100, N = 8, FRAME = 1 / 60, clamp = (v) => Math.min(1, Math.max(0, v));
const settle = easeFn('settle'), land = easeFn('land');
const AT = 0.7, DUR = 1.5;                                  // the dive: one eased move in log space, no way back
const host = document.getElementById('layers');
const layers = Array.from({ length: N }, (_, j) => {
  const el = document.createElement('div'); el.className = 'layer';
  el.append(...document.getElementById('scene').content.cloneNode(true).firstElementChild.children);
  el.style.opacity = 1 / (j + 1);   // stacked at 1, 1/2, 1/3 ...: copies at shutter times average into one exposure
  host.append(el);
  return { el, a: el.querySelector('.a'), b: el.querySelector('.b'), bars: [...el.querySelectorAll('.bars i')] };
});
const disc = layers[0].el.querySelector('.o').getBoundingClientRect();
const ox = disc.left + disc.width / 2, oy = disc.top + disc.height / 2, ri = 0.24 * disc.width;   // the counter: 0.48 of the glyph's width
const R = (1.15 * Math.hypot(W / 2, H / 2)) / ri;                                                  // the scale at which the counter covers the frame corners
const hole = `path(evenodd, 'M0 0H${W}V${H}H0Z M${ox + ri} ${oy}A${ri} ${ri} 0 1 0 ${ox - ri} ${oy}A${ri} ${ri} 0 1 0 ${ox + ri} ${oy}Z')`;
layers.forEach((l) => { l.a.style.clipPath = hole; });
const P = (t) => settle(clamp((t - AT) / DUR));
vawe.onFrame((t) => {
  const moving = Math.abs(P(t + FRAME) - P(t - FRAME)) > 1e-5;
  layers.forEach((l, j) => {
    const tj = t + (j / (N - 1) - 0.5) * 0.5 * FRAME;   // 180 degree shutter
    const p = P(tj), s = Math.exp(Math.log(R) * p);       // log path: the same share of the way every frame
    const px = ox + (W / 2 - ox) * p, py = oy + (H / 2 - oy) * p;
    l.el.style.visibility = j === 0 || moving ? 'visible' : 'hidden';
    l.a.style.visibility = s < 0.95 * R ? 'visible' : 'hidden';
    l.a.style.transform = `translate(${px - s * ox}px, ${py - s * oy}px) scale(${s})`;
    const k = s / R;
    l.b.style.transform = `translate(${px - (k * W) / 2}px, ${py - (k * H) / 2}px) scale(${k})`;
    l.bars.forEach((bar, i) => { bar.style.transform = `scaleY(${land(clamp((t - 2.0 - i * 0.08) / 0.55))})`; });
  });
});
</script>
</body>
</html>
