<!doctype html>
<html data-aspect="16:9" data-look="vawe">
<head>
<meta charset="utf-8">
<meta name="duration" content="1.8">
<title>move: pull back reveal</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; position: relative; }
  .bg { position: absolute; left: -300vw; top: -300vh; width: 700vw; height: 700vh; transform-origin: 300vw 300vh; background: radial-gradient(var(--dot) calc(var(--u) * 0.2), transparent calc(var(--u) * 0.26)) 0 0 / calc(var(--u) * 4.4) calc(var(--u) * 4.4); }
  .world { position: absolute; inset: 0; transform-origin: 0 0; }
  .card { position: absolute; left: 20vw; top: 16vh; width: 60vw; height: 68vh; padding: calc(var(--u) * 5) calc(var(--u) * 5.6); }
  .status { display: flex; align-items: center; gap: var(--s2); font: 500 var(--t-body)/1 var(--sans); color: var(--muted); }
  .dot { width: calc(var(--u) * 2.4); height: calc(var(--u) * 2.4); border-radius: 50%; background: var(--accent); }
  .card h1 { margin: calc(var(--u) * 4) 0 0; font: 700 calc(var(--u) * 16)/1 var(--sans); letter-spacing: -0.055em; }
  .card p { margin: var(--s3) 0 0; font: 500 var(--t-lead)/1.25 var(--sans); color: var(--muted); max-width: 40ch; }
  .meta { position: absolute; left: calc(var(--u) * 5.6); right: calc(var(--u) * 5.6); bottom: calc(var(--u) * 4.6); display: flex; justify-content: space-between; padding-top: var(--s3); box-shadow: 0 -1px 0 var(--line); color: var(--muted); font: 500 var(--t-body)/1 var(--sans); }
  .meta b { color: var(--ink); font-weight: 600; }
  .thumb { position: absolute; right: calc(var(--u) * 5.6); top: calc(var(--u) * 5); width: calc(var(--u) * 28); height: calc(var(--u) * 15.75); border-radius: calc(var(--r-card) - var(--u) * 2); box-shadow: var(--stack); }
  .thumb .photo { border-radius: inherit; }
  .thumb span { position: absolute; right: calc(var(--u) * 1.4); bottom: calc(var(--u) * 1.4); padding: calc(var(--u) * 0.7) calc(var(--u) * 1.2); border-radius: calc(var(--u) * 1); background: rgba(10, 9, 13, 0.72); font: 600 calc(var(--u) * 2.6)/1 var(--mono); letter-spacing: -0.02em; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="world">
  <div class="card">
    <div class="thumb"><img class="photo" src="/prompts/moves/demo/assets/photos/meadow.jpg" alt=""><span>0:41</span></div>
    <div class="status"><i class="dot"></i>Live now</div>
    <h1>Shipped.</h1>
    <p>launch-16x9 rendered 3 aspect ratios in 41 seconds</p>
    <div class="meta"><span><b>60</b> fps</span><span><b>1080p</b></span><span><b>-14</b> LUFS</span></div>
  </div>
</div>
<script type="module">
import '/core/engine/page-api.js';
import { easeFn } from '/core/motion/presets.js';
const world = document.querySelector('.world'), bg = document.querySelector('.bg');
const r = document.querySelector('.dot').getBoundingClientRect();
const W = window.innerWidth, H = window.innerHeight;
const d = { x: r.left + r.width / 2, y: r.top + r.height / 2 }, c = { x: W / 2, y: H / 2 };
const s0 = 9, t0 = 0.1, dur = 1.6;
// fast, then a long soft arrival
const ease = easeFn('land');
vawe.onFrame((t) => {
  const u = Math.min(1, Math.max(0, (t - t0) / dur)), p = ease(u);
  // zoom is multiplicative, so scale runs on a log path: equal steps read as equal speed
  const s = Math.exp(Math.log(s0) * (1 - p));
  const cam = { x: d.x + (c.x - d.x) * p, y: d.y + (c.y - d.y) * p };   // the dot is centred at the start and the card is centred at the end
  world.style.transform = `translate(${c.x - s * cam.x}px, ${c.y - s * cam.y}px) scale(${s})`;
  const sb = Math.pow(s, 0.55);                                        // the ground moves less, so it reads as far behind
  bg.style.transform = `translate(${c.x - sb * cam.x}px, ${c.y - sb * cam.y}px) scale(${sb})`;
});
</script>
</body>
</html>
