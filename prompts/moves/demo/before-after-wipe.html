<!doctype html>
<html data-aspect="16:9" data-look="soft">
<head>
<meta charset="utf-8">
<meta name="duration" content="2">
<title>move: before and after wipe</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  .card { position: relative; width: calc(var(--u) * 132); height: calc(var(--u) * 66); padding: 0; overflow: hidden; }
  .state { position: absolute; inset: 0; padding: var(--s4) calc(var(--u) * 5.6); display: flex; flex-direction: column; }
  .after { background: var(--surface); }
  .head { display: flex; align-items: center; gap: var(--s2); font: 600 var(--t-small)/1 var(--sans); color: var(--muted); }
  .head b { color: var(--ink); font-weight: 700; }
  .head .pill { margin-left: auto; }
  .read { display: flex; align-items: baseline; gap: var(--s2); margin-top: calc(var(--u) * 2.6); }
  .num { font: 800 calc(var(--u) * 16)/1 var(--sans); letter-spacing: -0.05em; }
  .unit { font: 600 var(--t-lead)/1 var(--sans); color: var(--muted); }
  .chart { flex: 1; min-height: 0; margin-top: var(--s2); }
  .chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .after .pill.up { color: var(--accent); }
  .slo { position: absolute; right: 0; top: 78%; }
  .before .num { color: var(--faint); }
  .before .pill { color: var(--muted); }
  .scan { position: absolute; top: 0; bottom: 0; left: 0; width: calc(var(--u) * 0.5); background: var(--accent); }
  .trail { position: absolute; top: 0; bottom: 0; right: 100%; width: calc(var(--u) * 14); background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 16%, transparent)); }
  .grip { position: absolute; top: 50%; left: 50%; translate: -50% -50%; width: calc(var(--u) * 7); height: calc(var(--u) * 7); border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: var(--accent-edge), 0 calc(var(--u) * 0.6) calc(var(--u) * 1.6) rgba(60, 50, 160, 0.3); }
  .grip .icon { width: calc(var(--u) * 4); height: calc(var(--u) * 4); stroke-width: 2; }
</style>
</head>
<body>
<div class="card">
  <div class="state before">
    <div class="head"><b>checkout-api</b> v4.2<span class="pill">p95 latency</span></div>
    <div class="read"><span class="num">812</span><span class="unit">ms</span></div>
    <div class="chart" style="position:relative"><span class="slo small muted">SLO 200 ms</span><svg viewBox="0 0 400 100" preserveAspectRatio="none">
      <line x1="0" y1="72" x2="400" y2="72" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="5 6" vector-effect="non-scaling-stroke"/>
      <path d="M0 40 L24 22 L44 60 L70 14 L96 52 L120 8 L150 46 L176 18 L204 58 L232 12 L262 44 L290 6 L320 50 L352 20 L376 42 L400 10" fill="none" stroke="var(--faint)" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg></div>
  </div>
  <div class="state after">
    <div class="head"><b>checkout-api</b> v4.3<span class="pill up">-88%</span></div>
    <div class="read"><span class="num accent">96</span><span class="unit">ms</span></div>
    <div class="chart" style="position:relative"><span class="slo small muted">SLO 200 ms</span><svg viewBox="0 0 400 100" preserveAspectRatio="none">
      <line x1="0" y1="72" x2="400" y2="72" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="5 6" vector-effect="non-scaling-stroke"/>
      <path d="M0 86 C60 84 90 88 140 85 C190 82 230 87 280 84 C330 82 370 86 400 84" fill="none" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></div>
  </div>
  <div class="scan"><div class="trail"></div><div class="grip"><svg class="icon" viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg></div></div>
</div>
<script type="module">
import '/core/engine/page-api.js';
import { curveToLinear, CURVES } from '/core/motion/springs.js';
const q = (s) => document.querySelector(s);
const E = CURVES.expoOut, accelerate = curveToLinear((u) => u * u * u);
const scan = (u) => (u < 0.5 ? 0.5 * (1 - E(1 - 2 * u)) : 0.5 + 0.5 * E(2 * u - 1));
const W = q('.card').getBoundingClientRect().width, at = 300, dur = 900;

q('.after').animate([{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)' }], { duration: dur, delay: at, easing: curveToLinear(scan), fill: 'both' });
q('.scan').animate([{ translate: '0 0' }, { translate: `${W}px 0` }], { duration: dur, delay: at, easing: curveToLinear(scan), fill: 'both' });
// the line leaves faster than it came, on the move it was already making
q('.scan').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 80, delay: at - 60, easing: 'linear', fill: 'both' });
q('.scan').animate([{ opacity: 0 }], { duration: 160, delay: at + dur - 120, easing: accelerate, fill: 'both' });
q('.after .pill').animate([{ scale: 0.92, opacity: 0 }, { scale: 1, opacity: 1 }], { duration: 400, delay: at + dur - 120, easing: curveToLinear(E), fill: 'both' });
q('.card').animate([{ scale: 1 }, { scale: 1.035 }], { duration: 2000, easing: 'linear', fill: 'both' });
</script>
</body>
</html>
