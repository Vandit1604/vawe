<!doctype html>
<html data-aspect="16:9" data-look="product" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="duration" content="6">
<meta name="variants" content="dark">
<title>move: model picker</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  /* claude.ai new chat in a Chrome window. Instrument Serif stands in for the greeting face; the colours are the product's own. Sizes are u (1 percent of the frame height). */
  html[data-look="product"] { --cbg: #faf9f5; --ccard: #fff; --cline: rgb(31 30 29 / 0.15); --cink: #141413; --cmuted: #73726c; --corange: #c6613f; --chover: #f0eee6; }
  html[data-look="product"][data-theme="dark"] { --cbg: #262624; --ccard: #30302e; --cline: rgb(222 220 209 / 0.15); --cink: #faf9f5; --cmuted: #9c9a92; --corange: #d97757; --chover: #3a3a37; }
  .page { display: flex; background: var(--cbg); color: var(--cink); font-family: var(--sans); }
  .rail { flex: none; width: calc(var(--u) * 5); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1.3); padding: calc(var(--u) * 1.4) 0; border-right: 1px solid var(--cline); color: var(--cmuted); }
  .rail .icon { width: calc(var(--u) * 2.1); height: calc(var(--u) * 2.1); stroke-width: 1.6; }
  .rail .me { margin-top: auto; width: calc(var(--u) * 2.6); height: calc(var(--u) * 2.6); border-radius: 50%; background: var(--corange); color: #fff; display: grid; place-items: center; font: 600 calc(var(--u) * 1.1)/1 var(--sans); }
  .main { position: relative; flex: 1; min-width: 0; }
  .greet { position: absolute; left: 0; right: 0; top: 16%; display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 1.6); font: 400 calc(var(--u) * 5)/1 'Instrument Serif', Georgia, serif; }
  .greet svg { width: calc(var(--u) * 4.2); height: calc(var(--u) * 4.2); stroke: var(--corange); stroke-width: 2.6; stroke-linecap: round; fill: none; }
  .composer { position: absolute; left: 50%; top: 28%; width: calc(var(--u) * 74); margin-left: calc(var(--u) * -37); border-radius: calc(var(--u) * 2.4); background: var(--ccard); box-shadow: 0 0 0 1px var(--cline), 0 calc(var(--u) * 0.4) calc(var(--u) * 1.6) rgb(0 0 0 / 0.05); }
  .field { position: relative; display: flex; align-items: center; height: calc(var(--u) * 8.4); padding: 0 calc(var(--u) * 2.4); white-space: nowrap; font: 400 calc(var(--u) * 2.6)/1 var(--sans); }
  .ph { position: absolute; color: var(--cmuted); }
  .type { position: relative; display: inline-flex; align-items: center; }
  .cur { width: 1.5px; height: calc(var(--u) * 2.6); margin-left: 1px; background: var(--corange); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .tools { display: flex; align-items: center; gap: calc(var(--u) * 0.8); padding: 0 calc(var(--u) * 1.4) calc(var(--u) * 1.4); }
  .ib { display: grid; place-items: center; width: calc(var(--u) * 3.6); height: calc(var(--u) * 3.6); border-radius: calc(var(--u) * 1.2); box-shadow: 0 0 0 1px var(--cline); color: var(--cmuted); }
  .ib .icon, .pill .icon { width: calc(var(--u) * 2); height: calc(var(--u) * 2); stroke-width: 1.7; }
  .trigger { position: relative; margin-left: auto; display: flex; align-items: center; gap: calc(var(--u) * 0.6); height: calc(var(--u) * 3.6); padding: 0 calc(var(--u) * 1.2); border-radius: calc(var(--u) * 1.2); color: var(--cmuted); font: 400 calc(var(--u) * 2)/1 var(--sans); }
  .trigger .hl { position: absolute; inset: 0; border-radius: inherit; background: var(--chover); }
  .trigger > * { position: relative; }
  .trigger .icon { width: calc(var(--u) * 1.5); height: calc(var(--u) * 1.5); stroke-width: 2; }
  .slot { display: inline-grid; }
  .slot > * { grid-area: 1 / 1; white-space: nowrap; }
  .go { position: relative; display: grid; place-items: center; width: calc(var(--u) * 3.6); height: calc(var(--u) * 3.6); border-radius: calc(var(--u) * 1.2); background: var(--corange); color: #fff; }
  .go .icon { width: calc(var(--u) * 2); height: calc(var(--u) * 2); stroke-width: 2.2; }
  .pills { position: absolute; left: 50%; top: 52%; margin-left: calc(var(--u) * -37); width: calc(var(--u) * 74); display: flex; justify-content: center; gap: calc(var(--u) * 1); }
  .pill { display: flex; align-items: center; gap: calc(var(--u) * 0.8); height: calc(var(--u) * 4.2); padding: 0 calc(var(--u) * 1.6); border-radius: calc(var(--u) * 1.4); box-shadow: 0 0 0 1px var(--cline); color: var(--cmuted); font: 400 calc(var(--u) * 1.9)/1 var(--sans); }

  .menu { position: absolute; z-index: 3; width: calc(var(--u) * 37); padding: calc(var(--u) * 0.8); border-radius: calc(var(--u) * 1.8); background: var(--ccard); box-shadow: 0 0 0 1px var(--cline), 0 calc(var(--u) * 1) calc(var(--u) * 3) rgb(0 0 0 / 0.12); transform-origin: top right; }
  .opt { position: relative; display: flex; align-items: center; justify-content: space-between; height: calc(var(--u) * 5.2); padding: 0 calc(var(--u) * 1.4); border-radius: calc(var(--u) * 1.1); }
  .opt .hov { position: absolute; inset: 0; border-radius: inherit; background: var(--chover); }
  .opt > b, .opt .end { position: relative; }
  .opt .end { display: flex; align-items: center; gap: calc(var(--u) * 1.2); }
  .opt kbd { font: 400 calc(var(--u) * 1.7)/1 var(--sans); color: var(--cmuted); font-variant-numeric: tabular-nums; }
  .opt b { font: 500 calc(var(--u) * 2.1)/1 var(--sans); }
  .ck { position: relative; width: calc(var(--u) * 2); height: calc(var(--u) * 2); color: var(--corange); stroke-width: 2.2; }
  .sep { height: 1px; margin: calc(var(--u) * 0.6) calc(var(--u) * 0.6); background: var(--cline); }
  .row2 { display: flex; align-items: center; justify-content: space-between; height: calc(var(--u) * 5); padding: 0 calc(var(--u) * 1.4); font: 400 calc(var(--u) * 2)/1 var(--sans); }
  .row2 .icon { width: calc(var(--u) * 1.6); height: calc(var(--u) * 1.6); color: var(--cmuted); }
  .sw { width: calc(var(--u) * 4.2); height: calc(var(--u) * 2.4); border-radius: 999px; background: var(--cline); position: relative; }
  .sw::after { content: ''; position: absolute; left: calc(var(--u) * 0.3); top: calc(var(--u) * 0.3); width: calc(var(--u) * 1.8); height: calc(var(--u) * 1.8); border-radius: 50%; background: var(--ccard); box-shadow: 0 1px 2px rgb(0 0 0 / 0.25); }
  .ptr { position: absolute; z-index: 4; left: 0; top: 0; width: calc(var(--u) * 3.4); height: calc(var(--u) * 3.4); }
  .ptr svg { width: 100%; height: 100%; overflow: visible; }
  .ptr path { fill: var(--cursor); stroke: var(--cursor-edge); stroke-width: 1.4; stroke-linejoin: round; }
</style>
<script type="application/json" id="authoring">{"allow": ["text-unreadable-hold", "text-moves-before-hold", "text-lingers", "world-held@0.0-6.0", "static-window@4-5.7", "tile-run@0.2-5.6"], "_why": {"text-unreadable-hold": "the composer line holds 1.75 s after the label changes at 3.85 s in a 6 s clip, and the check asks 5.4 s", "text-moves-before-hold": "the window leaves at 5.6 s, 0.4 s before the 6 s end, so the line holds 1.75 s, short of the 5.4 s the check asks", "text-lingers": "the Sonnet 5.5 label stays 3.35 s from 0.5 s to 3.85 s, 0.35 s over the 3.0 s the check allows, because the model name is what the menu changes", "world-held@0.0-6.0": "one claude.ai screen holds 6.0 s: the prompt types from 0.6 s, the menu opens at 2.65 s and the label swaps at 3.85 s", "static-window@4-5.7": "1.7 s from 4.0 s: the finished claude.ai composer holds still as the product does and only the caret blinks every 0.5 s", "tile-run@0.2-5.6": "28 near-identical tiles from 0.2 s to 5.6 s: the claude.ai screen changes in parts, the menu (about 10% of the window) opens at 2.65 s and the label swaps at 3.85 s"}}</script>
</head>
<body>
<div class="win">
  <div class="strip" data-chrome><span class="lights"><i></i><i></i><i></i></span>
    <span class="tab"><i class="fav" style="background:var(--corange)"></i><span>Claude</span><svg class="icon x" data-i="x"></svg></span>
    <svg class="icon newtab" data-i="plus"></svg></div>
  <div class="bar" data-chrome><svg class="icon" data-i="back"></svg><svg class="icon" data-i="fwd"></svg><svg class="icon" data-i="reload"></svg>
    <span class="omni"><svg class="icon" data-i="tune"></svg><span>claude.ai/new</span></span><i class="avatar-dot"></i><svg class="icon" data-i="dots-v"></svg></div>
  <div class="page">
    <div class="rail" data-chrome><svg class="icon" data-i="sidebar"></svg><svg class="icon" data-i="compose"></svg><svg class="icon" data-i="chats"></svg><svg class="icon" data-i="folder"></svg><span class="me">V</span></div>
    <div class="main">
      <div class="greet"><svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9M12 3v18M7.5 4.2l9 15.6M16.5 4.2l-9 15.6"/></svg><span>Good evening</span></div>
      <div class="composer">
        <div class="field"><span class="ph">How can I help you today?</span><span class="type"><span class="typed"></span><i class="cur"></i></span></div>
        <div class="tools">
          <span class="ib"><svg class="icon" data-i="plus"></svg></span><span class="ib"><svg class="icon" data-i="sliders"></svg></span>
          <span class="trigger"><i class="hl"></i><span class="slot"><span class="m1">Sonnet 5.5</span><span class="m2">Opus 5.5</span></span><svg class="icon" data-i="chev"></svg></span>
          <span class="go"><svg class="icon" data-i="up"></svg></span>
        </div>
      </div>
      <div class="pills" data-chrome><span class="pill"><svg class="icon" data-i="pen"></svg>Write</span><span class="pill"><svg class="icon" data-i="cap"></svg>Learn</span><span class="pill"><svg class="icon" data-i="code"></svg>Code</span><span class="pill"><svg class="icon" data-i="cup"></svg>Life stuff</span><span class="pill"><svg class="icon" data-i="spark"></svg>Claude's choice</span></div>
      <div class="menu">
        <div class="opt"><i class="hov"></i><b>Opus 5.5</b><span class="end"><kbd>1</kbd><svg class="icon ck ck2" data-i="check"></svg></span></div>
        <div class="opt"><b>Fable 5.1</b><span class="end"><kbd>2</kbd><svg class="icon ck" data-i="check" style="opacity:0"></svg></span></div>
        <div class="opt"><b>Sonnet 5.5</b><span class="end"><kbd>3</kbd><svg class="icon ck ck1" data-i="check"></svg></span></div>
        <div class="opt"><b>Haiku 5.5</b><span class="end"><kbd>4</kbd><svg class="icon ck" data-i="check" style="opacity:0"></svg></span></div>
        <div class="sep"></div>
        <div class="row2"><span>More models</span><svg class="icon" data-i="fwd"></svg></div>
      </div>
      <div class="ptr"><svg viewBox="0 0 24 24"><path d="M2 2 L2 19 L6.6 14.8 L9.6 21.6 L12.6 20.3 L9.6 13.6 L15.8 13.4 Z"/></svg></div>
    </div>
  </div>
</div>
<script type="module">
import '/core/engine/page-api.js';
import { EASE } from '/core/motion/presets.js';
import { leave, arrive, show, typeTimes, typedCount, between } from '/prompts/moves/demo/assets/stage.js';
const q = (s) => document.querySelector(s), all = (s) => [...document.querySelectorAll(s)];
const END = 6000, TYPE_AT = 600, CURSOR_AT = 1900, OPEN_AT = 2650, PICK_AT = 3450, CLOSE_AT = 3800;

const ICONS = {
  x: '<path d="M6 6l12 12M18 6L6 18"/>', plus: '<path d="M12 5v14M5 12h14"/>', back: '<path d="M19 12H5M11 6l-6 6 6 6"/>', fwd: '<path d="M9 5l7 7-7 7"/>',
  reload: '<path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/>', tune: '<path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/>',
  'dots-v': '<path d="M12 5v.01M12 12v.01M12 19v.01"/>', chev: '<path d="M6 9l6 6 6-6"/>', check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  sidebar: '<rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/>', compose: '<path d="M12 4H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-5"/><path d="M17.5 3.5a2 2 0 0 1 3 3L12 15l-4 1 1-4z"/>',
  chats: '<path d="M5 6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-6l-4 3.5V16H7a2 2 0 0 1-2-2z"/>', folder: '<path d="M4 7a2 2 0 0 1 2-2h4l2 2.5h6a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>',
  sliders: '<path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/>',
  pen: '<path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"/>', cap: '<path d="M2.5 9L12 4.5 21.5 9 12 13.5zM6.5 11.2V16c0 1.2 2.5 2.5 5.5 2.5s5.5-1.3 5.5-2.5v-4.8"/>',
  code: '<path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/>', cup: '<path d="M5 9h11v5a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4zM16 10h1.5a2 2 0 0 1 0 4H16"/>',
  spark: '<path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/>',
};
for (const el of all('[data-i]')) { el.setAttribute('viewBox', '0 0 24 24'); el.innerHTML = ICONS[el.dataset.i]; }

// place the menu under the trigger (right edges aligned) and the pointer on the three spots it visits, from the finished layout
const main = q('.main'), trigger = q('.trigger'), menu = q('.menu'), ptr = q('.ptr'), composer = q('.composer');
const mr = main.getBoundingClientRect(), tr = trigger.getBoundingClientRect(), cr = composer.getBoundingClientRect();
menu.style.left = `${tr.right - mr.left - menu.offsetWidth}px`;
menu.style.top = `${cr.bottom - mr.top + 8}px`;
const mrect = menu.getBoundingClientRect(), opus = q('.opt').getBoundingClientRect();
const at = (x, y) => `${x - mr.left}px ${y - mr.top}px`;
const START = at(mr.right - mr.width * 0.12, mr.bottom - mr.height * 0.14);
const ON_TRIGGER = at(tr.left + tr.width * 0.55, tr.top + tr.height * 0.55);
const ON_OPUS = at(mrect.left + mrect.width * 0.6, opus.top + opus.height * 0.6);

// the window arrives, then the greeting, the composer and the chips 80 ms apart
arrive(q('.win'), 100, { ms: 220, from: '0.8vh' });
arrive(q('.greet'), 220, { ms: 300, from: '0.8vh' });
arrive(composer, 300, { ms: 300, from: '0.8vh' });
arrive(q('.pills'), 380, { ms: 300, from: '0.6vh' });

// the prompt is typed: the text is a pure function of t; the send button wakes with the first key
const prompt = "Summarise last week’s support tickets";
const times = typeTimes(prompt, TYPE_AT);
const typed = q('.typed'), ph = q('.ph');
vawe.onFrame((s) => {
  const n = typedCount(times, s * 1000);
  typed.textContent = prompt.slice(0, n);
  ph.style.visibility = n === 0 ? 'visible' : 'hidden';
});
q('.pills').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 150, delay: times[0], easing: EASE.launch, fill: 'forwards' });
q('.go').animate([{ opacity: 0.4 }, { opacity: 1 }], { duration: 120, delay: times[0], easing: EASE.land, fill: 'both' });

// the pointer travels on a bowed path (x on expoOut, y on a smoothstep) to the trigger, then to the Opus row; each press dips it
const MOVE = EASE.land;
const hop = (from, to, atMs, ms) => ptr.animate([{ translate: from }, { translate: to }], { duration: ms, delay: atMs, easing: MOVE, fill: 'both' });
ptr.animate([{ translate: START, opacity: 0 }, { translate: START, opacity: 1 }], { duration: 120, delay: CURSOR_AT, fill: 'both' });
hop(START, ON_TRIGGER, CURSOR_AT, 650);
hop(ON_TRIGGER, ON_OPUS, OPEN_AT + 250, 420);
const press = (atMs) => ptr.firstElementChild.animate([{ scale: 1 }, { scale: 0.86, offset: 0.45 }, { scale: 1 }], { duration: 200, delay: atMs, easing: EASE.land, fill: 'both' });
press(OPEN_AT - 100);
press(PICK_AT - 100);

// the trigger lights while the menu is open; the menu opens with a short fade and scale and closes fast
between(q('.trigger .hl'), OPEN_AT - 60, CLOSE_AT + 100, END);
menu.animate([{ opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1 }], { duration: 150, delay: OPEN_AT, easing: EASE.land, fill: 'both' });
menu.animate([{ opacity: 0, scale: 0.98 }], { duration: 120, delay: CLOSE_AT, easing: EASE.launch, fill: 'forwards' });

// the Opus row takes the pointer's highlight, the check moves from Sonnet to Opus, the label swaps
between(q('.opt .hov'), OPEN_AT + 640, CLOSE_AT, END);
between(q('.ck1'), null, PICK_AT, END);
show(q('.ck2'), PICK_AT);
show(q('.m1'), null, CLOSE_AT + 50);
show(q('.m2'), CLOSE_AT + 50);
ptr.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 70, delay: CLOSE_AT + 500, easing: EASE.launch, fill: 'forwards' });
leave(q('.win'), END);
</script>
</body>
</html>
