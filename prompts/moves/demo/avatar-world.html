<!doctype html>
<html data-aspect="16:9" data-look="product" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="duration" content="5">
<title>move: avatar world</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<script type="application/json" id="authoring">{"allow": ["static-window@2.1-4.9", "text-unreadable-hold", "text-moves-before-hold", "world-held@0.0-5.0"], "_why": {"static-window@2.1-4.9": "the picture viewer holds still after it opens, as the product does; the pointer rests on it", "text-unreadable-hold": "the profile text is covered by the viewer from 2.0 s, as the real page is", "text-moves-before-hold": "the viewer opens at 1.75 s and the page behind it holds, as the product does", "world-held@0.0-5.0": "one profile page: a tap on the avatar opens its picture, no cut"}}</script>
<style>
  .page { background: #fff; display: flex; justify-content: center; }
  .col { position: relative; width: calc(var(--u) * 92); border-left: 1px solid var(--line); border-right: 1px solid var(--line); font-family: 'Inter', system-ui, sans-serif; color: var(--ink); }
  .banner { height: calc(var(--u) * 19); background: #cfd9de; }
  .banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar { position: absolute; left: calc(var(--u) * 3); top: calc(var(--u) * 9); width: calc(var(--u) * 20); height: calc(var(--u) * 20); border-radius: 50%; border: calc(var(--u) * 0.7) solid #fff; box-sizing: border-box; overflow: hidden; background: #fff; }
  .avatar svg, .big svg { display: block; width: 100%; height: 100%; }
  .actions { display: flex; justify-content: flex-end; align-items: center; gap: calc(var(--u) * 1.2); height: calc(var(--u) * 11); padding: 0 calc(var(--u) * 3); }
  .ic { width: calc(var(--u) * 5.6); height: calc(var(--u) * 5.6); border-radius: 50%; border: 1px solid #cfd9de; display: grid; place-items: center; }
  .ic svg { width: 55%; height: 55%; fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .follow { height: calc(var(--u) * 5.6); padding: 0 calc(var(--u) * 2.8); border-radius: 999px; background: var(--ink); color: #fff; font-weight: 700; font-size: calc(var(--u) * 2.5); display: grid; place-items: center; }
  .who { padding: 0 calc(var(--u) * 3); }
  .name { font-size: calc(var(--u) * 4.2); font-weight: 800; line-height: 1.2; }
  .handle { font-size: calc(var(--u) * 3); color: var(--muted); line-height: 1.3; }
  .bio { margin-top: calc(var(--u) * 1.4); font-size: calc(var(--u) * 3.1); line-height: 1.4; }
  .meta { margin-top: calc(var(--u) * 1.2); font-size: calc(var(--u) * 2.8); color: var(--muted); }
  .counts { margin-top: calc(var(--u) * 1.2); font-size: calc(var(--u) * 3); color: var(--muted); display: flex; gap: calc(var(--u) * 3); }
  .counts b { color: var(--ink); font-weight: 700; }
  .tabs { display: flex; margin-top: calc(var(--u) * 2); border-bottom: 1px solid var(--line); }
  .tabs span { flex: 1; text-align: center; padding: calc(var(--u) * 2) 0; font-size: calc(var(--u) * 2.8); font-weight: 500; color: var(--muted); position: relative; }
  .tabs .on { font-weight: 700; color: var(--ink); }
  .tabs .on::after { content: ''; position: absolute; left: 50%; bottom: 0; width: calc(var(--u) * 7); height: calc(var(--u) * 0.5); margin-left: calc(var(--u) * -3.5); border-radius: 99px; background: #1d9bf0; }
  .lb { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  .lb .dim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.9); opacity: 0; }
  .lb .big { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * 62); height: calc(var(--u) * 62); margin: calc(var(--u) * -31) 0 0 calc(var(--u) * -31); border-radius: 50%; overflow: hidden; opacity: 0; }
  .lb .x { position: absolute; left: calc(var(--u) * 2); top: calc(var(--u) * 2); width: calc(var(--u) * 5); height: calc(var(--u) * 5); border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, 0.14); opacity: 0; }
  .lb .x svg { width: 50%; height: 50%; stroke: #fff; stroke-width: 2; stroke-linecap: round; fill: none; }
  .cur { position: absolute; left: 0; top: 0; z-index: 10; }
  .cursor { display: block; width: calc(var(--u) * 4); height: calc(var(--u) * 4); overflow: visible; transform-origin: 0 0; }
  .cursor path { fill: #fff; stroke: #0f2033; stroke-width: 1.4; stroke-linejoin: round; }
</style>
</head>
<body>
<template id="art"><svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#ffcf70"/><circle cx="62" cy="46" r="14" fill="#fff1c7"/><path d="M0 58 Q 18 53 34 58 T 70 57 T 100 55 L100 100 L0 100Z" fill="#2f8f9d"/><path d="M0 72 Q 25 64 52 71 T 100 67 L100 100 L0 100Z" fill="#1f6f7c"/><path d="M0 86 Q 30 79 60 85 T 100 82 L100 100 L0 100Z" fill="#0e4f5c"/><path d="M24 58 L36 58 L30 44Z" fill="#fff1c7"/></svg></template>
<div class="win" id="win">
  <div class="strip" data-chrome><span class="lights"><i></i><i></i><i></i></span><span class="tab"><i class="fav"></i>Mira Okafor (@miraokafor)</span></div>
  <div class="bar" data-chrome><div class="omni">pebble.example/miraokafor</div></div>
  <div class="page" id="page">
    <div class="col">
      <div class="banner"><img src="/prompts/moves/demo/assets/photos/meadow.jpg" alt=""></div>
      <div class="avatar" id="av"></div>
      <div class="actions"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span><span class="follow">Follow</span></div>
      <div class="who">
        <div class="name">Mira Okafor</div>
        <div class="handle">@miraokafor</div>
        <div class="bio">Illustrator in Lagos. Small posters, big skies. Open for commissions in November.</div>
        <div class="meta">Lagos, Nigeria &nbsp;·&nbsp; mira.example &nbsp;·&nbsp; Joined March 2021</div>
        <div class="counts"><span><b>214</b> Following</span><span><b>12.4K</b> Followers</span></div>
      </div>
      <div class="tabs"><span class="on">Posts</span><span>Replies</span><span>Media</span><span>Likes</span></div>
    </div>
    <div class="lb" id="lb"><div class="dim" id="dim"></div><div class="big" id="big"></div><div class="x" id="x"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div></div>
  </div>
</div>
<div class="cur" id="cur"><svg class="cursor" id="arrow" viewBox="0 0 24 24"><path transform="translate(-2 -2)" d="M2 2 L2 19 L6.6 14.8 L9.6 21.6 L12.6 20.3 L9.6 13.6 L15.8 13.4 Z"/></svg></div>
<script type="module">
import '/core/engine/page-api.js';
import { EASE } from '/core/motion/presets.js';
import { arrive, leave } from '/prompts/moves/demo/assets/stage.js';
const $ = (id) => document.getElementById(id);
const art = $('art').content;
$('av').append(art.cloneNode(true)); $('big').append(art.cloneNode(true));
const W = innerWidth, H = innerHeight, END = 5000, T_TRAVEL = 700, D_TRAVEL = 900, T_PRESS = 1700, T_OPEN = 1800, D_OPEN = 300;

arrive($('win'), 100, { ms: 220, from: '0.8vh' });
// the first frame of the window is 0.8vh low: measure its layout without that offset
const r = $('av').getBoundingClientRect(), pr = $('page').getBoundingClientRect(), b = $('big').getBoundingClientRect();
const dx = (r.left + r.width / 2) - (b.left + b.width / 2), dy = (r.top + r.height / 2) - (b.top + b.height / 2), s0 = r.width / b.width;

// the pointer comes to the avatar, then presses
const tx = r.left + r.width * 0.6, ty = r.top + r.height * 0.62 - 0.008 * H;
$('cur').animate([{ translate: `${0.82 * W}px ${0.9 * H}px` }, { translate: `${tx}px ${ty}px` }], { duration: D_TRAVEL, delay: T_TRAVEL, easing: EASE.land, fill: 'both' });
$('arrow').animate([{ scale: 1 }, { scale: 0.86 }, { scale: 1 }], { duration: 200, delay: T_PRESS, fill: 'both' });

// the picture viewer: the avatar's picture grows from the avatar to the middle of the page, no overshoot, the page dims behind it
const keys = [{ opacity: 1, translate: `${dx}px ${dy}px`, scale: s0 }, { opacity: 1, translate: '0 0', scale: 1 }];
$('big').animate(keys, { duration: D_OPEN, delay: T_OPEN, easing: EASE.land, fill: 'both' });
$('dim').animate([{ opacity: 0 }, { opacity: 1 }], { duration: D_OPEN, delay: T_OPEN, easing: 'linear', fill: 'both' });
$('x').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 150, delay: T_OPEN + D_OPEN, fill: 'both' });
leave($('win'), END);
leave($('cur'), END);
</script>
</body>
</html>
