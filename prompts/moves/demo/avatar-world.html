<!doctype html>
<html data-aspect="16:9" data-look="daylight">
<head>
<meta charset="utf-8">
<meta name="duration" content="3.8">
<title>move: avatar world</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; position: relative; }
  .a { position: absolute; inset: 0; z-index: 1; }
  .a .card { position: absolute; left: 14vw; top: calc(var(--u) * 33); width: 72vw; height: calc(var(--u) * 34); }
  .a .who { position: absolute; left: calc(var(--u) * 33); top: calc(var(--u) * 7.2); }
  .a .who .title { margin-bottom: var(--s2); }
  .a .who .lead { color: var(--muted); }
  .a .btn { position: absolute; right: var(--s5); top: calc(var(--u) * 11); }
  .avatar-world { position: absolute; left: 0; top: 0; z-index: 3; border-radius: 50%; overflow: hidden; }
  .avatar-world svg { display: block; width: 100%; height: 100%; }
  .b { position: absolute; inset: 0; z-index: 4; pointer-events: none; color: #fff; }
  .b .name { position: absolute; left: 8vw; bottom: calc(var(--u) * 24); margin: 0; font: 700 calc(var(--u) * 17)/1 var(--sans); letter-spacing: -0.05em; }
  .b .meta { position: absolute; left: 8.4vw; bottom: calc(var(--u) * 14); margin: 0; font: 500 var(--t-lead)/1 var(--sans); color: #d7f3ee; }
  .b .cta { position: absolute; right: 8vw; bottom: calc(var(--u) * 14); }
  .cur { position: absolute; left: 0; top: 0; z-index: 10; }
  .cursor { display: block; width: calc(var(--u) * 5.2); height: calc(var(--u) * 5.2); overflow: visible; transform-origin: 0 0; }
  .cursor path { fill: #fff; stroke: #0f2033; stroke-width: 1.4; stroke-linejoin: round; }
</style>
</head>
<body>
<section class="a" id="a">
  <div class="card card"><div class="who"><div class="title">Mira Okafor</div><div class="lead">Illustrator, Lagos</div></div><div class="btn primary">Follow</div></div>
</section>
<div class="avatar-world" id="av">
  <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2a8f"/><stop offset="0.38" stop-color="#b8479a"/><stop offset="0.58" stop-color="#ff9a6a"/><stop offset="0.6" stop-color="#ffd08a"/></linearGradient>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b8f8c"/><stop offset="1" stop-color="#0b3b4a"/></linearGradient>
    </defs>
    <rect width="100" height="100" fill="url(#sky)"/>
    <circle id="sun" cx="62" cy="52" r="10" fill="#fff3c9"/>
    <path d="M0 60 Q 18 54 34 60 T 70 59 T 100 56 L100 100 L0 100Z" fill="url(#sea)"/>
    <path d="M0 74 Q 25 64 52 72 T 100 68 L100 100 L0 100Z" fill="#0c4c5a"/>
    <path d="M0 86 Q 30 78 60 85 T 100 82 L100 100 L0 100Z" fill="#07303d"/>
  </svg>
</div>
<section class="b" id="b"><h1 class="name" id="nm">Mira</h1><p class="meta" id="mt">12.4k followers</p><div class="cta" id="cp"><div class="btn primary">Follow</div></div></section>
<div class="cur" id="cur"><svg class="cursor" id="arrow" viewBox="0 0 24 24"><path transform="translate(-2 -2)" d="M2 2 L2 19 L6.6 14.8 L9.6 21.6 L12.6 20.3 L9.6 13.6 L15.8 13.4 Z"/></svg></div>
<script type="module">
import '/core/engine/page-api.js';
import { easeFn } from '/core/motion/presets.js';
const W = innerWidth, H = innerHeight, u = H / 100;
const clamp = (x) => Math.min(1, Math.max(0, x)), lerp = (p, q, k) => p + (q - p) * k;
const land = easeFn('land'), settle = easeFn('settle'), launch = easeFn('launch'), swap = easeFn('swap');
const $ = (id) => document.getElementById(id);
const av = $('av'), a = $('a'), cur = $('cur'), arrow = $('arrow'), sun = $('sun');
const D = 22 * u, START = { x: 14 * (W / 100) + 7 * u + D / 2, y: 50 * u };   // the avatar's circle in the card
const CENTER = { x: W / 2, y: H / 2 };
const SMAX = (Math.hypot(W, H) / 2 / (D / 2)) * 1.03;                           // its radius reaches the farthest corner
av.style.width = av.style.height = `${D}px`;
const T = { travel: [0.2, 0.95], press: 1.0, grow: 1.12, growDur: 0.95, leave: 1.15 };
const P = { x: START.x + D * 0.28, y: START.y + D * 0.3 };
vawe.onFrame((t) => {
  const tr = clamp((t - T.travel[0]) / (T.travel[1] - T.travel[0])), lv = clamp((t - T.leave) / 0.3);
  cur.style.transform = `translate(${lerp(0.8 * W, P.x, land(tr)) + 0.5 * W * launch(lv)}px, ${lerp(0.9 * H, P.y, settle(tr)) + 0.5 * H * launch(lv)}px)`;
  const dip = Math.sin(Math.PI * clamp((t - T.press) / 0.22));
  arrow.style.transform = `scale(${1 - 0.14 * dip})`;
  const k = clamp((t - T.grow) / T.growDur), g = 0.3 * k * k * (3 - 2 * k) + 0.7 * swap(k);
  const s = lerp(1, SMAX, g) * (1 - 0.05 * dip);
  const cx = lerp(START.x, CENTER.x, g), cy = lerp(START.y, CENTER.y, g);
  av.style.transform = `translate(${cx - D / 2}px, ${cy - D / 2}px) scale(${s})`;
  a.style.opacity = lerp(1, 0.55, g).toFixed(3);
  // the art keeps living once it is the ground: the sun climbs
  sun.setAttribute('cy', (52 - 3.5 * clamp((t - T.grow) / 2.6)).toFixed(3));
  const rise = (el, at, d) => { const e = land(clamp((t - at) / 0.7)); el.style.opacity = e; el.style.transform = `translateY(${(1 - e) * d * u}px)`; };
  rise($('nm'), 1.95, 6); rise($('mt'), 2.1, 4); rise($('cp'), 2.25, 4);
  $('mt').textContent = `${(12.4 * land(clamp((t - 2.1) / 1.0))).toFixed(1)}k followers`;
});
</script>
</body>
</html>
