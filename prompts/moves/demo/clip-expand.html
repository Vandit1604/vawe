<!doctype html>
<html data-aspect="16:9" data-look="dusk">
<head>
<meta charset="utf-8">
<meta name="duration" content="1">
<title>move: clip expand from a point</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  :root { --x: 22%; --y: 74%; }
  body { position: relative; display: block; }

  .thumb { position: absolute; left: var(--x); top: var(--y); translate: -50% -50%; display: grid; place-items: center; width: calc(var(--u) * 11); height: calc(var(--u) * 11); border-radius: 50%; background: var(--accent); }
  .thumb .icon { width: calc(var(--u) * 5); height: calc(var(--u) * 5); margin-left: 0.5%; fill: var(--on-accent); stroke: var(--on-accent); stroke-width: 1.5; }

  .panel { position: absolute; inset: 0; display: grid; align-content: center; justify-items: start; gap: var(--s3); padding-left: 14vw; background: var(--raised);
           clip-path: circle(0% at var(--x) var(--y));
           animation-name: expand; animation-duration: 0.8s; animation-delay: 0.15s;
           animation-timing-function: var(--settle); animation-fill-mode: both; }
  .panel .pill { background: var(--ground); font-size: var(--t-body); padding: calc(var(--u) * 1.2) calc(var(--u) * 2.4); }
  .panel h1 { margin: 0; font: 700 calc(var(--u) * 12)/1.04 var(--sans); letter-spacing: -0.04em; }
  .panel p { margin: 0; max-width: 38vw; font: 500 var(--t-lead)/1.25 var(--sans); color: var(--muted); text-wrap: balance; }
  .panel .still { position: absolute; right: 7vw; top: 50%; translate: 0 -50%; width: 34vw; height: calc(var(--u) * 58); box-shadow: var(--shadow-hero); }
  .panel .still span { position: absolute; left: var(--s3); bottom: var(--s3); padding: calc(var(--u) * 1) calc(var(--u) * 1.8); border-radius: 999px; background: rgba(8, 5, 22, 0.72); font: 600 var(--t-small)/1 var(--mono); color: #fff; }
  @keyframes expand { to { clip-path: circle(140% at var(--x) var(--y)); } }
</style>
</head>
<body>
<div class="thumb"><svg class="icon" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg></div>
<div class="panel">
  <span class="pill">Chapter 2 of 5</span>
  <h1>From brief<br>to first cut</h1>
  <p>Six stills, one draft, 41 seconds to render.</p>
  <div class="still"><img class="photo" src="/prompts/moves/demo/assets/photos/desk.jpg"><span>00:14 / 01:02</span></div>
</div>
<script type="module">
import { curveToLinear, CURVES } from '/core/motion/springs.js';
document.documentElement.style.setProperty('--settle', curveToLinear(CURVES.expoOut));
</script>
</body>
</html>
