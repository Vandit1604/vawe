<!doctype html>
<html data-aspect="16:9" data-look="signal">
<head>
<meta charset="utf-8">
<meta name="duration" content="1">
<meta name="blank" content="0-0.1">
<title>move: per-letter stagger</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  h1 { margin: 0; }
  h1 span { display: inline-block; white-space: pre; }
</style>
</head>
<body>
<h1 class="hero">staggered</h1>
<script type="module">
import { EASE } from '/core/motion/presets.js';
const h1 = document.querySelector('h1');
const letters = [...h1.textContent].map((ch) => Object.assign(document.createElement('span'), { textContent: ch }));
h1.replaceChildren(...letters);
// 45 ms per letter: inside the 30 to 80 ms band, so the group never lands on one frame
letters.forEach((s, i) => s.animate(
  [{ translate: '0 0.6em', opacity: 0 }, { translate: '0 0', opacity: 1 }],
  { duration: 550, delay: 100 + i * 45, easing: EASE.land, fill: 'both' },
));
</script>
</body>
</html>
