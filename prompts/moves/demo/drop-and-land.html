<!doctype html>
<html data-aspect="16:9" data-look="paper">
<head>
<meta charset="utf-8">
<meta name="duration" content="3.2">
<title>move: drop and land</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; }
  #layers { position: absolute; inset: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; background: var(--ground); }
  .belt { position: absolute; left: 0; top: 0; width: 100%; height: 200vh; }
  .panel { position: absolute; left: 50%; margin-left: calc(var(--u) * -35); width: calc(var(--u) * 70); }
  .shop { top: calc(var(--u) * 22); height: calc(var(--u) * 56); }
  .cart { top: calc(var(--u) * 122); height: calc(var(--u) * 70); }
  .pic { position: absolute; right: var(--s4); top: var(--s4); width: calc(var(--u) * 24); height: calc(var(--u) * 24); }
  .shop h2, .cart h2 { margin: 0; font: 400 var(--t-head)/1.1 var(--head); letter-spacing: var(--head-track); }
    .buy { position: absolute; left: var(--s4); right: var(--s4); bottom: var(--s4); text-align: center; padding: calc(var(--u) * 2.2) 0; }
  .cart .top { display: flex; align-items: center; justify-content: space-between; }
  .badge { display: inline-grid; place-items: center; min-width: calc(var(--u) * 6.4); height: calc(var(--u) * 6.4); padding: 0 var(--s1); border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 600 var(--t-small)/1 var(--sans); }
  .line { display: flex; align-items: center; gap: var(--s2); height: calc(var(--u) * 16); font: 500 var(--t-body)/1 var(--sans); }
  .line .thumb, .slot { flex: none; width: calc(var(--u) * 14); height: calc(var(--u) * 14); border-radius: var(--r-chip); overflow: hidden; }
  .line .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .line .muted { margin-left: auto; font-size: var(--t-small); }
  .slot { border: calc(var(--u) * 0.3) dashed var(--faint); margin-left: 0; }
  .item { position: absolute; z-index: 2; left: 0; top: 0; width: calc(var(--u) * 24); height: calc(var(--u) * 24); margin: calc(var(--u) * -12); border-radius: var(--r-card); overflow: hidden; box-shadow: var(--ring), var(--stack); }
  .item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cur { position: absolute; left: 0; top: 0; }
  .cur svg { display: block; width: calc(var(--u) * 6.4); height: calc(var(--u) * 6.4); transform-origin: 0 0; overflow: visible; }
  .cur path { fill: var(--cursor); stroke: var(--cursor-edge); stroke-width: 1.4; stroke-linejoin: round; }
</style>
</head>
<body>
<template id="scene">
  <div class="belt">
    <div class="card panel shop"><h2>Aero lamp</h2><div class="pic"></div><div class="btn primary buy">Add to cart</div></div>
    <div class="card panel cart">
      <div class="top"><h2>Your cart</h2><span class="badge"><span class="n">2</span></span></div>
      <div class="line"><span class="thumb"><img src="/prompts/moves/demo/assets/photos/desk.jpg" alt=""></span>Desk mat<span class="muted">$24</span></div>
      <div class="line"><span class="thumb"><img src="/prompts/moves/demo/assets/photos/loft.jpg" alt=""></span>Shelf light<span class="muted">$38</span></div>
      <div class="line"><span class="slot"></span><span class="muted">Aero lamp</span></div>
    </div>
    <div class="cur"><svg viewBox="0 0 24 24"><path d="M2 2 L2 19 L6.6 14.8 L9.6 21.6 L12.6 20.3 L9.6 13.6 L15.8 13.4 Z"/></svg></div>
  </div>
  <div class="item"><img src="/prompts/moves/demo/assets/photos/bulb.jpg" alt=""></div>
</template>
<div id="layers"></div>
<script type="module">
import '/core/engine/page-api.js';
import { easeFn } from '/core/motion/presets.js';
import { spring } from '/core/motion/springs.js';
const W = innerWidth, H = innerHeight, u = H / 100, N = 8, FRAME = 1 / 60, clamp = (v) => Math.min(1, Math.max(0, v));
const land = easeFn('land'), settle = easeFn('settle');
const PRESS = 0.62, LIFT = 0.76, FALL = 0.92, LAND = 1.85;   // seconds: the press, the item rises, the fall starts, the item meets the tray
const CAM = { at: 1.0, dur: 0.7 };                          // one tilt down by exactly one frame height, easing at both ends
const camY = (t) => H * settle(clamp((t - CAM.at) / CAM.dur));
const host = document.getElementById('layers');
const layers = Array.from({ length: N }, (_, j) => {
  const el = document.createElement('div'); el.className = 'layer';
  el.append(document.getElementById('scene').content.cloneNode(true));
  el.style.opacity = 1 / (j + 1);   // stacked at 1, 1/2, 1/3 ...: copies at shutter times average into one exposure
  host.append(el);
  return { el, belt: el.querySelector('.belt'), item: el.querySelector('.item'), cur: el.querySelector('.cur'), buy: el.querySelector('.buy'), badge: el.querySelector('.badge'), n: el.querySelector('.n') };
});
const centre = (sel) => { const r = layers[0].el.querySelector(sel).getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };   // world coordinates: the belt starts untransformed
const SLOT = centre('.slot'), START = centre('.pic'), BUY = centre('.buy');
BUY.x += 12 * u;
// the item is free in the frame: gravity from the apex of its lift to the tray's place at LAND, so its speed never steps; x eases so it starts and lands without a sideways step
const itemAt = (t) => {
  const lift = 1.8 * u * land(clamp((t - LIFT) / (FALL - LIFT)));
  const trayNow = SLOT.y - camY(LAND);
  if (t < FALL) return { x: START.x, y: START.y - lift, s: 1, sy: 1 };
  if (t < LAND) {
    const f = (t - FALL) / (LAND - FALL), apex = START.y - 1.8 * u;
    return { x: START.x + (SLOT.x - START.x) * settle(f), y: apex + (trayNow - apex) * f * f, s: 1 - (1 - 14 / 24) * f, sy: 1 };
  }
  const k = spring(t - LAND, 220, 12), hit = clamp((t - LAND) / 0.04);   // under-damped: one small overshoot
  return { x: SLOT.x, y: SLOT.y - camY(t), s: 14 / 24, sy: 1 - 0.14 * hit * (1 - k) };
};
vawe.onFrame((t) => {
  const moving = Math.abs(camY(t + FRAME) - camY(t - FRAME)) > 0.5 || (t > FALL && t < LAND + 0.4);
  layers.forEach((l, j) => {
    const tj = t + (j / (N - 1) - 0.5) * 0.5 * FRAME;   // 180 degree shutter
    l.el.style.visibility = j === 0 || moving ? 'visible' : 'hidden';
    l.belt.style.transform = `translateY(${-camY(tj)}px)`;
    const it = itemAt(tj);
    l.item.style.transform = `translate(${it.x}px, ${it.y}px) scale(${it.s}, ${it.s * it.sy})`;
    const cp = land(clamp((tj - 0.15) / 0.45)), press = clamp((tj - PRESS) / 0.06) * (1 - clamp((tj - PRESS - 0.08) / 0.12));
    l.cur.style.transform = `translate(${BUY.x - (1 - cp) * 30 * u}px, ${BUY.y + (1 - cp) * 24 * u}px)`;
    l.cur.firstElementChild.style.transform = `scale(${1 - 0.14 * press})`;
    l.buy.style.transform = `scale(${1 - 0.035 * press})`;
    const tick = clamp((tj - LAND - 0.1) / 0.3);
    l.n.textContent = tick > 0 ? '3' : '2';
    l.badge.style.transform = `scale(${1 + 0.25 * Math.sin(Math.PI * tick)})`;
  });
});
</script>
</body>
</html>
