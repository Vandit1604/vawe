<!doctype html>
<html data-aspect="16:9">
<head>
<meta charset="utf-8">
<meta name="duration" content="2">
<title>move: drift hold</title>
<style>
  @font-face { font-family: 'Archivo'; font-weight: 100 900; font-display: block; src: url('/assets/fonts/Archivo.woff2') format('woff2'); }
  :root { --ground: #16151a; --ink: #fff; --dim: #8b8a94; --accent: #0a87ff; }
  html, body { margin: 0; height: 100%; background: var(--ground); overflow: hidden; }
  body { position: relative; font: 600 3.6vh/1 'Archivo', sans-serif; color: var(--ink); }

  .bg { position: absolute; inset: -6%; background: radial-gradient(#4d4c59 0.2vh, transparent 0.26vh) 0 0 / 4.4vh 4.4vh; }
  .type { position: absolute; left: 12vw; top: 30vh; }
  .type h1 { margin: 0; font-size: 20vh; font-weight: 700; letter-spacing: -0.045em; line-height: 1; }
  .type p { margin: 3vh 0 0 0.6vw; font-size: 4vh; font-weight: 500; color: var(--dim); }
  .rule { position: absolute; left: 12.4vw; top: 66vh; width: 22vw; height: 0.8vh; border-radius: 1vh; background: var(--accent); }
</style>
</head>
<body>
<div class="bg"></div>
<div class="type"><h1>Held, not frozen.</h1><p>the camera never stops, it only slows down</p></div>
<div class="rule"></div>
<script type="module">
import '/core/engine/page-api.js';
import { noise1 } from '/core/motion/springs.js';
const bg = document.querySelector('.bg'), type = document.querySelector('.type'), rule = document.querySelector('.rule');
const layers = [
  { el: bg,   seed: 1, amp: 2.2, grow: 0.012 },   // vh of travel, and share of scale gained over the hold
  { el: type, seed: 2, amp: 1.0, grow: 0.022 },
  { el: rule, seed: 3, amp: 1.6, grow: 0.022 },
];
const rate = 0.8;   // noise steps per second: one new drift direction about every 1.2 s
vawe.onFrame((t) => {
  const vh = window.innerHeight / 100;
  layers.forEach(({ el, seed, amp, grow }) => {
    const x = noise1(t * rate, seed * 10) * amp * vh, y = noise1(t * rate, seed * 10 + 5) * amp * vh * 0.7;
    el.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) scale(${(1 + grow * t / 2).toFixed(5)})`;
  });
});
</script>
</body>
</html>
