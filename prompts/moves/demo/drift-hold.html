<!doctype html>
<html data-aspect="16:9" data-look="paper">
<head>
<meta charset="utf-8">
<meta name="duration" content="2">
<title>move: drift hold</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  @font-face { font-family: 'Instrument Serif'; font-style: italic; font-display: block; src: url('/assets/fonts/InstrumentSerif-Italic.woff2') format('woff2'); }
  body { display: block; position: relative; }
  .ground { position: absolute; inset: -8%; background: radial-gradient(var(--dot) calc(var(--u) * 0.22), transparent calc(var(--u) * 0.28)) 0 0 / calc(var(--u) * 4.4) calc(var(--u) * 4.4); }
  .light { position: absolute; left: -20vw; top: -30vh; width: 90vw; height: 110vh; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 250, 238, 0.85), rgba(255, 250, 238, 0)); }
  .line { position: absolute; left: 11vw; top: 50vh; translate: 0 -50%; margin: 0; font: 400 calc(var(--u) * 17)/1 var(--sans); letter-spacing: -0.02em; white-space: nowrap; }
  .line em { color: var(--accent); }
</style>
</head>
<body>
<div class="ground"></div>
<div class="light"></div>
<h1 class="line">Held, not <em>frozen.</em></h1>
<script type="module">
import '/core/engine/page-api.js';
import { noise1 } from '/core/motion/springs.js';
const ground = document.querySelector('.ground'), light = document.querySelector('.light');
// only the ground moves; the line has no transform at all
const layers = [
  { el: ground, seed: 1, amp: 1.6, grow: 0.03 },   // vh of travel, and share of scale gained over the 2 s hold
  { el: light,  seed: 2, amp: 5,   grow: 0.06 },
];
const rate = 0.5;   // noise steps per second: one new drift direction every 2 s, so it reads as a breath
vawe.onFrame((t) => {
  const vh = window.innerHeight / 100;
  layers.forEach(({ el, seed, amp, grow }) => {
    const x = noise1(t * rate, seed * 10) * amp * vh, y = noise1(t * rate, seed * 10 + 5) * amp * vh * 0.7;
    el.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) scale(${(1 + grow * t / 2).toFixed(5)})`;
  });
});
</script>
</body>
</html>
