<!doctype html>
<html data-aspect="16:9">
<head>
<meta charset="utf-8">
<meta name="duration" content="1.8">
<meta name="blank" content="0-0.05">
<title>move: cta pop</title>
<style>
  @font-face { font-family: 'Archivo'; font-weight: 100 900; font-display: block; src: url('/assets/fonts/Archivo.woff2') format('woff2'); }
  :root { --ground: #16151a; --ink: #fff; --dim: #a9a8b2; --accent: #0a87ff; }
  html, body { margin: 0; height: 100%; background: var(--ground); overflow: hidden; }
  body { display: grid; place-content: center; justify-items: start; gap: 6vh; padding-left: 14vw; font-family: 'Archivo', sans-serif; color: var(--ink); }
  h1 { margin: 0; font: 800 13vh/1.02 'Archivo', sans-serif; letter-spacing: -0.04em; }
  .cta { display: inline-flex; align-items: center; gap: 2.4vh; padding: 3.8vh 6vh 3.8vh 7vh; border-radius: 999px; background: var(--accent);
         font: 700 8.4vh/1 'Archivo', sans-serif; letter-spacing: -0.01em; color: #fff; transform-origin: 0 50%; opacity: 0; }
  .cta svg { width: 7.4vh; height: 7.4vh; }
  .cta path { fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<h1>Your first film<br>is one page away.</h1>
<div class="cta"><span>Start free</span><svg viewBox="0 0 24 24"><path class="arrow" d="M4 12 H19 M13 6 L19 12 L13 18"/></svg></div>
<script type="module">
import { curveToLinear, CURVES } from '/core/motion/springs.js';
const pop = curveToLinear(CURVES.overshoot), settle = curveToLinear(CURVES.expoOut);
const q = (s) => document.querySelector(s);
const cta = q('.cta');
// the pill grows out of the headline's left edge (transform-origin 0 50%), not from the centre of nowhere
cta.animate([{ scale: '0.86', translate: '0 3vh' }, { scale: '1', translate: '0 0' }], { duration: 650, delay: 300, easing: pop, fill: 'both' });
cta.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 100, delay: 300, easing: 'linear', fill: 'both' });
// after it lands, the arrow leans right and returns: the button is inviting a click and is never still
[1200, 1600].forEach((at) => q('.arrow').animate([{ translate: '0 0' }, { translate: '4px 0', offset: 0.4 }, { translate: '0 0' }], { duration: 380, delay: at, easing: settle, fill: 'both' }));
</script>
</body>
</html>
