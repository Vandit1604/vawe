<!doctype html>
<html data-aspect="16:9" data-look="chrome">
<head>
<meta charset="utf-8">
<meta name="duration" content="3.4">
<title>move: cta morph press</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; }
  .at { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%; translate: -50% -50%; }
  .plate { display: flex; align-items: center; justify-content: center; width: calc(var(--u) * 74); height: calc(var(--u) * 34); padding: 0; font-size: calc(var(--u) * 11); }
  .plate .logo-lockup { font-size: calc(var(--u) * 11); }
  .cta { position: relative; overflow: hidden; padding: calc(var(--u) * 3.6) calc(var(--u) * 9); font-size: calc(var(--u) * 7); border-radius: var(--r-card); }
  .ripple { position: absolute; left: calc(50% + var(--u) * 5); top: calc(50% + var(--u) * 1.6); width: calc(var(--u) * 14); height: calc(var(--u) * 14); margin: calc(var(--u) * -7) 0 0 calc(var(--u) * -7); border-radius: 50%; background: #fff; opacity: 0; }
  .cur { position: absolute; left: 0; top: 0; z-index: 5; }
  .cur svg { display: block; width: calc(var(--u) * 6.4); height: calc(var(--u) * 6.4); transform-origin: 0 0; overflow: visible; }
  .cur path { fill: var(--cursor); stroke: var(--cursor-edge); stroke-width: 1.4; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="at mark"><div class="plate card"><span data-logo="orbital" data-lockup></span></div></div>
<div class="at press"><div class="btn primary cta">Start free<i class="ripple"></i></div></div>
<div class="cur"><div class="x"><div class="y"><svg viewBox="0 0 24 24"><path d="M2 2 L2 19 L6.6 14.8 L9.6 21.6 L12.6 20.3 L9.6 13.6 L15.8 13.4 Z"/></svg></div></div></div>
<script type="module">
import '/prompts/moves/demo/assets/logos.js';
import { curveToLinear, CURVES } from '/core/motion/springs.js';
const q = (s) => document.querySelector(s);
const settle = curveToLinear(CURVES.expoOut), pop = curveToLinear(CURVES.overshoot), smooth = curveToLinear((u) => u * u * (3 - 2 * u)), leave = curveToLinear((u) => u * u * u);
const W = innerWidth, H = innerHeight, unit = H / 100;
const at = { mark: 100, morph: 900, go: 1250, dur: 850, press: 2350, release: 2480 };   // ms
const from = { x: W * 0.9, y: H * 1.06 }, to = { x: W / 2 + unit * 5, y: H / 2 + unit * 1.6 };

q('.mark').animate([{ scale: 0.97, opacity: 0 }, { scale: 1, opacity: 1 }], { duration: 420, delay: at.mark, easing: settle, fill: 'both' });
// the mark and the button share one centre: the mark shrinks and leaves in 340 ms as the button grows into the same place
q('.mark').animate([{ scale: 1, opacity: 1 }, { scale: 0.55, opacity: 0 }], { duration: 340, delay: at.morph, easing: leave, fill: 'forwards' });
q('.press').animate([{ scale: 0.55, opacity: 0 }, { opacity: 1, offset: 0.3 }, { scale: 1, opacity: 1 }], { duration: 560, delay: at.morph + 120, easing: pop, fill: 'both' });

// the cursor arrives on a decelerating bow and lands a few pixels off the centre
q('.x').animate([{ translate: `${from.x}px 0` }, { translate: `${to.x}px 0` }], { duration: at.dur, delay: at.go, easing: settle, fill: 'both' });
q('.y').animate([{ translate: `0 ${from.y}px` }, { translate: `0 ${to.y}px` }], { duration: at.dur, delay: at.go, easing: smooth, fill: 'both' });

// the press: cursor and button compress together, release together, and a ripple leaves the press point
q('.cur svg').animate([{ scale: 1 }, { scale: 0.84, offset: 0.5 }, { scale: 1 }], { duration: 260, delay: at.press, easing: settle, fill: 'both' });
q('.cta').animate([{ scale: 1 }, { scale: 0.94, offset: 0.5 }, { scale: 1 }], { duration: 260, delay: at.press, easing: settle, fill: 'both' });
q('.ripple').animate([{ opacity: 0.4, scale: 0.2 }, { opacity: 0, scale: 4 }], { duration: 620, delay: at.press, easing: settle, fill: 'both' });
</script>
</body>
</html>
