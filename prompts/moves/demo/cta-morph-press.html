<!doctype html>
<html data-aspect="16:9" data-look="product" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="duration" content="5.5">
<title>move: cta morph press</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; }
  .morph { position: absolute; left: 50%; top: 50%; overflow: hidden; background: var(--surface); box-shadow: var(--win-shadow), 0 0 0 1px var(--line); }
  .lbl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 1.6); white-space: nowrap; }
  .lbl.plate { gap: calc(var(--u) * 2.4); font: 600 calc(var(--u) * 13)/1 var(--sans); letter-spacing: -0.04em; }
  .mk { display: grid; place-items: center; width: calc(var(--u) * 14); height: calc(var(--u) * 14); border-radius: calc(var(--u) * 3.4); background: var(--ink); }
  .lbl.plate .mk svg { width: 80%; height: 80%; fill: none; stroke: #fff; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
  .lbl.go, .lbl.ok, .lbl.busy { font: 600 calc(var(--u) * 6.2)/1 var(--sans); letter-spacing: -0.02em; color: #fff; opacity: 0; }
  .lbl svg { width: calc(var(--u) * 6.4); height: calc(var(--u) * 6.4); fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .lbl.busy svg { width: calc(var(--u) * 7); height: calc(var(--u) * 7); }
  .note { position: absolute; left: 0; right: 0; top: calc(50% + var(--u) * 16); text-align: center; font: 500 calc(var(--u) * 3)/1.2 var(--sans); color: var(--muted); opacity: 0; }
  .cur { position: absolute; left: 0; top: 0; z-index: 5; opacity: 0; }
  .cur svg { display: block; width: calc(var(--u) * 6.4); height: calc(var(--u) * 6.4); transform-origin: 0 0; overflow: visible; }
  .cur path { fill: var(--cursor); stroke: var(--cursor-edge); stroke-width: 1.4; stroke-linejoin: round; }
</style>
<script type="application/json" id="authoring">{"allow": ["text-unreadable-hold", "text-moves-before-hold", "static-window@3.9-5.1", "world-held@0.0-5.5"], "_why": {"text-unreadable-hold": "the confirmed button holds 1.2 s after it lands at 3.9 s in a 5.5 s clip, and the check asks 5.4 s", "text-moves-before-hold": "the button leaves at 5.1 s, 0.4 s before the 5.5 s end, so the confirmed state holds 1.2 s, short of the 5.4 s the check asks", "static-window@3.9-5.1": "button at 4.5 s: a confirmed button holds still as the product does; the note under it fades in at 3.9 s", "world-held@0.0-5.5": "one button holds 5.5 s: it morphs from the plate at 1.0 s, is pressed at 2.4 s, loads to 3.5 s and shows its result from 3.5 s"}}</script>
</head>
<body>
<div id="wrap" style="position:absolute;inset:0">
<div class="morph" id="morph">
  <div class="lbl plate"><span class="mk"><svg viewBox="0 0 100 100"><path d="M22 32 L36 70 L50 44 L64 70 L78 32"/></svg></span><span>vawe</span></div>
  <div class="lbl go">Start free</div>
  <div class="lbl busy"><svg viewBox="0 0 24 24" id="spin"><circle cx="12" cy="12" r="9" opacity="0.25"/><path d="M12 3a9 9 0 0 1 9 9"/></svg></div>
  <div class="lbl ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2 9.3-9.4" id="tick"/></svg>You're in</div>
</div>
<div class="note" id="note">We sent a link to sam@northwind.co</div>
</div>
<div class="cur" id="cur"><svg viewBox="0 0 24 24" id="arrow"><path d="M2 2 L2 19 L6.6 14.8 L9.6 21.6 L12.6 20.3 L9.6 13.6 L15.8 13.4 Z"/></svg></div>
<script type="module">
import '/core/engine/page-api.js';
import { spring } from '/core/motion/springs.js';
import { easeFn, EASE } from '/core/motion/presets.js';
import { leave } from '/prompts/moves/demo/assets/stage.js';
const q = (s) => document.querySelector(s);
const clamp = (v) => Math.min(1, Math.max(0, v)), lerp = (a, b, v) => a + (b - a) * v, swap = easeFn('swap'), land = easeFn('land'), landSoft = easeFn('landSoft');
const seg = (t, a, b, f = swap) => f(clamp((t - a) / (b - a)));
const W = innerWidth, H = innerHeight, u = H / 100, END = 5500;
const at = { plate: 0.1, morph: 1.0, go: 1.35, arrive: 2.3, down: 2.4, release: 2.55, busy: 2.65, done: 3.55, leave: 3.1 };   // seconds
const plate = { w: u * 100, h: u * 46, r: u * 3 }, button = { w: u * 84, h: u * 22, r: u * 3.4 };
const target = [W / 2 + u * 14, H / 2 + u * 3], start = [W * 0.9, H * 1.06], bow = [W * 0.86, H * 0.58];
const mix = (a, b, p) => `color-mix(in srgb, ${a} ${(100 - p * 100).toFixed(1)}%, ${b})`;
const bez = (a, c, b, s) => [(1 - s) ** 2 * a[0] + 2 * (1 - s) * s * c[0] + s * s * b[0], (1 - s) ** 2 * a[1] + 2 * (1 - s) * s * c[1] + s * s * b[1]];
const tick = q('#tick'); tick.style.strokeDasharray = 24;

q('#note').animate([{ opacity: 0, translate: '0 0.8vh' }, { opacity: 1, translate: '0 0' }], { duration: 220, delay: at.done * 1000 + 300, easing: EASE.land, fill: 'both' });
leave(q('#wrap'), END);

vawe.onFrame((t) => {
  const morph = q('#morph');
  const m = land(clamp((t - at.morph) / 0.8));   // one curve drives width, height and radius, so the plate is the button at every frame between
  const enter = seg(t, at.plate, at.plate + 0.42, landSoft);
  const pressed = seg(t, at.down, at.down + 0.09) - spring(t - at.release, 300, 13);
  morph.style.width = `${lerp(plate.w, button.w, m).toFixed(2)}px`;
  morph.style.height = `${lerp(plate.h, button.h, m).toFixed(2)}px`;
  morph.style.borderRadius = `${lerp(plate.r, button.r, m).toFixed(2)}px`;
  morph.style.translate = '-50% -50%';
  morph.style.scale = `${(lerp(0.97, 1, enter) * (1 - pressed * 0.03)).toFixed(4)}`;
  morph.style.opacity = enter;
  // fill: white plate to ink, lighter on hover, darker while pressed
  const hover = seg(t, at.arrive - 0.1, at.arrive + 0.1) * (1 - seg(t, at.busy, at.busy + 0.1));
  const ink = mix(mix('var(--surface)', 'var(--ink)', seg(t, at.morph, at.morph + 0.45)), '#2b2b2b', hover * 0.9);
  morph.style.background = mix(ink, '#000', clamp(pressed) * 0.8);
  q('.lbl.plate').style.opacity = 1 - seg(t, at.morph, at.morph + 0.2);
  q('.lbl.go').style.opacity = seg(t, at.morph + 0.3, at.morph + 0.55) * (1 - seg(t, at.busy, at.busy + 0.12));
  q('.lbl.busy').style.opacity = seg(t, at.busy + 0.1, at.busy + 0.24) * (1 - seg(t, at.done, at.done + 0.12));
  q('#spin').style.rotate = `${((t - at.busy) / 0.8 * 360) % 360}deg`;
  q('.lbl.ok').style.opacity = seg(t, at.done + 0.1, at.done + 0.26);
  tick.style.strokeDashoffset = 24 * (1 - seg(t, at.done + 0.1, at.done + 0.4, landSoft));

  // the cursor rides a quadratic bow and decelerates onto the label; the dip and the release follow the button
  const arrive = bez(start, bow, target, seg(t, at.go, at.arrive, land));
  const away = seg(t, at.leave, at.leave + 0.35);
  const cur = q('#cur');
  cur.style.translate = `${(arrive[0] + away * u * 4).toFixed(1)}px ${(arrive[1] + pressed * u * 0.9 + away * u * 5).toFixed(1)}px`;
  cur.style.opacity = seg(t, at.go, at.go + 0.15) * (1 - away);
  q('#arrow').style.scale = 1 - pressed * 0.16;
});
</script>
</body>
</html>
