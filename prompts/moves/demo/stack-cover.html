<script type="application/json" id="authoring">{"allow": ["static-window@2.4-3.7", "world-held@0.0-5.0", "tile-run@2.3-3.4"], "_why": {"static-window@2.4-3.7": "the open sheet holds still while the name field's caret blinks, as the product does", "world-held@0.0-5.0": "one device screen: a sheet is a layer on the same screen, the page behind stays in place", "tile-run@2.3-3.4": "the name types one character at a time, as a text field does"}}</script>
<style>
  body { position: relative; display: block; background: #000; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; color: #000; }
  .page { position: absolute; inset: 0; background: #f2f2f7; overflow: hidden; transform-origin: 50% 0; }
  .status { position: absolute; left: 0; right: 0; top: calc(var(--u) * 1.4); display: flex; justify-content: space-between; padding: 0 calc(var(--u) * 3.4); font-size: calc(var(--u) * 2.4); font-weight: 600; }
  .batt { width: calc(var(--u) * 4.6); height: calc(var(--u) * 2.2); border: 1px solid #8e8e93; border-radius: calc(var(--u) * 0.6); position: relative; } .batt i { position: absolute; inset: calc(var(--u) * 0.2); background: #000; border-radius: calc(var(--u) * 0.3); }
  .nav { position: absolute; left: calc(var(--u) * 8); right: calc(var(--u) * 8); top: calc(var(--u) * 6.4); display: flex; justify-content: space-between; align-items: center; color: #007aff; font-size: calc(var(--u) * 3.4); }
  .nav svg { width: calc(var(--u) * 4); height: calc(var(--u) * 4); stroke: #007aff; stroke-width: 2.4; stroke-linecap: round; fill: none; }
  .large { position: absolute; left: calc(var(--u) * 8); top: calc(var(--u) * 13); font-size: calc(var(--u) * 7); font-weight: 700; letter-spacing: -0.02em; }
  .group { position: absolute; left: calc(var(--u) * 8); right: calc(var(--u) * 8); background: #fff; border-radius: calc(var(--u) * 1.4); overflow: hidden; }
  .head { position: absolute; left: calc(var(--u) * 11); font-size: calc(var(--u) * 2.5); color: #6c6c70; letter-spacing: 0.02em; }
  .row { display: flex; align-items: center; gap: calc(var(--u) * 2.4); height: calc(var(--u) * 11); padding: 0 calc(var(--u) * 3); position: relative; }
  .row + .row::before { content: ''; position: absolute; left: calc(var(--u) * 14); right: 0; top: 0; height: 1px; background: #c6c6c8; }
  .row img { width: calc(var(--u) * 8); height: calc(var(--u) * 8); border-radius: calc(var(--u) * 1.2); object-fit: cover; }
  .row b { display: block; font-weight: 500; font-size: calc(var(--u) * 3.4); } .row small { display: block; font-size: calc(var(--u) * 2.7); color: #8e8e93; margin-top: calc(var(--u) * 0.5); }
  .row .st { margin-left: auto; font-size: calc(var(--u) * 3); color: #8e8e93; } .row .st.ok { color: #34c759; }
  .chev { width: calc(var(--u) * 1.4); height: calc(var(--u) * 2.4); stroke: #c4c4c7; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .dim { position: absolute; inset: 0; background: #000; opacity: 0; }
  .sheet { position: absolute; left: 18vw; width: 64vw; top: calc(var(--u) * 7); bottom: calc(var(--u) * -4); background: #f2f2f7; border-radius: calc(var(--u) * 2.4) calc(var(--u) * 2.4) 0 0; box-shadow: 0 0 calc(var(--u) * 2.4) rgba(0, 0, 0, 0.16); overflow: hidden; }
  .grab { position: absolute; left: 50%; top: calc(var(--u) * 1); width: calc(var(--u) * 6); height: calc(var(--u) * 0.7); margin-left: calc(var(--u) * -3); border-radius: 99px; background: #c7c7cc; }
  .bar { position: absolute; left: 0; right: 0; top: calc(var(--u) * 2.6); height: calc(var(--u) * 8); display: flex; align-items: center; justify-content: space-between; padding: 0 calc(var(--u) * 3.6); font-size: calc(var(--u) * 3.4); color: #007aff; }
  .bar strong { color: #000; font-weight: 600; position: absolute; left: 0; right: 0; text-align: center; } .bar .add { font-weight: 600; opacity: 0.4; }
  .sheet .group { left: calc(var(--u) * 4); right: calc(var(--u) * 4); }
  .sheet .row { height: calc(var(--u) * 9.6); gap: calc(var(--u) * 1.6); } .sheet .row + .row::before { left: calc(var(--u) * 3); }
  .sheet .row .lbl { font-size: calc(var(--u) * 3.4); width: calc(var(--u) * 16); } .sheet .row .val { font-size: calc(var(--u) * 3.4); color: #8e8e93; margin-left: auto; display: flex; align-items: center; gap: calc(var(--u) * 1.2); }
  .field { font-size: calc(var(--u) * 3.4); display: flex; align-items: center; } .caret { width: calc(var(--u) * 0.28); height: calc(var(--u) * 3.8); background: #007aff; margin-left: 1px; }
  .tog { margin-left: auto; width: calc(var(--u) * 6.2); height: calc(var(--u) * 3.8); border-radius: 99px; background: #34c759; position: relative; } .tog i { position: absolute; right: calc(var(--u) * 0.2); top: calc(var(--u) * 0.2); width: calc(var(--u) * 3.4); height: calc(var(--u) * 3.4); border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); }
  .touch { position: absolute; left: 0; top: 0; width: calc(var(--u) * 7); height: calc(var(--u) * 7); margin: calc(var(--u) * -3.5) 0 0 calc(var(--u) * -3.5); border-radius: 50%; background: rgba(110, 110, 120, 0.45); opacity: 0; z-index: 20; }
</style>

<body>
<div class="page" id="page">
  <div class="status" data-chrome><span>9:41</span><span class="batt"><i></i></span></div>
  <div class="nav"><span>Edit</span><svg id="plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></div>
  <div class="large">Renders</div>
  <div class="head" style="top: calc(var(--u) * 24)">TODAY</div>
  <div class="group" style="top: calc(var(--u) * 28)">
    <div class="row"><img src="/prompts/moves/demo/assets/photos/meadow.jpg"><div><b>launch-16x9</b><small>1920 x 1080 · 12 s</small></div><span class="st ok">Done</span><svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg></div>
    <div class="row"><img src="/prompts/moves/demo/assets/photos/shore.jpg"><div><b>launch-9x16</b><small>1080 x 1920 · 12 s</small></div><span class="st ok">Done</span><svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg></div>
    <div class="row"><img src="/prompts/moves/demo/assets/photos/loft.jpg"><div><b>launch-1x1</b><small>1080 x 1080 · 12 s</small></div><span class="st">Queued</span><svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg></div>
    <div class="row"><img src="/prompts/moves/demo/assets/photos/ridge.jpg"><div><b>launch-4x5</b><small>1080 x 1350 · 12 s</small></div><span class="st">Queued</span><svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg></div>
  </div>
  <div class="dim" id="dim"></div>
</div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="bar"><span id="cancel">Cancel</span><strong>New render</strong><span class="add">Add</span></div>
  <div class="group" style="top: calc(var(--u) * 15)"><div class="row"><span class="lbl">Name</span><span class="field"><span id="typed"></span><i class="caret" id="caret"></i></span></div></div>
  <div class="group" style="top: calc(var(--u) * 28)">
    <div class="row"><span class="lbl">Format</span><span class="val">1080 x 1350<svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg></span></div>
    <div class="row"><span class="lbl">Length</span><span class="val">12 s<svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg></span></div>
    <div class="row"><span class="lbl">Quality</span><span class="val">Final<svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg></span></div>
  </div>
  <div class="group" style="top: calc(var(--u) * 61)"><div class="row"><span class="lbl">Captions</span><span class="tog"><i></i></span></div><div class="row"><span class="lbl">Sound</span><span class="val">Silent<svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg></span></div></div>
</div>
<div class="touch" id="touch"></div>
<script type="module">
import '/core/engine/page-api.js';
import { typeTimes, typedCount } from '/prompts/moves/demo/assets/stage.js';
const $ = (id) => document.getElementById(id);
const H = innerHeight, u = H / 100;
const T_TAP = 1000, T_PRESENT = 1150, D_PRESENT = 520, T_TYPE = 2200, T_CANCEL = 3800, T_DISMISS = 3900, D_DISMISS = 440;
const IOS = 'cubic-bezier(0.32, 0.72, 0, 1)';                          // the system sheet curve: fast out, no overshoot

// touch points (a finger on a screen recording): the plus, then Cancel inside the open sheet
const rect = (id) => $(id).getBoundingClientRect(), sheetFinal = { x: 0.18 * innerWidth, y: 7 * u };
const sr = rect('sheet'), cr = rect('cancel'), pr = rect('plus');
const plus = { x: pr.left + pr.width / 2, y: pr.top + pr.height / 2 };
const cancel = { x: sheetFinal.x + (cr.left - sr.left) + cr.width / 2, y: sheetFinal.y + (cr.top - sr.top) + cr.height / 2 };
const tap = (p, at) => {
  const t = $('touch');
  t.animate([{ opacity: 0, translate: `${p.x}px ${p.y}px`, scale: 1.2 }, { opacity: 1, translate: `${p.x}px ${p.y}px`, scale: 1 }], { duration: 90, delay: at - 90, fill: 'forwards' });
  t.animate([{ opacity: 1, translate: `${p.x}px ${p.y}px`, scale: 1 }, { opacity: 0, translate: `${p.x}px ${p.y}px`, scale: 1 }], { duration: 160, delay: at + 90, fill: 'forwards' });
};
tap(plus, T_TAP); tap(cancel, T_CANCEL);

// present: the sheet rises from the bottom edge; the page behind scales back, rounds its corners and dims, on one curve
const rise = (from, to, delay, duration, fill) => ({ keys: [from, to], opt: { duration, delay, easing: IOS, fill } });
const run = (el, a) => el.animate(a.keys, a.opt);
run($('sheet'), rise({ translate: `0 ${H}px` }, { translate: '0 0' }, T_PRESENT, D_PRESENT, 'both'));
run($('sheet'), rise({ translate: '0 0' }, { translate: `0 ${H}px` }, T_DISMISS, D_DISMISS, 'forwards'));
const back = { scale: 0.94, translate: `0 ${1.6 * u}px`, borderRadius: `${2.4 * u}px` }, front = { scale: 1, translate: '0 0', borderRadius: '0px' };
run($('page'), rise(front, back, T_PRESENT, D_PRESENT, 'both'));
run($('page'), rise(back, front, T_DISMISS, D_DISMISS, 'forwards'));
run($('dim'), rise({ opacity: 0 }, { opacity: 0.3 }, T_PRESENT, D_PRESENT, 'both'));
run($('dim'), rise({ opacity: 0.3 }, { opacity: 0 }, T_DISMISS, D_DISMISS, 'forwards'));

// the name field is focused: the text types one character at a time and the caret blinks every 0.5 s
const name = 'launch-4x5', times = typeTimes(name, T_TYPE);
vawe.onFrame((s) => {
  const ms = s * 1000, n = typedCount(times, ms);
  $('typed').textContent = ms >= T_DISMISS ? '' : name.slice(0, n);
  $('caret').style.visibility = ms < T_PRESENT + D_PRESENT || ms >= T_DISMISS || n > 0 && n < name.length || Math.floor(ms / 500) % 2 === 0 ? 'visible' : 'hidden';
});
</script>
