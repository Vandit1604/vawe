<!doctype html>
<html data-aspect="16:9" data-look="editorial" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="duration" content="4">
<title>move: halftone field</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<script type="application/json" id="authoring">{"allow": ["text-unreadable-hold", "text-moves-before-hold", "world-held@0.0-4.0"], "_why": {"text-unreadable-hold": "the copy holds 2.8 s after its last word at 1.0 s, and the check asks 5.4 s", "text-moves-before-hold": "the copy leaves at 3.6 s, 0.4 s before the 4 s end, so it holds 2.6 s short of the 5.4 s the check asks", "world-held@0.0-4.0": "one halftone print holds 4.0 s: the type rises from 0.1 s, the key light turns once round the sphere"}}</script>
<style>
  body { display: block; position: relative; }
  .copy { position: absolute; left: 9vw; top: 0; bottom: 0; width: 52vw; display: flex; flex-direction: column; justify-content: center; }
  .copy .title { margin: 0; font-size: calc(var(--u) * 12.5); line-height: 1.04; color: var(--ink); }
  .copy .lead { margin: var(--s3) 0 0; max-width: 16em; color: var(--ink); font-weight: 400; text-wrap: pretty; }
  .mask { display: block; overflow: hidden; padding: 0.1em 0.1em 0.25em; margin: -0.1em -0.1em -0.25em; }
  .mask > span { display: block; translate: 0 118%; animation: rise 0.7s var(--settle) both; animation-delay: calc(0.12s + var(--i) * 0.14s); }
  @keyframes rise { to { translate: 0 0; } }
</style>
</head>
<body>
<main class="copy" id="copy">
  <h1 class="title"><span class="mask" style="--i:0"><span>Light,</span></span><span class="mask" style="--i:1"><span>in dots.</span></span></h1>
  <p class="lead">Dot size follows the shade of one lit sphere. The light turns; the dots stay.</p>
</main>
<script type="module">
import '/core/engine/page-api.js';
import { shaderField } from '/core/surfaces/shader-field.js';
import { EASE } from '/core/motion/presets.js';
import { leave, arrive } from '/prompts/moves/demo/assets/stage.js';

const root = document.documentElement;
root.style.setProperty('--settle', EASE.land);
const copy = document.getElementById('copy');
arrive(copy.querySelector('.lead'), 700, { ms: 420, from: '1.2vh' });
leave(copy, 4000);

const tokens = getComputedStyle(root);
const rgb = (name) => { const h = tokens.getPropertyValue(name).trim(); return [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255); };

// A 45 degree dot screen in one ink. Dot centres never move; each dot's area is the shade of one lit sphere, so the size ramp is the light.
const frag = `
uniform vec3 u_ground, u_ink;
const float CELL = 0.026;                                    // pitch as a share of the frame height: 28 px at 1080
const float TURN = 6.2831853 / 4.0;                          // the light turns once round in the 4 s clip: the last frame matches the first
void main() {
  float aspect = u_res.x / u_res.y;
  vec2 p = gl_FragCoord.xy / u_res.y;
  vec2 g = vec2(p.x + p.y, p.y - p.x) * 0.7071 / CELL;
  vec2 id = floor(g);
  vec2 f = fract(g) - 0.5;
  vec2 c = (id + 0.5) * CELL;
  vec2 cp = vec2(c.x - c.y, c.x + c.y) * 0.7071;
  vec2 sc = vec2(aspect * 0.84, 0.5);
  float R = 0.40;
  vec2 q = (cp - sc) / R;
  float r2 = dot(q, q);
  vec3 L = normalize(vec3(-0.55 + 0.22 * sin(u_time * TURN), 0.55 + 0.12 * cos(u_time * TURN), 0.62));
  float cover = 0.012 + 0.08 * smoothstep(0.3, 1.0, cp.x / aspect);   // the paper: a faint screen that thickens to the right
  if (r2 < 1.0) {
    vec3 n = vec3(q, sqrt(1.0 - r2));
    cover = 0.08 + 0.7 * (1.0 - clamp(dot(n, L), 0.0, 1.0));
  } else {
    float s = length((cp - sc - vec2(0.12, -0.16) * R * 1.6) / (R * 1.1));   // the shadow the sphere throws down and to the right
    cover += 0.28 * (1.0 - smoothstep(0.7, 1.35, s));
  }
  float radius = sqrt(min(cover, 0.76) / 3.14159);
  float aa = 1.0 / (u_res.y * CELL);
  float dotMask = smoothstep(radius + aa, radius - aa, length(f));
  gl_FragColor = vec4(mix(u_ground, u_ink, dotMask * 0.94), 1.0);
}`;

const field = shaderField(frag, { seed: 2, uniforms: { u_ground: rgb('--ground'), u_ink: rgb('--ink') } });
vawe.onFrame((t) => field.draw(t));
</script>
</body>
</html>
