<!doctype html>
<html data-aspect="16:9" data-look="chrome">
<head>
<meta charset="utf-8">
<meta name="duration" content="4">
<title>move: halftone field</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; position: relative; }
  .copy { position: absolute; left: 9vw; top: 50vh; translate: 0 -50%; width: 56vw; }
  .copy .title { margin: 0; font-size: calc(var(--u) * 13); line-height: 1.04; }
  .copy .lead { margin: var(--s3) 0 0; max-width: 24em; color: var(--ink); text-wrap: pretty; }

  .mask { display: block; overflow: hidden; padding: 0.1em 0.1em 0.25em; margin: -0.1em -0.1em -0.25em; }
  .mask > span { display: block; translate: 0 118%; animation: rise 0.7s var(--settle) both; animation-delay: calc(0.12s + var(--i) * 0.14s); }
  @keyframes rise { to { translate: 0 0; } }

  .w { display: inline-block; opacity: 0; filter: blur(0.14em); translate: 0 0.22em;
       animation: resolve 0.8s var(--soft) both; animation-delay: calc(0.5s + var(--i) * 0.09s); }
  @keyframes resolve { 45% { opacity: 1; } to { opacity: 1; filter: blur(0); translate: 0 0; } }
</style>
</head>
<body>
<main class="copy">
  <h1 class="title"><span class="mask" style="--i:0"><span>Dots swell,</span></span><span class="mask" style="--i:1"><span>dots fade.</span></span></h1>
  <p class="lead" id="lead">A dot screen waves across the frame while the type holds still.</p>
</main>
<script type="module">
import '/core/engine/page-api.js';
import { shaderField } from '/core/surfaces/shader-field.js';
import { curveToLinear, CURVES } from '/core/motion/springs.js';

const root = document.documentElement;
root.style.setProperty('--settle', curveToLinear(CURVES.expoOut));
root.style.setProperty('--soft', curveToLinear(CURVES.expoOut));
const lead = document.getElementById('lead');
lead.innerHTML = lead.textContent.split(' ').map((t, i) => `<span class="w" style="--i:${i}">${t}</span>`).join(' ');

const tokens = getComputedStyle(root);
const rgb = (name) => { const h = tokens.getPropertyValue(name).trim(); return [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255); };

// A 45 degree dot screen. The cell centres never move; each dot's radius follows a plane wave that travels across the frame.
const frag = `
uniform vec3 u_ground, u_dot, u_faint, u_accent;
const float CELL = 0.032;
void main() {
  float aspect = u_res.x / u_res.y;
  vec2 p = gl_FragCoord.xy / u_res.y;
  vec2 g = vec2(p.x + p.y, p.y - p.x) * 0.7071 / CELL;
  vec2 id = floor(g);
  vec2 f = fract(g) - 0.5;
  vec2 c = (id + 0.5) * CELL;
  vec2 cp = vec2(c.x - c.y, c.x + c.y) * 0.7071;
  float wave = 0.5 + 0.5 * sin(4.0 * cp.x + 1.6 * cp.y - u_time * 3.2 + u_seed);
  float keep = 1.0 - 0.45 * smoothstep(0.80 * aspect, 0.56 * aspect, cp.x);       // the copy sits left: smaller dots behind it
  float radius = mix(0.10, 0.50, wave) * keep;
  float aa = 1.0 / (u_res.y * CELL);
  float dotMask = smoothstep(radius + aa, radius - aa, length(f));
  vec3 ink = mix(u_dot, u_faint, 0.25);
  ink = mix(ink, u_accent, 0.5 * smoothstep(0.72 * aspect, 0.94 * aspect, cp.x));   // half way to the accent on the right, away from the copy
  vec3 col = mix(u_ground, ink, dotMask);
  gl_FragColor = vec4(col, 1.0);
}`;

const field = shaderField(frag, { seed: 2, uniforms: { u_ground: rgb('--ground'), u_dot: rgb('--dot'), u_faint: rgb('--faint'), u_accent: rgb('--accent') } });
vawe.onFrame((t) => field.draw(t));
</script>
</body>
</html>
