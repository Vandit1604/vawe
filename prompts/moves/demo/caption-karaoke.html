<!doctype html>
<html data-aspect="16:9" data-look="product" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="duration" content="5">
<title>move: caption karaoke</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<script type="application/json" id="authoring">{"allow": ["static-window@0.0-0.3", "world-held@0.0-5.0"], "_why": {"static-window@0.0-0.3": "the video frame holds before the first word is spoken", "world-held@0.0-5.0": "one video shot with its captions: the photograph is the footage and the captions are the content"}}</script>
<style>
  body { position: relative; display: block; background: var(--ground); }
  .footage { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .caps { position: absolute; left: 0; right: 0; top: calc(var(--vh) * 0.62); text-align: center; font: 900 calc(var(--u) * 11.5)/1.1 'Archivo', var(--sans); font-stretch: 100%; text-transform: uppercase; letter-spacing: 0.01em; color: #fff; }
  .page { position: absolute; left: 0; right: 0; top: 0; visibility: hidden; }
  .line { display: block; white-space: nowrap; }
  .w { display: inline-block; margin: 0 0.18em; -webkit-text-stroke: calc(var(--u) * 1.8) #000; paint-order: stroke fill; stroke-linejoin: round; text-shadow: 0 calc(var(--u) * 0.5) calc(var(--u) * 1) rgba(0, 0, 0, 0.55); }
  .w.on { color: #ffe500; }
</style>
</head>
<body>
<img class="footage" id="foot" src="/prompts/moves/demo/assets/photos/harbour.jpg" alt="">
<div class="caps" id="caps"></div>
<script type="module">
import '/core/engine/page-api.js';
import { show } from '/prompts/moves/demo/assets/stage.js';

// pages of captions: [start second, end second, [[word, second it is spoken], ...] per line]
const PAGES = [
  [0.4, 2.2, [[['Captions', 0.4], ['that', 0.95]], [['follow', 1.2], ['the', 1.55], ['voice', 1.7]]]],
  [2.4, 4.6, [[['one', 2.4], ['word', 2.75]], [['at', 3.2], ['a', 3.45], ['time', 3.65]]]],
];
const WORD_TAIL = 0.45;
const caps = document.getElementById('caps');
const words = [];
PAGES.forEach(([from, to, lines]) => {
  const page = document.createElement('div');
  page.className = 'page';
  lines.forEach((line) => {
    const row = document.createElement('span');
    row.className = 'line';
    line.forEach(([text, at]) => {
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = text;
      row.append(w);
      words.push({ w, at, to });
    });
    page.append(row);
  });
  caps.append(page);
  show(page, from * 1000, to * 1000);
});

// the active word is solid yellow while it is spoken and white again at the next word: a hard step, no glide
vawe.onFrame((t) => {
  words.forEach(({ w, at }, i) => {
    const next = words[i + 1];
    const end = next && next.at - at < WORD_TAIL * 2 ? next.at : at + WORD_TAIL;
    w.classList.toggle('on', t >= at && t < end);
  });
});

// the footage is a held shot with a slow push
document.getElementById('foot').animate([{ scale: 1 }, { scale: 1.03 }], { duration: 5000, easing: 'linear', fill: 'both' });
</script>
</body>
</html>
