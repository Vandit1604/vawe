<!doctype html>
<html data-aspect="16:9">
<head>
<meta charset="utf-8">
<meta name="duration" content="1.6">
<title>move: iris wipe</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  :root { --paper: #ecebf1; --x: 66vw; --y: 63vh; }
  body { position: relative; display: block; }

  .shot { position: absolute; inset: 0; }
  .b h1 { position: absolute; left: 12vw; top: calc(var(--u) * 31); margin: 0; font: 700 calc(var(--u) * 20)/1 var(--sans); letter-spacing: -0.05em; }
  .b h1 i { display: inline-block; width: calc(var(--u) * 4.4); height: calc(var(--u) * 4.4); margin-left: var(--s1); border-radius: 50%; background: var(--accent); }
  .b p { position: absolute; left: 12.4vw; top: calc(var(--u) * 58); margin: 0; font: 500 var(--t-lead)/1 var(--mono); letter-spacing: -0.03em; color: var(--muted); }
  /* the iris: shot A is clipped to a circle that closes on the button, shot B waits underneath */
  .a { background: var(--paper); color: var(--ground); clip-path: circle(150vmax at var(--x) var(--y)); }
  .a h2 { position: absolute; left: 12vw; top: calc(var(--u) * 27); margin: 0; font: 700 var(--t-title)/1 var(--sans); letter-spacing: -0.035em; }
  .a span { position: absolute; left: 12.2vw; top: calc(var(--u) * 42); font: 500 var(--t-lead)/1 var(--sans); color: #6b6a72; }
  .btn { position: absolute; left: 50vw; top: calc(var(--u) * 55); width: 24vw; height: calc(var(--u) * 15); border-radius: 999px; background: var(--ground); color: var(--ink); font-size: var(--t-lead); box-shadow: 0 calc(var(--u) * 1.2) calc(var(--u) * 3) rgba(22, 21, 26, 0.25); }
  .cursor { position: absolute; left: 66vw; top: 63vh; margin: -0.3vh 0 0 -0.5vh; width: calc(var(--u) * 5); height: calc(var(--u) * 5); }
</style>
</head>
<body>
<section class="shot b"><h1>Live<i></i></h1><p>vawe.dev/launch</p></section>
<section class="shot a">
  <h2>Ready to publish</h2><span>3 aspect ratios, 60 fps</span>
  <div class="btn">Publish</div>
  <svg class="cursor" viewBox="0 0 24 24"><path d="M3 2l17 8-7.5 2.2L9.8 20z" fill="#fff" stroke="#16151a" stroke-width="1.6" stroke-linejoin="round"/></svg>
</section>
<script type="module">
import { curveToLinear, CURVES } from '/core/motion/springs.js';
const E = CURVES.expoOut;
const settle = curveToLinear(E);
const px = 0.66 * window.innerWidth, py = 0.63 * window.innerHeight;
const R = Math.hypot(px, py);   // to the farthest corner, so no travel is spent outside the frame
const at = `${px}px ${py}px`;   // px, not var(): a var() in a keyframe does not interpolate
const a = document.querySelector('.a'), b = document.querySelector('.b');
const close = { at: 550, dur: 650 };
document.querySelector('.cursor').animate([{ translate: '-24vw 16vh' }, { translate: '0 0' }], { duration: 500, delay: 50, easing: settle, fill: 'both' });
document.querySelector('.btn').animate([{ scale: 1 }, { scale: 0.95, offset: 0.4 }, { scale: 1 }], { duration: 220, delay: 480, easing: settle, fill: 'both' });
// ease in, fastest at the midpoint, soft close on the button; an accelerating-only curve spends its whole travel in the last 0.1 s
a.animate([{ clipPath: `circle(${R}px at ${at})` }, { clipPath: `circle(0px at ${at})` }],
  { duration: close.dur, delay: close.at, easing: curveToLinear((u) => (u < 0.5 ? 0.5 * (1 - E(1 - 2 * u)) : 0.5 + 0.5 * E(2 * u - 1))), fill: 'both' });
b.animate([{ scale: 1.1 }, { scale: 1 }], { duration: 1100, delay: close.at, easing: settle, fill: 'both' });
</script>
</body>
</html>
