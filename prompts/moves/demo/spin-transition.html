<!doctype html>
<html data-aspect="16:9" data-look="vawe">
<head>
<meta charset="utf-8">
<meta name="duration" content="1.4">
<title>move: spin transition</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; }
  #layers { position: absolute; inset: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .shot { position: absolute; inset: 0; }
  .a { background: var(--ground); }
  .a .card { position: absolute; left: 10vw; top: calc(var(--u) * 20); width: 52vw; height: calc(var(--u) * 60); display: flex; flex-direction: column; justify-content: space-between; padding: var(--s5); }
  .a .k { font: 500 var(--t-body)/1 var(--mono); color: var(--muted); }
  .a b { font: 700 calc(var(--u) * 20)/1 var(--sans); letter-spacing: -0.045em; }
  .a .pill { align-self: flex-start; }
  .a .top { display: flex; align-items: center; justify-content: space-between; }
  .a .avatars { --size: calc(var(--u) * 9); }
  .a .foot { display: flex; align-items: center; justify-content: space-between; }
  .a .foot span { font: 500 var(--t-small)/1 var(--sans); color: var(--muted); }
  .b { background: var(--paper); color: var(--paper-ink); }
  .b h2 { position: absolute; right: 10vw; top: calc(var(--u) * 28); margin: 0; text-align: right; font: 700 calc(var(--u) * 20)/0.95 var(--sans); letter-spacing: -0.05em; }
  .b p { position: absolute; right: 10vw; top: calc(var(--u) * 70); margin: 0; font: 500 var(--t-lead)/1 var(--mono); color: var(--paper-muted); }
  .b h2 i { font-style: normal; color: var(--accent); }
</style>
</head>
<body>
<template id="shots">
  <div class="shot a"><div class="card"><div class="top"><span class="k">Q3 renders</span><div class="avatars"><div class="avatar"><img src="/prompts/moves/demo/assets/photos/av-bust.jpg" alt=""></div><div class="avatar"><img src="/prompts/moves/demo/assets/photos/av-meadow.jpg" alt=""></div><div class="avatar"><img src="/prompts/moves/demo/assets/photos/av-david.jpg" alt=""></div></div></div><b>12,480</b><div class="foot"><span class="pill up">+38% on Q2</span><span>14 editors</span></div></div></div>
  <div class="shot b"><h2>Next:<br>Q4 <i>plan</i></h2><p>3 launches, 1 pipeline</p></div>
</template>
<div id="layers"></div>
<script type="module">
import '/core/engine/page-api.js';
import { CURVES } from '/core/motion/springs.js';
const W = innerWidth, H = innerHeight, N = 16, E = CURVES.expoOut, clamp = (u) => Math.min(1, Math.max(0, u));
const T0 = 0.45, DUR = 0.5, ROLL = 90;                                  // start (s), length (s), total roll (degrees)
const whip = (u) => (u < 0.5 ? 0.5 * (1 - E(1 - 2 * u)) : 0.5 + 0.5 * E(2 * u - 1));   // full speed at the cut
const P = (t) => whip(clamp((t - T0) / DUR));
const host = document.getElementById('layers');
const layers = Array.from({ length: N }, (_, j) => {
  const el = document.createElement('div'); el.className = 'layer';
  el.append(document.getElementById('shots').content.cloneNode(true));
  el.style.opacity = 1 / (j + 1);   // 1, 1/2, 1/3 ...: stacked they average into one exposure
  host.append(el);
  return { el, a: el.querySelector('.a'), b: el.querySelector('.b') };
});
// the smallest scale at which a W x H frame turned by deg still covers the W x H frame: no corner ever shows
const cover = (deg) => {
  const r = Math.abs(deg) * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
  return Math.max((W * c + H * s) / W, (W * s + H * c) / H);
};
vawe.onFrame((t) => {
  const p = P(t), spread = 0.5 * (P(t + 1 / 60) - p);   // a 180 degree shutter
  // under half a pixel of smear at the frame edge, one copy: stacked translucent copies show Chromium's 256 px tile seams on a flat ground
  const moving = spread * ROLL * (Math.PI / 180) * (W / 2) > 0.5;
  layers.forEach((l, j) => {
    l.el.style.visibility = j === 0 || moving ? 'visible' : 'hidden';
    const pj = clamp(p + (j / (N - 1) - 0.5) * spread), inB = pj >= 0.5;
    const deg = ROLL * pj - (inB ? ROLL : 0);           // shot A rolls 0 to 45, the cut, shot B rolls -45 to 0
    l.a.style.display = inB ? 'none' : 'block';
    l.b.style.display = inB ? 'block' : 'none';
    l.el.style.transform = `rotate(${deg.toFixed(3)}deg) scale(${(cover(deg) * (1 + 0.025 * t)).toFixed(4)})`;
  });
});
</script>
</body>
</html>
