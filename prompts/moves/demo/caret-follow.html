<!doctype html>
<html data-aspect="16:9">
<head>
<meta charset="utf-8">
<meta name="duration" content="2">
<title>move: caret follow</title>
<style>
  @font-face { font-family: 'Archivo'; font-weight: 100 900; font-display: block; src: url('/assets/fonts/Archivo.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 100 800; font-display: block; src: url('/assets/fonts/JetBrainsMono.woff2') format('woff2'); }
  :root { --ground: #16151a; --card: #1e1d24; --ink: #fff; --dim: #8b8a94; --accent: #0a87ff; }
  html, body { margin: 0; height: 100%; background: var(--ground); overflow: hidden; }

  .world { position: absolute; inset: 0; transform-origin: 0 0; }
  .win { position: absolute; left: 8vw; top: 22vh; width: 88vw; height: 40vh; background: var(--card); border-radius: 2vh; }
  .line { position: absolute; left: 3vw; top: 14vh; font: 500 6.4vh/1 'JetBrains Mono', monospace; color: var(--ink); white-space: pre; }
  .prompt { color: var(--accent); }
  .flag { color: var(--dim); }
  .caret { display: inline-block; width: 0.6em; height: 1.05em; margin-bottom: -0.16em; background: var(--accent); }
</style>
</head>
<body>
<div class="world"><div class="win"><div class="line"><span class="prompt">$ </span><span class="cmd"></span><span class="caret"></span></div></div></div>
<script type="module">
import '/core/engine/page-api.js';
import { track, rng } from '/core/motion/springs.js';
const world = document.querySelector('.world'), cmd = document.querySelector('.cmd'), caret = document.querySelector('.caret');
const parts = [['vawe ship films/launch', ''], [' --aspect all', 'flag']];
const text = parts.map((p) => p[0]).join('');
const W = window.innerWidth, H = window.innerHeight;
const line = document.querySelector('.line').getBoundingClientRect();
const ch = caret.getBoundingClientRect().width;               // monospace: one caret is one character wide
const promptW = document.querySelector('.prompt').getBoundingClientRect().width;
const winLeft = document.querySelector('.win').getBoundingClientRect().left;
const s = 1.9, x0 = line.left + promptW, y = line.top + line.height / 2;

// each character has a seeded time; a space adds a small pause, so the typing has a rhythm
const rand = rng(7);
let clock = 0.2;
const at = [...text].map((c) => { clock += 0.026 + rand() * 0.024 + (c === ' ' ? 0.07 : 0); return clock; });
const keys = [[0, x0], ...at.map((t, i) => [t, x0 + (i + 1) * ch])];

vawe.onFrame((t) => {
  const n = at.filter((a) => a <= t).length;
  let left = n;
  cmd.replaceChildren(...parts.map(([str, cls]) => {
    const span = Object.assign(document.createElement('span'), { className: cls, textContent: str.slice(0, Math.max(0, left)) });
    left -= str.length;
    return span;
  }));
  caret.style.opacity = n < text.length || Math.floor(t * 2.4) % 2 === 0 ? 1 : 0;
  // the camera is a spring behind the caret: it trails by a fraction of a second and never sits ahead of the text
  const follow = track(t, keys, 90, 20);
  const tx = Math.min(W * 0.66 - s * follow, W * 0.05 - s * winLeft);
  world.style.transform = `translate(${tx.toFixed(2)}px, ${(H * 0.5 - s * y).toFixed(2)}px) scale(${s})`;
});
</script>
</body>
</html>
