<!doctype html>
<html data-aspect="16:9" data-look="product" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="duration" content="6">
<title>move: push in</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; position: relative; }
  .grid { position: absolute; inset: -6%; background-image: linear-gradient(rgba(13, 13, 13, 0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(13, 13, 13, 0.06) 1px, transparent 1px); background-size: calc(var(--u) * 6) calc(var(--u) * 6); }
  .world, .front { position: absolute; inset: 0; }
  .front { pointer-events: none; }
  .db { position: absolute; inset: 0; display: flex; flex-direction: column; gap: calc(var(--u) * 2.6); padding: calc(var(--u) * 3.2) calc(var(--u) * 4); background: var(--raised); }
  .db-top { display: flex; align-items: center; gap: calc(var(--u) * 3); }
  .db-top b { font: 600 calc(var(--u) * 3.4)/1 var(--sans); letter-spacing: -0.02em; }
  .db-top .tabs { display: flex; gap: calc(var(--u) * 2.4); font: 500 calc(var(--u) * 2.3)/1 var(--sans); color: var(--muted); }
  .db-top .tabs .on { color: var(--ink); }
  .db-top .rng { margin-left: auto; padding: calc(var(--u) * 1) calc(var(--u) * 1.8); border-radius: calc(var(--u) * 0.9); background: var(--surface); box-shadow: 0 0 0 1px var(--line); font: 500 calc(var(--u) * 2.3)/1 var(--sans); }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u) * 2.2); }
  .kpi { padding: calc(var(--u) * 2.4) calc(var(--u) * 2.8); border-radius: calc(var(--u) * 1.4); background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
  .kpi .l { font: 500 calc(var(--u) * 2.3)/1 var(--sans); color: var(--muted); }
  .kpi .v { margin-top: calc(var(--u) * 1.4); font: 600 calc(var(--u) * 8.4)/1 var(--sans); letter-spacing: -0.04em; }
  .kpi .v small { margin-left: calc(var(--u) * 0.8); font: 500 calc(var(--u) * 3.4)/1 var(--sans); letter-spacing: -0.01em; color: var(--muted); }
  .kpi .d { margin-top: calc(var(--u) * 1.4); font: 500 calc(var(--u) * 2.3)/1 var(--sans); color: #1a7f37; }
  .chart { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: calc(var(--u) * 2.4) calc(var(--u) * 2.8) calc(var(--u) * 2); border-radius: calc(var(--u) * 1.4); background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
  .chart .t { display: flex; justify-content: space-between; font: 500 calc(var(--u) * 2.3)/1 var(--sans); }
  .chart .t span { color: var(--muted); }
  .plot { position: relative; flex: 1; min-height: 0; margin-top: calc(var(--u) * 1.6); display: flex; align-items: flex-end; gap: calc(var(--u) * 1.2); padding-left: calc(var(--u) * 5); border-bottom: 1px solid var(--line); }
  .plot .gl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); font: 500 calc(var(--u) * 2)/1 var(--mono); color: var(--faint); }
  .plot .gl span { position: absolute; left: 0; top: calc(var(--u) * -1.2); }
  .plot .b { position: relative; flex: 1; border-radius: calc(var(--u) * 0.5) calc(var(--u) * 0.5) 0 0; background: #cfcfcf; transform-origin: 50% 100%; }
  .tip { position: absolute; left: 0; top: 0; padding: calc(var(--u) * 1.4) calc(var(--u) * 2); border-radius: calc(var(--u) * 1.1); background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 calc(var(--u) * 1) calc(var(--u) * 3) rgb(0 0 0 / 0.12); white-space: nowrap; opacity: 0; }
  .tip .d { font: 500 calc(var(--u) * 2.4)/1 var(--sans); color: var(--muted); }
  .tip .n { margin-top: calc(var(--u) * 0.8); font: 600 calc(var(--u) * 4.2)/1 var(--sans); letter-spacing: -0.02em; }
</style>
<script type="application/json" id="authoring">{"allow": ["text-unreadable-hold", "text-moves-before-hold", "static-window@4.8-5.6", "world-held@0.0-6.0"], "_why": {"text-unreadable-hold": "the dashboard holds 2.1 s after the push ends at 3.5 s in a 6 s clip, and the check asks 5.4 s", "text-moves-before-hold": "the window leaves at 5.6 s, 0.4 s before the 6 s end, so the finished page holds 2.1 s, short of the 5.4 s the check asks", "static-window@4.8-5.6": "dashboard at 5.0 s: the camera holds and the hover tooltip stays on its bar until it steps to the next bar at 4.8 s", "world-held@0.0-6.0": "one dashboard holds 6.0 s: the bars draw from 0.5 s, the camera pushes 0.9 to 3.5 s and the window leaves at 5.6 s"}}</script>
</head>
<body>
<div class="grid" id="grid"></div>
<div class="world" id="world">
  <div class="win">
    <div class="strip" data-chrome><span class="lights"><i></i><i></i><i></i></span>
      <span class="tab"><i class="fav"></i><span>Renders</span><svg class="icon x" data-i="x"></svg></span>
      <svg class="icon newtab" data-i="plus"></svg></div>
    <div class="bar" data-chrome><svg class="icon" data-i="back"></svg><svg class="icon" data-i="fwd"></svg><svg class="icon" data-i="reload"></svg>
      <span class="omni"><svg class="icon" data-i="lock"></svg><span>app.vawe.dev/renders</span></span><i class="avatar-dot"></i><svg class="icon" data-i="dots-v"></svg></div>
    <div class="page"><div class="db">
      <div class="db-top"><b>Renders</b><span class="tabs"><span class="on">Overview</span><span>Films</span><span>Checks</span></span><span class="rng">Last 14 days</span></div>
      <div class="kpis">
        <div class="kpi" id="kpi"><div class="l">Median render</div><div class="v">41<small>s</small></div><div class="d">12% faster than last week</div></div>
        <div class="kpi"><div class="l">Films shipped</div><div class="v">128</div><div class="d">9 more than last week</div></div>
        <div class="kpi"><div class="l">Pass rate</div><div class="v">94<small>%</small></div><div class="d">2 points up</div></div>
      </div>
      <div class="chart"><div class="t"><b style="font-weight:600">Render time</b></div>
        <div class="plot" id="plot"><div class="gl" style="top:0"><span>60</span></div><div class="gl" style="top:33.3%"><span>40</span></div><div class="gl" style="top:66.6%"><span>20</span></div></div>
      </div>
    </div></div>
  </div>
</div>
<div class="front" id="front"><div class="tip" id="tip"><div class="d" id="td"></div><div class="n" id="tn"></div></div></div>
<script type="module">
import '/core/engine/page-api.js';
import { EASE } from '/core/motion/presets.js';
import { leave, arrive } from '/prompts/moves/demo/assets/stage.js';
const q = (s) => document.querySelector(s), all = (s) => [...document.querySelectorAll(s)];
const ICONS = {
  x: '<path d="M6 6l12 12M18 6L6 18"/>', plus: '<path d="M12 5v14M5 12h14"/>', back: '<path d="M19 12H5M11 6l-6 6 6 6"/>', fwd: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  reload: '<path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/>', 'dots-v': '<path d="M12 5v.01M12 12v.01M12 19v.01"/>', lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
};
for (const el of all('[data-i]')) { el.setAttribute('viewBox', '0 0 24 24'); el.innerHTML = ICONS[el.dataset.i]; }

const END = 6000, PUSH_AT = 900, PUSH_MS = 2600, HOVER_AT = 3700, STEP_AT = 4800;
const VALUES = [52, 48, 55, 50, 47, 44, 46, 45, 43, 48, 42, 40, 44, 41], DAYS = ['Oct 10', 'Oct 11', 'Oct 12', 'Oct 13', 'Oct 14', 'Oct 15', 'Oct 16', 'Oct 17', 'Oct 18', 'Oct 19', 'Oct 20', 'Oct 21', 'Oct 22', 'Oct 23'];
const HOT = [11, 13];
const plot = q('#plot');
VALUES.forEach((v) => { const b = document.createElement('i'); b.className = 'b'; b.style.height = `${v / 60 * 100}%`; plot.append(b); });
const bars = all('.b');

arrive(q('.win'), 100, { ms: 220, from: '0.8vh' });
bars.forEach((b, i) => b.animate([{ scale: '1 0' }, { scale: '1 1' }], { duration: 600, delay: 500 + i * 40, easing: EASE.land, fill: 'both' }));

// the camera leans toward the first number: the subject scales most, the ground behind it least, the tooltip in front more than the page
const S = { ground: 1.04, world: 1.14, front: 1.2 };
const H = innerHeight, k = q('#kpi').getBoundingClientRect();
const O = { x: k.left + k.width * 0.5, y: H / 2 };   // a point on the number's column, at mid height, so the window crops evenly top and bottom
[['#grid', S.ground], ['#world', S.world], ['#front', S.front]].forEach(([sel, to]) => {
  const el = q(sel);
  el.style.transformOrigin = `${O.x}px ${O.y}px`;
  el.animate([{ scale: 1 }, { scale: to }], { duration: PUSH_MS, delay: PUSH_AT, easing: EASE.glide, fill: 'both' });
});

// the tooltip belongs to the front layer, so it lands on its bar once both layers have scaled: place its tip where the bar ends up
const tip = q('#tip'), tipAt = (i) => {
  const r = bars[i].getBoundingClientRect(), p = plot.getBoundingClientRect(), bx = r.left + r.width / 2, by = p.bottom - 1 - VALUES[i] / 60 * (p.height - 1) - 0.008 * H;
  return [O.x + (bx - O.x) * S.world / S.front, O.y + (by - O.y) * S.world / S.front];
};
const [x1, y1] = tipAt(HOT[0]), [x2, y2] = tipAt(HOT[1]);
tip.style.cssText += `;left:${x1}px;top:${y1 - 14}px;translate:-50% -100%`;
tip.animate([{ opacity: 0, translate: '-50% -96%' }, { opacity: 1, translate: '-50% -100%' }], { duration: 220, delay: HOVER_AT, easing: EASE.land, fill: 'both' });
tip.animate([{ left: `${x1}px`, top: `${y1 - 14}px` }, { left: `${x2}px`, top: `${y2 - 14}px` }], { duration: 160, delay: STEP_AT, easing: EASE.land, fill: 'both' });
HOT.forEach((i, n) => bars[i].animate([{ backgroundColor: '#cfcfcf' }, { backgroundColor: '#0d0d0d' }], { duration: 160, delay: n ? STEP_AT : HOVER_AT, easing: EASE.land, fill: 'both' }));
bars[HOT[0]].animate([{ backgroundColor: '#0d0d0d' }, { backgroundColor: '#cfcfcf' }], { duration: 160, delay: STEP_AT, easing: EASE.land, fill: 'forwards' });
vawe.onFrame((s) => {
  const n = s * 1000 >= STEP_AT ? 1 : 0;
  q('#td').textContent = DAYS[HOT[n]];
  q('#tn').textContent = `${VALUES[HOT[n]]} s`;
});
leave(q('#world'), END);
leave(q('#front'), END);

</script>
</body>
</html>
