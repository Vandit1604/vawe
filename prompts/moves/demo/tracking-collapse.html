<!doctype html>
<html data-aspect="16:9">
<head>
<meta charset="utf-8">
<meta name="duration" content="1">
<meta name="blank" content="0-0.1">
<title>move: tracking collapse</title>
<style>
  @font-face { font-family: 'Archivo'; font-weight: 100 900; font-display: block; src: url('/assets/fonts/Archivo.woff2') format('woff2'); }
  :root { --ground: #16151a; --ink: #fff; --accent: #0a87ff; }
  html, body { margin: 0; height: 100%; background: var(--ground); overflow: hidden; }
  /* 9vh, not the usual 16: the word is 1.8x its settled width at the first frame, and it has to fit then */
  body { display: grid; place-items: center; font: 500 9vh/1 'Archivo', sans-serif; color: var(--ink); text-transform: uppercase; }

  /* letter-spacing adds a trailing gap after the last letter; text-indent of the same size keeps the word centred while it collapses */
  h1 { margin: 0; white-space: nowrap; letter-spacing: 0.35em; text-indent: 0.35em; opacity: 0; filter: blur(0.06em);
       animation-name: converge, sharpen; animation-duration: 0.9s, 0.5s; animation-delay: 0.1s, 0.1s;
       animation-timing-function: var(--settle), var(--settle); animation-fill-mode: both, both; }
  @keyframes converge { to { letter-spacing: 0.02em; text-indent: 0.02em; } }
  @keyframes sharpen { to { opacity: 1; filter: blur(0); } }
</style>
</head>
<body>
<h1>Converge</h1>
<script type="module">
import { curveToLinear, CURVES } from '/core/motion/springs.js';
document.documentElement.style.setProperty('--settle', curveToLinear(CURVES.expoOut));
</script>
</body>
</html>
