<!doctype html>
<html data-aspect="16:9" data-look="vawe">
<head>
<meta charset="utf-8">
<meta name="duration" content="1.7">
<title>move: zoom through</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { position: relative; display: block; }
  .layer { position: absolute; inset: 0; overflow: hidden; }
  .a, .bs { position: absolute; inset: 0; transform-origin: 0 0; }
  .a { background: var(--ground); }
  .bs { transform-origin: 50% 50%; display: none; }
  .layer.in-b { background: var(--accent); }
  .layer.in-b .a { display: none; }
  .layer.in-b .bs, .layer.in-disc .bs { display: block; }
  .a .card { position: absolute; left: 12vw; top: calc(var(--u) * 22); width: 76vw; height: calc(var(--u) * 56); }
  .a h2 { position: absolute; left: var(--s5); top: var(--s5); margin: 0; font: 700 var(--t-title)/1.06 var(--sans); letter-spacing: -0.03em; }
  .a .meta { position: absolute; left: var(--s5); bottom: var(--s5); font: 500 var(--t-body)/1.3 var(--mono); color: var(--muted); }
  .a .pill { position: absolute; left: var(--s5); top: calc(var(--u) * 30); }
  .disc { position: absolute; left: 66vw; top: 50vh; width: calc(var(--u) * 24); height: calc(var(--u) * 24); margin: calc(var(--u) * -12) 0 0 calc(var(--u) * -12); border-radius: 50%; background: var(--accent); box-shadow: 0 calc(var(--u) * 1.2) calc(var(--u) * 4) rgba(10, 135, 255, 0.35); }
  .bs .hero { position: absolute; left: 9vw; top: calc(var(--u) * 28); font: 800 calc(var(--u) * 24)/1 var(--sans); letter-spacing: -0.05em; color: var(--on-accent); }
  .bs .sub { position: absolute; left: 9.6vw; top: calc(var(--u) * 60); font: 500 var(--t-lead)/1 var(--mono); color: var(--on-accent); }
</style>
</head>
<body>
<template id="a"><div class="a"><div class="card"><h2>Launch film</h2><div class="pill up">3 aspects</div><div class="meta">0:41  60 fps</div></div><div class="disc"></div></div></template>
<template id="b"><div class="bs"><div class="hero">Live</div><div class="sub">vawe.dev/launch</div></div></template>
<div id="layers"></div>
<script type="module">
import '/core/engine/page-api.js';
import { CURVES } from '/core/motion/springs.js';
const E = CURVES.expoOut, W = window.innerWidth, H = window.innerHeight;
const whip = (u) => (u < 0.5 ? 0.5 * (1 - E(1 - 2 * u)) : 0.5 + 0.5 * E(2 * u - 1));
const t0 = 0.3, dur = 1.1, R = 20, S = R * 1.08, N = 8, SWAP = 12.5, EMERGE = 6.5;   // R: scale at which shot B is full frame; SWAP: the disc (12 percent of the frame height in radius) covers the frame from about 11
const ox = 0.66 * W, oy = 0.5 * H;                                    // the disc centre
const P = (t) => { const u = Math.min(1, Math.max(0, (t - t0) / dur)); return 0.4 * u + 0.6 * whip(u); };
const host = document.getElementById('layers');
const layers = Array.from({ length: N }, (_, j) => {
  const el = document.createElement('div'); el.className = 'layer';
  el.append(document.getElementById('a').content.cloneNode(true), document.getElementById('b').content.cloneNode(true));
  el.style.opacity = 1 / (j + 1);   // 1, 1/2, 1/3 ...: laid over each other they average, which is one exposure
  host.append(el);
  return { el, a: el.querySelector('.a'), b: el.querySelector('.bs') };
});
vawe.onFrame((t) => {
  const p = P(t), spread = 0.5 * (P(t + 1 / 60) - P(t));   // a 180 degree shutter: half of one frame's travel, split across the copies
  layers.forEach((l, j) => {
    const pj = p + (j / (N - 1) - 0.5) * spread;
    const s = Math.exp(Math.log(S) * pj);
    const px = ox + (W / 2 - ox) * pj, py = oy + (H / 2 - oy) * pj;
    l.el.classList.toggle('in-b', s >= SWAP);
    l.el.classList.toggle('in-disc', s >= EMERGE);   // shot B's type fades up inside the disc before the disc has filled the frame
    l.b.style.opacity = Math.min(1, Math.max(0, (s - EMERGE) / 2.5));
    l.a.style.transform = `translate(${px - s * ox}px, ${py - s * oy}px) scale(${s})`;
    l.b.style.transform = `scale(${s / R})`;
  });
});
</script>
</body>
</html>
