<!doctype html>
<html data-aspect="16:9" data-look="paper">
<head>
<meta charset="utf-8">
<meta name="duration" content="3.2">
<title>move: lower third</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; }
  .shot { position: absolute; inset: 0; background: url("/prompts/moves/demo/assets/photos/reading.jpg") 62% 50% / cover; transform-origin: 70% 50%; }
  .third { position: absolute; left: var(--s5); bottom: calc(var(--s5) + var(--s2)); display: flex; align-items: stretch; }
  .rule { width: var(--s1); background: var(--accent); transform-origin: 50% 100%; }
  .plate { display: flex; flex-direction: column; gap: var(--s1); padding: var(--s3) var(--s5) var(--s3) var(--s4); background: var(--surface); box-shadow: var(--stack); }
  .mask { overflow: hidden; padding: 0.06em 0 0.14em; margin: -0.06em 0 -0.14em; }
  .name { display: block; font: 400 var(--t-title)/1 var(--head); letter-spacing: -0.02em; white-space: nowrap; }
  .role { display: block; font: 600 var(--t-small)/1.1 var(--label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
</style>
</head>
<body>
<div class="shot"></div>
<div class="third">
  <div class="rule"></div>
  <div class="plate">
    <div class="mask"><span class="name">Ines Calloway</span></div>
    <div class="mask"><span class="role">Head of field research, Tidewell</span></div>
  </div>
</div>
<script type="module">
import { EASE } from '/core/motion/presets.js';
const q = (s) => document.querySelector(s);
const opt = { fill: 'both' };
const at = { rule: 420, plate: 520, name: 760, role: 900 };   // ms

// the shot keeps drifting under the card, so the frame is alive while the name holds
q('.shot').animate([{ scale: 1.0 }, { scale: 1.05 }], { duration: 3200, easing: EASE.glide, ...opt });

// in: the rule grows up, the plate wipes open from it, the name rises out of its mask, then the role
q('.rule').animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: 380, delay: at.rule, easing: EASE.landSoft, ...opt });
q('.plate').animate([{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)' }], { duration: 560, delay: at.plate, easing: EASE.land, ...opt });
q('.name').animate([{ translate: '0 105%' }, { translate: '0 0' }], { duration: 520, delay: at.name, easing: EASE.land, ...opt });
q('.role').animate([{ translate: '0 120%' }, { translate: '0 0' }], { duration: 460, delay: at.role, easing: EASE.landSoft, ...opt });
</script>
</body>
</html>
