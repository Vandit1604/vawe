<!doctype html>
<html data-aspect="16:9" data-look="signal">
<head>
<meta charset="utf-8">
<meta name="duration" content="3">
<title>move: gradient mesh field</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; position: relative; }
  .copy { position: absolute; left: 9vw; top: 50vh; translate: 0 -50%; width: 62vw; }
  .copy .title { margin: 0; font-size: calc(var(--u) * 17); line-height: 1.04; }
  .copy .title .accent { color: var(--accent); }
  .copy .lead { margin: var(--s4) 0 0; max-width: 28em; color: var(--ink); text-wrap: pretty; }
</style>
</head>
<body>
<main class="copy">
  <h1 class="title">A ground that <span class="accent">moves.</span></h1>
  <p class="lead">Four soft lights on slow seeded paths, blended in one shader.</p>
</main>
<script type="module">
import '/core/engine/page-api.js';
import { shaderField } from '/core/surfaces/shader-field.js';

const tokens = getComputedStyle(document.documentElement);
const rgb = (name) => { const h = tokens.getPropertyValue(name).trim(); return [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255); };

const frag = `
uniform vec3 u_ground, u_a, u_b;
float hash(float n) { return fract(sin(n * 12.9898 + u_seed * 78.233) * 43758.5453); }
float vnoise(float x) { float i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f); return mix(hash(i), hash(i + 1.0), f); }
vec2 wander(float k, vec2 home, float amp) {
  float s = u_time * 0.45 + k * 19.7;
  return home + amp * 2.0 * vec2(vnoise(s) - 0.5, vnoise(s + 41.3) - 0.5);
}
float pool(vec2 p, vec2 c, float r) { vec2 d = (p - c) / r; return exp(-dot(d, d)); }
vec3 lin(vec3 c) { return pow(c, vec3(2.2)); }
void main() {
  float aspect = u_res.x / u_res.y;
  vec2 p = gl_FragCoord.xy / u_res.y;
  vec3 ground = lin(u_ground), a = lin(u_a), b = lin(u_b), ab = mix(a, b, 0.5);
  vec3 col = ground;
  col = mix(col, a,  0.85 * pool(p, wander(0.0, vec2(0.30 * aspect, 0.22), 0.14), 0.62));
  col = mix(col, a,  0.58 * pool(p, wander(1.0, vec2(0.82 * aspect, 0.86), 0.12), 0.50));
  col = mix(col, ab, 0.38 * pool(p, wander(2.0, vec2(0.68 * aspect, 1.04), 0.08), 0.30));
  col = mix(col, b,  0.26 * pool(p, wander(3.0, vec2(0.86 * aspect, 0.26), 0.12), 0.42));
  col = pow(col, vec3(1.0 / 2.2));
  float g = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5;
  gl_FragColor = vec4(col + g * 0.035, 1.0);
}`;

const field = shaderField(frag, { seed: 7, uniforms: { u_ground: rgb('--ground'), u_a: rgb('--tile-alt'), u_b: rgb('--accent') } });
vawe.onFrame((t) => field.draw(t));
</script>
</body>
</html>
