<!doctype html>
<html data-aspect="16:9" data-look="editorial">
<head>
<meta charset="utf-8">
<meta name="duration" content="5">
<title>move: gradient mesh field</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; position: relative; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .copy { position: absolute; left: 9vw; top: 50vh; translate: 0 -50%; width: 56vw; }
  .copy .title { margin: 0; font: 300 calc(var(--u) * 17)/1.02 var(--sans); letter-spacing: -0.04em; }
  .copy .lead { margin: calc(var(--u) * 4) 0 0; max-width: 20em; font: 400 calc(var(--u) * 4.8)/1.3 var(--sans); color: var(--ink); text-wrap: pretty; }

  .mask { display: block; overflow: hidden; padding: 0.1em 0.1em 0.25em; margin: -0.1em -0.1em -0.25em; }
  .mask > span { display: block; translate: 0 118%; animation: rise 0.7s var(--settle) both; animation-delay: calc(0.12s + var(--i) * 0.14s); }
  @keyframes rise { to { translate: 0 0; } }

  .w { display: inline-block; opacity: 0; filter: blur(0.14em); translate: 0 0.22em;
       animation: resolve 0.8s var(--soft) both; animation-delay: calc(0.5s + var(--i) * 0.09s); }
  @keyframes resolve { 45% { opacity: 1; } to { opacity: 1; filter: blur(0); translate: 0 0; } }
</style>
<script type="application/json" id="authoring">{"allow": ["text-unreadable-hold", "text-moves-before-hold", "world-held@0.0-5.0"], "_why": {"text-unreadable-hold": "the copy holds 2.4 s after its last word lands at 2.2 s in a 5 s clip, and the check asks 5.4 s", "text-moves-before-hold": "the copy leaves at 4.6 s, 0.4 s before the 5 s end, so it holds 2.4 s, short of the 5.4 s the check asks", "world-held@0.0-5.0": "one title holds 5.0 s: the bands flow the whole clip, the darker sand band widens from 1.6 to 2.6 s and the copy leaves at 4.6 s"}}</script>
</head>
<body>
<canvas id="bands"></canvas>
<main class="copy" id="copy">
  <h1 class="title"><span class="mask" style="--i:0"><span>A ground</span></span><span class="mask" style="--i:1"><span>that flows.</span></span></h1>
  <p class="lead" id="lead">Layers of colour drift across the page, crisp at every edge.</p>
</main>
<script type="module">
import '/core/engine/page-api.js';
import { EASE, easeFn } from '/core/motion/presets.js';
import { leave } from '/prompts/moves/demo/assets/stage.js';

const root = document.documentElement;
root.style.setProperty('--settle', EASE.land);
root.style.setProperty('--soft', EASE.land);
const lead = document.getElementById('lead');
lead.innerHTML = lead.textContent.split(' ').map((t, i) => `<span class="w" style="--i:${i}">${t}</span>`).join(' ');

// Five layers of colour with crisp edges. Each edge is a sine curve with its own phase and speed, so the layers flow but never cross.
const W = innerWidth, H = innerHeight, u = H / 100;
const canvas = document.getElementById('bands');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');
const ground = getComputedStyle(root).getPropertyValue('--ground').trim();
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, p) => `rgb(${hex(a).map((v, i) => Math.round(v + (hex(b)[i] - v) * p)).join(',')})`;
const LAYERS = [   // top to bottom: base height, amplitude, waves across the frame, phase, speed (rad/s), colour
  { y: 0.10, a: 0.045, f: 1.0, p: 0.0, w: 1.1, c: '#eee6d6' },
  { y: 0.25, a: 0.050, f: 1.3, p: 1.7, w: 1.4, c: '#e4d8c1' },
  { y: 0.40, a: 0.045, f: 0.9, p: 3.1, w: 1.0, c: '#d6c4a6' },
  { y: 0.52, a: 0.040, f: 1.2, p: 4.4, w: 1.3, c: '#a8855a' },   // the one darker sand band, thin, that widens once
  { y: 0.58, a: 0.040, f: 1.1, p: 5.6, w: 1.2, c: '#c4ab84' },
];
const TILT = 0.2, THIN = 0.025, WIDE = 0.075, WIDEN_AT = 1.6, land = easeFn('land');
const clamp = (v) => Math.min(1, Math.max(0, v));
const edge = (L, x, t, extra) => H * (L.y + extra + (x / W - 0.5) * TILT + L.a * Math.sin(2 * Math.PI * L.f * x / W + L.p + L.w * t));
function fill(L, t, extra, bottomOf) {
  const g = ctx.createLinearGradient(0, 0, W, 0);   // flat ground on the left under the copy, full colour on the right
  const s0 = 0.5;
  g.addColorStop(0, ground); g.addColorStop(s0, mix(ground, L.c, 0.2)); g.addColorStop(s0 + (1 - s0) * 0.55, mix(ground, L.c, 0.75)); g.addColorStop(1, L.c);
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 8) ctx.lineTo(x, edge(L, x, t, extra));
  ctx.lineTo(W, H); ctx.closePath();
  ctx.shadowColor = 'rgba(70, 45, 20, 0.2)'; ctx.shadowBlur = 2.4 * u; ctx.shadowOffsetY = -0.7 * u;   // a contact shadow above each edge, as layers of paper cast
  ctx.fillStyle = g; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.beginPath();
  for (let x = 0; x <= W; x += 8) { const y = edge(L, x, t, extra); if (x) ctx.lineTo(x, y); else ctx.moveTo(x, y); }
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)'; ctx.lineWidth = 1.5; ctx.stroke();   // a 1 px highlight on each lit edge
}
vawe.onFrame((t) => {
  ctx.fillStyle = ground; ctx.fillRect(0, 0, W, H);
  const th = THIN + (WIDE - THIN) * land(clamp((t - WIDEN_AT) / 1.0));   // the accent layer widens once
  LAYERS.forEach((L, i) => fill(L, t, i === 4 ? th - THIN : 0));
});
leave(document.getElementById('copy'), 5000);
</script>
</body>
</html>
