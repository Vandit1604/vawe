<!doctype html>
<html data-aspect="16:9" data-look="daylight">
<head>
<meta charset="utf-8">
<meta name="duration" content="3">
<title>move: swipe continues</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; }
  #layers { position: absolute; inset: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; background: var(--ground); }
  .belt { position: absolute; inset: 0; }
  .card { position: absolute; top: 50%; width: calc(var(--u) * 80); height: calc(var(--u) * 54); margin-top: calc(var(--u) * -27); margin-left: calc(var(--u) * -40); display: flex; flex-direction: column; justify-content: space-between; }
  .a { left: 50%; }
  .b { left: calc(50% + 74vw); }
  .top, .foot { display: flex; align-items: center; justify-content: space-between; }
  .k { font: 500 var(--t-body)/1 var(--mono); color: var(--muted); }
  .a b { font: 700 calc(var(--u) * 17)/1 var(--sans); letter-spacing: -0.045em; }
  .avatars { --size: calc(var(--u) * 8); }
  .foot span:last-child { font: 500 var(--t-small)/1 var(--sans); color: var(--muted); }
  .b h2 { margin: 0; font: 700 var(--t-head)/1.1 var(--sans); letter-spacing: -0.03em; }
  .row { display: grid; grid-template-columns: calc(var(--u) * 24) 1fr; align-items: center; gap: var(--s3); font: 500 var(--t-body)/1 var(--sans); }
  .row i { display: block; height: calc(var(--u) * 2.2); border-radius: 999px; background: var(--accent); transform-origin: 0 50%; }
  .row i.s2 { opacity: 0.6; }
  .row i.s3 { opacity: 0.35; }
  .touch { position: absolute; right: calc(var(--u) * 9); top: 54%; width: calc(var(--u) * 9); height: calc(var(--u) * 9); margin: calc(var(--u) * -4.5); border-radius: 50%; background: color-mix(in srgb, var(--ink) 16%, transparent); box-shadow: 0 0 0 calc(var(--u) * 0.35) color-mix(in srgb, var(--ink) 40%, transparent); }
</style>
</head>
<body>
<template id="scene">
  <div class="belt">
    <div class="card a">
      <div class="top"><span class="k">Q3 renders</span><div class="avatars"><div class="avatar"><img src="/prompts/moves/demo/assets/photos/av-bust.jpg" alt=""></div><div class="avatar"><img src="/prompts/moves/demo/assets/photos/av-meadow.jpg" alt=""></div><div class="avatar"><img src="/prompts/moves/demo/assets/photos/av-david.jpg" alt=""></div></div></div>
      <b>12,480</b>
      <div class="foot"><span class="pill up">+38% on Q2</span><span>14 editors</span></div>
      <div class="touch"></div>
    </div>
    <div class="card b">
      <div class="top"><h2>Q4 plan</h2><span class="pill">3 launches</span></div>
      <div class="row"><span>Launch film</span><i class="s1"></i></div>
      <div class="row"><span>Docs site</span><i class="s2"></i></div>
      <div class="row"><span>Pipeline</span><i class="s3"></i></div>
    </div>
  </div>
</template>
<div id="layers"></div>
<script type="module">
import '/core/engine/page-api.js';
import { easeFn } from '/core/motion/presets.js';
const W = innerWidth, N = 8, FRAME = 1 / 60, clamp = (u) => Math.min(1, Math.max(0, u));
const TRAVEL = 0.74 * W, EXIT_SHARE = 0.4;                  // one belt carries both cards: A is 0.74 W left of B
const T0 = 0.55, D_OUT = 0.4, D_IN = 0.6, T1 = T0 + D_OUT;   // the finger lets go at T1, the belt keeps its speed
const carry = easeFn('carry'), land = easeFn('land');
// the speed at the seam is 4.8 x the average on both sides: 4.8 * share * TRAVEL / D_OUT = 4.8 * (1 - share) * TRAVEL / D_IN
const belt = (t) => (t < T1 ? EXIT_SHARE * TRAVEL * carry(clamp((t - T0) / D_OUT)) : EXIT_SHARE * TRAVEL + (1 - EXIT_SHARE) * TRAVEL * land(clamp((t - T1) / D_IN)));
const host = document.getElementById('layers');
const layers = Array.from({ length: N }, (_, j) => {
  const el = document.createElement('div'); el.className = 'layer';
  el.append(document.getElementById('scene').content.cloneNode(true));
  el.style.opacity = 1 / (j + 1);   // stacked at 1, 1/2, 1/3 ...: copies at shutter times average into one exposure
  host.append(el);
  return { el, belt: el.querySelector('.belt'), touch: el.querySelector('.touch'), bars: [...el.querySelectorAll('.row i')] };
});
vawe.onFrame((t) => {
  const moving = Math.abs(belt(t + FRAME) - belt(t - FRAME)) > 1;
  layers.forEach((l, j) => {
    const tj = t + (j / (N - 1) - 0.5) * 0.5 * FRAME;   // 180 degree shutter
    l.el.style.visibility = j === 0 || moving ? 'visible' : 'hidden';
    l.belt.style.transform = `translateX(${-belt(tj)}px)`;
    const down = land(clamp((t - 0.3) / 0.12)), up = easeFn('launch')(clamp((t - T1) / 0.12));
    l.touch.style.opacity = down * (1 - up);
    l.touch.style.transform = `scale(${(1.25 - 0.3 * down) * (1 + 0.35 * up)})`;
    l.bars.forEach((bar, i) => { bar.style.transform = `scaleX(${[0.9, 0.62, 0.38][i] * land(clamp((t - 1.5 - i * 0.09) / 0.5))})`; });
  });
});
</script>
</body>
</html>
