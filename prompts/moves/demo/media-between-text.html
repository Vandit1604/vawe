<!doctype html>
<html data-aspect="16:9" data-look="editorial" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="duration" content="4.4">
<title>move: media between text</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<script type="application/json" id="authoring">{"allow": ["text-unreadable-hold", "text-moves-before-hold", "world-held@0.0-4.4"], "_why": {"text-unreadable-hold": "the line is on screen from 0.1 s and holds 4.0 s, and the check asks 5.4 s", "text-moves-before-hold": "the line leaves at 4.0 s, 0.4 s before the 4.4 s end, short of the 5.4 s the check asks", "world-held@0.0-4.4": "one line of text holds 4.4 s: the pointer hovers it twice and the photo opens and closes each time"}}</script>
<style>
  body { display: block; position: relative; }
  .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .line { display: flex; align-items: center; justify-content: center; font: 300 calc(var(--u) * 10)/1 var(--sans); letter-spacing: -0.03em; color: var(--ink); white-space: pre; }
  #media { width: 0; height: calc(var(--u) * 28); overflow: hidden; margin: 0 calc(var(--u) * 1); border-radius: calc(var(--u) * 1.2); }
  #media img { display: block; width: calc(var(--u) * 34); height: 100%; object-fit: cover; object-position: 30% 55%; }
  .ptr { position: absolute; inset: 0; }
  .cur { position: absolute; left: 0; top: 0; width: calc(var(--u) * 6.4); height: calc(var(--u) * 6.4); overflow: visible; }
  .cur path { fill: var(--ink); stroke: var(--surface); stroke-width: 1.4; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="stage" id="stage"><div class="line" id="line"><span>that's a nice (</span><div id="media"><img src="/prompts/moves/demo/assets/photos/loft.jpg" alt=""></div><span>) chair!</span></div></div>
<div class="ptr" id="ptr"><svg class="cur" id="cur" viewBox="0 0 24 24"><path d="M2 2 L2 19 L6.6 14.8 L9.6 21.6 L12.6 20.3 L9.6 13.6 L15.8 13.4 Z"/></svg></div>
<script type="module">
import '/core/engine/page-api.js';
import { spring } from '/core/motion/springs.js';
import { easeFn } from '/core/motion/presets.js';
import { arrive, leave } from '/prompts/moves/demo/assets/stage.js';

const OPEN = { k: 532.6, d: 46.15 };                      // critically damped, no bounce: reaches the width in about 0.4 s
const CLOSE_S = 0.3;
const HOVERS = [[0.55, 1.95], [2.8, 3.75]];                // [second the pointer enters the line, second it leaves]
const land = easeFn('land');
const media = document.getElementById('media'), cur = document.getElementById('cur');
const H = innerHeight, W = innerWidth, WIDTH = 34 * H / 100;
// the pointer: [second, x, y] in shares of the frame; it eases between stops
const PATH = [[0.1, 0.9, 0.82], [0.55, 0.52, 0.56], [1.95, 0.52, 0.56], [2.3, 0.64, 0.8], [2.45, 0.64, 0.8], [2.8, 0.5, 0.56], [3.75, 0.5, 0.56], [4.1, 0.9, 0.84]];
const pointer = (t) => {
  for (let i = PATH.length - 1; i > 0; i--) {
    const [t0, x0, y0] = PATH[i - 1], [t1, x1, y1] = PATH[i];
    if (t >= t0) { const k = land(Math.min(1, (t - t0) / (t1 - t0))); return [x0 + (x1 - x0) * k, y0 + (y1 - y0) * k]; }
  }
  return PATH[0].slice(1);
};
const widthAt = (t) => {
  for (let i = HOVERS.length - 1; i >= 0; i--) {
    const [enter, out] = HOVERS[i];
    if (t >= out) return WIDTH * (1 - land(Math.min((t - out) / CLOSE_S, 1)));
    if (t >= enter) return WIDTH * spring(t - enter, OPEN.k, OPEN.d);
  }
  return 0;
};
window.seek = (t) => {
  media.style.width = `${widthAt(t)}px`;
  const [x, y] = pointer(t);
  cur.style.translate = `${x * W}px ${y * H}px`;
};
window.seek(0);
arrive(document.getElementById('line'), 100, { ms: 220, from: '0.8vh' });
arrive(document.getElementById('ptr'), 100, { ms: 220, from: '0px' });
leave(document.getElementById('stage'), 4400);
leave(document.getElementById('ptr'), 4400);
</script>
</body>
</html>
