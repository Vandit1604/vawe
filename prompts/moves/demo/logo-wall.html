<!doctype html>
<html data-aspect="16:9" data-look="product" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="duration" content="4">
<title>move: logo wall</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<script type="application/json" id="authoring">{"allow": ["text-unreadable-hold", "text-moves-before-hold", "world-held@0.0-4.0"], "_why": {"text-unreadable-hold": "the heading holds 3.0 s after it lands at 0.8 s, and the check asks 5.4 s", "text-moves-before-hold": "the wall leaves at 3.6 s, 0.4 s before the 4 s end, short of the 5.4 s the check asks", "world-held@0.0-4.0": "one logo wall holds 4.0 s: the rows arrive from 0.15 s and then drift at a constant speed, as a real wall does"}}</script>
<style>
  body { display: block; position: relative; }
  .stage { position: absolute; inset: 0; }
  .lede { position: absolute; left: 0; right: 0; top: calc(var(--u) * 11); text-align: center; font: 600 calc(var(--u) * 9)/1.05 var(--sans); letter-spacing: -0.04em; }
  .lede span { display: block; overflow: hidden; padding-bottom: 0.12em; margin-bottom: -0.12em; }
  .lede i { display: block; font-style: normal; }
  .lede .l1 { color: var(--muted); }
  .wall { position: absolute; left: 0; right: 0; top: calc(var(--u) * 41); border-top: 1px solid var(--line);
          -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 12%, #000 88%, transparent 100%); }
  .lane { position: relative; height: calc(var(--u) * 17); border-bottom: 1px solid var(--line); overflow: hidden; }
  .row { position: absolute; left: calc(var(--u) * -300); top: 0; height: 100%; display: flex; width: max-content; }
  .slot { flex: none; width: calc(var(--u) * 38); height: 100%; display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 1.6); color: #86867f; }
  .slot .logo-mark { width: calc(var(--u) * 5.8); height: calc(var(--u) * 5.8); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="lede"><span><i class="l1">Trusted by</i></span><span><i>4,200 teams.</i></span></div>
  <div class="wall" id="wall"></div>
</div>
<script type="module">
import '/core/engine/page-api.js';
import { easeFn } from '/core/motion/presets.js';
import { EASE } from '/core/motion/presets.js';
import { leave } from '/prompts/moves/demo/assets/stage.js';
import { mark, wordmark } from '/prompts/moves/demo/assets/logos.js';
const land = easeFn('landSoft');
const H = innerHeight, u = H / 100;
// invented brands from the shared set, all in one grey at one optical size; a wide or mono face sets smaller
const brands = [['northwind', 1], ['halcyon', 1.08], ['fernbank', 0.66], ['kestrel', 0.88], ['orbital', 1], ['lumen', 1], ['quarry', 1], ['tidewell', 1.08], ['parcel', 0.82], ['mosaic', 1], ['ardent', 1], ['vantage', 1]];
const slot = ([name, size]) => `<div class="slot">${mark(name)}${wordmark(name).replace('style="', `style="font-size:${(u * 5.2 * size).toFixed(1)}px;`)}</div>`;
const wall = document.getElementById('wall');
const rows = [0, 1, 2].map((r) => {
  const set = Array.from({ length: 12 }, (_, i) => brands[(i + r * 4) % 12]);
  const lane = Object.assign(document.createElement('div'), { className: 'lane' });
  lane.innerHTML = `<div class="row">${set.concat(set).map(slot).join('')}</div>`;
  wall.append(lane);
  return lane.firstElementChild;
});
const ARRIVE = 1.3, STAGGER = 0.11, RUN = 150 * u, DRIFT = 4 * u;   // s; s between rows; px a row travels while it arrives; px a second after
const clamp = (x) => Math.min(1, Math.max(0, x));
vawe.onFrame((t) => rows.forEach((row, i) => {
  const dir = i % 2 ? 1 : -1, k = clamp((t - 0.15 - i * STAGGER) / ARRIVE);
  row.style.translate = `${dir * DRIFT * t - dir * RUN * (1 - land(k))}px 0`;
  row.style.opacity = String(clamp(k * 3));
}));
[...document.querySelectorAll('.lede i')].forEach((el, i) => el.animate([{ translate: '0 110%' }, { translate: '0 0' }], { duration: 640, delay: 80 + i * 90, easing: EASE.land, fill: 'both' }));
leave(document.getElementById('stage'), 4000);
</script>
</body>
</html>
