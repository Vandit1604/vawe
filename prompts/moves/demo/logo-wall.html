<!doctype html>
<html data-aspect="16:9" data-look="daylight">
<head>
<meta charset="utf-8">
<meta name="duration" content="2">
<meta name="blank" content="0-0.05">
<title>move: logo wall</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; position: relative; }
  .lede { position: absolute; left: 6vw; top: calc(var(--u) * 9); font: 700 calc(var(--u) * 10.5)/1 var(--sans); letter-spacing: -0.045em; }
  .lede span { display: block; overflow: hidden; padding-bottom: 0.1em; margin-bottom: -0.1em; }
  .lede i { display: block; font-style: normal; }
  .lede .n { color: var(--accent); }
  .wall { position: absolute; left: 0; right: 0; top: calc(var(--u) * 42); border-top: 1px solid var(--ink); }
  .lane { position: relative; height: calc(var(--u) * 17); border-bottom: 1px solid var(--line); overflow: hidden; }
  .row { position: absolute; left: calc(var(--u) * -20); top: 0; height: 100%; width: max-content; display: flex; will-change: transform; }
  .track { flex: none; display: flex; height: 100%; }
  .logo { flex: none; width: calc(var(--u) * 38); height: 100%; display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 1.6); border-right: 1px solid var(--line); color: var(--ink); }
  .logo .logo-mark { width: calc(var(--u) * 5.8); height: calc(var(--u) * 5.8); }
  .logo b { font-size: calc(var(--u) * 5.2); line-height: 1; white-space: nowrap; }
</style>
</head>
<body>
<div class="lede"><span><i>Trusted by</i></span><span><i><em class="n" style="font-style:normal">4,200</em> teams.</i></span></div>
<div class="wall" id="wall"></div>
<script type="module">
import '/core/engine/page-api.js';
import { curveToLinear, CURVES } from '/core/motion/springs.js';
import { mark, wordmark } from '/prompts/moves/demo/assets/logos.js';
const settle = curveToLinear(CURVES.expoOut), E = CURVES.expoOut;
const W = innerWidth, H = innerHeight, u = H / 100;
// invented brands from the shared set; a wide or mono face sets smaller so every wordmark has one optical size
const brands = [['northwind', 1], ['halcyon', 1.08], ['fernbank', 0.66], ['kestrel', 0.88], ['orbital', 1], ['lumen', 1], ['quarry', 1], ['tidewell', 1.08], ['parcel', 0.82], ['mosaic', 1], ['ardent', 1], ['vantage', 1]];
const logo = ([name, size]) => `<div class="logo">${mark(name)}${wordmark(name).replace('style="', `style="font-size:${(u * 5.2 * size).toFixed(1)}px;`)}</div>`;
const wall = document.getElementById('wall');
const rows = [0, 1, 2].map((r) => {
  const set = Array.from({ length: 12 }, (_, i) => brands[(i + r * 4) % 12]);
  const lane = Object.assign(document.createElement('div'), { className: 'lane' });
  lane.innerHTML = `<div class="row"><div class="track">${set.concat(set).map(logo).join('')}</div></div>`;
  wall.append(lane);
  return lane.firstElementChild;
});
const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
svg.setAttribute('width', 0); svg.setAttribute('height', 0); svg.style.position = 'absolute';
svg.innerHTML = rows.map((_, i) => `<filter id="lb${i}" x="-10%" width="120%" y="0" height="100%"><feGaussianBlur id="lg${i}" stdDeviation="0 0"/></filter>`).join('');
document.body.append(svg);
const arrive = 1300, stagger = 110, run = 190 * u;      // px each row travels while it arrives
const plan = rows.map((row, i) => {
  const dir = i % 2 ? 1 : -1, delay = 150 + i * stagger;
  row.style.filter = `url(#lb${i})`;
  row.animate([{ translate: `${-dir * run}px 0` }, { translate: '0 0' }], { duration: arrive, delay, easing: settle, fill: 'both' });
  // after it lands the row never stops: a slow linear drift, so the last frame still moves
  row.firstElementChild.animate([{ translate: '0 0' }, { translate: `${dir * 6 * u}px 0` }], { duration: 2000, easing: 'linear', fill: 'both' });
  return { blur: document.getElementById(`lg${i}`), delay: delay / 1000, run };
});
vawe.onFrame((t) => plan.forEach((p) => {
  const x = (t - p.delay) / (arrive / 1000), du = 1 / 240;
  const slope = x > 0 && x < 1 ? (E(Math.min(1, x + du)) - E(x)) / du : 0;
  p.blur.setAttribute('stdDeviation', `${(slope * p.run / (arrive / 1000) / 60 * 0.3).toFixed(2)} 0`);
}));
const lede = [...document.querySelectorAll('.lede i')];
lede.forEach((el, i) => el.animate([{ translate: '0 110%' }, { translate: '0 0' }], { duration: 640, delay: 80 + i * 90, easing: settle, fill: 'both' }));
</script>
</body>
</html>
