<!doctype html>
<html data-aspect="16:9" data-look="signal">
<head>
<meta charset="utf-8">
<meta name="duration" content="1.6">
<title>move: slice shift</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { position: relative; display: block; }
  .shot { position: absolute; inset: 0; }
  .a .num { position: absolute; left: 8vw; top: calc(var(--u) * 12); font: 700 calc(var(--u) * 46)/1 var(--sans); letter-spacing: -0.06em; }
  .a .num i { font-style: normal; color: var(--accent); }
  .a .cap { position: absolute; left: 8.6vw; top: calc(var(--u) * 66); font: 500 var(--t-lead)/1.2 var(--sans); letter-spacing: -0.02em; }
  .a .meta { position: absolute; right: 8vw; top: calc(var(--u) * 70); font: 500 var(--t-body)/1.4 var(--mono); color: var(--muted); text-align: right; }
  .a .rule { position: absolute; left: 8vw; right: 8vw; top: calc(var(--u) * 62); height: 1px; background: var(--ink); }
  .b { background: var(--paper); color: var(--paper-ink); overflow: hidden; }
  .b .in { position: absolute; inset: 0; }
  .b h1 { position: absolute; left: 8vw; top: calc(var(--u) * 26); margin: 0; font: 700 calc(var(--u) * 30)/1 var(--sans); letter-spacing: -0.06em; }
  .b h1 i { display: inline-block; width: calc(var(--u) * 6); height: calc(var(--u) * 6); margin-left: var(--s2); background: var(--accent); }
  .b p { position: absolute; left: 8.6vw; top: calc(var(--u) * 66); margin: 0; font: 500 var(--t-lead)/1 var(--mono); color: var(--paper-muted); letter-spacing: -0.03em; }
  .slice { position: absolute; left: 0; width: 100vw; overflow: hidden; background: var(--ground); }
  .slice .shot { top: 0; }
</style>
</head>
<body>
<section class="shot b"><div class="in"><h1>Live<i></i></h1><p>vawe.dev/launch</p></div></section>
<template id="a"><section class="shot a"><div class="num">2.0<i>.</i></div><div class="rule"></div><div class="cap">Motion graphics,<br>written as a page</div><div class="meta">release<br>sep 30</div></section></template>
<div id="slices"></div>
<script type="module">
import '/core/engine/page-api.js';
import { curveToLinear, CURVES, rng } from '/core/motion/springs.js';
const E = CURVES.expoOut, W = window.innerWidth, H = window.innerHeight;
const leave = (u) => 1 - E(1 - u);   // slow off the mark, fastest as the slice leaves the frame
const N = 7, h = H / N, t0 = 0.3, stagger = 0.042, rand = rng(11);
const tpl = document.getElementById('a'), host = document.getElementById('slices');
const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
svg.setAttribute('width', 0); svg.setAttribute('height', 0); svg.style.position = 'absolute';
document.body.append(svg);
const slices = Array.from({ length: N }, (_, i) => {
  const el = document.createElement('div'); el.className = 'slice';
  Object.assign(el.style, { top: `${i * h}px`, height: `${h + 1}px`, filter: `url(#m${i})` });
  const shot = tpl.content.cloneNode(true); el.append(shot); el.firstElementChild.style.top = `${-i * h}px`;
  el.firstElementChild.style.height = `${H}px`;
  svg.insertAdjacentHTML('beforeend', `<filter id="m${i}" x="-30%" width="160%" y="0" height="100%"><feGaussianBlur id="b${i}" stdDeviation="0 0"/></filter>`);
  host.append(el);
  const dir = i % 2 ? 1 : -1, delay = t0 + i * stagger + rand() * 0.03, dur = 0.5 + rand() * 0.1;
  el.animate([{ translate: '0 0' }, { translate: `${dir * W * 1.04}px 0` }], { duration: dur * 1000, delay: delay * 1000, easing: curveToLinear(leave), fill: 'both' });
  return { blur: document.getElementById(`b${i}`), delay, dur };
});
document.querySelector('.b .in').animate([{ scale: 1.07 }, { scale: 1 }], { duration: 1000, delay: (t0 + 0.15) * 1000, easing: curveToLinear(E), fill: 'both' });
// one blur per slice: half a frame of its own travel, x only
vawe.onFrame((t) => slices.forEach((s) => {
  const u = Math.min(1, Math.max(0, (t - s.delay) / s.dur)), du = 1 / 240;
  const slope = (leave(Math.min(1, u + du)) - leave(u)) / du;
  s.blur.setAttribute('stdDeviation', `${(u > 0 && u < 1 ? (slope / s.dur) * W * 1.04 / 60 * 0.3 : 0).toFixed(2)} 0`);
}));
</script>
</body>
</html>
