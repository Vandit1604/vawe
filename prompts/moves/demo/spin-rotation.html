<!doctype html>
<html data-aspect="16:9" data-look="product" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="duration" content="4.6">
<title>move: spin rotation</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<script type="application/json" id="authoring">{"allow": ["text-unreadable-hold", "text-moves-before-hold", "static-window@3.6-4.2", "world-held@0.0-4.6"], "_why": {"text-unreadable-hold": "the ready card holds 1.5 s after its last row at 3.1 s, and the check asks 5.4 s", "text-moves-before-hold": "the window leaves at 4.2 s, 0.4 s before the 4.6 s end, short of the 5.4 s the check asks", "static-window@3.6-4.2": "the ready page holds 0.6 s as a real page does once it has loaded", "world-held@0.0-4.6": "one workspace page holds 4.6 s: the spinner turns from 0.4 s, closes at 1.6 s and becomes the status mark at 2.3 s"}}</script>
<style>
  body { display: block; position: relative; }
  .scr { position: absolute; inset: 0; }
  .say { position: absolute; left: 0; right: 0; top: calc(50% + var(--u) * 14); text-align: center; font: 500 calc(var(--u) * 2.9)/1 var(--sans); color: var(--muted); }
  .ring { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * 18); height: calc(var(--u) * 18); margin: calc(var(--u) * -9) 0 0 calc(var(--u) * -9); }
  .ring svg { display: block; width: 100%; height: 100%; overflow: visible; }
  #spin { transform-origin: 50px 50px; }
  .ring circle { fill: none; stroke-width: 7; stroke-linecap: round; }
  .ring .track { stroke: var(--dot); }
  .ring .check { fill: none; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke: #1a7f4b; }
  .ready { position: absolute; left: calc(var(--u) * 9); right: calc(var(--u) * 9); top: calc(var(--u) * 10); }
  .hrow { display: flex; align-items: center; gap: calc(var(--u) * 2.4); height: calc(var(--u) * 7); }
  .mark { flex: none; width: calc(var(--u) * 7); height: calc(var(--u) * 7); }
  .hrow h2 { margin: 0; font: 600 calc(var(--u) * 5.4)/1 var(--sans); letter-spacing: -0.03em; white-space: nowrap; }
  .hrow .tagp { margin-left: auto; padding: calc(var(--u) * 1) calc(var(--u) * 2); border-radius: 999px; background: #e3f3ea; color: #1a7f4b; font: 600 calc(var(--u) * 2.8)/1 var(--sans); white-space: nowrap; }
  .note { margin-top: calc(var(--u) * 3); display: flex; align-items: center; gap: calc(var(--u) * 1.4); font: 400 calc(var(--u) * 3)/1 var(--sans); color: var(--muted); }
  .note i { width: calc(var(--u) * 1.4); height: calc(var(--u) * 1.4); border-radius: 50%; background: #1a7f4b; }
  .stats { margin-top: calc(var(--u) * 9); display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u) * 2.4); }
  .stat { padding: calc(var(--u) * 4.4); border-radius: calc(var(--u) * 1.6); background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); }
  .stat b { display: block; font: 600 calc(var(--u) * 11)/1 var(--sans); letter-spacing: -0.04em; }
  .stat span { display: block; margin-top: calc(var(--u) * 1.6); font: 400 calc(var(--u) * 3)/1 var(--sans); color: var(--muted); }
</style>
</head>
<body>
<div class="win">
  <div class="strip" data-chrome><span class="lights"><i></i><i></i><i></i></span><span class="tab"><i class="fav"></i>Workspace</span></div>
  <div class="bar" data-chrome><div class="omni">app.example.com/workspace</div></div>
  <div class="page">
    <div class="scr">
      <div class="say" id="say">Loading workspace</div>
      <div class="ready" id="ready">
        <div class="hrow"><div class="mark" id="mark"></div><h2 id="h2">Workspace ready</h2><span class="tagp" id="pill">3 projects</span></div>
        <div class="note" id="note"><i></i>Synced just now</div>
        <div class="stats" id="stats">
          <div class="stat"><b>128</b><span>files</span></div>
          <div class="stat"><b>14</b><span>editors</span></div>
          <div class="stat"><b>99.9%</b><span>uptime</span></div>
        </div>
      </div>
      <div class="ring" id="ring"><svg viewBox="0 0 100 100"><g id="spin"><circle class="track" cx="50" cy="50" r="42"/><circle class="arc" id="arc" cx="50" cy="50" r="42"/></g><path class="check" id="check" d="M31 51 L45 64 L70 37"/></svg></div>
    </div>
  </div>
</div>
<script type="module">
import '/core/engine/page-api.js';
import { EASE, easeFn } from '/core/motion/presets.js';
import { arrive, leave } from '/prompts/moves/demo/assets/stage.js';
const q = (s) => document.querySelector(s);
const land = easeFn('land');
const clamp = (x) => Math.min(1, Math.max(0, x));
const ring = q('#ring'), spin = q('#spin'), arc = q('#arc'), check = q('#check');

// measure before anything moves: the mark's centre against the ring's, in the window's own px
const rc = ring.getBoundingClientRect(), mc = q('#mark').getBoundingClientRect();
const dx = mc.left + mc.width / 2 - (rc.left + rc.width / 2), dy = mc.top + mc.height / 2 - (rc.top + rc.height / 2), S1 = mc.width / rc.width;

const OMEGA = 330, SPIN_AT = 0.4, BRAKE_AT = 1.6, BRAKE_S = 0.7, CLOSE_S = 0.7, MOVE = { at: 2.3, dur: 0.55 }, CHECK = { at: 2.7, dur: 0.35 };
const C = 2 * Math.PI * 42, ARC0 = 0.25;           // circumference of the ring; the share of it the arc covers while it spins
// the head turns at one speed, then brakes from that speed to a stop with the same ease the arc closes with (land starts at 4.8 times the average speed)
const head = (t) => (t < BRAKE_AT ? OMEGA * Math.max(0, t - SPIN_AT) : OMEGA * (BRAKE_AT - SPIN_AT) + (OMEGA * BRAKE_S / 4.8) * land(clamp((t - BRAKE_AT) / BRAKE_S)));
arc.style.stroke = '#1a7f4b';
vawe.onFrame((t) => {
  const close = land(clamp((t - BRAKE_AT) / CLOSE_S)), p = land(clamp((t - MOVE.at) / MOVE.dur));
  const share = ARC0 + (1 - ARC0) * close;
  arc.style.strokeDasharray = `${C * share} ${C}`;
  ring.style.transform = `translate(${dx * p}px, ${dy * p}px) scale(${1 - (1 - S1) * p})`;
  spin.style.transform = `rotate(${head(t).toFixed(2)}deg)`;
  check.style.strokeDasharray = '60 60';
  check.style.strokeDashoffset = String(60 * (1 - land(clamp((t - CHECK.at) / CHECK.dur))));
  ring.style.opacity = String(clamp((t - 0.1) / 0.2));
});

// the page: the caption leaves as the ring closes; the header and rows arrive while the ring travels
q('#say').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, delay: BRAKE_AT * 1000 + 300, easing: EASE.launch, fill: 'both' });
arrive(q('#h2'), 2650, { ms: 300, from: '1vh' });
arrive(q('#pill'), 2720, { ms: 300, from: '1vh' });
arrive(q('#note'), 2600, { ms: 300, from: '1vh' });
[...q('#stats').children].forEach((el, i) => arrive(el, 2350 + i * 70, { ms: 300, from: '1vh' }));
arrive(q('.win'), 100, { ms: 220, from: '0.8vh' });
leave(q('.win'), 4600);
</script>
</body>
</html>
