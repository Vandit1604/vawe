<!doctype html>
<html data-aspect="16:9" data-look="vawe">
<head>
<meta charset="utf-8">
<meta name="duration" content="3.2">
<title>move: spin rotation</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; }
  #layers { position: absolute; inset: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; background: var(--ground); }
  .world { position: absolute; inset: 0; }
  .plane { position: absolute; inset: -50%; }
  .a { background: var(--ground); z-index: 0; }
  .b { background: var(--paper); z-index: 1; }
  .a .say { position: absolute; left: 50%; top: calc(50% + var(--u) * 20); transform: translateX(-50%); font: 500 var(--t-body)/1 var(--mono); color: var(--muted); white-space: nowrap; }
  .card { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * 100); height: calc(var(--u) * 58); margin: calc(var(--u) * -29) 0 0 calc(var(--u) * -50); display: flex; flex-direction: column; justify-content: space-between; }
  .head-row { display: flex; align-items: center; gap: var(--s3); }
  .mark { flex: none; width: calc(var(--u) * 9); height: calc(var(--u) * 9); }
  .head-row h2 { margin: 0; font: 700 calc(var(--u) * 6.6)/1 var(--sans); letter-spacing: -0.03em; white-space: nowrap; }
  .head-row .pill { margin-left: auto; white-space: nowrap; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s3); }
  .stat { padding: var(--s3); border-radius: var(--r-chip); background: var(--raised); box-shadow: var(--ring); }
  .stat b { display: block; font: 700 calc(var(--u) * 9)/1 var(--sans); letter-spacing: -0.04em; }
  .stat span { display: block; margin-top: var(--s1); font: 500 var(--t-small)/1 var(--sans); color: var(--muted); }
  .ring { position: absolute; z-index: 2; left: 50%; top: 50%; width: calc(var(--u) * 22); height: calc(var(--u) * 22); margin: calc(var(--u) * -11) 0 0 calc(var(--u) * -11); }
  .ring svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .ring circle { fill: none; stroke-width: 9; }
  .ring .track { stroke: var(--dot); }
  .ring .arc { stroke: var(--accent); stroke-dasharray: 66 198; transform: rotate(-180deg); transform-origin: 50px 50px; }
</style>
</head>
<body>
<template id="scene">
  <div class="world">
    <div class="plane a"><div class="say">Loading workspace</div></div>
    <div class="plane b">
      <div class="card">
        <div class="head-row"><div class="mark"></div><h2>Workspace ready</h2><span class="pill up">3 projects</span></div>
        <div class="stats">
          <div class="stat"><b>128</b><span>files</span></div>
          <div class="stat"><b>14</b><span>editors</span></div>
          <div class="stat"><b>99.9%</b><span>uptime</span></div>
        </div>
      </div>
    </div>
    <div class="ring"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42"/><circle class="arc" cx="50" cy="50" r="42"/></svg></div>
  </div>
</template>
<div id="layers"></div>
<script type="module">
import '/core/engine/page-api.js';
import { easeFn } from '/core/motion/presets.js';
const W = innerWidth, H = innerHeight, u = H / 100, N = 8, FRAME = 1 / 60, clamp = (v) => Math.min(1, Math.max(0, v));
const land = easeFn('land'), settle = easeFn('settle');
const OMEGA = 330, T0 = 0.5, T_C = 1.7, D2 = 0.8;   // spinner speed (deg/s), the sweep starts, the head starts to brake, the brake lasts
const ROLL = { at: 0.9, dur: 1.3, deg: 14 };         // one eased roll of the camera, clockwise like the spinner
const TO_MARK = { at: 1.6, dur: 0.55 };              // the ring flies to the header and becomes its mark
// the head's angle on screen: constant speed, then braking from that same speed (land starts at 4.8 x the average speed)
const head = (t) => (t < T_C ? OMEGA * t : OMEGA * T_C + (OMEGA * D2 / 4.8) * land(clamp((t - T_C) / D2)));
const roll = (t) => ROLL.deg * settle(clamp((t - ROLL.at) / ROLL.dur));
const own = (t) => head(t) - roll(t);                 // the ring's turn inside the rolled world: screen angle = own + roll
const sweep = (t) => Math.max(0, own(t) - own(T0));
const host = document.getElementById('layers');
const layers = Array.from({ length: N }, (_, j) => {
  const el = document.createElement('div'); el.className = 'layer';
  el.append(document.getElementById('scene').content.cloneNode(true));
  el.style.opacity = 1 / (j + 1);   // stacked at 1, 1/2, 1/3 ...: copies at shutter times average into one exposure
  host.append(el);
  return { el, world: el.querySelector('.world'), b: el.querySelector('.b'), ring: el.querySelector('.ring') };
});
const centre = (sel) => { const r = layers[0].el.querySelector(sel).getBoundingClientRect(); return { x: r.left + r.width / 2 - W / 2, y: r.top + r.height / 2 - H / 2 }; };   // from the frame centre, before any roll
const MARK = centre('.mark');
const wedge = (from, span) => {   // angles in degrees clockwise from the top, about the plane's centre (the plane is 2 W by 2 H)
  if (span >= 360) return 'none';
  const pts = [`${W}px ${H}px`], steps = Math.max(2, Math.ceil(span / 12));
  for (let i = 0; i <= steps; i++) {
    const a = ((from + (span * i) / steps) * Math.PI) / 180;
    pts.push(`${(W + 3 * W * Math.sin(a)).toFixed(1)}px ${(H - 3 * W * Math.cos(a)).toFixed(1)}px`);
  }
  return `polygon(${pts.join(',')})`;
};
vawe.onFrame((t) => {
  const moving = Math.abs(head(t + FRAME) - head(t - FRAME)) > 0.3;
  layers.forEach((l, j) => {
    const tj = t + (j / (N - 1) - 0.5) * 0.5 * FRAME;   // 180 degree shutter
    l.el.style.visibility = j === 0 || moving ? 'visible' : 'hidden';
    l.world.style.transform = `rotate(${roll(tj).toFixed(3)}deg)`;
    l.b.style.clipPath = wedge(own(T0), sweep(tj));
    const p = land(clamp((tj - TO_MARK.at) / TO_MARK.dur));
    l.ring.style.transform = `translate(${MARK.x * p}px, ${MARK.y * p}px) scale(${1 - (1 - 9 / 22) * p}) rotate(${own(tj).toFixed(3)}deg)`;
  });
});
</script>
</body>
</html>
