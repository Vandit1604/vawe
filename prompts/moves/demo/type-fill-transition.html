<!doctype html>
<html data-aspect="16:9" data-look="brutal">
<head>
<meta charset="utf-8">
<meta name="duration" content="1.8">
<title>move: type fill transition</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { position: relative; display: block; }
  .world { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; transform-origin: 0 0; }
  .word { position: absolute; left: 9vw; top: calc(var(--u) * 24); margin: 0; font: 800 calc(var(--u) * 46)/1 var(--sans); letter-spacing: -0.03em; white-space: nowrap; }
  .word .fill { color: var(--accent); }
  .sub { position: absolute; left: 9.6vw; top: calc(var(--u) * 78); font: 500 var(--t-lead)/1 var(--mono); }
  .b { position: absolute; inset: 0; background: var(--accent); color: var(--on-accent); opacity: 0; }
  .b .line { position: absolute; left: 9vw; overflow: hidden; padding-bottom: calc(var(--u) * 2); }
  .b .line > div { will-change: translate; }
  .b .l1 { top: calc(var(--u) * 24); font: 800 calc(var(--u) * 20)/1.05 var(--sans); letter-spacing: -0.03em; }
  .b .l2 { top: calc(var(--u) * 76); font: 500 var(--t-lead)/1.1 var(--mono); }
</style>
</head>
<body>
<section class="b" id="b"><div class="line l1"><div>Live in<br>3 aspects</div></div><div class="line l2"><div>16:9  9:16  1:1</div></div></section>
<div class="world" id="world">
  <h1 class="word" id="word">L<span class="fill" id="fill">I</span>VE</h1>
  <div class="sub">vawe.dev/launch</div>
</div>
<script type="module">
import '/core/engine/page-api.js';
import { EASE, easeFn } from '/core/motion/presets.js';
const E = easeFn('land');
const W = window.innerWidth, H = window.innerHeight;
const world = document.getElementById('world'), fill = document.getElementById('fill'), word = document.getElementById('word'), b = document.getElementById('b');
const t0 = 0.35, dur = 1.0, COVER = 0.62;   // COVER: the share of the zoom at which the letter fills the frame;
// ease in, fastest at the midpoint, soft finish: the letter fills the frame and the zoom does not slam
const whip = easeFn('swap');
vawe.onFrame((t) => {
  // offset metrics ignore transforms, so the letter's centre is read fresh every frame
  const ox = word.offsetLeft + fill.offsetLeft + fill.offsetWidth / 2, oy = word.offsetTop + fill.offsetTop + fill.offsetHeight / 2;
  const S = (1.1 * W) / (0.4 * fill.offsetWidth);   // the stem is about 0.4 of the letter box wide
  const u = Math.min(1, Math.max(0, (t - t0) / dur)), p = 0.4 * u + 0.6 * whip(u);   // a linear share keeps the growth readable through the middle
  const s = Math.exp(Math.log(S) * p);              // scale runs on a log path: equal steps read as equal speed
  const px = ox + (W / 2 - ox) * p, py = oy + (H / 2 - oy) * p;   // the letter drifts to the middle as it grows
  world.style.transform = `translate(${px - s * ox}px, ${py - s * oy}px) scale(${s})`;
  const covered = u >= COVER;
  world.style.visibility = covered ? 'hidden' : 'visible';
  b.style.opacity = covered ? 1 : 0;
});
const tIn = (t0 + dur * COVER - 0.02) * 1000;
document.querySelectorAll('.b .line > div').forEach((el, i) => el.animate([{ translate: '0 115%' }, { translate: '0 0' }],
  { duration: 700, delay: tIn + i * 90, easing: EASE.land, fill: 'both' }));
</script>
</body>
</html>
