<!doctype html>
<html data-aspect="16:9" data-look="daylight">
<head>
<meta charset="utf-8">
<meta name="duration" content="4">
<title>move: dot grid wave</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; position: relative; }
  .copy { position: absolute; left: 9vw; top: 50vh; translate: 0 -50%; width: 56vw; }
  svg.grid { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .copy .title { margin: 0; font-size: calc(var(--u) * 14); line-height: 1.04; }
  .copy .lead { margin: var(--s3) 0 0; max-width: 24em; color: var(--ink); text-wrap: pretty; }

  .mask { display: block; overflow: hidden; padding: 0.1em 0.1em 0.25em; margin: -0.1em -0.1em -0.25em; }
  .mask > span { display: block; translate: 0 118%; animation: rise 0.7s var(--settle) both; animation-delay: calc(0.12s + var(--i) * 0.14s); }
  @keyframes rise { to { translate: 0 0; } }

  .w { display: inline-block; opacity: 0; filter: blur(0.14em); translate: 0 0.22em;
       animation: resolve 0.8s var(--soft) both; animation-delay: calc(0.5s + var(--i) * 0.09s); }
  @keyframes resolve { 45% { opacity: 1; } to { opacity: 1; filter: blur(0); translate: 0 0; } }
</style>
</head>
<body>
<svg class="grid" id="grid" aria-hidden="true"></svg>
<main class="copy">
  <h1 class="title"><span class="mask" style="--i:0"><span>A wave</span></span><span class="mask" style="--i:1"><span>in the grid.</span></span></h1>
  <p class="lead" id="lead">Scale and brightness travel across a plain field of dots.</p>
</main>
<script type="module">
import '/core/engine/page-api.js';
import { curveToLinear, CURVES } from '/core/motion/springs.js';

const root = document.documentElement;
root.style.setProperty('--settle', curveToLinear(CURVES.expoOut));
root.style.setProperty('--soft', curveToLinear(CURVES.expoOut));
const lead = document.getElementById('lead');
lead.innerHTML = lead.textContent.split(' ').map((t, i) => `<span class="w" style="--i:${i}">${t}</span>`).join(' ');

// A grid of SVG dots. A plane wave sets each dot's radius and opacity from its place and the seek time: no state between frames.
const PITCH = 0.052, BASE = 0.0095, SPEED = 3.4;       // grid pitch and base radius as shares of the frame height, wave rad/s
const W = innerWidth, H = innerHeight;
const svg = document.getElementById('grid');
svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
const NS = 'http://www.w3.org/2000/svg';
const smooth = (a, b, v) => { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); };
const dots = [];
for (let y = PITCH * H / 2; y < H; y += PITCH * H) {
  for (let x = PITCH * H / 2; x < W; x += PITCH * H) {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', x.toFixed(1)); c.setAttribute('cy', y.toFixed(1));
    svg.append(c);
    const zone = (1 - smooth(0.60 * W, 0.74 * W, x)) * (1 - smooth(0.30 * H, 0.40 * H, Math.abs(y - 0.5 * H)));   // the copy box
    dots.push({ c, nx: x / H, ny: y / H, keep: 1 - 0.8 * zone });
  }
}
svg.style.fill = getComputedStyle(root).getPropertyValue('--accent');
vawe.onFrame((t) => {
  for (const d of dots) {
    const w = (0.5 + 0.5 * Math.sin(6.0 * (d.nx * 0.9 + d.ny * 0.45) - t * SPEED)) * d.keep;
    d.c.setAttribute('r', (BASE * H * (0.5 + 1.3 * w)).toFixed(2));
    d.c.setAttribute('opacity', (0.2 + 0.8 * w).toFixed(3));
  }
});
</script>
</body>
</html>
