<!doctype html>
<html data-aspect="16:9" data-look="dusk">
<head>
<meta charset="utf-8">
<meta name="duration" content="3.8">
<title>move: toggle horizon</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; position: relative; }
  .shot { position: absolute; inset: 0; }
  .b { z-index: 1; background: linear-gradient(180deg, #0c0824 0%, #1d1245 38%, #5a2a6e 62%, #d9784f 100%); }
  .b .ground { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--vh) * 0.38); background: linear-gradient(180deg, #1a0f33 0%, #0b0719 100%); }
  .sun { position: absolute; left: 50%; width: calc(var(--u) * 26); height: calc(var(--u) * 26); margin-left: calc(var(--u) * -13); border-radius: 50%; background: #ffb547; }
  .stars i { position: absolute; width: calc(var(--u) * 0.5); height: calc(var(--u) * 0.5); border-radius: 50%; background: #f6f2ff; }
  .refl { position: absolute; left: 50%; height: calc(var(--u) * 0.5); border-radius: 999px; background: #ffb547; transform: translateX(-50%); }
  .b .cap { position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 11); text-align: center; }
  .a { z-index: 2; }
  .a .half { position: absolute; inset: 0; background: var(--ground); background: linear-gradient(165deg, #150f33 0%, #120e2a 55%, #1d0f2b 100%); }
  .a .card { position: absolute; left: 50%; top: calc(var(--vh) * 0.22); width: calc(var(--u) * 100); height: calc(var(--vh) * 0.52); transform: translateX(-50%); }
  .a .card .title { position: absolute; left: var(--s5); top: var(--s5); }
  .a .card .lead { position: absolute; left: var(--s5); top: calc(var(--u) * 17); color: var(--muted); }
  .line { position: absolute; z-index: 6; background: var(--accent); border-radius: 999px; }
  .knob { position: absolute; z-index: 7; border-radius: 50%; background: #fff; box-shadow: 0 calc(var(--u) * 0.4) calc(var(--u) * 1) rgba(0, 0, 0, 0.35); }
  .cur { position: absolute; left: 0; top: 0; z-index: 10; }
  .cursor { display: block; width: calc(var(--u) * 5.2); height: calc(var(--u) * 5.2); overflow: visible; transform-origin: 0 0; }
  .cursor path { fill: #fff; stroke: #120e2a; stroke-width: 1.4; stroke-linejoin: round; }
</style>
</head>
<body>
<section class="shot b" id="b">
  <div class="stars" id="stars"></div>
  <div class="sun" id="sun"></div>
  <div class="ground" id="ground"></div>
  <div class="refl" id="r1"></div><div class="refl" id="r2"></div><div class="refl" id="r3"></div>
  <div class="cap lead muted">Dusk mode is on</div>
</section>
<section class="shot a">
  <div class="half" id="top"><div class="card card"><div class="title">Dusk mode</div><div class="lead">Dim the whole product after sunset</div></div></div>
  <div class="half" id="bot"></div>
</section>
<div class="line" id="track"></div><div class="knob" id="knob"></div>
<div class="cur" id="cur"><svg class="cursor" id="arrow" viewBox="0 0 24 24"><path transform="translate(-2 -2)" d="M2 2 L2 19 L6.6 14.8 L9.6 21.6 L12.6 20.3 L9.6 13.6 L15.8 13.4 Z"/></svg></div>
<script type="module">
import '/core/engine/page-api.js';
import { easeFn } from '/core/motion/presets.js';
import { spring } from '/core/motion/springs.js';
const W = innerWidth, H = innerHeight, u = H / 100;
const clamp = (x) => Math.min(1, Math.max(0, x)), lerp = (p, q, k) => p + (q - p) * k;
const land = easeFn('land'), settle = easeFn('settle'), launch = easeFn('launch'), swap = easeFn('swap');
const $ = (id) => document.getElementById(id);
const track = $('track'), knob = $('knob'), cur = $('cur'), arrow = $('arrow'), topHalf = $('top'), bot = $('bot');
bot.innerHTML = topHalf.innerHTML;                                  // both halves hold the same scene, each clipped to its side of the line
const LINE_Y = 0.62 * H, CX = W / 2;
const TW = 24 * u, TH = 10 * u, PAD = 1.3 * u, LINE_H = 0.5 * u;     // the toggle's track and the horizon it becomes
const T = { travel: [0.2, 0.95], press: 1.0, stretch: [1.5, 2.2], wipe: [2.0, 2.75], leave: 1.2 };
$('ground').style.top = `${LINE_Y}px`; $('ground').style.height = `${H - LINE_Y}px`;
const sun = $('sun'), SUN_D = 26 * u;
const stars = $('stars');
for (let i = 0; i < 26; i++) {
  const s = document.createElement('i');
  s.style.left = `${(i * 37 % 97) + 1.5}%`; s.style.top = `${(i * 53 % 54) + 3}%`; s.style.opacity = 0.35 + (i % 4) * 0.2;
  stars.appendChild(s);
}
const P = { x: CX + TW * 0.2, y: LINE_Y + TH * 0.05 };                // the tip lands on the track
const mix = (a, b, k) => `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], k))).join(',')})`;
vawe.onFrame((t) => {
  const tr = clamp((t - T.travel[0]) / (T.travel[1] - T.travel[0]));
  const lv = clamp((t - T.leave) / 0.3);
  cur.style.transform = `translate(${lerp(0.82 * W, P.x, land(tr)) + 0.5 * W * launch(lv)}px, ${lerp(0.9 * H, P.y, settle(tr)) + 0.5 * H * launch(lv)}px)`;
  const dip = Math.sin(Math.PI * clamp((t - T.press) / 0.22));
  arrow.style.transform = `scale(${1 - 0.14 * dip})`;
  // the switch: the knob rides a spring after the press, the track turns accent
  const on = spring(t - T.press - 0.02, 380, 26);
  const sk = clamp((t - T.stretch[0]) / (T.stretch[1] - T.stretch[0]));
  const w = lerp(TW, W * 1.05, land(sk)), h = lerp(TH, LINE_H, swap(clamp(sk * 1.25)));
  const pad = PAD * (h / TH);
  track.style.width = `${w}px`; track.style.height = `${h}px`;
  track.style.left = `${CX - w / 2}px`; track.style.top = `${LINE_Y - h / 2}px`;
  track.style.background = t < T.press ? 'var(--raised)' : mix([55, 48, 90], [255, 181, 71], clamp((t - T.press) / 0.2));
  const d = Math.max(h - 2 * pad, 0.2 * u);
  const kx0 = CX - TW / 2 + PAD + (TW - 2 * PAD - (TH - 2 * PAD)) * on;
  const kx = sk > 0 ? CX + w / 2 - pad - d : kx0;                       // the knob rides the right end as the track stretches
  knob.style.width = knob.style.height = `${d}px`;
  knob.style.left = `${kx}px`; knob.style.top = `${LINE_Y - d / 2}px`;
  knob.style.opacity = sk > 0.92 ? 0 : 1;
  // the horizon opens the world from the line: A shrinks away from it in both directions
  const wk = swap(clamp((t - T.wipe[0]) / (T.wipe[1] - T.wipe[0])));
  topHalf.style.clipPath = `inset(0 0 ${H - LINE_Y * (1 - wk)}px 0)`;
  bot.style.clipPath = `inset(${LINE_Y + (H - LINE_Y) * wk}px 0 0 0)`;
  // the world: the sun climbs from under the line and its reflection lengthens
  const su = land(clamp((t - 2.5) / 1.1));
  sun.style.top = `${LINE_Y - SUN_D * 0.55 * su}px`;
  sun.style.opacity = t > 2.4 ? 1 : 0;
  $('r1').style.top = `${LINE_Y + 2.2 * u}px`; $('r1').style.width = `${(16 + 8 * su) * u}px`;
  $('r2').style.top = `${LINE_Y + 4.4 * u}px`; $('r2').style.width = `${(10 + 6 * su) * u}px`;
  $('r3').style.top = `${LINE_Y + 7 * u}px`; $('r3').style.width = `${(5 + 4 * su) * u}px`;
  [1, 2, 3].forEach((n) => { $('r' + n).style.opacity = su * 0.7; });
});
</script>
</body>
</html>
