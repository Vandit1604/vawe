<!doctype html>
<html data-aspect="16:9" data-look="dusk">
<head>
<meta charset="utf-8">
<meta name="duration" content="3.8">
<title>move: toggle horizon</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; position: relative; }
  .shot { position: absolute; inset: 0; }
  .b { z-index: 1; overflow: hidden; }
  .b .ground { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, #2a1546 0%, #140b2a 38%, #0b0719 100%); }
  .glow { position: absolute; width: calc(var(--u) * 90); height: calc(var(--u) * 90); left: 50%; margin-left: calc(var(--u) * -45); border-radius: 50%; background: radial-gradient(circle, rgba(255, 181, 71, 0.5) 0%, rgba(255, 150, 90, 0.18) 38%, rgba(255, 150, 90, 0) 70%); }
  .sun { position: absolute; left: 50%; width: calc(var(--u) * 26); height: calc(var(--u) * 26); margin-left: calc(var(--u) * -13); border-radius: 50%; background: linear-gradient(180deg, #ffd27a 0%, #ffb547 100%); }
  .stars i { position: absolute; width: calc(var(--u) * 0.5); height: calc(var(--u) * 0.5); border-radius: 50%; background: #f6f2ff; }
  .cloud { position: absolute; height: calc(var(--u) * 1.1); border-radius: 999px; background: rgba(255, 214, 190, 0.16); filter: blur(calc(var(--u) * 0.35)); }
  .refl { position: absolute; left: 50%; height: calc(var(--u) * 0.5); border-radius: 999px; background: #ffb547; transform: translateX(-50%); }
  .b .cap { position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 9); display: flex; justify-content: center; }
  .b .cap .pill { gap: var(--s1); padding: calc(var(--u) * 1.6) calc(var(--u) * 3); font-size: var(--t-body); }
  .b .cap svg { width: calc(var(--u) * 4.4); height: calc(var(--u) * 4.4); fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .a { z-index: 2; }
  .a .half { position: absolute; inset: 0; background: var(--backdrop); }
  .a .card { position: absolute; left: 50%; top: calc(var(--u) * 24); width: calc(var(--u) * 104); height: calc(var(--u) * 54); margin-left: calc(var(--u) * -52); }
  .a .card .eyebrow { position: absolute; left: var(--s5); top: calc(var(--u) * 6); }
  .a .row { position: absolute; left: 0; right: 0; height: calc(var(--u) * 13); padding-inline: var(--s5); display: flex; align-items: center; justify-content: space-between; }
  .a .row + .row { border-top: 1px solid var(--line); }
  .a .row b { display: block; font: 600 var(--t-body)/1.15 var(--sans); }
  .a .row span { display: block; margin-top: calc(var(--u) * 0.6); font: 500 var(--t-small)/1.2 var(--sans); color: var(--muted); }
  .a .chip-val { padding: calc(var(--u) * 1.3) calc(var(--u) * 2.4); border-radius: var(--r-chip); background: var(--raised); box-shadow: var(--ring); font: 600 var(--t-small)/1 var(--sans); }
  .a .tg { position: relative; width: calc(var(--u) * 15); height: calc(var(--u) * 8.4); border-radius: 999px; background: var(--raised); }
  .a .tg::after { content: ''; position: absolute; left: calc(var(--u) * 1); top: calc(var(--u) * 1); width: calc(var(--u) * 6.4); height: calc(var(--u) * 6.4); border-radius: 50%; background: #fff; box-shadow: 0 calc(var(--u) * 0.4) calc(var(--u) * 1) rgba(0, 0, 0, 0.35); }
  .line { position: absolute; z-index: 6; background: var(--accent); border-radius: 999px; }
  .knob { position: absolute; z-index: 7; border-radius: 50%; background: #fff; box-shadow: 0 calc(var(--u) * 0.4) calc(var(--u) * 1) rgba(0, 0, 0, 0.35); }
  .cur { position: absolute; left: 0; top: 0; z-index: 10; }
  .cursor { display: block; width: calc(var(--u) * 5.2); height: calc(var(--u) * 5.2); overflow: visible; transform-origin: 0 0; }
  .cursor path { fill: #fff; stroke: #120e2a; stroke-width: 1.4; stroke-linejoin: round; }
</style>
</head>
<body>
<section class="shot b" id="b">
  <div class="stars" id="stars"></div>
  <div class="cloud" id="c1"></div><div class="cloud" id="c2"></div>
  <div class="glow" id="glow"></div>
  <div class="sun" id="sun"></div>
  <div class="ground" id="ground"></div>
  <div class="refl" id="r1"></div><div class="refl" id="r2"></div><div class="refl" id="r3"></div>
  <div class="cap" id="cap"><div class="pill"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>Dusk mode is on</div></div>
</section>
<section class="shot a">
  <div class="half" id="top"><div class="card card">
    <div class="eyebrow">Appearance</div>
    <div class="row" style="top: calc(var(--u) * 14.5)"><div><b>Text size</b><span>Scales every screen</span></div><div class="chip-val">Medium</div></div>
    <div class="row" style="top: calc(var(--u) * 27.5)"><div class="lbl"><b>Dusk mode</b><span>Dim the whole product after sunset</span></div><div class="tg" style="visibility: hidden"></div></div>
    <div class="row" style="top: calc(var(--u) * 40.5)"><div><b>Reduce motion</b><span>Calmer transitions</span></div><div class="tg"></div></div>
  </div></div>
  <div class="half" id="bot"></div>
</section>
<div class="line" id="track"></div><div class="knob" id="knob"></div>
<div class="cur" id="cur"><svg class="cursor" id="arrow" viewBox="0 0 24 24"><path transform="translate(-2 -2)" d="M2 2 L2 19 L6.6 14.8 L9.6 21.6 L12.6 20.3 L9.6 13.6 L15.8 13.4 Z"/></svg></div>
<script type="module">
import '/core/engine/page-api.js';
import { easeFn } from '/core/motion/presets.js';
import { spring } from '/core/motion/springs.js';
const W = innerWidth, H = innerHeight, u = H / 100;
const clamp = (x) => Math.min(1, Math.max(0, x)), lerp = (p, q, k) => p + (q - p) * k;
const land = easeFn('land'), settle = easeFn('settle'), launch = easeFn('launch'), swap = easeFn('swap');
const $ = (id) => document.getElementById(id);
const track = $('track'), knob = $('knob'), cur = $('cur'), arrow = $('arrow'), topHalf = $('top'), bot = $('bot');
bot.innerHTML = topHalf.innerHTML;                                  // both halves hold the same scene, each clipped to its side of the line
const lbls = [...document.querySelectorAll('.lbl')];
const LINE_Y = 0.58 * H, CX = W / 2;
const TW = 15 * u, TH = 8.4 * u, PAD = 1 * u, LINE_H = 0.5 * u;     // the toggle's track and the horizon it becomes
const R0 = CX + 45 * u, L0 = R0 - TW, OVER = 0.03 * W;
const T = { travel: [0.2, 0.95], press: 1.0, stretch: [1.5, 2.2], wipe: [2.0, 2.65], leave: 1.2 };
$('b').style.background = `linear-gradient(180deg, #0c0824 0, #1d1245 ${LINE_Y * 0.45}px, #6a2f78 ${LINE_Y * 0.82}px, #ee8f5a ${LINE_Y}px)`;
$('ground').style.top = `${LINE_Y}px`;
const sun = $('sun'), SUN_D = 26 * u;
const stars = $('stars');
for (let i = 0; i < 28; i++) {
  const s = document.createElement('i');
  s.style.left = `${(i * 37 % 97) + 1.5}%`; s.style.top = `${((i * 53 % 50) / 100) * 0.9 * 58 + 2}%`; s.style.opacity = 0.35 + (i % 4) * 0.2;
  stars.appendChild(s);
}
const P = { x: (L0 + R0) / 2 + TW * 0.1, y: LINE_Y + TH * 0.05 };    // the tip lands on the track
const mix = (a, b, k) => `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], k))).join(',')})`;
vawe.onFrame((t) => {
  const tr = clamp((t - T.travel[0]) / (T.travel[1] - T.travel[0]));
  const lv = clamp((t - T.leave) / 0.3);
  cur.style.transform = `translate(${lerp(0.9 * W, P.x, land(tr)) + 0.5 * W * launch(lv)}px, ${lerp(0.46 * H, P.y, settle(tr)) + 0.5 * H * launch(lv)}px)`;
  const dip = Math.sin(Math.PI * clamp((t - T.press) / 0.22));
  arrow.style.transform = `scale(${1 - 0.14 * dip})`;
  // the switch: the knob rides a spring after the press, the track turns accent
  const on = spring(t - T.press - 0.02, 380, 26);
  const sk = clamp((t - T.stretch[0]) / (T.stretch[1] - T.stretch[0]));
  const l = lerp(L0, -OVER, land(sk)), r = lerp(R0, W + OVER, land(sk)), h = lerp(TH, LINE_H, swap(clamp(sk * 1.25)));
  const pad = PAD * (h / TH);
  track.style.left = `${l}px`; track.style.width = `${r - l}px`;
  track.style.top = `${LINE_Y - h / 2}px`; track.style.height = `${h}px`;
  track.style.background = t < T.press ? 'var(--raised)' : mix([38, 32, 72], [255, 181, 71], clamp((t - T.press) / 0.2));
  const d = Math.max(h - 2 * pad, 0);
  const kx0 = L0 + PAD + (TW - 2 * PAD - (TH - 2 * PAD)) * on;
  const kx = sk > 0 ? r - pad - d : kx0;                                // the knob rides the right end as the track stretches
  knob.style.width = knob.style.height = `${d}px`;
  knob.style.left = `${kx}px`; knob.style.top = `${LINE_Y - d / 2}px`;
  lbls.forEach((el) => { el.style.opacity = 1 - land(clamp((t - 1.4) / 0.25)); });   // the row label leaves before the track runs through it
  // the horizon opens the world from the line: A shrinks away from it in both directions
  const wk = launch(clamp((t - T.wipe[0]) / (T.wipe[1] - T.wipe[0])));
  topHalf.style.clipPath = `inset(0 0 ${H - LINE_Y * (1 - wk)}px 0)`;
  bot.style.clipPath = `inset(${LINE_Y + (H - LINE_Y) * wk}px 0 0 0)`;
  // the world: the sun climbs from under the line and its reflection lengthens
  const su = land(clamp((t - 2.5) / 1.1));
  const sunTop = LINE_Y - SUN_D * 0.55 * su;
  sun.style.top = `${sunTop}px`;
  $('glow').style.top = `${sunTop + SUN_D / 2 - 45 * u}px`; $('glow').style.opacity = su;
  $('c1').style.top = `${LINE_Y - 9 * u}px`; $('c1').style.left = `${12 * u + 1.2 * u * t}px`; $('c1').style.width = `${34 * u}px`;
  $('c2').style.top = `${LINE_Y - 4.5 * u}px`; $('c2').style.left = `${W - 52 * u - 0.9 * u * t}px`; $('c2').style.width = `${40 * u}px`;
  $('r1').style.top = `${LINE_Y + 2.2 * u}px`; $('r1').style.width = `${(16 + 8 * su) * u}px`;
  $('r2').style.top = `${LINE_Y + 4.4 * u}px`; $('r2').style.width = `${(10 + 6 * su) * u}px`;
  $('r3').style.top = `${LINE_Y + 7 * u}px`; $('r3').style.width = `${(5 + 4 * su) * u}px`;
  [1, 2, 3].forEach((n) => { $('r' + n).style.opacity = su * 0.7; });
  const cp = land(clamp((t - 2.75) / 0.6));
  $('cap').style.opacity = cp; $('cap').style.transform = `translateY(${(1 - cp) * 2 * u}px)`;
});
</script>
</body>
</html>
