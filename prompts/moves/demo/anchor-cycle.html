<!doctype html>
<html data-aspect="16:9" data-look="signal">
<head>
<meta charset="utf-8">
<meta name="duration" content="4.6">
<title>move: anchor cycle</title>
<link rel="stylesheet" href="/prompts/moves/demo/demo.css">
<style>
  body { display: block; }
  .row { position: absolute; width: max-content; left: var(--margin); top: 42%; translate: 0 -50%; display: flex; align-items: baseline; gap: var(--s4); }
  .anchor { flex: none; font: 800 var(--t-hero)/0.9 var(--head); letter-spacing: -0.01em; text-transform: uppercase; white-space: nowrap; }
  .tape { flex: none; display: inline-block; padding: var(--s1) var(--s4); border-radius: var(--r-card); background: var(--accent); color: var(--on-accent);
          font: 800 calc(var(--t-hero) * 0.8)/0.95 var(--head); letter-spacing: -0.005em; text-transform: uppercase; white-space: nowrap; }
  .tape.b { background: var(--tile-alt); color: #fff; }
  .lock { position: absolute; left: var(--margin); top: 67%; display: flex; align-items: center; gap: var(--s3); font: 600 var(--t-lead)/1 var(--label); letter-spacing: var(--label-track); text-transform: uppercase; color: var(--muted); }
  .lock .logo-lockup { font-size: calc(var(--u) * 7.4); color: var(--ink); }
</style>
</head>
<body>
<div class="row"><div class="anchor">Built for</div><span class="tape"></span></div>
<div class="lock"><span data-logo="kestrel" data-lockup></span><span>Ships Monday</span></div>
<script type="module">
import '/core/engine/page-api.js';
import '/prompts/moves/demo/assets/logos.js';
import { EASE } from '/core/motion/presets.js';
const q = (s) => document.querySelector(s);
const chip = q('.tape');

// the cadence shrinks by about a fifth per swap: a roll call that turns into a flurry, then one held phrase
const states = ['Chefs', 'Pilots', 'Nurses', 'Teachers', 'Founders', 'Designers', 'Farmers', 'Every team'];
const holds = [0.55, 0.45, 0.36, 0.29, 0.23, 0.18, 0.14];   // seconds per state; the last state holds
const start = 0.85, edges = holds.reduce((a, h) => [...a, a[a.length - 1] + h], [start]);

q('.anchor').animate([{ translate: '0 2.4vh', opacity: 0, scale: 0.96 }, { translate: '0 0', opacity: 1, scale: 1 }], { duration: 520, delay: 120, easing: EASE.land, fill: 'both' });
q('.lock').animate([{ translate: '0 3vh', opacity: 0 }, { translate: '0 0', opacity: 1 }], { duration: 480, delay: 3850, easing: EASE.pop, fill: 'both' });

// a hard cut per state, the chip slapped on at a small seeded tilt; it grows to the right, away from the pinned anchor
vawe.onFrame((t) => {
  const i = t < start ? -1 : edges.filter((e) => t >= e).length - 1;
  chip.style.visibility = i < 0 ? 'hidden' : 'visible';
  if (i < 0) return;
  chip.textContent = states[i];
  chip.classList.toggle('b', i % 2 === 1 && i < states.length - 1);
  chip.style.rotate = i === states.length - 1 ? '0deg' : `${[-1.6, 1.2, -0.8, 1.6, -1.2, 0.8, -1.6][i]}deg`;
});
</script>
</body>
</html>
