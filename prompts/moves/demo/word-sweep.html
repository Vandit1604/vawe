<!doctype html>
<html data-aspect="16:9">
<head>
<meta charset="utf-8">
<meta name="duration" content="1.5">
<title>move: word colour sweep</title>
<style>
  @font-face { font-family: 'Archivo'; font-weight: 100 900; font-display: block; src: url('/assets/fonts/Archivo.woff2') format('woff2'); }
  :root { --ground: #16151a; --ink: #fff; --dim: #5c5b63; --accent: #0a87ff; }
  html, body { margin: 0; height: 100%; background: var(--ground); overflow: hidden; }
  body { display: grid; place-items: center; padding: 0 8vw; font: 600 11vh/1.15 'Archivo', sans-serif; color: var(--dim); letter-spacing: -0.02em; text-align: center; }
  h1 { margin: 0; }
  h1 span { display: inline-block; white-space: pre; }
</style>
</head>
<body>
<h1>every device directs the eye</h1>
<script type="module">
import { curveToLinear, CURVES } from '/core/motion/springs.js';
const h1 = document.querySelector('h1');
const words = h1.textContent.split(' ').map((w, i, a) =>
  Object.assign(document.createElement('span'), { textContent: i < a.length - 1 ? w + ' ' : w }));
h1.replaceChildren(...words);
const settle = curveToLinear(CURVES.expoOut);
const css = getComputedStyle(document.documentElement);
const dim = css.getPropertyValue('--dim'), ink = css.getPropertyValue('--ink'), accent = css.getPropertyValue('--accent');
// 140 ms per word is faster than reading (about 250 ms), so the sweep leads the eye instead of following it
const beat = 150, step = 140;
words.forEach((s, i) => {
  const last = i === words.length - 1;
  s.animate([{ color: dim }, { color: accent, offset: 0.25 }, { color: last ? accent : ink }],
    { duration: 520, delay: beat + i * step, easing: settle, fill: 'both' });
});
</script>
</body>
</html>
