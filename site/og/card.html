<!doctype html>
<meta charset="utf-8">
<style>
  /* The site's own tokens, never a second palette. site/app/globals.css is the owner. */
  :root{
    --accent:#2563eb; --bg:#ffffff; --line:#e7eaf0; --line-2:#d7dce4;
    --ink:#0f1620; --ink-2:#454f5e; --muted:#697182;
  }
  @font-face{font-family:Anybody;src:url('/site/public/assets/fonts/Anybody.woff2')format('woff2');font-weight:100 900;font-stretch:50% 150%;font-display:block}
  @font-face{font-family:JetBrainsMono;src:url('/site/public/assets/fonts/JetBrainsMono.woff2')format('woff2');font-weight:100 800;font-display:block}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:var(--bg);font-family:Anybody,system-ui;
       color:var(--ink);overflow:hidden;position:relative}

  /* One rule, under the masthead. The earlier version drew a four-column grid the content then
     ignored, which is decoration wearing structure's clothes. The columns here are real: the left
     block and the right block meet on one axis at 596px, and that is the only vertical the eye needs. */
  .rule{position:absolute;left:72px;right:72px;top:116px;height:1px;background:var(--line)}

  .top{position:absolute;left:72px;right:72px;top:56px;display:flex;align-items:center;gap:13px}
  .mark{width:25px;height:25px;background:var(--accent);
        clip-path:polygon(0 62%,25% 22%,50% 62%,75% 22%,100% 62%,100% 100%,0 100%)}
  .word{font-size:22px;font-weight:600;font-variation-settings:'wdth' 105;letter-spacing:-.015em}
  .host{margin-left:auto;font-family:JetBrainsMono;font-size:14px;color:var(--muted);letter-spacing:.02em}

  /* LEFT: the input. Display type stands WIDE (wdth 105) per DESIGN.md's type roles; Swiss headings
     are light, never bold, and the one bold word is the payoff. */
  /* Both columns start at 168 and end at 574, so the type block and the frame block are justified
     to the same two horizontals. The gap inside the left column then sits BETWEEN the claim and the
     input that backs it, which is a decision; a ragged bottom edge would just be a leftover. */
  .left{position:absolute;left:72px;top:168px;width:474px;height:406px;
        display:flex;flex-direction:column;justify-content:space-between}
  h1{font-size:78px;line-height:.94;font-weight:300;font-variation-settings:'wdth' 105;
     letter-spacing:-.035em}
  h1 em{font-style:normal;font-weight:600}
  .say{margin-top:20px;font-size:18px;line-height:1.5;color:var(--ink-2);max-width:34ch;
       font-variation-settings:'wdth' 100}
  /* Mono says the string is LITERAL, which is why the input gets it and the prose above never does. */
  .json{font-family:JetBrainsMono;font-size:13.5px;line-height:1.75;
        color:var(--ink-2);white-space:pre}
  .json b{color:var(--accent);font-weight:500}
  .json i{font-style:normal;color:var(--muted)}

  /* RIGHT: the output, and it is REAL. Three frames pulled from three shipped films rather than three
     mockups. They are deliberately unalike: cobalt, warm, dark. A card claiming that one input shape
     makes any look, illustrated with three frames of the same look, would argue the opposite. */
  .right{position:absolute;left:596px;top:168px;width:532px}
  .shot{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;
        box-shadow:0 1px 2px rgba(16,22,32,.04), 0 2px 8px rgba(16,22,32,.05)}
  .shot img{display:block;width:100%;height:100%;object-fit:cover}
  .hero{height:264px}
  .pairs{display:flex;gap:14px;margin-top:14px}
  .pairs .shot{flex:1;height:128px}

</style>

<div class="top">
  <div class="mark"></div><div class="word">vawe</div><div class="host">vawe.dev</div>
</div>
<div class="rule"></div>

<div class="left">
  <h1>one JSON,<br>one <em>video</em>.</h1>
  <div class="say">A deterministic motion&#8209;graphics engine. Same input, same bytes, every time.</div>
  <div class="json"><i>{</i> <b>"module"</b>: "scene",
  <b>"duration"</b>: 12,
  <b>"layers"</b>: [ … ] <i>}</i></div>
</div>

<div class="right">
  <div class="shot hero"><img src="/site/og/frames/main.png" alt=""></div>
  <div class="pairs">
    <div class="shot"><img src="/site/og/frames/warm.png" alt=""></div>
    <div class="shot"><img src="/site/og/frames/dark.png" alt=""></div>
  </div>
</div>
