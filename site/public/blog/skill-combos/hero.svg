<rect x="40" y="386" width="1120" height="54" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="60" y="420" font-family="system-ui,sans-serif" font-size="21" font-weight="600" fill="#14161f">Soft glass</text><rect x="725" y="396" width="150" height="34" rx="17" fill="#2f4bff"/><text x="800" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#ffffff">picked</text><rect x="935" y="396" width="150" height="34" rx="17" fill="#ffffff" stroke="#c4c8d6"/><text x="1010" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#4a4f60">not picked</text>
