<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Results of the blind combo test. Warm editorial was picked for both the type frame and the product UI frame. Soft light and Sparse geometry were picked for the UI frame only. Soft glass was picked for the type frame only. Brutalist telemetry and Apple material were picked for neither.">
<rect width="1200" height="630" fill="#f4f5fa"/>
<text x="40" y="64" font-family="system-ui,sans-serif" font-size="34" font-weight="700" fill="#14161f">Six combos, two frame kinds, one blind reviewer</text>
<text x="40" y="100" font-family="system-ui,sans-serif" font-size="19" fill="#4a4f60">Eleven single-skill arms before this were all cluttered web heroes.</text>
<text x="800" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#14161f">Type frame</text>
<text x="1010" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#14161f">Product UI card</text>
<rect x="40" y="170" width="1120" height="54" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="60" y="204" font-family="system-ui,sans-serif" font-size="21" font-weight="600" fill="#14161f">Warm editorial</text><rect x="725" y="180" width="150" height="34" rx="17" fill="#2f4bff"/><text x="800" y="204" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#ffffff">picked</text><rect x="935" y="180" width="150" height="34" rx="17" fill="#2f4bff"/><text x="1010" y="204" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#ffffff">picked</text>
