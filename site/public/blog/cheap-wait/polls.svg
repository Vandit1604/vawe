<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" role="img" aria-label="Before: many 100 second polls. After: one blocking call with a progress line each minute"><title>Before: many 100 second polls. After: one blocking call with a progress line each minute</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="680" height="260" rx="12" fill="#f7f8fc" stroke="#c9cfe0"/><text x="24" y="26" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Waiting for one final (about 16 minutes)</text><text x="24" y="54" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Before</text><rect x="70" y="38" width="56" height="26" rx="5" fill="#ffe7dc" stroke="#c2410c" stroke-width="1.5"/><rect x="132" y="38" width="56" height="26" rx="5" fill="#ffe7dc" stroke="#c2410c" stroke-width="1.5"/><rect x="194" y="38" width="56" height="26" rx="5" fill="#ffe7dc" stroke="#c2410c" stroke-width="1.5"/><rect x="256" y="38" width="56" height="26" rx="5" fill="#ffe7dc" stroke="#c2410c" stroke-width="1.5"/><rect x="318" y="38" width="56" height="26" rx="5" fill="#ffe7dc" stroke="#c2410c" stroke-width="1.5"/><rect x="380" y="38" width="56" height="26" rx="5" fill="#ffe7dc" stroke="#c2410c" stroke-width="1.5"/><rect x="442" y="38" width="56" height="26" rx="5" fill="#ffe7dc" stroke="#c2410c" stroke-width="1.5"/><rect x="504" y="38" width="56" height="26" rx="5" fill="#ffe7dc" stroke="#c2410c" stroke-width="1.5"/><rect x="566" y="38" width="56" height="26" rx="5" fill="#ffe7dc" stroke="#c2410c" stroke-width="1.5"/><text x="98" y="56" font-size="11.5" fill="#c2410c" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">poll</text><text x="160" y="56" font-size="11.5" fill="#c2410c" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">poll</text><text x="222" y="56" font-size="11.5" fill="#c2410c" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">poll</text><text x="284" y="56" font-size="11.5" fill="#c2410c" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">poll</text><text x="346" y="56" font-size="11.5" fill="#c2410c" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">poll</text><text x="408" y="56" font-size="11.5" fill="#c2410c" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">poll</text><text x="470" y="56" font-size="11.5" fill="#c2410c" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">poll</text><text x="532" y="56" font-size="11.5" fill="#c2410c" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">poll</text><text x="594" y="56" font-size="11.5" fill="#c2410c" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">poll</text><text x="24" y="92" font-size="12.5" fill="#475569" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Each poll blocked for up to 100 s. Agents sent three or four at once.</text><text x="24" y="130" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,sans-serif">After</text><rect x="70" y="114" width="570" height="26" rx="5" fill="#dcf5e4" stroke="#15803d" stroke-width="1.5"/><text x="355" y="132" font-size="12.5" fill="#15803d" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">ship --status --wait: one call, up to 9 min, a progress line each minute</text><text x="24" y="170" font-size="12.5" fill="#475569" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">The result names the next call and how many calls are left.</text><rect x="24" y="190" width="632" height="52" rx="8" fill="#ffffff" stroke="#c9cfe0" stroke-width="1.5"/><text x="40" y="212" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">In one 110-minute session, ship and waits took 81.5 minutes (74% of wall time).</text><text x="40" y="230" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Polls were 43% of that session's cache-read tokens (17.6M of 40.7M).</text></svg>
