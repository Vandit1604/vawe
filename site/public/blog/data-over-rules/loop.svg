<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" role="img" aria-label="The loop: a measurement, a rule change, a test that docs and checks agree, a re-stamp"><title>The loop: a measurement, a rule change, a test that docs and checks agree, a re-stamp</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="680" height="200" rx="12" fill="#f7f8fc" stroke="#c9cfe0"/><rect x="16" y="30" width="140" height="80" rx="8" fill="#ffffff" stroke="#c9cfe0" stroke-width="1.5"/><text x="86" y="52" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">measure</text><text x="86" y="72" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">a number from</text><text x="86" y="88" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">a trace or audit</text><rect x="186" y="30" width="140" height="80" rx="8" fill="#e3eaff" stroke="#1f4fff" stroke-width="1.5"/><text x="256" y="52" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">change the rule</text><text x="256" y="72" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">cite the number</text><text x="256" y="88" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">in the commit</text><rect x="356" y="30" width="140" height="80" rx="8" fill="#ffffff" stroke="#c9cfe0" stroke-width="1.5"/><text x="426" y="52" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">test</text><text x="426" y="72" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">docs and checks</text><text x="426" y="88" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">must agree</text><rect x="526" y="30" width="138" height="80" rx="8" fill="#dcf5e4" stroke="#15803d" stroke-width="1.5"/><text x="595" y="52" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">re-stamp</text><text x="595" y="72" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">read-load and</text><text x="595" y="88" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">rule length</text><line x1="156" y1="70" x2="184" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><line x1="326" y1="70" x2="354" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><line x1="496" y1="70" x2="524" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><rect x="16" y="134" width="648" height="48" rx="8" fill="#ffffff" stroke="#c9cfe0" stroke-width="1.5"/><text x="32" y="155" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Adding a hard gate is allowed under the same rule, if the number says it helps.</text><text x="32" y="173" font-size="12.5" fill="#475569" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">The re-stamp is on purpose: a doc change shows its cost in the commit diff.</text></svg>
