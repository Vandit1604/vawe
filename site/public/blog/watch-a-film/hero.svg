<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Bar chart of flash length. The reference had three flashes of 0.10, 0.07 and 0.10 seconds. The agent's film had three flashes of 0.20 seconds each. Below it, the share of pixels below Y 50: 27 percent in the reference and 80 percent in the agent's film.">
<rect width="1200" height="630" fill="#f4f5fa"/>
<text x="60" y="76" font-family="system-ui,sans-serif" font-size="34" font-weight="700" fill="#14161f">What the agent could not see</text>
<text x="60" y="112" font-family="system-ui,sans-serif" font-size="20" fill="#4a4f60">Measured on one reference film and the agent's draft of it.</text>
<text x="60" y="166" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#14161f">Length of each flash (seconds)</text>
<g font-family="system-ui,sans-serif" font-size="19" fill="#14161f">
<text x="60" y="212">Reference</text>
<rect x="200" y="190" width="250" height="32" rx="4" fill="#2f4bff"/><text x="458" y="213">0.10</text>
<rect x="200" y="230" width="175" height="32" rx="4" fill="#2f4bff"/><text x="383" y="253">0.07</text>
<rect x="200" y="270" width="250" height="32" rx="4" fill="#2f4bff"/><text x="458" y="293">0.10</text>
<text x="60" y="352">Agent's film</text>
<rect x="200" y="330" width="500" height="32" rx="4" fill="#d9480f"/><text x="708" y="353">0.20</text>
<rect x="200" y="370" width="500" height="32" rx="4" fill="#d9480f"/><text x="708" y="393">0.20</text>
<rect x="200" y="410" width="500" height="32" rx="4" fill="#d9480f"/><text x="708" y="433">0.20</text>
</g>
<text x="60" y="495" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#14161f">Pixels darker than Y 50</text>
<rect x="60" y="512" width="1080" height="34" rx="4" fill="#ffffff" stroke="#c4c8d6"/>
<rect x="60" y="512" width="292" height="34" rx="4" fill="#2f4bff"/>
<text x="1124" y="536" text-anchor="end" font-family="system-ui,sans-serif" font-size="19" fill="#14161f">Reference: 27 percent</text>
<rect x="60" y="556" width="1080" height="34" rx="4" fill="#ffffff" stroke="#c4c8d6"/>
<rect x="60" y="556" width="864" height="34" rx="4" fill="#d9480f"/>
<text x="1124" y="580" text-anchor="end" font-family="system-ui,sans-serif" font-size="19" fill="#14161f">Agent's film: 80 percent</text>
</svg>
