<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-label="The fresh judge compares with two references, caps scores and keeps a ledger"><title>The fresh judge compares with two references, caps scores and keeps a ledger</title><rect width="720" height="390" rx="12" fill="#fbfbf9"/><text x="24" y="34" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#14161a" text-anchor="start">One fresh judge pass</text><rect x="24" y="56" width="200" height="70" rx="8" fill="#ffffff" stroke="#c9ccd2" stroke-width="1.5"/><text x="124" y="84" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="middle">read-only judge</text><text x="124" y="106" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b616b" text-anchor="middle">Read tool only, starts at reject</text><line x1="226" y1="91" x2="262" y2="91" stroke="#5b616b" stroke-width="2"/><polygon points="262,91 253,86 253,96" fill="#5b616b"/><rect x="264" y="56" width="200" height="70" rx="8" fill="#ffffff" stroke="#c9ccd2" stroke-width="1.5"/><text x="364" y="84" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="middle">contact sheet</text><text x="364" y="106" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b616b" text-anchor="middle">six change-peak frames, loudness</text><line x1="466" y1="91" x2="502" y2="91" stroke="#5b616b" stroke-width="2"/><polygon points="502,91 493,86 493,96" fill="#5b616b"/><rect x="504" y="56" width="192" height="70" rx="8" fill="#ffffff" stroke="#c9ccd2" stroke-width="1.5"/><text x="600" y="84" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="middle">two reference films</text><text x="600" y="106" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b616b" text-anchor="middle">side by side, per dial</text><line x1="600" y1="128" x2="600" y2="160" stroke="#5b616b" stroke-width="2"/><polygon points="600,160 609,155 609,165" fill="#5b616b"/><rect x="504" y="162" width="192" height="70" rx="8" fill="#ffffff" stroke="#c4372c" stroke-width="2.5"/><text x="600" y="190" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="middle">caps</text><text x="600" y="212" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b616b" text-anchor="middle">lose to both: 6, to one: 7</text><line x1="502" y1="197" x2="466" y2="197" stroke="#5b616b" stroke-width="2"/><polygon points="466,197 475,192 475,202" fill="#5b616b"/><rect x="264" y="162" width="200" height="70" rx="8" fill="#ffffff" stroke="#2f5bea" stroke-width="2.5"/><text x="364" y="190" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="middle">ledger</text><text x="364" y="212" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b616b" text-anchor="middle">each fix has an id</text><line x1="262" y1="197" x2="226" y2="197" stroke="#5b616b" stroke-width="2"/><polygon points="226,197 235,192 235,202" fill="#5b616b"/><rect x="24" y="162" width="200" height="70" rx="8" fill="#ffffff" stroke="#c9ccd2" stroke-width="1.5"/><text x="124" y="190" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="middle">next judge</text><text x="124" y="212" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b616b" text-anchor="middle">marks fixed, partly, still</text><rect x="24" y="262" width="672" height="112" rx="8" fill="#edf8f2" stroke="#1f8a5b" stroke-width="1.5"/><text x="40" y="288" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="start">Fairness rules</text><text x="40" y="312" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#14161a" text-anchor="start">A brief that declares silence removes the sound axis.</text><text x="40" y="330" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#14161a" text-anchor="start">A brief that says no text removes the type axis and the text dial.</text><text x="40" y="348" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#14161a" text-anchor="start">Scores are not printed back to the author as a target.</text><text x="40" y="366" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#14161a" text-anchor="start">A target asked back and forth over 3 rounds prints a stop line.</text></svg>
