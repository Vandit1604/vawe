<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-label="The ratchet loop: a doc change raises the word count, the pre-push bench warns that read-load grew, the author prunes or re-stamps on purpose in a commit named re-stamp read-load.">
<rect width="900" height="250" fill="#f4f5fa"/>
<g font-family="system-ui,sans-serif" font-size="16" fill="#14161f">
<rect x="20" y="70" width="190" height="80" rx="8" fill="#ffffff" stroke="#c4c8d6"/>
<text x="36" y="102" font-weight="700">1. Edit a doc</text><text x="36" y="126">AGENTS.md, digest,</text><text x="36" y="144">skill, starter</text>
<rect x="250" y="70" width="190" height="80" rx="8" fill="#dfe5ff" stroke="#2f4bff"/>
<text x="266" y="102" font-weight="700">2. Commit hooks</text><text x="266" y="126">bench counts words</text><text x="266" y="144">in 5 files</text>
<rect x="480" y="70" width="190" height="80" rx="8" fill="#ffe3d6" stroke="#d9480f"/>
<text x="496" y="102" font-weight="700">3. Warning</text><text x="496" y="126">read-load grew to</text><text x="496" y="144">N, up from M</text>
<rect x="710" y="30" width="170" height="70" rx="8" fill="#dff5e8" stroke="#1a7f4b"/>
<text x="726" y="60" font-weight="700">4a. Prune</text><text x="726" y="82">merge or cut a rule</text>
<rect x="710" y="130" width="170" height="70" rx="8" fill="#ffffff" stroke="#c4c8d6"/>
<text x="726" y="160" font-weight="700">4b. Re-stamp</text><text x="726" y="182">a commit, on purpose</text>
<path d="M212 110 H248 M442 110 H478 M672 100 L708 70 M672 120 L708 160" stroke="#14161f" stroke-width="2" fill="none"/>
<text x="20" y="232" fill="#4a4f63">Commits with re-stamp in the subject: 25. The hook only warns; it never blocks.</text>
</g>
</svg>
