<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" role="img" aria-label="Schematic: three subframes of a fast circle show as three separate ghosts, eight subframes blend into one streak">
<rect x="0.5" y="0.5" width="679" height="279" rx="10" fill="#f6f7fb" stroke="#dfe2ea"/>
<g font-family="system-ui,sans-serif" font-size="13" fill="#14161c">
<text x="20" y="28" font-size="16" font-weight="700">Too few subframes show copies. Enough show a streak.</text>
<text x="20" y="60" font-weight="700" fill="#c2410c">3 subframes, a fast move</text>
<circle cx="120" cy="100" r="22" fill="#2f4bff" fill-opacity="0.45"/><circle cx="330" cy="100" r="22" fill="#2f4bff" fill-opacity="0.45"/><circle cx="540" cy="100" r="22" fill="#2f4bff" fill-opacity="0.45"/>
<text x="20" y="145" font-size="11" fill="#5b6170">Neighbours sit far apart, so the eye sees three objects.</text>
<text x="20" y="180" font-weight="700" fill="#1f8a4c">8 subframes, the same move</text>
<g fill="#2f4bff" fill-opacity="0.2">
<circle cx="120" cy="220" r="22"/><circle cx="180" cy="220" r="22"/><circle cx="240" cy="220" r="22"/><circle cx="300" cy="220" r="22"/><circle cx="360" cy="220" r="22"/><circle cx="420" cy="220" r="22"/><circle cx="480" cy="220" r="22"/><circle cx="540" cy="220" r="22"/></g>
<text x="20" y="266" font-size="11" fill="#5b6170">Neighbours overlap, so the blend reads as one smear. Positions are schematic.</text>
</g></svg>
