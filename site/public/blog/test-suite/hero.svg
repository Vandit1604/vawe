<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 266" role="img" aria-label="Seconds per command, before and after the cut">
<rect x="0.5" y="0.5" width="679" height="265" rx="10" fill="#f6f7fb" stroke="#dfe2ea"/>
<text x="20" y="30" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#14161c">Seconds per command, before and after the cut</text>
<text x="20" y="50" font-family="system-ui,sans-serif" font-size="12" fill="#5b6170">make e2e fell from about 175 s to 4.3 s. make test stayed at 95 s.</text>
