<rect x="190" y="74" width="360.0" height="24" rx="4" fill="#8a90a0"/>
<text x="558.0" y="91" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#14161c">about 175 s</text>
<text x="20" y="133" font-family="system-ui,sans-serif" font-size="13" fill="#14161c">make test (unchanged)</text>
<rect x="190" y="118" width="195.4" height="24" rx="4" fill="#8a90a0"/>
<text x="393.4" y="135" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#14161c">about 95 s</text>
<text x="20" y="177" font-family="system-ui,sans-serif" font-size="13" fill="#14161c">page tests</text>
<rect x="190" y="162" width="30.9" height="24" rx="4" fill="#2f4bff"/>
<text x="228.9" y="179" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#14161c">about 15 s</text>
<text x="20" y="221" font-family="system-ui,sans-serif" font-size="13" fill="#14161c">make e2e, after</text>
<rect x="190" y="206" width="8.8" height="24" rx="4" fill="#1f8a4c"/>
<text x="206.8" y="223" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#14161c">4.3 s</text>
