<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-label="Four tests a waiver reason must pass: long enough, not generic, names a place, names a measured value with a unit. A fifth test refuses the same reason used on more than two waivers.">
<rect width="900" height="280" fill="#f4f5fa"/>
<g font-family="system-ui,sans-serif" font-size="16" fill="#14161f">
<text x="20" y="32" font-size="19" font-weight="700">What a reason must pass before it waives anything</text>
<rect x="20" y="52" width="165" height="96" rx="8" fill="#dfe5ff" stroke="#2f4bff"/><text x="34" y="82" font-weight="700">1. Length</text><text x="34" y="106">12 characters</text><text x="34" y="128">or more</text>
<rect x="200" y="52" width="165" height="96" rx="8" fill="#dfe5ff" stroke="#2f4bff"/><text x="214" y="82" font-weight="700">2. Not generic</text><text x="214" y="106">"by design", "fine",</text><text x="214" y="128">"intentional" fail</text>
<rect x="380" y="52" width="165" height="96" rx="8" fill="#dfe5ff" stroke="#2f4bff"/><text x="394" y="82" font-weight="700">3. A place</text><text x="394" y="106">a world id of this</text><text x="394" y="128">page, or a second</text>
<rect x="560" y="52" width="165" height="96" rx="8" fill="#dfe5ff" stroke="#2f4bff"/><text x="574" y="82" font-weight="700">4. A measure</text><text x="574" y="106">a number with a</text><text x="574" y="128">unit: 4.4:1, 42%</text>
<rect x="740" y="52" width="140" height="96" rx="8" fill="#ffe3d6" stroke="#d9480f"/><text x="754" y="82" font-weight="700">5. Not copied</text><text x="754" y="106">3 or more waivers</text><text x="754" y="128">with one reason fail</text>
<rect x="20" y="176" width="860" height="64" rx="8" fill="#ffffff" stroke="#c4c8d6"/>
<text x="36" y="203">A retired code, or a code no check emits, waives nothing and says so.</text>
<text x="36" y="227">Every refusal prints what to write instead.</text>
</g>
</svg>
