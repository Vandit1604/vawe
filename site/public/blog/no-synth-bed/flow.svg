<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="Before and after. Before, an agent that needs sound writes a synth bed and the dead-air check passes. After, the page is refused with the fix, so the agent adds effects on actions or a real track the user gives.">
<rect width="1200" height="440" fill="#f4f5fa"/>
<text x="40" y="50" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#14161f">What the agent does when it needs sound</text>
<text x="40" y="100" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#d9480f">Before</text>
<rect x="40" y="115" width="250" height="80" rx="8" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/>
<text x="165" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#14161f">data-synth="bed"</text>
<path d="M295 155 H345" stroke="#4a4f60" stroke-width="3"/><path d="M345 155 l-10 -7 v14 z" fill="#4a4f60"/>
<rect x="350" y="115" width="260" height="80" rx="8" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/>
<text x="480" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#14161f">hum under every second</text>
<path d="M615 155 H665" stroke="#4a4f60" stroke-width="3"/><path d="M665 155 l-10 -7 v14 z" fill="#4a4f60"/>
<rect x="670" y="115" width="250" height="80" rx="8" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/>
<text x="795" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#14161f">dead-air check: green</text>
<text x="940" y="162" font-family="system-ui,sans-serif" font-size="18" fill="#4a4f60">sounds machine-made</text>
<text x="40" y="262" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#2f4bff">After</text>
<rect x="40" y="277" width="250" height="80" rx="8" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/>
<text x="165" y="324" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#14161f">data-synth="bed"</text>
<path d="M295 317 H345" stroke="#4a4f60" stroke-width="3"/><path d="M345 317 l-10 -7 v14 z" fill="#4a4f60"/>
<rect x="350" y="277" width="260" height="80" rx="8" fill="#d9480f"/>
<text x="480" y="324" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="600" fill="#ffffff">refused, fix printed</text>
<path d="M615 317 H665" stroke="#4a4f60" stroke-width="3"/><path d="M665 317 l-10 -7 v14 z" fill="#4a4f60"/>
<rect x="670" y="262" width="250" height="50" rx="8" fill="#2f4bff"/>
<text x="795" y="293" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#ffffff">small effects on actions</text>
<rect x="670" y="326" width="250" height="50" rx="8" fill="#2f4bff"/>
<text x="795" y="357" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#ffffff">a track the user gives</text>
<text x="40" y="416" font-family="system-ui,sans-serif" font-size="17" fill="#4a4f60">With a track, vawe sound prints the beat grid and a cut table.</text>
</svg>
