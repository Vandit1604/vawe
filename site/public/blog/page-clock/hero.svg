<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="A seek time t goes into a virtual clock that sets Date, performance.now, requestAnimationFrame, timers and Math.random. The same t always gives the same frame.">
<rect width="1200" height="630" fill="#f4f5fa"/>
<g font-family="system-ui,sans-serif" fill="#14161f">
<text x="60" y="80" font-size="34" font-weight="700">Same t in. Same frame out.</text>
<rect x="60" y="180" width="200" height="120" rx="12" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/>
<text x="90" y="235" font-size="30" font-weight="700">seek(t)</text>
<text x="90" y="270" font-size="20" fill="#4a4f60">t = 4.2 s</text>
<path d="M262 240 H340" stroke="#14161f" stroke-width="3"/><path d="M330 230 l12 10 l-12 10" stroke="#14161f" stroke-width="3" fill="none"/>
<rect x="344" y="110" width="440" height="380" rx="12" fill="#dfe5ff" stroke="#2f4bff" stroke-width="2"/>
<text x="370" y="155" font-size="24" font-weight="700">Virtual clock</text>
<g font-family="ui-monospace,Menlo,monospace" font-size="21">
<text x="370" y="210">Date.now()        = t</text>
<text x="370" y="255">performance.now() = t</text>
<text x="370" y="300">requestAnimationFrame</text>
<text x="370" y="332" fill="#1b2fb8">  flush once per seek</text>
<text x="370" y="377">setTimeout, setInterval</text>
<text x="370" y="409" fill="#1b2fb8">  fire in due order</text>
<text x="370" y="454">Math.random: seed(t)</text>
</g>
<path d="M786 240 H864" stroke="#14161f" stroke-width="3"/><path d="M854 230 l12 10 l-12 10" stroke="#14161f" stroke-width="3" fill="none"/>
<rect x="868" y="180" width="240" height="120" rx="12" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/>
<text x="898" y="235" font-size="30" font-weight="700">One frame</text>
<text x="898" y="270" font-size="20" fill="#4a4f60">identical every render</text>
<text x="60" y="590" font-size="20" fill="#4a4f60">vawe.dev/blog</text>
</g>
</svg>
