<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="Order of one seek: set the clock, call window.seek, seek every animation, call onFrame hooks, wait for fonts and two paints, then screenshot.">
<rect width="900" height="330" fill="#f4f5fa"/>
<g font-family="system-ui,sans-serif" font-size="17" fill="#14161f">
<text x="30" y="40" font-size="20" font-weight="700">What one seek does, in order</text>
<g stroke="#c4c8d6" stroke-width="2">
<rect x="30" y="70" width="250" height="70" rx="8" fill="#dfe5ff" stroke="#2f4bff"/>
<rect x="325" y="70" width="250" height="70" rx="8" fill="#ffffff"/>
<rect x="620" y="70" width="250" height="70" rx="8" fill="#ffffff"/>
<rect x="30" y="200" width="250" height="70" rx="8" fill="#ffffff"/>
<rect x="325" y="200" width="250" height="70" rx="8" fill="#ffffff"/>
<rect x="620" y="200" width="250" height="70" rx="8" fill="#dfe5ff" stroke="#2f4bff"/>
</g>
<text x="46" y="98" font-weight="700">1. Set the clock</text><text x="46" y="122" fill="#4a4f60">Date, timers, rAF, random</text>
<text x="341" y="98" font-weight="700">2. window.seek(t)</text><text x="341" y="122" fill="#4a4f60">if the page defines it</text>
<text x="636" y="98" font-weight="700">3. Seek animations</text><text x="636" y="122" fill="#4a4f60">CSS, WAAPI, SVG SMIL</text>
<text x="46" y="228" font-weight="700">4. onFrame hooks</text><text x="46" y="252" fill="#4a4f60">awaited, in order</text>
<text x="341" y="228" font-weight="700">5. Settle</text><text x="341" y="252" fill="#4a4f60">fonts, images, two paints</text>
<text x="636" y="228" font-weight="700">6. Screenshot</text><text x="636" y="252" fill="#4a4f60">one frame</text>
<path d="M282 105 H323 M577 105 H618 M745 142 V160 H155 V198 M282 235 H323 M577 235 H618" stroke="#14161f" stroke-width="2" fill="none"/>
</g>
</svg>
