<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img" aria-label="The watchdog: each step marks progress, 60 seconds of silence prints the worker, frame and step, retries the slice on a fresh page up to 4 attempts, then fails naming the step">
<rect x="0.5" y="0.5" width="679" height="249" rx="10" fill="#f6f7fb" stroke="#dfe2ea"/>
<g font-family="system-ui,sans-serif" font-size="13" fill="#14161c">
<text x="20" y="28" font-size="16" font-weight="700">A slice step that stops reporting gets named, then retried</text>
<rect x="20" y="60" width="140" height="70" rx="8" fill="#ffffff" stroke="#c9cedb"/>
<text x="90" y="85" text-anchor="middle">slice loop</text><text x="90" y="104" text-anchor="middle" font-size="11" fill="#5b6170">mark("seek")</text><text x="90" y="118" text-anchor="middle" font-size="11" fill="#5b6170">mark("screenshot")</text>
<path d="M160 95 H200" stroke="#5b6170"/><path d="M194 90 L200 95 L194 100" stroke="#5b6170" fill="none"/>
<rect x="200" y="60" width="150" height="70" rx="8" fill="#ffffff" stroke="#c9cedb"/>
<text x="275" y="85" text-anchor="middle">idle timer</text><text x="275" y="104" text-anchor="middle" font-size="11" fill="#5b6170">checked every second</text><text x="275" y="118" text-anchor="middle" font-size="11" fill="#5b6170">limit 60 s</text>
<path d="M350 95 H390" stroke="#5b6170"/><path d="M384 90 L390 95 L384 100" stroke="#5b6170" fill="none"/>
<rect x="390" y="60" width="270" height="70" rx="8" fill="#fde3d6" stroke="#c2410c"/>
<text x="525" y="85" text-anchor="middle">print worker, frame, time, step</text><text x="525" y="104" text-anchor="middle" font-size="11" fill="#5b6170">close the page, open a fresh one</text><text x="525" y="118" text-anchor="middle" font-size="11" fill="#5b6170">run the slice again from its first frame</text>
<path d="M525 130 V160" stroke="#5b6170"/><path d="M520 154 L525 160 L530 154" stroke="#5b6170" fill="none"/>
<rect x="390" y="160" width="130" height="60" rx="8" fill="#e6f4ec" stroke="#1f8a4c"/>
<text x="455" y="185" text-anchor="middle">attempt 2 to 4</text><text x="455" y="204" text-anchor="middle" font-size="11" fill="#5b6170">render finishes</text>
<rect x="530" y="160" width="130" height="60" rx="8" fill="#ffffff" stroke="#c2410c"/>
<text x="595" y="185" text-anchor="middle">4 stalls in a row</text><text x="595" y="204" text-anchor="middle" font-size="11" fill="#5b6170">error names the step</text>
</g></svg>
