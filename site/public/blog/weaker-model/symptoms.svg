<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="t d">
<title id="t">Four things a weaker model did, and the harness change for each</title>
<desc id="d">The model used a stock brand name and a banded disc, so we added an attractor check. It skipped the stills judge, so dev now runs it. It read advice as blocking, so advice lines start with advice: and errors with error:. The judge flipped its advice, so a ledger gives each fix an id.</desc>
<rect width="680" height="340" fill="#16151a"/>
<g font-family="system-ui,sans-serif">
<text x="20" y="28" fill="#9a98a3" font-size="12" letter-spacing="1" font-family="ui-monospace,Menlo,monospace">WHAT THE WEAKER MODEL DID</text>
<text x="370" y="28" fill="#9a98a3" font-size="12" letter-spacing="1" font-family="ui-monospace,Menlo,monospace">WHAT THE HARNESS DOES NOW</text>
<g fill="#2a1a1c" stroke="#ff7a7a">
<rect x="20" y="42" width="290" height="58" rx="8"/><rect x="20" y="114" width="290" height="58" rx="8"/><rect x="20" y="186" width="290" height="58" rx="8"/><rect x="20" y="258" width="290" height="58" rx="8"/>
</g>
<g fill="#0d2a46" stroke="#0a87ff">
<rect x="370" y="42" width="290" height="58" rx="8"/><rect x="370" y="114" width="290" height="58" rx="8"/><rect x="370" y="186" width="290" height="58" rx="8"/><rect x="370" y="258" width="290" height="58" rx="8"/>
</g>
<g fill="#ecebf1" font-size="13">
<text x="34" y="66">Named the brand with a listed cliche</text><text x="34" y="86" fill="#ffb3b3">and drew a banded disc</text>
<text x="34" y="138">Skipped the stills judge</text>
<text x="34" y="210">Read advice lines as blocking</text>
<text x="34" y="282">Judge flipped its advice</text><text x="34" y="302" fill="#ffb3b3">between rounds</text>
<text x="384" y="66">Attractor check names the fix</text><text x="384" y="86" fill="#b8d9ff">in the brand and each direction</text>
<text x="384" y="138">dev runs the stills judge itself</text><text x="384" y="158" fill="#b8d9ff">3-line pick, --no-judge skips it</text>
<text x="384" y="210">advice: and error: prefixes</text><text x="384" y="230" fill="#b8d9ff">advice ends "(advice only: ...)"</text>
<text x="384" y="282">Judge ledger: each fix has an id</text><text x="384" y="302" fill="#b8d9ff">the next judge marks it fixed</text>
</g>
<g fill="#9a98a3"><polygon points="322,71 342,71 342,66 358,76 342,86 342,81 322,81"/><polygon points="322,143 342,143 342,138 358,148 342,158 342,153 322,153"/><polygon points="322,215 342,215 342,210 358,220 342,230 342,225 322,225"/><polygon points="322,287 342,287 342,282 358,292 342,302 342,297 322,297"/></g>
</g>
</svg>
