<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 190" role="img" aria-label="Known-truth fixtures give each measure an error; the error is attached to every spec"><title>Known-truth fixtures give each measure an error; the error is attached to every spec</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="680" height="190" rx="12" fill="#f7f8fc" stroke="#c9cfe0"/><rect x="16" y="30" width="130" height="80" rx="8" fill="#ffffff" stroke="#c9cfe0" stroke-width="1.5"/><text x="81" y="52" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">fixtures</text><text x="81" y="72" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">12 known-truth</text><text x="81" y="88" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">pages</text><rect x="180" y="30" width="140" height="80" rx="8" fill="#ffffff" stroke="#c9cfe0" stroke-width="1.5"/><text x="250" y="52" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">ref-calibrate</text><text x="250" y="72" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">renders them,</text><text x="250" y="88" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">measures them</text><rect x="354" y="30" width="140" height="80" rx="8" fill="#ffffff" stroke="#c9cfe0" stroke-width="1.5"/><text x="424" y="52" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">error per measure</text><text x="424" y="72" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">p50, p90, bias</text><rect x="528" y="30" width="136" height="80" rx="8" fill="#dcf5e4" stroke="#15803d" stroke-width="1.5"/><text x="596" y="52" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">every spec</text><text x="596" y="72" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">carries the error</text><line x1="146" y1="70" x2="178" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><line x1="320" y1="70" x2="352" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><line x1="494" y1="70" x2="526" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><rect x="16" y="130" width="648" height="44" rx="8" fill="#ffffff" stroke="#c9cfe0" stroke-width="1.5"/><text x="32" y="157" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">If p90 error is above what the measure must detect, the spec prints "check by eye" for it.</text></svg>
