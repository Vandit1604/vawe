<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="vawe new decision flow. If subject, message or show is unanswered it prints the questions and writes nothing. With answers it writes page.html and brief.md. With the defaults flag it guesses and marks each guess.">
<rect width="900" height="360" fill="#f4f5fa"/>
<g font-family="system-ui,sans-serif" font-size="16" fill="#14161f">
<rect x="20" y="130" width="200" height="70" rx="8" fill="#dfe5ff" stroke="#2f4bff"/>
<text x="36" y="160" font-weight="700">vawe new demo</text><text x="36" y="182">--request "..."</text>
<path d="M222 165 H282" stroke="#14161f" stroke-width="2" fill="none"/><path d="M274 159 l9 6 l-9 6" stroke="#14161f" stroke-width="2" fill="none"/>
<rect x="285" y="120" width="190" height="90" rx="8" fill="#ffffff" stroke="#c4c8d6"/>
<text x="301" y="152" font-weight="700">Are subject,</text><text x="301" y="174" font-weight="700">message and show</text><text x="301" y="196" font-weight="700">answered?</text>
<path d="M380 120 V80" stroke="#14161f" stroke-width="2" fill="none"/>
<rect x="285" y="20" width="400" height="60" rx="8" fill="#ffe3d6" stroke="#d9480f"/>
<text x="301" y="48" font-weight="700">No: print the questions, write nothing</text><text x="301" y="68">exit 0, not logged as a new film</text>
<path d="M380 210 V250" stroke="#14161f" stroke-width="2" fill="none"/>
<rect x="285" y="250" width="400" height="60" rx="8" fill="#dff5e8" stroke="#1a7f4b"/>
<text x="301" y="278" font-weight="700">Yes: write page.html and brief.md</text><text x="301" y="298">optional gaps become marked guesses</text>
<rect x="710" y="20" width="170" height="60" rx="8" fill="#ffffff" stroke="#c4c8d6"/>
<text x="726" y="48">--answers file</text><text x="726" y="68">--detail key=value</text>
<path d="M708 50 H688" stroke="#14161f" stroke-width="2" fill="none"/>
<rect x="710" y="130" width="170" height="70" rx="8" fill="#ffffff" stroke="#c4c8d6"/>
<text x="726" y="158">--defaults</text><text x="726" y="180">unattended runs</text>
<path d="M708 165 H690 V280 H688" stroke="#14161f" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
<text x="20" y="340" fill="#4a4f63">Each guess is written into brief.md as "(guess: change me)".</text>
</g>
</svg>
