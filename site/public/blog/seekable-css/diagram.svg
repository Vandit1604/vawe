<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="Four fixes in order: do not kill animations, keep finished animations, drop cancelled or removed animations, freeze the document timeline. Fonts are awaited around each seek with a 10 second limit.">
<rect width="900" height="340" fill="#f4f5fa"/>
<g font-family="system-ui,sans-serif" font-size="17" fill="#14161f">
<text x="30" y="40" font-size="20" font-weight="700">Four fixes between "it plays" and "it seeks back"</text>
<g stroke="#c4c8d6" stroke-width="2" fill="#ffffff">
<rect x="30" y="70" width="195" height="170" rx="8"/><rect x="245" y="70" width="195" height="170" rx="8"/><rect x="460" y="70" width="195" height="170" rx="8"/><rect x="675" y="70" width="195" height="170" rx="8"/>
</g>
<text x="46" y="100" font-weight="700">1. Stop killing</text><text x="46" y="128" fill="#4a4f60">Remove the global</text><text x="46" y="150" fill="#4a4f60">animation: none.</text><text x="46" y="172" fill="#4a4f60">Seek them instead.</text><text x="46" y="224" font-size="15" fill="#1b2fb8">7baa223b9</text>
<text x="261" y="100" font-weight="700">2. Keep finished</text><text x="261" y="128" fill="#4a4f60">fill: none ones come</text><text x="261" y="150" fill="#4a4f60">back on a seek back.</text><text x="261" y="224" font-size="15" fill="#1b2fb8">76d28ec1b</text>
<text x="476" y="100" font-weight="700">3. Drop dead ones</text><text x="476" y="128" fill="#4a4f60">Never re-seek a</text><text x="476" y="150" fill="#4a4f60">cancelled or removed</text><text x="476" y="172" fill="#4a4f60">animation.</text><text x="476" y="224" font-size="15" fill="#1b2fb8">8e2200e05</text>
<text x="691" y="100" font-weight="700">4. Freeze the clock</text><text x="691" y="128" fill="#4a4f60">Document timeline</text><text x="691" y="150" fill="#4a4f60">at rate 0, so only a</text><text x="691" y="172" fill="#4a4f60">seek moves anything.</text><text x="691" y="224" font-size="15" fill="#1b2fb8">874af4972</text>
<rect x="30" y="265" width="840" height="50" rx="8" fill="#dfe5ff" stroke="#2f4bff" stroke-width="2"/>
<text x="46" y="296">Fonts: awaited before and after every seek. A face still loading after 10 s fails the render.</text>
</g>
</svg>
