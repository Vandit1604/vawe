<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="One animation runs from 0 to 1 second on a 5 second axis. After a seek to 5 s and back to 0.25 s the effect must apply again, and it does because the renderer keeps every animation the page made.">
<rect width="1200" height="630" fill="#f4f5fa"/>
<g font-family="system-ui,sans-serif" fill="#14161f">
<text x="60" y="80" font-size="34" font-weight="700">Seek forward. Seek back. Same pixels.</text>
<rect x="60" y="170" width="1080" height="60" rx="8" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/>
<rect x="60" y="170" width="216" height="60" rx="8" fill="#dfe5ff" stroke="#2f4bff" stroke-width="2"/>
<text x="72" y="208" font-size="20" font-weight="600">runs, fill: none</text>
<text x="300" y="208" font-size="22" fill="#4a4f60">animation finished</text>
<text x="60" y="262" font-size="18" fill="#4a4f60">0 s</text><text x="270" y="262" font-size="18" fill="#4a4f60">1 s</text><text x="1100" y="262" font-size="18" fill="#4a4f60">5 s</text>
<path d="M1100 270 Q1100 340 640 340 H130" stroke="#d9480f" stroke-width="4" fill="none"/><path d="M146 326 l-16 14 l16 14" stroke="#d9480f" stroke-width="4" fill="none"/>
<text x="400" y="395" font-size="22" font-weight="600" fill="#8a2f06">seek to 5 s, then back to 0.25 s</text>
<rect x="60" y="440" width="520" height="110" rx="12" fill="#ffe3d6" stroke="#d9480f" stroke-width="2"/>
<text x="84" y="482" font-size="22" font-weight="700">Before</text>
<text x="84" y="516" font-size="20">getAnimations() dropped it. Element misses its effect.</text>
<rect x="620" y="440" width="520" height="110" rx="12" fill="#dfe5ff" stroke="#2f4bff" stroke-width="2"/>
<text x="644" y="482" font-size="22" font-weight="700">After</text>
<text x="644" y="516" font-size="20">We keep every animation. The effect applies again.</text>
</g>
</svg>
