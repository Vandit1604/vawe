<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" role="img" aria-label="Capture time 140 s before and 47 s after; Buffer decode 11 percent faster idle and about 40 percent under load"><title>Capture time 140 s before and 47 s after; Buffer decode 11 percent faster idle and about 40 percent under load</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="680" height="200" rx="12" fill="#f7f8fc" stroke="#c9cfe0"/><text x="24" y="28" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Capture time for one 20 s film (final render)</text><text x="24" y="57" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">One shared Chrome</text><rect x="184" y="44" width="382" height="18" rx="4" fill="#ffffff" stroke="#c9cfe0" stroke-width="1"/><rect x="184" y="44" width="356.5" height="18" rx="4" fill="#c2410c"/><text x="574" y="57" font-size="13" fill="#c2410c" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">140 s</text><text x="24" y="89" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">One Chrome per lane</text><rect x="184" y="76" width="382" height="18" rx="4" fill="#ffffff" stroke="#c9cfe0" stroke-width="1"/><rect x="184" y="76" width="119.7" height="18" rx="4" fill="#15803d"/><text x="574" y="89" font-size="13" fill="#15803d" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">47 s</text><text x="24" y="134" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Faster capture from decoding with Buffer instead of a per-character copy</text><text x="24" y="163" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Quiet machine</text><rect x="184" y="150" width="382" height="16" rx="4" fill="#ffffff" stroke="#c9cfe0" stroke-width="1"/><rect x="184" y="150" width="93.4" height="16" rx="4" fill="#1f4fff"/><text x="574" y="163" font-size="13" fill="#1f4fff" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">11%</text><text x="24" y="191" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Machine under load</text><rect x="184" y="178" width="382" height="16" rx="4" fill="#ffffff" stroke="#c9cfe0" stroke-width="1"/><rect x="184" y="178" width="339.6" height="16" rx="4" fill="#1f4fff"/><text x="574" y="191" font-size="13" fill="#1f4fff" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">about 40%</text></svg>
