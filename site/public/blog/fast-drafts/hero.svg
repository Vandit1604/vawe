<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" role="img" aria-label="Draft path against final path: draft uses JPEG quality 92, GPU compositing, slices sized to the work and ultrafast x264; final uses lossless PNG, software compositing, fixed 60-frame slices and x264 preset fast">
<rect x="0.5" y="0.5" width="679" height="269" rx="10" fill="#f6f7fb" stroke="#dfe2ea"/>
<g font-family="system-ui,sans-serif" font-size="13" fill="#14161c">
<text x="20" y="28" font-size="16" font-weight="700">The draft path and the final path share a page and little else</text>
<text x="190" y="58" font-size="11" fill="#5b6170">DRAFT</text><text x="430" y="58" font-size="11" fill="#5b6170">FINAL</text>
<g stroke="#dfe2ea"><path d="M20 66 H660"/><path d="M20 104 H660"/><path d="M20 142 H660"/><path d="M20 180 H660"/><path d="M20 218 H660"/></g>
<text x="20" y="90" fill="#5b6170">screenshot</text><text x="190" y="90">JPEG, quality 92</text><text x="430" y="90">lossless PNG</text>
<text x="20" y="128" fill="#5b6170">compositing</text><text x="190" y="128">GPU (software for SVG filters)</text><text x="430" y="128">software</text>
<text x="20" y="166" fill="#5b6170">slices</text><text x="190" y="166">sized to the work, 15 frames min</text><text x="430" y="166">fixed 60 frames, fresh page</text>
<text x="20" y="204" fill="#5b6170">layout size</text><text x="190" y="204">full CSS size, scaled in ffmpeg</text><text x="430" y="204">full CSS size</text>
<text x="20" y="242" fill="#5b6170">x264</text><text x="190" y="242">ultrafast, CRF 20</text><text x="430" y="242">preset fast, CRF 16, dithered</text>
</g></svg>
