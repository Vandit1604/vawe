<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-label="Bar chart of how many of 36 films used each trick that turns a check green"><title>Bar chart of how many of 36 films used each trick that turns a check green</title><rect width="720" height="410" rx="12" fill="#fbfbf9"/><text x="24" y="34" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#14161a" text-anchor="start">Patterns that turn a check green, counted in page source</text><text x="24" y="56" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5b616b" text-anchor="start">Films using each trick, out of 36 page films (audio row: out of 24)</text><text x="24" y="104" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#14161a" text-anchor="start">Full-frame gradient layer</text><rect x="250" y="84" width="400" height="28" rx="5" fill="#e9ebef"/><rect x="250" y="84" width="333.33333333333337" height="28" rx="5" fill="#2f5bea"/><text x="591.3333333333334" y="104" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="start">30 of 36</text><text x="24" y="156" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#14161a" text-anchor="start">Grain overlay</text><rect x="250" y="136" width="400" height="28" rx="5" fill="#e9ebef"/><rect x="250" y="136" width="255.55555555555554" height="28" rx="5" fill="#2f5bea"/><text x="513.5555555555555" y="156" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="start">23 of 36</text><text x="24" y="208" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#14161a" text-anchor="start">Slow scale or translate drift</text><rect x="250" y="188" width="400" height="28" rx="5" fill="#e9ebef"/><rect x="250" y="188" width="200" height="28" rx="5" fill="#c4372c"/><text x="458" y="208" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="start">18 of 36</text><text x="24" y="260" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#14161a" text-anchor="start">Drifting blob ground (about)</text><rect x="250" y="240" width="400" height="28" rx="5" fill="#e9ebef"/><rect x="250" y="240" width="77.77777777777779" height="28" rx="5" fill="#c4372c"/><text x="335.77777777777777" y="260" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="start">7 of 36</text><text x="24" y="312" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#14161a" text-anchor="start">Synth bed (audio films only)</text><rect x="250" y="292" width="400" height="28" rx="5" fill="#e9ebef"/><rect x="250" y="292" width="66.66666666666666" height="28" rx="5" fill="#b7791f"/><text x="324.66666666666663" y="312" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="start">4 of 24</text><rect x="24" y="350" width="672" height="40" rx="8" fill="#fdf1ef" stroke="#c4372c" stroke-width="1.5"/><text x="40" y="375" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#14161a" text-anchor="start">21 of 107 rules had no check at all. Counts are a grep of page source, not a render.</text></svg>
