<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="The audit question and the four fixes"><title>The audit question and the four fixes</title><rect width="720" height="340" rx="12" fill="#fbfbf9"/><text x="24" y="34" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#14161a" text-anchor="start">The audit question, and what it changed</text><rect x="24" y="60" width="200" height="100" rx="8" fill="#ffffff" stroke="#c9ccd2" stroke-width="1.5"/><text x="124" y="90" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#14161a" text-anchor="middle">ask each check</text><text x="124" y="114" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5b616b" text-anchor="middle">what is the cheapest</text><text x="124" y="132" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5b616b" text-anchor="middle">change that turns it green?</text><line x1="226" y1="110" x2="270" y2="110" stroke="#5b616b" stroke-width="2"/><polygon points="270,110 261,105 261,115" fill="#5b616b"/><rect x="272" y="60" width="200" height="100" rx="8" fill="#ffffff" stroke="#c9ccd2" stroke-width="1.5"/><text x="372" y="90" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#14161a" text-anchor="middle">if the answer is global</text><text x="372" y="114" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5b616b" text-anchor="middle">a camera drift, a grain</text><text x="372" y="132" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5b616b" text-anchor="middle">layer, a gradient box</text><line x1="474" y1="110" x2="518" y2="110" stroke="#5b616b" stroke-width="2"/><polygon points="518,110 509,105 509,115" fill="#5b616b"/><rect x="520" y="60" width="176" height="100" rx="8" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5"/><text x="608" y="90" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#14161a" text-anchor="middle">exclude it</text><text x="608" y="114" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5b616b" text-anchor="middle">measure paint, not boxes</text><text x="608" y="132" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5b616b" text-anchor="middle">whole-frame moves ignored</text><rect x="24" y="190" width="672" height="130" rx="8" fill="#eef2fe" stroke="#2f5bea" stroke-width="1.5"/><text x="44" y="220" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#14161a" text-anchor="start">One fixture page per trick, beside an honest page, run through the checks in a test.</text><text x="44" y="246" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#14161a" text-anchor="start">Advice lines stop naming the trick.</text><text x="44" y="272" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#14161a" text-anchor="start">Waivers need a code, a second, a place and a measure.</text><text x="44" y="298" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#14161a" text-anchor="start">The judge rubric lists each known trick and needs a cited second.</text></svg>
