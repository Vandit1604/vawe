="408" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#14161a" text-anchor="start">chrome</text><line x1="514" y1="185" x2="558" y2="185" stroke="#5b616b" stroke-width="2"/><polygon points="558,185 549,180 549,190" fill="#5b616b"/><rect x="560" y="60" width="136" height="110" rx="8" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5"/><text x="628" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#14161a" text-anchor="middle">contrast.mjs</text><text x="628" y="122" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5b616b" text-anchor="middle">text 4.5 : 1</text><text x="628" y="144" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5b616b" text-anchor="middle">faint: never text</text><line x1="628" y1="172" x2="628" y2="210" stroke="#5b616b" stroke-width="2"/><polygon points="628,210 637,205 637,215" fill="#5b616b"/><rect x="560" y="212" width="136" height="98" rx="8" fill="#ffffff" stroke="#2f5bea" stroke-width="2.5"/><text x="628" y="246" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#14161a" text-anchor="middle">70 clips</text><text x="628" y="270" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5b616b" text-anchor="middle">1280x720, 60 fps</text><text x="628" y="290" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5b616b" text-anchor="middle">rendered once</text><rect x="24" y="330" width="672" height="52" rx="8" fill="#eef2fe" stroke="#2f5bea" stroke-width="1.5"/><text x="40" y="352" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#14161a" text-anchor="start">The look is data-look on the html tag. No class, size or timing changes.</text><text x="40" y="372" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b616b" text-anchor="start">A source hash in clips.lock.json decides which clips are stale.</text></svg>
