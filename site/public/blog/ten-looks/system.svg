<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="The demo.css foundation feeds ten looks, a contrast check and 70 clips"><title>The demo.css foundation feeds ten looks, a contrast check and 70 clips</title><rect width="720" height="400" rx="12" fill="#fbfbf9"/><text x="24" y="34" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#14161a" text-anchor="start">One foundation, ten token sets, one contrast gate</text><rect x="24" y="60" width="220" height="250" rx="8" fill="#ffffff" stroke="#c9ccd2" stroke-width="1.5"/><text x="40" y="88" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#14161a" text-anchor="start">demo.css foundation</text><text x="40" y="120" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b616b" text-anchor="start">6 type sizes</text><text x="40" y="150" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b616b" text-anchor="start">5 spacing steps</text><text x="40" y="180" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b616b" text-anchor="start">7 radius steps</text><text x="40" y="210" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b616b" text-anchor="start">3 line weights</text><text x="40" y="240" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b616b" text-anchor="start">12-column grid</text><text x="40" y="270" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b616b" text-anchor="start"