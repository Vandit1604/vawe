<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img" aria-label="Two machine-wide render slots: a final may only take slot 0, a draft tries slot 1 first. A reaper kills Chromes whose owner process is dead.">
<rect x="0.5" y="0.5" width="679" height="289" rx="10" fill="#f6f7fb" stroke="#dfe2ea"/>
<g font-family="system-ui,sans-serif" font-size="13" fill="#14161c">
<text x="20" y="28" font-size="16" font-weight="700">Two slots for the whole machine, one kept for drafts</text>
<rect x="20" y="50" width="190" height="64" rx="8" fill="#e8ecff" stroke="#2f4bff"/>
<text x="115" y="76" text-anchor="middle" font-weight="700">slot-0</text><text x="115" y="96" text-anchor="middle" font-size="11" fill="#5b6170">a final or a draft</text>
<rect x="230" y="50" width="190" height="64" rx="8" fill="#e6f4ec" stroke="#1f8a4c"/>
<text x="325" y="76" text-anchor="middle" font-weight="700">slot-1</text><text x="325" y="96" text-anchor="middle" font-size="11" fill="#5b6170">drafts only: a final never takes it</text>
<text x="440" y="76">final: tries slot-0 only</text><text x="440" y="96">draft: tries slot-1, then slot-0</text>
<text x="20" y="150" font-size="16" font-weight="700">The reaper cleans up what a killed render left</text>
<rect x="20" y="170" width="190" height="60" rx="8" fill="#ffffff" stroke="#c9cedb"/>
<text x="115" y="194" text-anchor="middle">launch Chrome</text><text x="115" y="212" text-anchor="middle" font-size="11" fill="#5b6170">write file: pid = owner pid</text>
<path d="M210 200 H240" stroke="#5b6170"/><path d="M234 195 L240 200 L234 205" stroke="#5b6170" fill="none"/>
<rect x="240" y="170" width="190" height="60" rx="8" fill="#ffffff" stroke="#c9cedb"/>
<text x="335" y="194" text-anchor="middle">render dies (SIGKILL)</text><text x="335" y="212" text-anchor="middle" font-size="11" fill="#5b6170">no handler runs</text>
<path d="M430 200 H460" stroke="#5b6170"/><path d="M454 195 L460 200 L454 205" stroke="#5b6170" fill="none"/>
<rect x="460" y="170" width="200" height="60" rx="8" fill="#fde3d6" stroke="#c2410c"/>
<text x="560" y="194" text-anchor="middle">next render starts</text><text x="560" y="212" text-anchor="middle" font-size="11" fill="#5b6170">owner dead, so kill that Chrome</text>
<text x="20" y="262" font-size="11" fill="#5b6170">Slots are files made with an exclusive create. A slot whose pid is dead is taken back.</text>
</g></svg>
