<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-labelledby="t d">
<title id="t">Reference against our film: flash length and brightness split</title>
<desc id="d">Flash runs: reference 0.10, 0.07 and 0.10 seconds, ours 0.20 seconds each. Frame luma: reference 27 percent below Y 50, 68 percent between 50 and 110, 5 percent above 110. Ours 80, 12 and 8 percent.</desc>
<rect width="680" height="360" fill="#16151a"/>
<g font-family="system-ui,sans-serif">
<text x="20" y="28" fill="#ecebf1" font-size="14" font-weight="600">Flash length: seconds above frame-mean Y 110</text>
<g font-family="ui-monospace,Menlo,monospace" font-size="12">
<text x="20" y="58" fill="#b8b6c0">flash 1</text>
<rect x="90" y="44" width="100" height="12" fill="#4cc488"/>
<text x="198" y="54" fill="#8fe0b4">reference 0.10 s</text>
<rect x="90" y="58" width="200" height="12" fill="#ff7a7a"/>
<text x="298" y="68" fill="#ffb3b3">ours 0.20 s</text>
<text x="20" y="92" fill="#b8b6c0">flash 2</text>
<rect x="90" y="78" width="70" height="12" fill="#4cc488"/>
<text x="168" y="88" fill="#8fe0b4">reference 0.07 s</text>
<rect x="90" y="92" width="200" height="12" fill="#ff7a7a"/>
<text x="298" y="102" fill="#ffb3b3">ours 0.20 s</text>
<text x="20" y="126" fill="#b8b6c0">flash 3</text>
