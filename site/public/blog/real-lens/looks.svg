<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Option precedence. A named look sits at the bottom, the page options go over it, and a preview override goes on top. Ten named looks are listed.">
<rect width="1200" height="460" fill="#f4f5fa"/>
<text x="40" y="52" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#14161f">Three layers decide the final options</text>
<rect x="40" y="90" width="520" height="62" rx="8" fill="#2f4bff"/>
<text x="60" y="128" font-family="system-ui,sans-serif" font-size="21" font-weight="600" fill="#ffffff">3. preview override (vawe looks)</text>
<rect x="40" y="164" width="520" height="62" rx="8" fill="#ffffff" stroke="#2f4bff" stroke-width="2"/>
<text x="60" y="202" font-family="system-ui,sans-serif" font-size="21" font-weight="600" fill="#14161f">2. the page's own options</text>
<rect x="40" y="238" width="520" height="62" rx="8" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/>
<text x="60" y="276" font-family="system-ui,sans-serif" font-size="21" font-weight="600" fill="#14161f">1. the named look over a flat lens</text>
<text x="40" y="345" font-family="system-ui,sans-serif" font-size="18" fill="#4a4f60">A higher layer wins, key by key. A nested page option such as</text>
<text x="40" y="371" font-family="system-ui,sans-serif" font-size="18" fill="#4a4f60">halation.radius changes only that key and keeps the look's strength.</text>
<text x="640" y="110" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#14161f">Ten named looks</text>
<g font-family="system-ui,sans-serif" font-size="19" fill="#14161f">
<rect x="640" y="130" width="250" height="40" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="655" y="156">clean</text>
<rect x="900" y="130" width="250" height="40" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="915" y="156">dream-bloom</text>
<rect x="640" y="180" width="250" height="40" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="655" y="206">film-halation</text>
<rect x="900" y="180" width="250" height="40" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="915" y="206">anamorphic</text>
<rect x="640" y="230" width="250" height="40" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="655" y="256">pro-mist</text>
<rect x="900" y="230" width="250" height="40" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="915" y="256">tilt-shift</text>
<rect x="640" y="280" width="250" height="40" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="655" y="306">soft-focus</text>
<rect x="900" y="280" width="250" height="40" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="915" y="306">vintage</text>
<rect x="640" y="330" width="250" height="40" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="655" y="356">cyanotype</text>
<rect x="900" y="330" width="250" height="40" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="915" y="356">crt</text>
</g>
<text x="640" y="410" font-family="system-ui,sans-serif" font-size="18" fill="#4a4f60">Each look names every effect it uses. Nothing else is on.</text>
</svg>
