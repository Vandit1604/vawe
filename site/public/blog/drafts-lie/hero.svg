<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-label="Before: a draft laid out in 960 by 540 CSS pixels puts a box at 62 percent of the width, the final at 31 percent. After: both lay out at 1920 by 1080 and the draft is captured at scale 0.5.">
<rect x="0.5" y="0.5" width="679" height="329" rx="10" fill="#f6f7fb" stroke="#dfe2ea"/>
<g font-family="system-ui,sans-serif" font-size="13" fill="#14161c">
<text x="20" y="28" font-size="16" font-weight="700">Same page, same CSS: transform: translateX(600px)</text>
<text x="20" y="56" font-weight="700" fill="#c2410c">Before: the draft changes the layout viewport</text>
<rect x="20" y="70" width="300" height="84" fill="#ffffff" stroke="#c9cedb"/>
<rect x="207" y="95" width="30" height="34" fill="#c2410c"/>
<text x="170" y="172" text-anchor="middle" font-size="11" fill="#5b6170">draft: 960x540 CSS px, box at 62.5%</text>
<rect x="360" y="70" width="300" height="84" fill="#ffffff" stroke="#c9cedb"/>
<rect x="454" y="95" width="30" height="34" fill="#2f4bff"/>
<text x="510" y="172" text-anchor="middle" font-size="11" fill="#5b6170">final: 1920x1080 CSS px, box at 31.25%</text>
<text x="20" y="214" font-weight="700" fill="#1f8a4c">After: same layout viewport, smaller capture</text>
<rect x="20" y="228" width="300" height="84" fill="#ffffff" stroke="#c9cedb"/>
<rect x="114" y="253" width="30" height="34" fill="#2f4bff"/>
<text x="170" y="326" text-anchor="middle" font-size="11" fill="#5b6170">draft: 1920x1080 CSS px, scale 0.5</text>
<rect x="360" y="228" width="300" height="84" fill="#ffffff" stroke="#c9cedb"/>
<rect x="454" y="253" width="30" height="34" fill="#2f4bff"/>
<text x="510" y="326" text-anchor="middle" font-size="11" fill="#5b6170">final: 1920x1080 CSS px, scale 1</text>
</g></svg>
