<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Twelve handoff families, each with what carries the eye across the cut: graphic match, action match, object to object, position lock, container transform, shared axis, colour or light flood, type-driven, camera through, invisible cut, sound bridge and deliberate cut.">
<rect width="1200" height="630" fill="#f4f5fa"/>
<text x="60" y="76" font-family="system-ui,sans-serif" font-size="34" font-weight="700" fill="#14161f">Twelve things that can carry the eye across a cut</text>
<text x="60" y="112" font-family="system-ui,sans-serif" font-size="20" fill="#4a4f60">Every cut hands off one thing from beat A to beat B, or nothing, on purpose.</text>
<rect x="60" y="150" width="350" height="88" rx="8" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/><text x="78" y="188" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#14161f">graphic match</text><text x="78" y="216" font-family="system-ui,sans-serif" font-size="17" fill="#4a4f60">a shared shape, colour or line</text>
<rect x="430" y="150" width="350" height="88" rx="8" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/><text x="448" y="188" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#14161f">action match</text><text x="448" y="216" font-family="system-ui,sans-serif" font-size="17" fill="#4a4f60">motion continues at one speed</text>
<rect x="800" y="150" width="350" height="88" rx="8" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/><text x="818" y="188" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#14161f">object to object</text><text x="818" y="216" font-family="system-ui,sans-serif" font-size="17" fill="#4a4f60">one thing becomes another</text>
<rect x="60" y="255" width="350" height="88" rx="8" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/><text x="78" y="293" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#14161f">position lock</text><text x="78" y="321" font-family="system-ui,sans-serif" font-size="17" fill="#4a4f60">an anchor stays put</text>
<rect x="430" y="255" width="350" height="88" rx="8" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/><text x="448" y="293" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#14161f">container transform</text><text x="448" y="321" font-family="system-ui,sans-serif" font-size="17" fill="#4a4f60">an element grows into the next beat</text>
<rect x="800" y="255" width="350" height="88" rx="8" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/><text x="818" y="293" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#14161f">shared axis</text><text x="818" y="321" font-family="system-ui,sans-serif" font-size="17" fill="#4a4f60">both beats move on one axis</text>
<rect x="60" y="360" width="350" height="88" rx="8" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/><text x="78" y="398" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#14161f">colour or light flood</text><text x="78" y="426" font-family="system-ui,sans-serif" font-size="17" fill="#4a4f60">a glow fills the frame</text>
<rect x="430" y="360" width="350" height="88" rx="8" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/><text x="448" y="398" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#14161f">type-driven</text><text x="448" y="426" font-family="system-ui,sans-serif" font-size="17" fill="#4a4f60">a glyph is the mask</text>
<rect x="800" y="360" width="350" height="88" rx="8" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/><text x="818" y="398" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#14161f">camera through</text><text x="818" y="426" font-family="system-ui,sans-serif" font-size="17" fill="#4a4f60">the camera exits in another world</text>
<rect x="60" y="465" width="350" height="88" rx="8" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/><text x="78" y="503" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#14161f">invisible cut</text><text x="78" y="531" font-family="system-ui,sans-serif" font-size="17" fill="#4a4f60">a blur peak hides the join</text>
<rect x="430" y="465" width="350" height="88" rx="8" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/><text x="448" y="503" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#14161f">sound bridge</text><text x="448" y="531" font-family="system-ui,sans-serif" font-size="17" fill="#4a4f60">audio leads or trails the picture</text>
<rect x="800" y="465" width="350" height="88" rx="8" fill="#2f4bff" stroke="#c4c8d6" stroke-width="2"/><text x="818" y="503" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#ffffff">deliberate cut</text><text x="818" y="531" font-family="system-ui,sans-serif" font-size="17" fill="#ffffff">a hard cut, on purpose</text>
<text x="60" y="590" font-family="system-ui,sans-serif" font-size="20" fill="#4a4f60">vawe.dev/blog</text>
</svg>
