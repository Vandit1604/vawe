<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Ten slideshow tells, each with its check code. The advisory score is the number of tells found, out of 10.">
<rect width="1200" height="500" fill="#f4f5fa"/>
<text x="40" y="52" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#14161f">Ten slideshow tells, scored out of 10</text>
<g font-family="system-ui,sans-serif" font-size="18" fill="#14161f">
<rect x="40" y="80" width="550" height="46" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="56" y="110">same-in-out: every scene enters and exits alike</text>
<rect x="610" y="80" width="550" height="46" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="626" y="110">crossfade-every-cut: a fade at every seam</text>
<rect x="40" y="136" width="550" height="46" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="56" y="166">cut-and-fade-in: hard cut, then a fade in</text>
<rect x="610" y="136" width="550" height="46" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="626" y="166">swap-no-carry: background swap, nothing carried</text>
<rect x="40" y="192" width="550" height="46" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="56" y="222">dead-gap: B starts after A fully left</text>
<rect x="610" y="192" width="550" height="46" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="626" y="222">all-at-once: every element enters together</text>
<rect x="40" y="248" width="550" height="46" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="56" y="278">one-thing-scenes: one centred line on a still ground</text>
<rect x="610" y="248" width="550" height="46" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="626" y="278">equal-shots: shots within 15 percent of one length</text>
<rect x="40" y="304" width="550" height="46" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="56" y="334">static-holds: a still camera and still content</text>
<rect x="610" y="304" width="550" height="46" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="626" y="334">same-entrance: one entrance for every element</text>
</g>
<text x="40" y="400" font-family="system-ui,sans-serif" font-size="19" fill="#14161f">A tell needs a repeat: 3 or more cuts, 5 or more elements, or a 75 percent share.</text>
<text x="40" y="432" font-family="system-ui,sans-serif" font-size="19" fill="#14161f">One crossfade for a time jump is a choice, not a tell.</text>
<text x="40" y="472" font-family="system-ui,sans-serif" font-size="17" fill="#4a4f60">Advice only. A waiver names a second and a measured value.</text>
</svg>
