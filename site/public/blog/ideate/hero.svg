<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="The ideate method in five steps: meaning, four ideas from four devices, a typicality number from 0 to 1, pick one that is not the most typical, keep the ledger row.">
<rect width="1200" height="630" fill="#f4f5fa"/>
<text x="60" y="80" font-family="system-ui,sans-serif" font-size="34" font-weight="700" fill="#14161f">Five steps for every creative decision</text>
<text x="60" y="118" font-family="system-ui,sans-serif" font-size="20" fill="#4a4f60">A beat, a cut, a sound, or the whole film. Run it once per decision.</text>
<rect x="40" y="190" width="200" height="150" rx="10" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/><text x="140" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#2f4bff">1</text><text x="140" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="600" fill="#14161f">Meaning</text><text x="140" y="298" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#4a4f60">one plain sentence</text>
<rect x="260" y="190" width="200" height="150" rx="10" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/><text x="360" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#2f4bff">2</text><text x="360" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="600" fill="#14161f">Four ideas</text><text x="360" y="298" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#4a4f60">four different devices</text>
<rect x="480" y="190" width="200" height="150" rx="10" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/><text x="580" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#2f4bff">3</text><text x="580" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="600" fill="#14161f">Typicality</text><text x="580" y="298" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#4a4f60">0 to 1, all four first</text>
<rect x="700" y="190" width="200" height="150" rx="10" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/><text x="800" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#2f4bff">4</text><text x="800" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="600" fill="#14161f">Pick</text><text x="800" y="298" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#4a4f60">not the most typical</text>
<rect x="920" y="190" width="200" height="150" rx="10" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/><text x="1020" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#2f4bff">5</text><text x="1020" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="600" fill="#14161f">Keep it</text><text x="1020" y="298" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#4a4f60">a row in the Ideas table</text>
<g stroke="#4a4f60" stroke-width="3" fill="#4a4f60"><path d="M242 265 H256"/><path d="M462 265 H476"/><path d="M682 265 H696"/><path d="M902 265 H916"/></g>
<text x="60" y="440" font-family="system-ui,sans-serif" font-size="21" font-weight="600" fill="#14161f">Ten devices to draw from</text>
<text x="60" y="476" font-family="system-ui,sans-serif" font-size="19" fill="#4a4f60">metaphor, transformation, show the invisible, scale shift, personification,</text>
<text x="60" y="504" font-family="system-ui,sans-serif" font-size="19" fill="#4a4f60">literalise, part for whole, reversal, collision, literal (allowed, but needs a reason)</text>
<text x="60" y="590" font-family="system-ui,sans-serif" font-size="20" fill="#4a4f60">vawe.dev/blog</text>
</svg>
