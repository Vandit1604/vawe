<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="How stage-say picks the next command: git status finds the page that changed, the hook reads the brief, DESIGN.md, frames and draft files, then prints one next command. Verbs print the same line after they run.">
<rect width="900" height="330" fill="#f4f5fa"/>
<g font-family="system-ui,sans-serif" font-size="16" fill="#14161f">
<rect x="20" y="40" width="170" height="90" rx="8" fill="#ffffff" stroke="#c4c8d6"/>
<text x="36" y="72" font-weight="700">git status</text><text x="36" y="96">which page.html</text><text x="36" y="116">changed or is new</text>
<rect x="225" y="40" width="210" height="90" rx="8" fill="#dfe5ff" stroke="#2f4bff"/>
<text x="241" y="72" font-weight="700">read the files</text><text x="241" y="96">brief.md, DESIGN.md,</text><text x="241" y="116">frames sheet, drafts</text>
<rect x="470" y="40" width="190" height="90" rx="8" fill="#dff5e8" stroke="#1a7f4b"/>
<text x="486" y="72" font-weight="700">pick one stage</text><text x="486" y="96">first unmet step</text><text x="486" y="116">wins</text>
<rect x="695" y="40" width="185" height="90" rx="8" fill="#ffffff" stroke="#c4c8d6"/>
<text x="711" y="72" font-weight="700">print one line</text><text x="711" y="96">next: bin/vawe ...</text>
<path d="M192 85 H223 M437 85 H468 M662 85 H693" stroke="#14161f" stroke-width="2" fill="none"/>
<text x="20" y="190" font-weight="700">Two channels carry the same line</text>
<rect x="20" y="206" width="420" height="82" rx="8" fill="#ffe3d6" stroke="#d9480f"/>
<text x="36" y="236" font-weight="700">Prompt hook</text><text x="36" y="260">fires once per prompt: 1 to 4 times in a headless run</text>
<rect x="460" y="206" width="420" height="82" rx="8" fill="#dff5e8" stroke="#1a7f4b"/>
<text x="476" y="236" font-weight="700">Verb output</text><text x="476" y="260">fires after every frames, dev, strip, critique call</text>
</g>
</svg>
