<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Our early films against the measured reference range"><title>Our early films against the measured reference range</title><rect width="720" height="320" rx="12" fill="#fbfbf9"/><text x="24" y="34" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#14161a" text-anchor="start">Our first drafts against the same reference range</text><rect x="24" y="60" width="672" height="50" rx="8" fill="#ffffff" stroke="#c9ccd2" stroke-width="1.5"/><text x="40" y="81" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="start">Arrivals that overshoot</text><text x="40" y="100" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c4372c" text-anchor="start">ours 0 to 11%</text><text x="380" y="100" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f8a5b" text-anchor="start">reference 21 to 41%</text><rect x="24" y="122" width="672" height="50" rx="8" fill="#ffffff" stroke="#c9ccd2" stroke-width="1.5"/><text x="40" y="143" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="start">Peak speed, p90 of movers</text><text x="40" y="162" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c4372c" text-anchor="start">ours 14 to 30 frame heights/s</text><text x="380" y="162" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f8a5b" text-anchor="start">reference 12.6 or less</text><rect x="24" y="184" width="672" height="50" rx="8" fill="#ffffff" stroke="#c9ccd2" stroke-width="1.5"/><text x="40" y="205" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="start">Time with readable text</text><text x="40" y="224" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c4372c" text-anchor="start">two films at 94%</text><text x="380" y="224" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f8a5b" text-anchor="start">reference 84% or less</text><rect x="24" y="246" width="672" height="50" rx="8" fill="#ffffff" stroke="#c9ccd2" stroke-width="1.5"/><text x="40" y="267" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="start">One word held on screen</text><text x="40" y="286" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c4372c" text-anchor="start">two films 3 to 4 s</text><text x="380" y="286" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f8a5b" text-anchor="start">reference p90 2.8 s</text></svg>
