"410" y="170" width="266" height="52" rx="8" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5"/><text x="426" y="192" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#14161a" text-anchor="start">warm tab, WARM_HASH in URL</text><text x="426" y="212" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b616b" text-anchor="start">found through browser.targets()</text><rect x="410" y="236" width="266" height="52" rx="8" fill="#ffffff" stroke="#c9ccd2" stroke-width="1.5"/><text x="426" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#14161a" text-anchor="start">vawe compare --page</text><text x="426" y="278" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b616b" text-anchor="start">only warm tabs get a Page</text><text x="406" y="320" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#14161a" text-anchor="start">Same 66-frame window, 2 of 2 runs:</text><text x="406" y="340" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#14161a" text-anchor="start">0 wrong frames</text><text x="406" y="360" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5b616b" text-anchor="start">(5 to 6 before)</text></svg>
