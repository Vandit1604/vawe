<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-label="A compare run resets shared browser tabs to 800x600; the fix finds warm tabs by URL"><title>A compare run resets shared browser tabs to 800x600; the fix finds warm tabs by URL</title><rect width="720" height="410" rx="12" fill="#fbfbf9"/><text x="24" y="34" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#14161a" text-anchor="start">How one compare run broke a final render</text><rect x="24" y="56" width="330" height="330" rx="8" fill="#fdf1ef" stroke="#c4372c" stroke-width="1.5"/><text x="40" y="84" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#14161a" text-anchor="start">before: browser.pages()</text><rect x="44" y="104" width="290" height="52" rx="8" fill="#ffffff" stroke="#c9ccd2" stroke-width="1.5"/><text x="60" y="126" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#14161a" text-anchor="start">final render tab</text><text x="60" y="146" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b616b" text-anchor="start">laid out at the film size</text><rect x="44" y="170" width="290" height="52" rx="8" fill="#ffffff" stroke="#c9ccd2" stroke-width="1.5"/><text x="60" y="192" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#14161a" text-anchor="start">warm draft tab</text><text x="60" y="212" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b616b" text-anchor="start">kept open for the next draft</text><rect x="44" y="236" width="290" height="52" rx="8" fill="#ffffff" stroke="#c4372c" stroke-width="2.5"/><text x="60" 