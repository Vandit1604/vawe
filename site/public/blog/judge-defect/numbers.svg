<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="Wrong frames fell from 5 to 6 to 0 and luma jumps from 14 to 0"><title>Wrong frames fell from 5 to 6 to 0 and luma jumps from 14 to 0</title><rect width="720" height="280" rx="12" fill="#fbfbf9"/><text x="24" y="34" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#14161a" text-anchor="start">Before and after, same renders</text><text x="24" y="80" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#14161a" text-anchor="start">Wrong frames in a 66-frame window</text><rect x="24" y="94" width="220" height="24" rx="4" fill="#c4372c"/><text x="252" y="112" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#14161a" text-anchor="start">before: 5 to 6</text><rect x="24" y="126" width="3" height="24" rx="1" fill="#1f8a5b"/><text x="36" y="144" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#14161a" text-anchor="start">after: 0</text><text x="24" y="190" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#14161a" text-anchor="start">Luma jumps over 20 in a final</text><rect x="24" y="204" width="252" height="24" rx="4" fill="#c4372c"/><text x="284" y="222" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#14161a" text-anchor="start">before: 14</text><rect x="24" y="236" width="3" height="24" rx="1" fill="#1f8a5b"/><text x="36" y="254" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#14161a" text-anchor="start">after: 0</text></svg>
