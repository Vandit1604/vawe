<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" role="img" aria-label="The frames directory key hashed size and mtime, so a rebase changed it; hashing file bytes keeps it stable"><title>The frames directory key hashed size and mtime, so a rebase changed it; hashing file bytes keeps it stable</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="680" height="230" rx="12" fill="#f7f8fc" stroke="#c9cfe0"/><text x="24" y="28" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Why a resume started from 0%</text><rect x="24" y="44" width="300" height="86" rx="8" fill="#ffe7dc" stroke="#c2410c" stroke-width="1.5"/><text x="174" y="66" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Before: hash of size + mtime</text><text x="174" y="86" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">a checkout, rebase or edit</text><text x="174" y="102" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">by another session changes it</text><rect x="356" y="44" width="300" height="86" rx="8" fill="#dcf5e4" stroke="#15803d" stroke-width="1.5"/><text x="506" y="66" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">After: hash of file bytes</text><text x="506" y="86" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">same bytes, same directory</text><text x="506" y="102" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">the resume finds its slices</text><rect x="24" y="150" width="632" height="60" rx="8" fill="#ffffff" stroke="#c9cfe0" stroke-width="1.5"/><text x="40" y="174" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Before: the resume opened a new directory and captured from 0%.</text><text x="40" y="194" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">After: bytes decide. A touched file with the same content does not move the key.</text></svg>
