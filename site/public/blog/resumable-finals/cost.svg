<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 150" role="img" aria-label="In one 110 minute session, failed finals cost 2,967 seconds, 49 minutes or 45 percent"><title>In one 110 minute session, failed finals cost 2,967 seconds, 49 minutes or 45 percent</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="680" height="150" rx="12" fill="#f7f8fc" stroke="#c9cfe0"/><text x="24" y="28" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">One 110-minute session (trace review)</text><rect x="24" y="44" width="632" height="34" rx="8" fill="#ffffff" stroke="#c9cfe0" stroke-width="1"/><rect x="24" y="44" width="284.4" height="34" rx="6" fill="#c2410c"/><text x="166.20000000000002" y="66" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">failed finals: 49 min</text><text x="482.20000000000005" y="66" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">everything else: 61 min</text><text x="24" y="108" font-size="12.5" fill="#475569" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Two of the failures sat at "0%" after capturing 19198 of 19200 frames.</text><text x="24" y="128" font-size="12.5" fill="#475569" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">The last step, mixing page audio, lost its browser frame.</text></svg>
