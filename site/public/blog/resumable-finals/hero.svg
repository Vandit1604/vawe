<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 266" role="img" aria-label="Eight capture slices: six with markers, one lost, one not run; the resume skips the six"><title>Eight capture slices: six with markers, one lost, one not run; the resume skips the six</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="680" height="266" rx="12" fill="#f7f8fc" stroke="#c9cfe0"/><text x="24" y="28" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">A final is cut into fixed slices. A finished slice leaves a marker.</text><rect x="24" y="48" width="70" height="56" rx="8" fill="#dcf5e4" stroke="#15803d" stroke-width="1.5"/><text x="59" y="72" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">slice 1</text><text x="59" y="92" font-size="12" fill="#15803d" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">marker</text><rect x="102" y="48" width="70" height="56" rx="8" fill="#dcf5e4" stroke="#15803d" stroke-width="1.5"/><text x="137" y="72" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">slice 2</text><text x="137" y="92" font-size="12" fill="#15803d" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">marker</text><rect x="180" y="48" width="70" height="56" rx="8" fill="#dcf5e4" stroke="#15803d" stroke-width="1.5"/><text x="215" y="72" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">slice 3</text><text x="215" y="92" font-size="12" fill="#15803d" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">marker</text><rect x="258" y="48" width="70" height="56" rx="8" fill="#dcf5e4" stroke="#15803d" stroke-width="1.5"/><text x="293" y="72" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">slice 4</text><text x="293" y="92" font-size="12" fill="#15803d" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">marker</text><rect x="336" y="48" width="70" height="56" rx="8" fill="#dcf5e4" stroke="#15803d" stroke-width="1.5"/><text x="371" y="72" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">slice 5</text><text x="371" y="92" font-size="12" fill="#15803d" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">marker</text><rect x="414" y="48" width="70" height="56" rx="8" fill="#dcf5e4" stroke="#15803d" stroke-width="1.5"/><text x="449" y="72" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">slice 6</text><text x="449" y="92" font-size="12" fill="#15803d" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">marker</text><rect x="492" y="48" width="70" height="56" rx="8" fill="#ffe7dc" stroke="#c2410c" stroke-width="1.5"/><text x="527" y="72" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">slice 7</text><text x="527" y="92" font-size="12" fill="#c2410c" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">lost 4x</text><rect x="570" y="48" width="70" height="56" rx="8" fill="#ffffff" stroke="#c9cfe0" stroke-width="1.5"/><text x="605" y="72" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">slice 8</text><text x="605" y="92" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">not run</text><text x="24" y="140" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Run 1: slice 7 loses its page four times, the final stops. Frames stay on disk, keyed by the page.</text><rect x="24" y="158" width="632" height="70" rx="8" fill="#ffffff" stroke="#c9cfe0" stroke-width="1.5"/><text x="40" y="182" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Resume: slices 1 to 6 are skipped. Slice 7 runs on a fresh page. Slice 8 runs.</text><text x="40" y="204" font-size="12.5" fill="#475569" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">The failure line names the resume command. Frames go after a successful encode.</text><text x="24" y="252" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Schematic: eight slices shown. A real final has many more.</text></svg>
