<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 170" role="img" aria-label="Three counts from one film: rows green, drafts that fixed nothing, dev calls that skipped the judge"><title>Three counts from one film: rows green, drafts that fixed nothing, dev calls that skipped the judge</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="680" height="170" rx="12" fill="#f7f8fc" stroke="#c9cfe0"/><text x="24" y="30" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">One film, ten drafts (counts from our trace review)</text><text x="24" y="61" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Rows green (of 15)</text><rect x="194" y="48" width="372" height="18" rx="4" fill="#ffffff" stroke="#c9cfe0" stroke-width="1"/><rect x="194" y="48" width="173.6" height="18" rx="4" fill="#a16207"/><text x="574" y="61" font-size="13" fill="#a16207" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">7 of 15</text><text x="24" y="97" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Drafts that fixed nothing</text><rect x="194" y="84" width="372" height="18" rx="4" fill="#ffffff" stroke="#c9cfe0" stroke-width="1"/><rect x="194" y="84" width="279.0" height="18" rx="4" fill="#c2410c"/><text x="574" y="97" font-size="13" fill="#c2410c" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">9 of 12</text><text x="24" y="133" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Dev calls with --no-judge</text><rect x="194" y="120" width="372" height="18" rx="4" fill="#ffffff" stroke="#c9cfe0" stroke-width="1"/><rect x="194" y="120" width="328.2" height="18" rx="4" fill="#c2410c"/><text x="574" y="133" font-size="13" fill="#c2410c" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">15 of 17</text><text x="24" y="158" font-size="12" fill="#475569" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">The review wrote both "7 of 14" and "7 of 15" for the same table.</text></svg>
