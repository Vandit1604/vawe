<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="The acceptance loop measures the agent against its own tables, not the reference film"><title>The acceptance loop measures the agent against its own tables, not the reference film</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="680" height="300" rx="12" fill="#f7f8fc" stroke="#c9cfe0"/><rect x="24" y="30" width="170" height="86" rx="8" fill="#e3eaff" stroke="#1f4fff" stroke-width="1.5"/><text x="109" y="52" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">brief.md</text><text x="109" y="72" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Spec tables:</text><text x="109" y="88" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Shots, Words, Objects</text><rect x="255" y="30" width="170" height="86" rx="8" fill="#ffffff" stroke="#c9cfe0" stroke-width="1.5"/><text x="340" y="52" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">page.html</text><text x="340" y="72" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">the agent writes it</text><text x="340" y="88" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">from those tables</text><rect x="486" y="30" width="170" height="86" rx="8" fill="#ffffff" stroke="#c9cfe0" stroke-width="1.5"/><text x="571" y="52" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">acceptance.mjs</text><text x="571" y="72" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">measures the draft</text><text x="571" y="88" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">prints N of M green</text><line x1="194" y1="73" x2="253" y2="73" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><line x1="425" y1="73" x2="484" y2="73" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><path d="M571,118 L571,150 L109,150 L109,120" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="340" y="170" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">compared against the same tables the agent just wrote</text><rect x="24" y="205" width="632" height="70" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4"/><text x="44" y="232" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Outside the loop</text><text x="44" y="254" font-size="12.5" fill="#475569" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">The reference film. The range the rows use is a generic 17-film range, not the named reference.</text></svg>
