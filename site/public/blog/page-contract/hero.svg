<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="An annotated film page: a duration meta, optional fps, message and spectacle metas, data-aspect on the html element, --vw and --vh on root, audio tags, and one data-world element per beat.">
<rect width="1200" height="630" fill="#f4f5fa"/>
<g font-family="system-ui,sans-serif" fill="#14161f">
<text x="60" y="70" font-size="34" font-weight="700">A whole film format: one web page</text>
<rect x="60" y="110" width="640" height="470" rx="12" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/>
<g font-family="ui-monospace,Menlo,monospace" font-size="19">
<text x="84" y="150">&lt;html data-aspect="16:9"&gt;</text>
<text x="84" y="190">&lt;meta name="duration" content="5"&gt;</text>
<text x="84" y="226">&lt;meta name="message" content="..."&gt;</text>
<text x="84" y="262">&lt;meta name="spectacle" content="2.75"&gt;</text>
<text x="84" y="312">:root { --beat-2: 0.7s; --beat-3: 2.0s }</text>
<text x="84" y="362">&lt;div data-world="cold"&gt;...&lt;/div&gt;</text>
<text x="84" y="398">&lt;div data-world="warm"&gt;...&lt;/div&gt;</text>
<text x="84" y="434">&lt;div data-world="hot"&gt;...&lt;/div&gt;</text>
<text x="84" y="484">&lt;audio src="tick.wav" data-at="0.7"&gt;</text>
<text x="84" y="540">window.seek = (t) =&gt; { ... }</text>
</g>
<g font-size="21">
<rect x="740" y="130" width="400" height="44" rx="8" fill="#dfe5ff" stroke="#2f4bff"/><text x="756" y="159">Length and layout, set by the renderer</text>
<rect x="740" y="206" width="400" height="44" rx="8" fill="#dfe5ff" stroke="#2f4bff"/><text x="756" y="235">The one thing to remember</text>
<rect x="740" y="282" width="400" height="44" rx="8" fill="#dfe5ff" stroke="#2f4bff"/><text x="756" y="311">Literals the studio edits in place</text>
<rect x="740" y="342" width="400" height="108" rx="8" fill="#dfe5ff" stroke="#2f4bff"/><text x="756" y="375">One element per beat. Checks</text><text x="756" y="405">and the judge read the worlds</text><text x="756" y="435">from these.</text>
<rect x="740" y="464" width="400" height="44" rx="8" fill="#dfe5ff" stroke="#2f4bff"/><text x="756" y="493">Audio, mixed as written</text>
<rect x="740" y="520" width="400" height="44" rx="8" fill="#dfe5ff" stroke="#2f4bff"/><text x="756" y="549">Optional: paint frame t as a function</text>
</g>
</g>
</svg>
