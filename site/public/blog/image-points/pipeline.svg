<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="imagePoints pipeline. A photo becomes a luma map and an edge map. Weight is the brightness above a threshold raised to gamma, times one plus the edge boost times the edge, times the mask. Points are seeded draws from the cumulative weight. Output is positions, colours, normals and luma.">
<rect width="1200" height="460" fill="#f4f5fa"/>
<text x="40" y="52" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#14161f">imagePoints: a photo in, a seeded cloud out</text>
<rect x="40" y="90" width="200" height="120" rx="10" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/>
<text x="140" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#14161f">photo</text>
<text x="140" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#4a4f60">plus optional mask,</text><text x="140" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#4a4f60">depth, label image</text>
<path d="M245 150 H285" stroke="#4a4f60" stroke-width="3"/><path d="M285 150 l-10 -7 v14 z" fill="#4a4f60"/>
<rect x="290" y="90" width="460" height="120" rx="10" fill="#ffffff" stroke="#c4c8d6" stroke-width="2"/>
<text x="520" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#14161f">weight per pixel</text>
<text x="520" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#14161f">max(0, luma - threshold)^gamma</text>
<text x="520" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#14161f">x (1 + edgeBoost x edge) x mask</text>
<path d="M755 150 H795" stroke="#4a4f60" stroke-width="3"/><path d="M795 150 l-10 -7 v14 z" fill="#4a4f60"/>
<rect x="800" y="90" width="360" height="120" rx="10" fill="#2f4bff"/>
<text x="980" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#ffffff">seeded draws</text>
<text x="980" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#ffffff">from the cumulative weight</text>
<text x="980" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#ffffff">same inputs, same cloud</text>
<text x="40" y="270" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#14161f">What each point carries</text>
<g font-family="system-ui,sans-serif" font-size="19" fill="#14161f">
<rect x="40" y="290" width="260" height="56" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="56" y="325">position x, y, z</text>
<rect x="320" y="290" width="260" height="56" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="336" y="325">colour r, g, b</text>
<rect x="600" y="290" width="260" height="56" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="616" y="325">normal, from luma</text>
<rect x="880" y="290" width="280" height="56" rx="6" fill="#ffffff" stroke="#c4c8d6"/><text x="896" y="325">luma, and region index</text>
</g>
<text x="40" y="400" font-family="system-ui,sans-serif" font-size="18" fill="#4a4f60">Edges get more points so silhouettes and veins stay crisp. Depth comes from a depth image, else from luma.</text>
</svg>
