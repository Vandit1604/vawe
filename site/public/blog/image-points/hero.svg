<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Timeline. On 2026-10-01 photo parallax was removed because it processes a captured image. On 2026-10-11 imagePoints was added because it uses the photo as a source for a designed particle form. The scope rule became one question: does the move depend on processing the image?">
