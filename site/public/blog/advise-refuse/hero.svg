<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Two columns. Advise: every check prints a line starting with advice and the render continues. Refuse: only determinism, a missing waiver reason and a final without approval stop a command.">
<rect width="1200" height="630" fill="#f4f5fa"/>
<g font-family="system-ui,sans-serif" fill="#14161f">
<text x="60" y="80" font-size="34" font-weight="700">Advise on everything. Refuse on three things.</text>
<rect x="60" y="130" width="520" height="400" rx="12" fill="#dfe5ff" stroke="#2f4bff" stroke-width="2"/>
<text x="90" y="185" font-size="28" font-weight="700">advice: ...</text>
<text x="90" y="235" font-size="22">Every check prints a line.</text>
<text x="90" y="270" font-size="22">The command runs on.</text>
<text x="90" y="305" font-size="22">Flat frame, loud cue, empty Board,</text>
<text x="90" y="340" font-size="22">a brand name on the cliche list.</text>
<text x="90" y="480" font-size="20" fill="#1b2fb8">(advice only: the render continued)</text>
<rect x="620" y="130" width="520" height="400" rx="12" fill="#ffe3d6" stroke="#d9480f" stroke-width="2"/>
<text x="650" y="185" font-size="28" font-weight="700">error: ...</text>
<text x="650" y="235" font-size="22">1. A render that is not deterministic.</text>
<text x="650" y="270" font-size="22">2. A waiver with no reason.</text>
<text x="650" y="305" font-size="22">3. A final without approval.</text>
<text x="650" y="480" font-size="20" fill="#8a2f06">Only these stop the command.</text>
<text x="60" y="590" font-size="20" fill="#4a4f60">vawe.dev/blog</text>
</g>
</svg>
