<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" role="img" aria-label="A truth fixture is rendered, each tool measures it, and a scorer prints one row per measure"><title>A truth fixture is rendered, each tool measures it, and a scorer prints one row per measure</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="680" height="230" rx="12" fill="#f7f8fc" stroke="#c9cfe0"/><rect x="20" y="30" width="140" height="80" rx="8" fill="#e3eaff" stroke="#1f4fff" stroke-width="1.5"/><text x="90" y="52" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">fixture</text><text x="90" y="72" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">page.html +</text><text x="90" y="88" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">truth.json</text><rect x="210" y="30" width="120" height="80" rx="8" fill="#ffffff" stroke="#c9cfe0" stroke-width="1.5"/><text x="270" y="52" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">render</text><text x="270" y="72" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">draft, 960x540,</text><text x="270" y="88" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">30 fps</text><rect x="380" y="30" width="120" height="80" rx="8" fill="#ffffff" stroke="#c9cfe0" stroke-width="1.5"/><text x="440" y="52" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">tools</text><text x="440" y="72" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">spec, strip,</text><text x="440" y="88" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">velocity, look</text><rect x="550" y="30" width="110" height="80" rx="8" fill="#dcf5e4" stroke="#15803d" stroke-width="1.5"/><text x="605" y="52" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">scorer</text><text x="605" y="72" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">one row per</text><text x="605" y="88" font-size="12" fill="#475569" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">measure</text><line x1="160" y1="70" x2="208" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><line x1="330" y1="70" x2="378" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><line x1="500" y1="70" x2="548" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><rect x="20" y="140" width="640" height="70" rx="8" fill="#ffffff" stroke="#c9cfe0" stroke-width="1.5"/><text x="36" y="164" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">measure | truth | measured | error | tolerance | result | tool</text><text x="36" y="186" font-size="13" fill="#475569" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">result is one of: pass, fail, no tool, not available</text><text x="36" y="203" font-size="12" fill="#475569" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">A measure with no tool, or a verb not on main yet, shows as a gap instead of a quiet pass.</text></svg>
