<style>
/* BEAT 2 · THESIS: the plane leads, the left column explains it.
   The index is not decoration and not a caption: every row is a key visible in the plane beside it, so
   a viewer who cannot read 34px JSON at speed still learns what the file DECLARES. That is the density
   this beat can carry, and it is why the left half stopped being a void with a sentence in it. */
/* THE REFERENCE GRAMMAR, in vawe's palette, on the stage kit's ramps.
   Decoded off the together.ai film frame by frame: a faintly cool near-white ground, WHITE planes
   separated by depth and never a border, a large radius, planes tilted in 3D that run off the frame
   edge, and one word of each sentence in the accent.
   EVERY SIZE IS A KIT ROLE and every shadow a kit elevation level. Seven frames that each invent their
   own scale are seven films (ui-skills pbakaus/typeset). */
/* The ground is set per beat from the theme's own backdrop rotation, and it REMAPS the tokens:
   this fragment is written once against --text and --surface and renders on any of the three. */
.g-root{position:absolute;inset:0;overflow:hidden;container-type:size}
.tilt-r{transform:perspective(2000px) rotateY(-17deg) rotateX(5deg) rotateZ(-2deg)}
.say{letter-spacing:-0.03em;line-height:1.14}
.w{display:inline-block}
.w-accent{color:var(--accent)}
/* RHYTHM: tight INSIDE a group, generous BETWEEN groups. One spacing value repeated everywhere gives
   every element equal weight, which is the flat frame the squint test catches (ui-skills pbakaus/layout).
   Two intervals, used consistently, are the whole cadence. */
/* align-items:start, or a pill stretches to the column width and stops being a pill. */
.grp{display:flex;flex-direction:column;align-items:flex-start;gap:var(--kit-space-2)}
/* Sets NO colour. `inherit` was worse than the original: all three classes sit on ONE element, so
   inherit takes the PARENT colour and still beats the chip that element is. Declaring nothing lets
   .kit-chip own its own pair, which is the only way that pair stays measured. */
.eyebrow-num{display:flex;align-items:center;gap:var(--kit-space-2)}
.eyebrow-num s{text-decoration:none;color:inherit}
/* The film's spine, carried on beat 1 and paid back on beat 7. The current step is the only one at
   full ink, which makes the rail a position indicator rather than a decoration. */
.rail{position:absolute;left:var(--kit-margin);right:var(--kit-margin);bottom:var(--kit-space-6);
  display:flex;align-items:center;gap:var(--kit-space-4);color:var(--dim)}
.rail b{font-weight:600;color:var(--text)}
.rail i{flex:1;height:1px;background:var(--line);font-style:normal}
.cd-left{position:absolute;left:var(--kit-margin);top:50%;transform:translateY(-50%);z-index:2;
  display:flex;flex-direction:column;gap:var(--kit-space-6);width:34%}
/* The sentence wraps at its own measure; the eyebrow and the index rows must not, so the measure
   lives on the sentence rather than on the column that also holds a nowrap row. */
.cd-left .say{max-width:11ch}
/* The index maps onto the plane: one row per key the file declares, so the left column EXPLAINS the
   code instead of captioning it. Rows are tight; the gap to the sentence is generous. */
/* D6 · THE LIST CARD. The reference's model list is the shape it uses whenever it has a SET to show:
   a card of rows, each a bold value over a grey caption, with a check on the one that is selected.
   Same shape here, and the set is what the file declares. Rows are tight; the card is the group. */
.cd-index{background:var(--surface);border-radius:max(25px, 1.8cqw);box-shadow:var(--kit-elev-2);
  padding:var(--kit-space-4) var(--kit-space-5);display:flex;flex-direction:column;
  gap:var(--kit-space-3);white-space:nowrap}
.cd-row{display:flex;flex-direction:column;gap:2px}
.cd-row b{font:700 26px/1.1 var(--font-sans);color:var(--text)}
.cd-row span{font-family:var(--font-mono);color:var(--dim)}
/* Pulled in during the bolder pass: at left:50% this plane covered 46% of the frame and was the
   largest object in a film whose peak is beat 4. Quieting what competes with the peak is how the peak
   stays legible; `make frame-check` is what measured it. */
.cd-plane{position:absolute;left:57%;right:-12%;top:10%;bottom:-24%;
  padding:var(--kit-space-7) var(--kit-space-8);box-sizing:border-box;overflow:hidden}
.cd-code{margin:0;font:400 34px/64px var(--font-mono);color:var(--text-2)}
.line{white-space:pre;height:64px}
.line-blank{height:64px}
.tok-key{color:var(--accent)}
.tok-str,.tok-num{color:var(--text)}
.tok-punc{color:var(--dim)}
.cd-focus{position:absolute;left:0;right:0;height:64px;background:var(--accent-dim);
  top:calc(var(--focus,0) * 64px);opacity:var(--focus-on,0)}


/* D4 · TWO PLANES AT DIFFERENT DEPTHS. The reference never shows one card alone: a second plane sits
   behind at a shallower angle and travels at a different rate, which is what makes the pair read as
   space rather than as a sticker. It carries no content on purpose. It is depth, not information, and
   giving it content would make a viewer try to read it. */
/* Tucked behind rather than beside: at left:46% this depth plane measured 52% of the frame and
   competed with the peak beat for the largest object in the film. A plane that is there to be BEHIND
   something should not out-mass what it is behind. */
.cd-back{position:absolute;left:62%;right:-6%;top:9%;bottom:-4%;
  background:var(--surface);border-radius:max(25px, 1.8cqw);box-shadow:var(--kit-elev-2);opacity:.5;
  transform:perspective(2400px) rotateY(-14deg) rotateX(4deg) rotateZ(-3.2deg)}

</style>
