<!-- post-tock.scene1.html: the STATIC instrument face. Split from a single-fragment first draft after
     the engine keys LAYERS, not DOM nodes inside a fragment: a layer-level rotation on this fragment
     would have spun the scale ticks and #line along with the arm, and `parts` (the only mechanism that
     reaches inside a fragment) is refused for this film. So the arm lives in its own layer
     (post-tock.arm.html) and the readout in another (post-tock.readout.html); this fragment is
     everything that does NOT move: the pivot joint, the nine scale ticks on the arc, and the one line
     of copy. Theme: mercury (near-black graphite, single cobalt accent, ivory text, intermediate
     weight, never bold).
     GEOMETRY ONLY. No animation, no transition, no opacity keyframe, no parts.
     REFUSES: a card or panel; a grid; a second focal point (the scale reads as part of the instrument's
     face, not a competing element); bold weight anywhere (mercury's own rule).
     Preview: make preview HTML=films/scene/post-tock.scene1.html THEME=mercury -->

<style>
/* The pivot is a point, not a box: an empty 0x0 anchor at 50cqw/68cqh, near the lower third (which
   starts at 66.6cqh). The arm layer's own anchor (`ox: 50, oy: 100` in the scene's pose table) is keyed
   to land on this same point, so the two fragments agree on where the foot is without sharing markup. */
.tock-pivot{position:absolute;left:50cqw;top:68cqh;width:0;height:0}

/* The pivot cap: the one visible joint. It does not move, because a real pivot does not spin, the arm
   spins around it. */
.tock-cap{
  position:absolute; left:-11px; top:-11px; width:22px; height:22px; border-radius:50%;
  background:var(--surface); border:2px solid var(--accent);
}

/* The scale: nine unlabelled ticks fanned across the widest sweep the storyboard names (beat 1, "wide
   and slow"), each its own invisible spoke rooted at the SAME pivot point and radius (56cqh) as the arm
   layer, so the mark it carries sits exactly on the arc the arm's tip traces, not an arc guessed at
   with a border-radius. A static per-tick `rotate()` is geometry, not motion: nothing here moves. */
.tock-scale{position:absolute; left:50cqw; top:68cqh; width:0; height:0}
.tock-tick{position:absolute; left:-1px; bottom:0; width:2px; height:56cqh; transform-origin:50% 100%}
.tock-tick i{position:absolute; top:0; left:-8px; width:16px; height:2px; background:var(--dim)}
.tock-tick.mid i{background:var(--text-2); width:22px; left:-11px}

/* The line: the film's one sentence, quiet, low in the frame, well clear of the sweep above it.
   --text-2, not the kit's default --dim: at this size dim falls under mercury's own 4.5:1 floor. */
#line{position:absolute; left:var(--kit-margin); right:var(--kit-margin); bottom:6cqh; text-align:center; color:var(--text-2)}
</style>
<div class="kit-root">

</div>
