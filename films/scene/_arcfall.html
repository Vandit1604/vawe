<style>
/* _arcfall · DECORATION, not explanation. It dresses the frame and carries no information; a scene
   using it still needs a real picture to clear the show-don't-tell floor. Generated CSS only, no bitmap.
   Every moving value is sin(var(--t)). CSS keyframe and tween declarations are banned engine-wide and
   render as a dead still rather than an error. Periods are 100-300 s, so nothing loops inside a film. */
.af{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#050509 0%,#05061a 46%,#04050f 100%)}
/* THE RING. ONE radial gradient centred at bottom-centre, dark at its core, peaking at r = 1: that
   single primitive gives the bright arc, the dark interior AND the blue returning down the left and
   right edges. Nothing is hand-drawn. */
.af .arc{position:absolute;inset:0;transform-origin:50% 100%;
  transform:scale(calc(1 + 0.015 * sin(var(--t) * 1.44 + 1.3)));
  opacity:calc(0.93 + 0.07 * sin(var(--t) * 1.83 + 4.4));
  background:radial-gradient(32.5% 78% at 50% 100%, rgba(4,5,14,0) 0%, rgba(6,9,32,0.5) 28%, rgba(8,13,56,0.76) 47%, rgba(8,18,84,0.9) 64%, rgba(7,27,110,1) 80%, rgba(8,42,150,1) 90%, rgba(10,56,182,1) 100%, rgba(9,50,164,1) 106%, rgba(7,38,132,0.95) 116%, rgba(6,26,100,0.82) 130%, rgba(5,17,70,0.6) 150%, rgba(3,10,42,0.34) 180%, rgba(0,5,24,0) 230%)}
/* The reference's arc is violet at the top and blue at the bottom: a second axis the radial ramp
   cannot carry. So the violet is its OWN ring on the same geometry, screened over the blue one and
   masked away below mid-frame. It follows the ridge, so it never fills the dark interior. */
.af .vio{position:absolute;inset:0;mix-blend-mode:screen;transform-origin:50% 100%;
  transform:scale(calc(1 + 0.015 * sin(var(--t) * 1.44 + 1.3)));
  opacity:calc(0.85 + 0.15 * sin(var(--t) * 1.65 + 0.9));
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 20%,rgba(0,0,0,0.42) 38%,transparent 56%);
  mask-image:linear-gradient(180deg,#000 0%,#000 20%,rgba(0,0,0,0.42) 38%,transparent 56%);
  background:radial-gradient(32.5% 78% at 50% 100%,
    rgba(0,0,0,0) 76%, rgba(88,60,146,0.5) 92%, rgba(122,92,172,0.78) 103%,
    rgba(92,62,142,0.42) 118%, rgba(0,0,0,0) 142%)}
/* the pale, desaturated, slightly green cap the reference carries at the very top centre */
.af .mint{position:absolute;inset:0;mix-blend-mode:screen;
  transform:translateX(calc(sin(var(--t) * 0.93 + 0.7) * 3%));
  opacity:calc(0.82 + 0.18 * sin(var(--t) * 0.93 + 2.9));
  background:radial-gradient(26% 20% at 50% 0%,
    rgba(140,176,96,0.88) 0%, rgba(130,154,124,0.66) 28%, rgba(120,134,154,0.38) 56%,
    rgba(104,114,148,0.14) 78%, rgba(0,0,0,0) 100%)}
/* the slat field drifts as one, under the per-bar drift: the parallax base */
.af .fld{position:absolute;inset:0;transform:translateX(calc(sin(var(--t) * 0.63 + 2.2) * 14px))}
.af .fld i{position:absolute;top:-4%;bottom:-4%;display:block;will-change:transform}
/* coarse, very low-frequency turbulence: uneven light across the field, NOT crawling dirt. This is
   the layer that moves; the fine grain below is static by design. */
.af .mot{position:absolute;inset:-24%;mix-blend-mode:overlay;opacity:0.26;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='480'%20height='480'%3E%3Cfilter%20id='n'%20x='0'%20y='0'%20width='100%25'%20height='100%25'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.012'%20numOctaves='3'%20stitchTiles='stitch'%20seed='19'/%3E%3CfeColorMatrix%20type='saturate'%20values='0'/%3E%3CfeComponentTransfer%3E%3CfeFuncA%20type='linear'%20slope='0'%20intercept='1'/%3E%3C/feComponentTransfer%3E%3C/filter%3E%3Crect%20width='480'%20height='480'%20filter='url(%23n)'/%3E%3C/svg%3E");background-size:150% 150%;
  transform:translate(calc(sin(var(--t) * 0.78 + 1.1) * 3%),calc(sin(var(--t) * 0.57 + 4.6) * 2%))}
/* fixed-seed feTurbulence, rasterised once, STATIC on purpose: static grain over a moving field is how
   film and print actually look, and a per-frame seed cannot be expressed in CSS anyway. */
.af .grain{position:absolute;inset:0;mix-blend-mode:overlay;opacity:0.5;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='200'%20height='200'%3E%3Cfilter%20id='n'%20x='0'%20y='0'%20width='100%25'%20height='100%25'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.85'%20numOctaves='2'%20stitchTiles='stitch'%20seed='7'/%3E%3CfeColorMatrix%20type='saturate'%20values='0'/%3E%3CfeComponentTransfer%3E%3CfeFuncA%20type='linear'%20slope='0'%20intercept='1'/%3E%3C/feComponentTransfer%3E%3C/filter%3E%3Crect%20width='200'%20height='200'%20filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px 200px}
.af .vig{position:absolute;inset:0;transform-origin:50% 52%;
  transform:scale(calc(1 + 0.02 * sin(var(--t) * 1.11 + 5.2)));
  background:radial-gradient(78% 96% at 50% 51%, rgba(0,0,0,0) 42%, rgba(0,0,0,0.78) 100%)}
</style>
