<style>
/* BEAT 3 · THESIS: the COMMAND is the hero, as type, in no container at all.
   WHAT THIS REPLACES, and why it was wrong. It was a rounded pill with a circular accent send button:
   the together.ai chat input, copied straight off the reference. That is the reference's SHAPE borrowed
   without its ROLE. Their hero object is a chat input because their product is chat; ours is a command
   line, and a pill with a send button reads as "type a prompt to an AI", which is the strongest generic
   tell in the whole set. The plan said `terminalReveal` the entire time and the fragment ignored it.
   `make preview` passed it clean, because the detector reads craft tells and cannot know that a
   well-made object is the wrong object.
   NO WINDOW CHROME EITHER. Three traffic-light dots and a title bar are their own cliche, and a dark
   terminal would be the only dark surface in a film whose whole grammar is light. What a developer
   actually sees is a transcript: a prompt, a command, and the lines it printed. So that is the frame,
   set at the film's own scale, with nothing drawn around it.
   Leads: the command. Supports: the four real output lines, small and dim, the last one in the accent
   because it is the only one that leaves a file behind. Left-aligned at the margin, which is an
   archetype no neighbouring beat uses (1 is centred, 2 is a split, 4 is an asymmetric baseline). */
.tm-stage{position:absolute;left:var(--kit-margin);right:var(--kit-margin);top:0;bottom:0;
  display:flex;flex-direction:column;justify-content:center;gap:var(--kit-space-8);align-items:flex-start}
/* Mono at the headline role's job but not its face: a command is code and code is monospaced. The size
   is the kit's own headline step, so it sits on the ramp rather than beside it. */
.tm-cmd{margin:0;font:400 64px/1.2 var(--font-mono);color:var(--text);white-space:nowrap}
.tm-prompt{color:var(--accent)}
/* --typed clips the command left to right in whole characters, so it can never stop mid-glyph. */
.tm-typed{display:inline-block;overflow:hidden;vertical-align:bottom;width:calc(var(--typed,1) * 42ch);
  /* The clip box is the PADDING box, and a 1.2 line box on this mono face is 2px short of the
     descenders, so `make audit` read the tails of g/y/p as cut. The padding gives them room and the
     matching negative margin keeps every neighbour where it was. */
  padding-bottom:.16em;margin-bottom:-.16em}
.tm-run{display:flex;flex-direction:column;gap:var(--kit-space-4);align-items:flex-start}
.tm-out{display:flex;flex-direction:column;gap:var(--kit-space-1);font-family:var(--font-mono);color:var(--dim)}
.tm-line{white-space:pre}
.tm-line-done{color:var(--accent)}
/* THE REFERENCE GRAMMAR, in vawe's palette, on the stage kit's ramps.
   Decoded off the together.ai film frame by frame: a faintly cool near-white ground, WHITE planes
   separated by depth and never a border, a large radius, planes tilted in 3D that run off the frame
   edge, and one word of each sentence in the accent.
   EVERY SIZE IS A KIT ROLE and every shadow a kit elevation level. Seven frames that each invent their
   own scale are seven films (ui-skills pbakaus/typeset). */
/* The ground is set per beat from the theme's own backdrop rotation, and it REMAPS the tokens:
   this fragment is written once against --text and --surface and renders on any of the three. */
.g-root{position:absolute;inset:0;overflow:hidden;container-type:size}
.tilt-r{transform:perspective(2000px) rotateY(-17deg) rotateX(5deg) rotateZ(-2deg)}
.say{letter-spacing:-0.03em;line-height:1.14}
.w{display:inline-block}
.w-accent{color:var(--accent)}
/* RHYTHM: tight INSIDE a group, generous BETWEEN groups. One spacing value repeated everywhere gives
   every element equal weight, which is the flat frame the squint test catches (ui-skills pbakaus/layout).
   Two intervals, used consistently, are the whole cadence. */
/* align-items:start, or a pill stretches to the column width and stops being a pill. */
.grp{display:flex;flex-direction:column;align-items:flex-start;gap:var(--kit-space-2)}
/* Sets NO colour. `inherit` was worse than the original: all three classes sit on ONE element, so
   inherit takes the PARENT colour and still beats the chip that element is. Declaring nothing lets
   .kit-chip own its own pair, which is the only way that pair stays measured. */
.eyebrow-num{display:flex;align-items:center;gap:var(--kit-space-2)}
.eyebrow-num s{text-decoration:none;color:inherit}
/* The film's spine, carried on beat 1 and paid back on beat 7. The current step is the only one at
   full ink, which makes the rail a position indicator rather than a decoration. */
.rail{position:absolute;left:var(--kit-margin);right:var(--kit-margin);bottom:var(--kit-space-6);
  display:flex;align-items:center;gap:var(--kit-space-4);color:var(--dim)}
.rail b{font-weight:600;color:var(--text)}
.rail i{flex:1;height:1px;background:var(--line);font-style:normal}


/* D1 · THE TYPEWRITER CURSOR. The reference types its opening word and its question with a literal
   bar riding the end of the text, and that bar is half of why the typing reads as typing. Its blink is
   a formula on the scene clock, never a CSS animation: `mod()` gives a square wave the renderer owns,
   so frame 412 blinks the same way on every render. */
.caret{display:inline-block;width:.08em;height:.86em;vertical-align:-.1em;margin-left:.04em;
  background:var(--accent);
  opacity:calc(1 - round(down, mod(var(--t,0), 0.9) * 1.2))}

</style>
