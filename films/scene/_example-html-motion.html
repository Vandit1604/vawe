<style>
.emh { position: relative; width: 100%; height: 100%; }
/* CSS @keyframes loop: seeked deterministically by seekAll(t), same clock motion/anim use. */
@keyframes emh-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.emh-badge {
  position: absolute; top: 40px; right: 40px; width: 160px; height: 160px; border-radius: 50%;
  border: 6px solid var(--line-strong, #cbd5e1);
  animation: emh-spin 4s linear infinite;
}
/* one asymmetric mark, so a rotated still is never ambiguous with an unrotated one */
.emh-badge::before {
  content: ''; position: absolute; top: -6px; left: 50%; width: 16px; height: 16px; margin-left: -8px;
  border-radius: 50%; background: var(--accent, #2563eb);
}
.emh-ring-wrap { position: absolute; left: 60px; bottom: 60px; width: 280px; height: 280px; }
</style>
<div class="emh">
  <div class="emh-badge"></div>
  <div class="emh-ring-wrap">
    <!-- `make arsenal Q="ring"` names progressRing (an engine preset); hand-built here on purpose
         because the point of this fragment is the raw mechanism, SVG SMIL <animate>, not the look.
         SMIL runs on its own timeline, paused+seeked separately by seekAll(t)
         (svg.pauseAnimations() + setCurrentTime(t)), never through document.getAnimations(). -->
    <svg viewBox="0 0 100 100" width="100%" height="100%">
      <circle cx="50" cy="50" r="42" fill="none" stroke="var(--line-strong, #cbd5e1)" stroke-width="6"></circle>
      <circle cx="50" cy="50" r="42" fill="none" stroke="var(--accent, #2563eb)" stroke-width="6"
        stroke-linecap="round" pathLength="1" stroke-dasharray="1" transform="rotate(-90 50 50)">
        <animate attributeName="stroke-dashoffset" from="1" to="0" begin="0s" dur="4.6s" fill="freeze"></animate>
      </circle>
    </svg>
  </div>
</div>
