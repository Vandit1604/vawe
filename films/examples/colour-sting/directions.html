<!doctype html>
<html data-aspect="16:9">
<head>
<meta charset="utf-8">
<meta name="duration" content="1">
<title>Ondo: three directions</title>
<style>
  @font-face { font-family: "Unbounded"; src: url("../../../assets/fonts/Unbounded.woff2") format("woff2"); font-weight: 200 900; }
  @font-face { font-family: "Manrope"; src: url("../../../assets/fonts/Manrope.woff2") format("woff2"); font-weight: 200 800; }
  :root { --paper: #16151a; --ink: #f1eee8; }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; }
  body { box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2vw;
         padding: 5vh 3vw; align-content: center; font: 400 2vh/1.35 "Manrope", sans-serif; color: var(--ink); }
  figure { margin: 0; display: grid; gap: 1.2vh; min-width: 0; }
  .frame { aspect-ratio: 16 / 9; position: relative; overflow: hidden; container-type: inline-size; }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  figcaption b { display: block; font-size: 2.4vh; }

  /* B: a paper ribbon folds across the frame, each fold a new colour */
  .b1 { background: radial-gradient(circle at 30% 40%, #3346ff, #0d1480 90%); }
  .fold { position: absolute; top: -10%; height: 120%; width: 22%; transform-origin: top left; }
  .f1 { left: 18%; background: linear-gradient(90deg, #ffd23f, #f2b400); transform: skewX(-18deg); }
  .f2 { left: 40%; background: linear-gradient(90deg, #d95a00, #ff7a1a); transform: skewX(18deg); }
  .f3 { left: 62%; background: linear-gradient(90deg, #ff3d6e, #ff6a8d); transform: skewX(-18deg); }
  .b1 .name { position: absolute; left: 66%; bottom: 14%; font: 800 11cqw/1 "Manrope", sans-serif; color: #fff; letter-spacing: -0.03em; }

  /* C: a glass drop rolls through pools of colour and settles as the dot of the name */
  .c1 { background: radial-gradient(circle at 70% 60%, #00c2a8, #004a52 70%, #001d22); }
  .drop { position: absolute; left: 20%; top: 22%; width: 34cqw; height: 34cqw; border-radius: 50%;
          background: radial-gradient(circle at 34% 30%, #ffffffcc 0 6%, transparent 14%),
                      radial-gradient(circle at 60% 70%, #ffb347 0%, #ff4f81 45%, #3d1a78 100%); box-shadow: 0 3cqw 6cqw #00000066; }
  .c1 .name { position: absolute; left: 58%; top: 38%; font: 700 12cqw/1 "Manrope", sans-serif; color: #eafffb; }
</style>
</head>
<body>
<figure>
  <div class="frame"><img src="assets/dir-a-1.9.jpg" alt=""></div>
  <div class="frame"><img src="assets/dir-a-4.9.jpg" alt=""></div>
  <figcaption><b>A. Ondo: the heat dial</b>A glossy ring whose colour runs cold to hot is the dial; every turn heats the world (ultramarine, magenta, vermilion, the hot room) and it lands as the o of ondo. Key frame: the ring rushes the lens and the next world shows through its hole.</figcaption>
</figure>
<figure>
  <div class="frame b1"><div class="fold f1"></div><div class="fold f2"></div><div class="fold f3"></div><span class="name">pleat</span></div>
  <figcaption><b>B. Pleat: the folding ribbon</b>A paper ribbon folds down the frame; each fold turns up a new saturated face; the last face carries the name. Palette: cobalt, lemon, tangerine, rose. Move: a hinge fold per beat.</figcaption>
</figure>
<figure>
  <div class="frame c1"><div class="drop"></div><span class="name">brume</span></div>
  <figcaption><b>C. Brume: the glass drop</b>A glass drop rolls through pools of colour, taking each colour in, and settles next to the name. Palette: teal, coral, violet. Move: a rolling refraction.</figcaption>
</figure>
</body>
</html>
